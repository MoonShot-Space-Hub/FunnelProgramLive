<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10X Coaching 2026 — Malkansview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  /* sampled from the MoonShot app screens */
  --violet:#8C2FC2;        /* primary */
  --indigo:#251F70;
  --purple:#652CA5;
  --magenta:#A94271;
  --orange:#C25834;
  --amber:#FEB022;
  --amber-2:#E59819;
  --amber-soft:#FEEBCB;
  --cream:#FDF2E0;
  --grad:linear-gradient(90deg,#251F70 0%,#4C2991 22%,#692EA5 40%,#8C2FC2 56%,#C17786 82%,#C25834 100%);
  --grad-btn:linear-gradient(90deg,#4E2294 0%,#8129BC 55%,#A94271 100%);

  --brand:#8C2FC2;
  --blue:#8B2BC4;          /* accent for icons and links */
  --glow:rgba(140,47,194,.22);

  --ink:#F6F7FE;
  --card:#FFFFFF;
  --card-2:#F9F7FE;
  --line:#EEF2F9;
  --line-2:#E4E4F0;
  --text:#181818;
  --dim:#757575;

  --mute:#9A96B2; --lilac:#A94271;
  --accent:#8C2FC2; --accent-ink:#FFFFFF;

  --col:460px; --nav:64px; --r:9px;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;
  height:100%;min-height:100%;overflow:hidden;position:relative;
}
.shell{
  position:fixed;top:0;right:0;bottom:0;left:0;inset:0;
  display:flex;flex-direction:column;overflow:hidden;
}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
h1,h2,h3,b,strong{margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ic-fill{fill:currentColor;stroke:currentColor}

/* ============ shell ============ */
.bar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--ink) 94%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.bar-in{max-width:var(--col);margin:0 auto;padding:11px 16px;padding-top:calc(11px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px;min-height:64px}
.wordmark{font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 104;font-weight:800;font-size:15px;letter-spacing:-.01em}
.wordmark span{color:var(--dim);font-weight:400;font-family:"Instrument Sans",sans-serif;font-size:11.5px;letter-spacing:0;margin-left:6px}
.sw{margin-left:auto;position:relative;display:flex;align-items:center}
.sw select{
  appearance:none;-webkit-appearance:none;background:var(--card-2);color:var(--text);
  border:1px solid var(--line-2);border-radius:999px;padding:7px 32px 7px 13px;font-size:13px;max-width:46vw;
}
.sw::after{content:"";position:absolute;right:13px;width:6px;height:6px;border-right:1.6px solid var(--dim);border-bottom:1.6px solid var(--dim);transform:translateY(-2px) rotate(45deg);pointer-events:none}

.app{max-width:var(--col);margin:0 auto;padding:16px 16px 28px}
.view{display:none}
.view.on{display:block}

.tabbar{
  flex:0 0 auto;z-index:40;min-height:56px;
  background:var(--card);
  border-top:1px solid var(--line-2);padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -6px 18px -12px rgba(37,31,112,.35);
}
.tabbar-in{max-width:var(--col);margin:0 auto;display:flex}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:9px 2px 9px;color:var(--dim);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  font-family:"Archivo",sans-serif;font-weight:600;
}
.tab .ic{width:20px;height:20px;padding:3px 11px;box-sizing:content-box;border-radius:999px}
.tab[aria-selected="true"]{color:var(--brand)}
.tab[aria-selected="true"] .ic{background:var(--brand);color:#FFFFFF}

/* ============ section headers ============ */
.sh{display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.sh .ic{color:var(--blue);width:17px;height:17px}
.sh h2{
  font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 100;font-weight:700;
  font-size:14.5px;letter-spacing:.07em;text-transform:uppercase;
}
.sh .right{margin-left:auto}
.sub-h{
  font-family:"Archivo",sans-serif;font-weight:700;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--blue);margin:18px 0 10px;
}
.sub-h.muted{color:var(--dim)}

/* ============ cards ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.card-lit{
  background:var(--grad);border:0;color:#FFFFFF;
  padding:16px;border-radius:var(--r);
}
.card-lit .now-s,.card-lit .next-l span{color:rgba(255,255,255,.78)}
.card-lit .next-t{color:#FFFFFF}
.card-lit .next .ic{color:rgba(255,255,255,.9)}
.card-lit .cd div{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22)}
.card-lit .cd span{color:rgba(255,255,255,.78)}
.card-lit .pulse{background:var(--amber);box-shadow:0 0 0 4px rgba(254,176,34,.28)}
.card-lit .hr{background:rgba(255,255,255,.22)}
.card-lit p{color:rgba(255,255,255,.84)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--grad-btn);color:#FFFFFF;border-radius:999px;padding:14px 18px;
  font-weight:600;font-size:15px;
}
.btn-2{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.pill-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:7px 13px;font-size:12.5px;color:var(--dim)}
.pill-btn[aria-pressed="true"]{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 55%,transparent);background:color-mix(in srgb,var(--brand) 30%,transparent)}

/* ============ home ============ */

.h-title{
  font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 118;font-weight:800;
  font-size:clamp(1.7rem,8vw,2.3rem);line-height:1.04;letter-spacing:-.02em;
  text-align:center;color:var(--blue);margin:0 0 8px;
}
.h-sub{
  text-align:center;font-family:"Archivo",sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--magenta);
}
.metas{display:grid;gap:5px;margin:12px 0 14px;justify-items:center}
.meta{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim);text-align:center}
.meta .ic{width:15px;height:15px;color:var(--blue)}

.now-h{display:flex;align-items:center;gap:8px;font-family:"Archivo",sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 22%,transparent)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:13px 0 14px}
.cd div{background:color-mix(in srgb,var(--ink) 55%,transparent);border:1px solid var(--line);border-radius:9px;padding:8px 4px;text-align:center}
.cd strong{display:block;font-family:"Archivo",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
.cd span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.now-t{font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 106;font-weight:700;font-size:17px;line-height:1.24;margin-bottom:5px}
.now-s{font-size:13px;color:var(--dim)}
.hr{height:1px;background:var(--line);margin:13px 0}
.next{display:flex;align-items:center;gap:10px}
.next .ic{color:var(--blue)}
.next-l{flex:1;min-width:0}
.next-l span{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.next-l b{font-weight:600;font-size:14.5px}
.next-t{color:var(--blue);font-weight:600;font-size:14px}

.qlinks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ql{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:11px;font-weight:600;
}
.ql .ic{color:var(--blue);width:19px;height:19px}

.ann-t{display:flex;gap:10px;align-items:flex-start;margin-bottom:7px}
.ann-t h3{font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 104;font-weight:700;font-size:15.5px;line-height:1.3;flex:1}
.badge{
  flex:0 0 auto;font-family:"Archivo",sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--blue);border:1px solid color-mix(in srgb,var(--blue) 55%,transparent);border-radius:999px;padding:3px 8px;
}
.badge-a{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.ann p{font-size:14px;color:var(--dim)}
.ann time{display:block;margin-top:10px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}
.fact b{display:block;font-family:"Archivo",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
.fact span{font-size:12px;color:var(--dim)}

.fee{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.fee b{font-family:"Archivo",sans-serif;font-weight:700;font-size:27px;letter-spacing:-.02em}
.fee-n{font-size:13px;color:var(--dim);margin-bottom:14px}
.list{display:grid;gap:11px}
.list div{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:14px;align-items:start}
.list .ic{color:var(--accent);width:16px;height:16px;margin-top:3px}
.quote p{font-size:15.5px;line-height:1.45}
.quote cite{display:block;margin-top:10px;font-size:12.5px;color:var(--dim);font-style:normal}

/* ============ schedule ============ */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:11px 15px;font-family:"Archivo",sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--dim);white-space:nowrap;
}
.day[aria-pressed="true"]{
  color:#FFFFFF;border-color:var(--brand);background:var(--brand);
}
.info{
  display:flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;font-size:12.5px;font-style:italic;color:var(--dim);margin-bottom:12px;
}
.info .ic{color:var(--blue);width:16px;height:16px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.slot.saved{border-color:color-mix(in srgb,var(--amber-2) 55%,transparent)}
.slot-r{display:flex;align-items:stretch}
.slot-main{flex:1;display:flex;align-items:center;gap:13px;padding:14px 4px 14px 14px;text-align:left;min-width:0}
.slot-time{
  flex:0 0 66px;font-family:"Archivo",sans-serif;font-weight:700;font-size:13px;
  font-variant-numeric:tabular-nums;line-height:1.2;
}
.slot-div{flex:0 0 1px;align-self:stretch;background:var(--line-2);margin:2px 0}
.slot-b{flex:1;min-width:0}
.slot-b h3{font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 104;font-weight:700;font-size:15px;line-height:1.28}
.slot-b .who{display:block;font-size:12.5px;color:var(--dim);margin-top:3px}
.tag{
  display:inline-block;margin-top:8px;font-family:"Archivo",sans-serif;font-weight:700;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 9px;
}
.tag-live{color:#FFFFFF;background:var(--brand)}
.tag-work{color:var(--amber-2);background:var(--amber-soft)}
.tag-qa{color:var(--magenta);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--magenta) 45%,transparent)}
.tag-desk{color:var(--dim);box-shadow:inset 0 0 0 1px var(--line-2)}
.star{flex:0 0 46px;display:grid;place-items:center;color:var(--dim)}
.star[aria-pressed="true"]{color:var(--amber-2)}
.slot-d{padding:0 14px 14px;font-size:13.5px;color:var(--dim);display:none}
.slot.open .slot-d{display:block}
.empty{text-align:center;color:var(--dim);font-size:14px;padding:30px 10px}

/* ============ speakers ============ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.sp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.sp.key{border-color:var(--line-2);background:var(--card-2)}
.por{
  aspect-ratio:1/1;display:grid;place-items:center;
  background:linear-gradient(160deg,color-mix(in srgb,var(--violet) 18%,var(--card-2)),var(--card-2));
  font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 110;font-weight:800;
  font-size:clamp(1.5rem,7vw,2.1rem);color:var(--brand);border-bottom:1px solid var(--line);
}
.grid3 .por{font-size:1.25rem}
.sp-b{padding:11px 11px 13px}
.sp-b h3{font-family:"Archivo",sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;line-height:1.2}
.grid3 .sp-b h3{font-size:11.5px}
.sp-b p{font-size:12px;color:var(--dim);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp-b .badge{display:inline-block;margin-top:9px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(37,31,112,.58);backdrop-filter:blur(3px)}
.sheet.on{display:flex}
.sheet-in{width:100%;max-width:var(--col);background:var(--card);border:1px solid var(--line-2);border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in .mono{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);font-family:"Archivo",sans-serif;font-weight:800;font-size:20px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);margin-bottom:13px}
.sheet-in h3{font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 108;font-weight:700;font-size:20px}
.sheet-in .role{color:var(--accent);font-size:13px;margin-top:4px}
.sheet-in p{color:var(--dim);font-size:14.5px;margin-top:11px}
.sheet-in .btn{margin-top:18px}
@media (min-width:560px){
  .sheet{align-items:center}
  .sheet-in{border-radius:18px;padding-bottom:22px;margin:0 16px}
}

/* ============ venue ============ */
.plan-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.plan-img{position:relative;display:block;width:100%;background:#F6F4FD;border:0;padding:0}
.plan-img > svg{display:block;width:100%;height:auto}
.plan-img .zoom svg{width:13px;height:13px}
.zoom{
  position:absolute;top:9px;right:9px;display:flex;align-items:center;gap:5px;
  background:rgba(9,15,27,.78);color:#fff;border-radius:999px;padding:5px 10px;
  font-family:"Archivo",sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
}
.plan-cap{
  text-align:center;padding:11px;font-family:"Archivo",sans-serif;font-weight:700;font-size:11.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--blue);border-top:1px solid var(--line);
}
.addr{font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 106;font-weight:700;font-size:16px;line-height:1.35;margin-bottom:4px}
.addr-s{font-size:13.5px;color:var(--dim);white-space:pre-line}
.rows{display:grid}
.rows > div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.rows dt{color:var(--dim)}
.rows dd{margin:0}
.lb{position:fixed;inset:0;z-index:70;display:none;background:rgba(37,31,112,.88);padding:16px}
.lb.on{display:grid;place-items:center}
.lb-in{width:100%;max-width:900px;background:#F6F4FD;border-radius:12px;overflow:auto;max-height:82vh}
.lb-in > svg{display:block;width:100%;height:auto}
.lb-x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;background:var(--card);border:1px solid var(--line-2);border-radius:999px;padding:9px 15px;font-size:13px;color:var(--text)}

/* ============ more ============ */
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow .ic{color:var(--blue)}
.grow-b{flex:1;min-width:0}
.grow-b b{display:block;font-weight:600;font-size:14.5px}
.grow-b span{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
.grow .chev{color:var(--dim);width:16px;height:16px}
.grow.lit{background:var(--cream);border-left:3px solid var(--amber)}
.grow.lit .ic{color:var(--amber-2)}
.qa{border-bottom:1px solid var(--line)}
.qa:last-child{border-bottom:0}
.qa summary{display:flex;gap:12px;align-items:center;padding:14px;list-style:none;font-weight:600;font-size:14.5px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";margin-left:auto;color:var(--blue);font-size:19px;line-height:1}
.qa[open] summary::after{content:"\2212"}
.qa p{padding:0 14px 14px;font-size:13.5px;color:var(--dim)}
.foot{text-align:center;font-size:11.5px;color:var(--dim);margin-top:24px;line-height:1.7}

/* ============ terms ============ */
.terms-h{display:flex;align-items:center;gap:11px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.terms-h .ic-wrap{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 55%,var(--card));border:1px solid color-mix(in srgb,var(--blue) 40%,transparent);color:var(--blue)}
.terms-h h2{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:13.5px;font-weight:600;margin-bottom:14px}
.back .ic{width:15px;height:15px;transform:rotate(180deg)}
.terms h3{
  font-family:"Archivo",sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;
  margin:22px 0 8px;display:flex;gap:9px;
}
.terms h3 i{color:var(--blue);font-style:normal}
.terms .lede{color:var(--blue);font-family:"Archivo",sans-serif;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
.terms p{font-size:14px;color:var(--dim);margin-bottom:11px}
.terms .eff{font-weight:600;color:var(--text);font-size:13.5px}

/* ---- responsive tuning ---- */
@media (max-width:360px){
  body{font-size:14.5px}
  .app{padding:14px 12px 24px}
  .qlinks{gap:6px}
  .ql{padding:11px 2px;font-size:10px}
  .cd strong{font-size:18px}
  .cd div{padding:7px 2px}
  .tab{font-size:9px}
  .tab .ic{padding:3px 9px}
  .slot-main{gap:10px;padding-left:12px}
  .slot-time{flex:0 0 58px;font-size:12px}
  .grid3{gap:7px}
  .rows > div{grid-template-columns:82px 1fr;gap:9px}
}
@media (max-height:620px){
  .tab{padding:6px 2px;font-size:9px}
  .tab .ic{width:18px;height:18px;padding:2px 9px}
}
@media (min-width:700px){
  :root{--col:520px}
  .app{padding:22px 20px 34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- 10X event additions ---- */
.bar-cta{
  margin-left:auto;background:var(--grad-btn);color:#FFFFFF;border-radius:999px;
  padding:8px 16px;font-size:13px;font-weight:600;white-space:nowrap;
}
.seatpill{
  display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--amber-soft);color:var(--amber-2);border-radius:999px;
  padding:8px 14px;font-size:12.5px;font-weight:600;margin:0 auto 14px;width:fit-content;
}
.seatpill .ic{width:15px;height:15px}
.head-line{
  font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 108;font-weight:700;
  font-size:19px;line-height:1.25;margin-bottom:8px;
}
.body-dim{color:var(--dim);font-size:14px}
.mod{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.mod-n{
  font-family:"Archivo",sans-serif;font-weight:800;font-size:17px;color:var(--brand);
  background:color-mix(in srgb,var(--violet) 12%,transparent);border-radius:8px;
  padding:7px 0;text-align:center;
}
.mod h3{font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 104;font-weight:700;font-size:15.5px;margin-bottom:4px}
.mod p{color:var(--dim);font-size:13.5px}
.inc-h{
  font-family:"Archivo",sans-serif;font-weight:700;font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--brand);margin-bottom:11px;
}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{
  background:var(--card-2);border:1px solid var(--line-2);border-radius:999px;
  padding:5px 11px;font-size:12.5px;color:var(--dim);
}
.warn{border-left:3px solid var(--orange)}
.warn p{color:var(--dim);font-size:14px}
.day-theme{
  font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 106;font-weight:700;
  font-size:15px;margin:0 0 10px;
}
.por{overflow:hidden;padding:0}
.por img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.por-x{color:var(--brand)}
.sheet-img{
  width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 20%;
  display:block;margin-bottom:13px;border:1px solid var(--line-2);
}
.sheet-in{max-height:86vh;overflow-y:auto}
.badge-a{color:var(--amber-2);border-color:color-mix(in srgb,var(--amber-2) 55%,transparent)}

.brand-logo{height:42px;width:auto;display:block;flex:0 0 auto}
.hero-logo{display:block;width:min(178px,50%);height:auto;margin:10px auto 22px}
@media (max-width:360px){.brand-logo{height:36px}.bar-in{gap:10px;padding-left:14px;padding-right:14px}.hero-logo{width:min(156px,52%);margin-bottom:18px}}
</style>

  return `

  </div>
  <div class="days">
    ${E.days.map((x,i)=>`<button class="day" data-day="${i}" aria-pressed="${i===day}">${esc(x.label)} · ${esc(x.date)}</button>`).join("")}
  </div>
  <p class="day-theme">${esc(d.theme)}</p>
  <div class="info">${ic("info")}<span>Times are IST and may shift slightly on the day. Tap a session for what it covers.</span></div>
  ${list.length?list.map(({s,i})=>{
    const k=key(day,i), on=saved.has(k), [cls,label]=TAGS[s.k]||TAGS.desk;
    return `<div class="slot${on?" saved":""}">
      <div class="slot-r">
        <button class="slot-main" data-open="${i}" aria-expanded="false">
          <span class="slot-time num">${esc(s.t)}</span>
          <span class="slot-div"></span>
          <span class="slot-b"><h3>${esc(s.n)}</h3><span class="who">${esc(s.w)}</span>
            <span class="tag ${cls}">${label}</span></span>
        </button>
        <button class="star" data-star="${i}" aria-pressed="${on}" aria-label="Save ${esc(s.n)}">${ic("star",on?"ic-fill":"")}</button>
      </div>
      <div class="slot-d">${esc(s.d)}</div>
    </div>`;
  }).join(""):`<p class="empty">Nothing saved on this day yet. Tap the star on a session to keep it here.</p>`}
  <a class="btn" style="margin-top:16px" href="${esc(E.ctaUrl)}" target="_blank" rel="noopener">${esc(E.ctaLabel)}</a>`;
}

/* ---------------- speakers ---------------- */
function face(s,big){
  if(s.img && IMG[s.img]) return `<span class="por"><img src="${IMG[s.img]}" alt="${esc(s.n)}" loading="lazy"></span>`;
  return `<span class="por por-x">${s.reveal?"?":esc(inits(s.n))}</span>`;
}
function speakers(){
  const leads=E.speakers.filter(s=>s.tier==="lead"), guests=E.speakers.filter(s=>s.tier!=="lead");
  const idx=s=>E.speakers.indexOf(s);
  return `
  <div class="sh">${ic("users")}<h2>Meet your coaches</h2></div>
  <div class="grid2">${leads.map(s=>`<button class="sp key" data-sp="${idx(s)}">
    ${face(s,true)}<span class="sp-b"><h3>${esc(s.n)}</h3><p>${esc(s.r)}</p></span></button>`).join("")}</div>

  <p class="sub-h">Guest faculty</p>
  <div class="grid2">${guests.map(s=>`<button class="sp" data-sp="${idx(s)}">
    ${face(s,false)}<span class="sp-b"><h3>${esc(s.n)}</h3><p>${esc(s.r)}</p>
    ${s.reveal?`<span class="badge badge-a">Reveal soon</span>`:""}</span></button>`).join("")}</div>

  <div class="sh">${ic("info")}<h2>In the room</h2></div>
  <div class="card"><p class="body-dim">Every session is taught live by the faculty above — no recordings played back, no stand-ins. Tap a coach to see exactly what their session covers.</p></div>
  <a class="btn" style="margin-top:14px" href="${esc(E.ctaUrl)}" target="_blank" rel="noopener">${esc(E.ctaLabel)}</a>`;
}

/* ---------------- venue ---------------- */
function planSVG(which){

  if(which===0){
    return `<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ground floor plan">
      <rect width="360" height="240" fill="#F6F4FD"/>
      <rect x="18" y="18" width="324" height="204" fill="${room}" stroke="${wall}" stroke-width="2"/>
      <rect x="40" y="150" width="280" height="54" fill="${hi}" opacity=".85"/>
      <text x="180" y="182" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">MAIN HALL · SEATING</text>
      <rect x="120" y="40" width="120" height="40" fill="${hi}"/>
      <text x="180" y="65" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">STAGE</text>
      <rect x="30" y="30" width="72" height="46" fill="${soft}" stroke="${wall}"/>
      <text x="66" y="57" text-anchor="middle" font-family="Arial" font-size="8.5" fill="${txt}">CHECK-IN</text>
      <rect x="258" y="30" width="72" height="46" fill="${soft}" stroke="${wall}"/>
      <text x="294" y="57" text-anchor="middle" font-family="Arial" font-size="8.5" fill="${txt}">TEA / COFFEE</text>
      <rect x="30" y="96" width="60" height="38" fill="#FDF2E0" stroke="${wall}"/>
      <text x="60" y="119" text-anchor="middle" font-family="Arial" font-size="8.5" fill="${txt}">RESTROOMS</text>
      <rect x="270" y="96" width="60" height="38" fill="#FEEBCB" stroke="${wall}"/>
      <text x="300" y="119" text-anchor="middle" font-family="Arial" font-size="8.5" fill="${txt}">HELP DESK</text>
      <rect x="160" y="214" width="46" height="10" fill="#C25834"/>
      <text x="183" y="234" text-anchor="middle" font-family="Arial" font-size="8.5" fill="${txt}">ENTRANCE</text>
    </svg>`;
  }
  return `<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Upper level plan">
    <rect width="360" height="240" fill="#F6F4FD"/>
    <rect x="18" y="18" width="324" height="204" fill="${room}" stroke="${wall}" stroke-width="2"/>
    <rect x="34" y="34" width="140" height="88" fill="${hi}" opacity=".85"/>
    <text x="104" y="82" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">LAB ROOM</text>
    <rect x="192" y="34" width="134" height="88" fill="${soft}" stroke="${wall}"/>
    <text x="259" y="82" text-anchor="middle" font-family="Arial" font-size="10" fill="${txt}">BREAKOUT</text>
    <rect x="34" y="138" width="90" height="66" fill="${soft}" stroke="${wall}"/>
    <text x="79" y="175" text-anchor="middle" font-family="Arial" font-size="9" fill="${txt}">LOUNGE</text>
    <rect x="138" y="138" width="90" height="66" fill="#FDF2E0" stroke="${wall}"/>
    <text x="183" y="175" text-anchor="middle" font-family="Arial" font-size="9" fill="${txt}">DINING</text>
    <rect x="242" y="138" width="84" height="66" fill="#FEEBCB" stroke="${wall}"/>
    <text x="284" y="175" text-anchor="middle" font-family="Arial" font-size="9" fill="${txt}">ONE-TO-ONES</text>
  </svg>`;
}

function venue(){
  const v=E.venue;
  return `
  <div class="sh">${ic("pin")}<h2>Know before you go</h2></div>
  <p class="body-dim" style="margin-bottom:14px">${esc(v.name)} · ${esc(E.datesLabel)}</p>
  ${[0,1].map(i=>`<div class="plan-card">
    <button class="plan-img" data-plan="${i}">${planSVG(i)}<span class="zoom">Tap to zoom</span></button>
    <div class="plan-cap">${i===0?"Ground floor · main hall":"Upper level · labs and breakout"}</div>
  </div>`).join("")}

  <div class="sh">${ic("pin")}<h2>Address</h2></div>
  <div class="card">
    <p class="addr">${esc(v.addr.split("\n")[0])}</p>
    <p class="addr-s">${nl(v.addr.split("\n").slice(1).join("\n"))}</p>
    <p class="addr-s" style="margin-top:12px">${nl(v.near)}</p>
    <a class="btn btn-2" style="margin-top:14px" href="${esc(v.mapsUrl)}" target="_blank" rel="noopener">${ic("pin")}Open in maps</a>
  </div>

  <div class="sh">${ic("info")}<h2>On the day</h2></div>
  <div class="card"><dl class="rows">
    ${v.plan.map(r=>`<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("")}
    <div><dt>Doors</dt><dd>${esc(v.doors)}</dd></div>
  </dl></div>`;
}

/* ---------------- more ---------------- */
function more(){
  const s=E.support;
  return `
  <div class="sh">${ic("dots")}<h2>More</h2></div>

  <p class="sub-h">Support</p>
  <div class="grp">
    <a class="grow lit" href="https://wa.me/919324636993">${ic("chat")}<span class="grow-b"><b>WhatsApp only</b><span>${esc(s.whatsapp)}</span></span>${ic("chev","chev")}</a>
    <a class="grow" href="mailto:${esc(s.email)}">${ic("mail")}<span class="grow-b"><b>Email us</b><span>${esc(s.email)}</span></span>${ic("chev","chev")}</a>
    <a class="grow" href="tel:+912235403306">${ic("phone")}<span class="grow-b"><b>Landline</b><span>${esc(s.landline)} · ${esc(s.hours)}</span></span>${ic("chev","chev")}</a>
  </div>

  <p class="sub-h">Legal</p>
  <div class="grp">
    ${E.policies.map(l=>`<a class="grow" href="${esc(l.u)}" target="_blank" rel="noopener">${ic("doc")}<span class="grow-b"><b>${esc(l.l)}</b></span>${ic("chev","chev")}</a>`).join("")}
    <button class="grow" data-go="terms">${ic("doc")}<span class="grow-b"><b>Event terms</b><span>How this event page may be used</span></span>${ic("chev","chev")}</button>
  </div>

  <p class="foot">© Malkansview.com · All rights reserved<br>${esc(E.legal.owner)}<br>${esc(E.legal.sebi)}<br>${esc(E.legal.risk)}</p>`;
}

/* ---------------- terms ---------------- */
function terms(){
  const S=[
    ["Purpose and scope",`This page is a companion to ${E.name}, held on ${E.datesLabel} at ${E.venue.name}. It carries the schedule, faculty information, venue details and announcements. Where it differs from the email you receive from the Malkansview team, that email is the record.`],
    ["Education, not advice",`${E.legal.risk} Malkansview is not acting as your investment adviser or portfolio manager, does not issue buy or sell calls, and no faculty member will manage money on your behalf. ${E.legal.sebi}`],
    ["Market risk",`Trading and investing carry risk, including the loss of the whole amount you commit. Past results, whether a faculty member's or a past participant's, do not indicate future results. Nothing here is a promise of profit.`],
    ["Seats and fees",`The room is capped at 100 seats. The fee is ${E.price}, or two payments of ₹66,000 with the balance cleared before 28 September 2026. Cancellation and refund terms are set out in the refund policy linked under Legal.`],
    ["Recordings and materials",`Slides, worksheets and any session recordings are licensed to you for your own use. Recording the sessions yourself, sharing materials, reselling or republishing them is not permitted.`],
    ["Conduct in the room",`The two days are a shared space. Recording other participants, soliciting them, or sharing anything said about another person's account or positions is not allowed and is grounds for removal without refund.`],
    ["Changes",`Session times, faculty and running order may change. Changes are announced on this page and by email. The surprise guest session is subject to the guest's availability.`],
    ["Contact",`Questions about these terms or your enrolment: ${E.support.email}, or WhatsApp ${E.support.whatsapp}, ${E.support.hours}.`]
  ];
  return `
  <button class="back" data-go="more">${ic("chev")}Back to more</button>
  <div class="terms-h"><span class="ic-wrap">${ic("doc")}</span><h2>Event terms</h2></div>
  <div class="terms">
    <p class="lede">${esc(E.name)} · ${esc(E.venue.name)}</p>
    <p class="eff">Effective date: 22 September 2026</p>
    <p>These terms govern your use of this event page and your attendance at ${esc(E.name)}. By using the page or enrolling, you agree to them.</p>
    ${S.map(([h,b],i)=>`<h3><i class="num">${i+1}.</i>${esc(h)}</h3><p>${esc(b)}</p>`).join("")}
    <p class="foot" style="margin-top:22px">© Malkansview.com · ${esc(E.legal.owner)}</p>
  </div>`;
}

/* ---------------- countdown ---------------- */
function tick(){
  const el=$("#cd"); if(!el) return;
  const t=new Date(E.starts)-new Date();
  if(t<=0){ render(); return; }
  const s=Math.floor(t/1000);
  const parts=[[Math.floor(s/86400),"days"],[Math.floor(s%86400/3600),"hrs"],[Math.floor(s%3600/60),"min"],[s%60,"sec"]];
  el.innerHTML=parts.map(([v,l])=>`<div><strong class="num">${String(v).padStart(2,"0")}</strong><span>${l}</span></div>`).join("");
}

/* ---------------- render ---------------- */
const TABS=[["home","Home","home"],["schedule","Schedule","cal"],["speakers","Speakers","users"],["venue","Venue","pin"],["more","More","dots"]];

function paintTabs(){
  const sel=view==="terms"?"more":view;
  $("#tabs").innerHTML=TABS.map(([id,label,i])=>
    `<button class="tab" role="tab" data-go="${id}" aria-selected="${id===sel}">${ic(i)}${label}</button>`).join("");
}

function render(){
  $("#barCta").href=E.ctaUrl;
  $("#v-home").innerHTML=home();
  $("#v-schedule").innerHTML=schedule();
  $("#v-speakers").innerHTML=speakers();
  $("#v-venue").innerHTML=venue();
  $("#v-more").innerHTML=more();
  $("#v-terms").innerHTML=terms();
  paintTabs();
  tick();
  clearInterval(timer); timer=setInterval(tick,1000);
}

function go(name){
  view=name;
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+name));
  paintTabs();
  const sc=$("#scroll"); if(sc) sc.scrollTop=0;
}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const t=e.target;

  const goBtn=t.closest("[data-go]");
  if(goBtn){ go(goBtn.dataset.go); return; }

  const d=t.closest("[data-day]");
  if(d){ day=Number(d.dataset.day); $("#v-schedule").innerHTML=schedule(); return; }

  if(t.closest("#mine")){ onlySaved=!onlySaved; $("#v-schedule").innerHTML=schedule(); return; }

  const st=t.closest("[data-star]");
  if(st){
    const k=key(day,Number(st.dataset.star));
    saved.has(k)?saved.delete(k):saved.add(k);
    persist(); $("#v-schedule").innerHTML=schedule(); return;
  }

  const op=t.closest("[data-open]");
  if(op){
    const slot=op.closest(".slot"), open=slot.classList.toggle("open");
    op.setAttribute("aria-expanded",String(open)); return;
  }

  const sp=t.closest("[data-sp]");
  if(sp){
    const s=E.speakers[Number(sp.dataset.sp)];
    $("#sheetIn").innerHTML=`
      ${s.img&&IMG[s.img]?`<img class="sheet-img" src="${IMG[s.img]}" alt="${esc(s.n)}">`:`<div class="mono">${s.reveal?"?":esc(inits(s.n))}</div>`}
      <h3>${esc(s.n)}</h3><p class="role">${esc(s.r)}</p><p>${esc(s.f)}</p>
      ${s.learn&&s.learn.length?`<p class="inc-h" style="margin-top:14px">What you'll learn in the room</p>
      <div class="list">${s.learn.map(l=>`<div>${ic("check")}<span>${esc(l)}</span></div>`).join("")}</div>`:""}
      <button class="btn btn-2" data-close>Close</button>`;
    $("#sheet").classList.add("on"); return;
  }
  if(t.closest("[data-close]")||t.id==="sheet"){ $("#sheet").classList.remove("on"); }

  const pl=t.closest("[data-plan]");
  if(pl){ $("#lbIn").innerHTML=planSVG(Number(pl.dataset.plan)); $("#lb").classList.add("on"); return; }
  if(t.id==="lbX"||t.id==="lb"){ $("#lb").classList.remove("on"); }

});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ $("#sheet").classList.remove("on"); $("#lb").classList.remove("on"); }
});

render();
</script>
</body>
</html>
