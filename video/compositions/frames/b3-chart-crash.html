        var hash = function (n) {

        var clamp01 = function (v) {

        var DRAW_END = 0.95; // climb draws 0.00 -> 0.95
        var CRASH_AT = 1.05; // "wrong"
        var CRASH_DUR = 0.25; // red drop draws in ~0.25s
        var GLITCH_DUR = 0.3; // RGB-split + slice window
        var JITTER = 0.04; // one render frame @25fps (quantized stutter)
        var FLIP_AT = 1.19; // tag flips red as the value crosses zero
        var ALERT_AT = 1.27;

        var CLIMB = [[110, 900], [152, 858], [194, 872], [236, 812], [278, 830], [320, 764], [362, 782], [404, 706], [446, 726], [488, 640], [530, 662], [572, 566], [620, 488]];

        // ---- elements ----
        var climb = $("climb"), climbGlow = $("climb-glow");
        var crash = $("crash"), crashGlow = $("crash-glow"), crashGrp = $("crashgrp");
        var tipPos = $("tippos"), tipA = $("tipa"), tipR = $("tipr"), halo = $("halo"), haloR = $("halor");
        var tagPos = $("tagpos"), tagA = $("taga"), tagR = $("tagr"), txtA = $("txta"), txtR = $("txtr");
        var areaRect = $("arearect"), pline = $("pline"), vblur = $("vblur");
        var plotVis = $("plotvis"), gWarm = $("gwarm"), gCool = $("gcool");
        var slices = Array.prototype.slice.call(document.querySelectorAll(".b3-chart-crash-slice"));
        var cam = $("cam"), grid = $("grid"), violet = $("violet"), amberGlow = $("amberglow"), redGlow = $("redglow");
        var dotA = $("dota"), dotR = $("dotr");

        var Lc = climb.getTotalLength();
        var Lk = crash.getTotalLength();
        [climb, climbGlow].forEach(function (p) {
          p.style.strokeDasharray = Lc + " " + (Lc + 40);
          p.style.strokeDashoffset = Lc;
        });
        [crash, crashGlow].forEach(function (p) {
          p.style.strokeDasharray = Lk + " " + (Lk + 40);
          p.style.strokeDashoffset = Lk;
        });

        // ---- faint candle bars, derived from the climb (seeded, index-driven) ----
        var lineYAt = function (x) {
          for (var i = 1; i < CLIMB.length; i++) {
            if (x <= CLIMB[i][0]) {
              var a = CLIMB[i - 1], b = CLIMB[i];
              return a[1] + ((x - a[0]) / (b[0] - a[0])) * (b[1] - a[1]);
            }
          }
          return CLIMB[CLIMB.length - 1][1];
        };
        var candleWrap = $("candles");
        var candles = [];
        for (var i = 0; i < 9; i++) {
          var cx = 138 + i * 56;
          var cy = lineYAt(cx) + (hash(i * 3 + 1) * 2 - 1) * 16 + 10;
          var bh = 34 + hash(i * 5 + 2) * 44;
          var up = hash(i * 9 + 6) > 0.32;
          var g = document.createElementNS(NS, "g");
          var wick = document.createElementNS(NS, "line");
          wick.setAttribute("x1", cx);
          wick.setAttribute("x2", cx);
          wick.setAttribute("y1", (cy - bh / 2 - (10 + hash(i * 7 + 3) * 22)).toFixed(1));
          wick.setAttribute("y2", (cy + bh / 2 + (8 + hash(i * 11 + 4) * 18)).toFixed(1));
          wick.setAttribute("stroke", up ? "rgba(178,107,232,0.42)" : "rgba(154,150,178,0.4)");
          wick.setAttribute("stroke-width", "2");
          var body = document.createElementNS(NS, "rect");
          body.setAttribute("x", cx - 10);
          body.setAttribute("y", (cy - bh / 2).toFixed(1));
          body.setAttribute("width", 20);
          body.setAttribute("height", bh.toFixed(1));
          body.setAttribute("rx", 3);
          body.setAttribute("fill", up ? "rgba(178,107,232,0.16)" : "rgba(154,150,178,0.10)");
          body.setAttribute("stroke", up ? "rgba(178,107,232,0.48)" : "rgba(154,150,178,0.42)");
          body.setAttribute("stroke-width", "2");
          g.appendChild(wick);
          g.appendChild(body);
          candleWrap.appendChild(g);
          candles.push({ el: g, x: cx });
        }

        var fmt = function (v) {
          return (v < -0.05 ? "-" : "+") + Math.abs(v).toFixed(1) + "%";
        };
        var lastTxt = "";

        // ---- the rig: every procedural value is a pure function of local time t ----
        function rig(t) {
          var pd = clamp01(t / DRAW_END); // steady climb (linear pen)
          var tc = clamp01((t - CRASH_AT) / CRASH_DUR);
          var pc = tc * tc; // crash accelerates (power2.in)
          var crashed = t >= CRASH_AT;

          climb.style.strokeDashoffset = (Lc * (1 - pd)).toFixed(2);
          climbGlow.style.strokeDashoffset = (Lc * (1 - pd)).toFixed(2);
          crash.style.strokeDashoffset = (Lk * (1 - pc)).toFixed(2);
          crashGlow.style.strokeDashoffset = (Lk * (1 - pc)).toFixed(2);
          crashGrp.style.opacity = crashed ? 1 : 0;

          var pt = crashed ? crash.getPointAtLength(Lk * pc) : climb.getPointAtLength(Lc * pd);
          tipPos.setAttribute("transform", "translate(" + pt.x.toFixed(2) + " " + pt.y.toFixed(2) + ")");
          tagPos.setAttribute("transform", "translate(" + (pt.x + 24).toFixed(2) + " " + (pt.y - 34).toFixed(2) + ")");
          areaRect.setAttribute("width", Math.max(0, Math.min(pt.x, 620) - 110).toFixed(2));
          pline.setAttribute("x1", (pt.x + 14).toFixed(2));
          pline.setAttribute("y1", pt.y.toFixed(2));
          pline.setAttribute("y2", pt.y.toFixed(2));
          pline.setAttribute("stroke", crashed ? "#ff4d5e" : "#feb022");
          tipA.style.opacity = crashed ? 0 : 1;
          tipR.style.opacity = crashed ? 1 : 0;

          var v = crashed ? 8.2 - 26.8 * pc : 8.2 * pd;
          var s = fmt(v);
          if (s !== lastTxt) {
            txtA.textContent = s;
            txtR.textContent = s;
            lastTxt = s;
          }
          var red = t >= FLIP_AT;
          tagA.style.opacity = red ? 0 : 1;
          tagR.style.opacity = red ? 1 : 0;

          // vertical motion blur on the falling tag: grows with fall speed, 0 the instant it lands
          var vb = crashed && tc < 1 ? 10 * tc : 0;
          vblur.setAttribute("stdDeviation", "0 " + vb.toFixed(2));

          // chromatic glitch: RGB-split ghosts + slice tear, quantized-time hash, amp envelope 1 -> 0
          var step = Math.floor(t / JITTER + 1e-6);
          var amp = 0;
          if (t >= CRASH_AT && t < CRASH_AT + GLITCH_DUR) {
            var u = (t - CRASH_AT) / GLITCH_DUR;
            amp = 1 - u * u * u;
          }
          if (amp > 0) {
            [gWarm, gCool].forEach(function (el, layer) {
              var jx = (hash(step * 13 + layer * 7) * 2 - 1) * 14 * amp;
              var jy = (hash(step * 29 + layer * 11) * 2 - 1) * 5 * amp;
              el.setAttribute("transform", "translate(" + jx.toFixed(2) + " " + jy.toFixed(2) + ")");
              el.style.opacity = 0.85;
            });
            plotVis.style.opacity = 0;
            slices.forEach(function (el, k) {
              var on = hash(step * 31 + k * 17) > 0.42;
              var dx = on ? (hash(step * 7 + k * 3) * 2 - 1) * 56 * amp : 0;
              el.setAttribute("transform", "translate(" + dx.toFixed(2) + " 0)");
              el.style.opacity = 1;
            });
          } else {
            // clean resolve: clamp to exact rest
            [gWarm, gCool].forEach(function (el) {
              el.setAttribute("transform", "translate(0 0)");
              el.style.opacity = 0;
            });
            plotVis.style.opacity = 1;
            slices.forEach(function (el) {
              el.setAttribute("transform", "translate(0 0)");
              el.style.opacity = 0;
            });
          }

          // camera: slow push + organic drift; impact punch + deterministic shake on "wrong"
          var push = 1 + 0.045 * (t / DUR);
          var punch = 0, sx = 0, sy = 0, sr = 0;
          if (crashed) {
            var k1 = Math.max(0, 1 - (t - CRASH_AT) / 0.4);
            punch = 0.03 * k1 * k1;
            if (t < CRASH_AT + 0.45) {
              var env = Math.pow(1 - (t - CRASH_AT) / 0.45, 2);
              sx = (hash(step * 5 + 1) * 2 - 1) * 20 * env;
              sy = (hash(step * 9 + 2) * 2 - 1) * 12 * env;
              sr = (hash(step * 3 + 5) * 2 - 1) * 0.7 * env;
            }
          }
          var dx = Math.sin(t * 2.2) * 4 + sx;
          var dy = Math.sin(t * 2.86) * 2.5 + sy;
          cam.style.transform =
            "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px) rotate(" + sr.toFixed(3) + "deg) scale(" + (push + punch).toFixed(4) + ")";

          // ambient: background drifts slower than foreground
          grid.style.transform = "translate3d(0," + (-t * 16).toFixed(2) + "px,0)";
          violet.style.transform = "translate3d(" + (Math.sin(t * 0.8) * 36).toFixed(2) + "px," + (Math.sin(t * 0.6 + 1) * 24).toFixed(2) + "px,0)";
          amberGlow.style.transform =
            "translate3d(" + (pt.x - 210).toFixed(2) + "px," + (pt.y - 210).toFixed(2) + "px,0) scale(" + (1 + 0.06 * Math.sin(t * 3.1)).toFixed(4) + ")";
          redGlow.style.transform = "scale(" + (1 + 0.05 * Math.sin(t * 4.2)).toFixed(4) + ")";
          halo.setAttribute("transform", "scale(" + (1 + 0.22 * Math.sin(t * 9)).toFixed(4) + ")");
          haloR.setAttribute("transform", "scale(" + (1 + 0.25 * Math.sin(t * 11)).toFixed(4) + ")");
          dotA.style.opacity = crashed ? 0 : (0.6 + 0.4 * Math.cos(t * Math.PI * 2 * 1.3)).toFixed(3);
          dotR.style.opacity = crashed ? (0.65 + 0.35 * Math.cos((t - CRASH_AT) * Math.PI * 2 * 2.2)).toFixed(3) : 0;
        }

        var tl = gsap.timeline({ paused: true });

        // one driver spans the whole composition; the rig reads its linear time
        var drv = { t: 0 };
        rig(0);
        tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { rig(drv.t); } }, 0);

        // ---- Scene 1: chart lands, grid + axes build, candles pop as the line passes ----
        tl.fromTo($("chart"), { opacity: 0, scale: 0.94, y: 40, rotationX: 12, transformPerspective: 1600 }, { opacity: 1, scale: 1, y: 0, rotationX: 0, duration: 0.6, ease: "expo.out" }, 0);
        tl.fromTo([$("pill"), $("live")], { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 0.06);
        tl.fromTo($("sheen"), { x: -420, rotation: 18 }, { x: 1300, rotation: 18, duration: 0.62, ease: "power2.inOut" }, 0.3);

        var gridLines = Array.prototype.slice.call($("gridlines").querySelectorAll("line"));
        gridLines.forEach(function (ln, i) {
          var L = ln.getTotalLength();
          ln.style.strokeDasharray = L + " " + (L + 10);
          tl.fromTo(ln, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 0.03 + i * 0.025);
        });
        tl.fromTo($("prices").querySelectorAll("text"), { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.05 }, 0.12);
        tl.fromTo($("times").querySelectorAll("text"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.04 }, 0.18);
        gsap.set($("entry"), { transformOrigin: "0% 50%" });
        tl.fromTo($("entry"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.22);
        tl.fromTo($("entrylabel"), { opacity: 0 }, { opacity: 0.85, duration: 0.3, ease: "power1.out" }, 0.45);

        candles.forEach(function (c) {
          var at = Math.max(0, DRAW_END * ((c.x - 110) / 510) - 0.05);
          tl.fromTo(c.el, { scaleY: 0, opacity: 0, transformOrigin: "50% 50%" }, { scaleY: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, at);
        });

        tl.fromTo($("tippop"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.02);
        tl.fromTo($("tagpop"), { scale: 0.4, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.8)" }, 0.06);

        // ---- Scene 2: "wrong" @1.05 — red drop, glitch, shake, flip, alert ----
        tl.to($("climbgrp"), { opacity: 0.5, duration: 0.3, ease: "power2.out" }, CRASH_AT + 0.03);
        tl.to($("area"), { opacity: 0.3, duration: 0.3, ease: "power2.out" }, CRASH_AT + 0.03);
        tl.fromTo($("cardred"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, CRASH_AT);
        tl.fromTo($("vignette"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out" }, CRASH_AT);
        tl.to($("vignette"), { opacity: 0.5, duration: 0.6, ease: "power2.out" }, CRASH_AT + 0.08);
        tl.fromTo($("flash"), { opacity: 0 }, { opacity: 0.2, duration: 0.03, ease: "none" }, CRASH_AT);
        tl.to($("flash"), { opacity: 0, duration: 0.22, ease: "power2.out" }, CRASH_AT + 0.03);
        tl.fromTo(redGlow, { opacity: 0 }, { opacity: 0.22, duration: 0.5, ease: "power2.out" }, CRASH_AT);
        tl.to(amberGlow, { opacity: 0.04, duration: 0.3, ease: "power2.out" }, CRASH_AT);

        // tag flips red (scaleY card-flip, style swap at the midpoint)
        tl.fromTo($("tagflip"), { scaleY: 1, transformOrigin: "50% 50%" }, { scaleY: 0, duration: 0.05, ease: "power2.in" }, FLIP_AT - 0.05);
        tl.to($("tagflip"), { scaleY: 1, duration: 0.2, ease: "back.out(2.4)" }, FLIP_AT);

        // alert triangle springs in beside the tag, then rings out twice
        var alert = $("alert");
        gsap.set(alert, { svgOrigin: "916 906" });
        tl.fromTo(alert, { scale: 0, rotation: -30, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(1.9)" }, ALERT_AT);
        gsap.set([$("ring"), $("ring2")], { svgOrigin: "916 906" });
        tl.fromTo($("ring"), { scale: 0.75, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.5, ease: "power2.out" }, ALERT_AT + 0.08);
        tl.fromTo($("ring2"), { scale: 0.75 }, { scale: 1.5, duration: 0.34, ease: "power2.out" }, 1.55);
        tl.fromTo($("ring2"), { opacity: 0.8 }, { opacity: 0, duration: 0.34, ease: "power1.in", immediateRender: false }, 1.55);

        // light sweep across the landed red tag
        tl.fromTo($("tagsheen"), { x: 0 }, { x: 260, duration: 0.38, ease: "power2.inOut" }, 1.42);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
