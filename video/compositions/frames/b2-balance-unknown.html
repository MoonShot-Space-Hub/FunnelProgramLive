  var DUR = 3.8;

  // ---------- GROUND: ambient drift (slower than the stage) ----------

  // one finite ambient clock: bokeh drift, dust motes, the chip's live dot
  var MOTES = [[44.29,21.43,3.156,0.481],[32.16,14.41,5.81,0.515],[51.73,11.21,0.74,0.592],[47.94,19.79,1.111,0.48],[59.46,20.57,6.257,0.276],[46.14,19.33,2.882,0.59],[38.81,9.55,3.429,0.347],[55.37,12.93,5.115,0.535],[35.39,21.45,6.193,0.321],[58.36,15.13,4.287,0.556],[59.77,21.39,3.995,0.441],[59.69,13.49,5.256,0.338],[52.24,7.43,5.066,0.527],[39.71,17.9,2.586,0.256],[55.63,14.81,1.052,0.276],[31.22,15.94,4.194,0.454],[58.1,13.37,0.692,0.563],[45.04,8.68,4.808,0.303]];

  var bokehEls = el("bokehs").querySelectorAll(".b2-balance-unknown-bokeh");
  var liveDot = el("livedot");
  var amb = { t: 0 };
  function applyAmbient() {
    var t = amb.t, i;
    for (i = 0; i < bokehEls.length; i++) {
      var b = BOKEH[i];
      var bx = b[0] * Math.sin(b[1] + t * 0.55), by = b[0] * 0.8 * Math.cos(b[1] * 1.3 + t * 0.42);
      bokehEls[i].style.transform = "translate(" + bx.toFixed(2) + "px," + by.toFixed(2) + "px) scale(" + (1 + 0.05 * Math.sin(b[1] + t * 0.8)).toFixed(4) + ")";
    }
    for (i = 0; i < moteEls.length; i++) {
      var m = MOTES[i];
      var x = m[1] * Math.sin(m[2] + t * 0.9);
      var y = -m[0] * t;
      moteEls[i].style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
      moteEls[i].style.opacity = (m[3] * (0.62 + 0.38 * Math.sin(m[2] * 1.7 + t * 2.1))).toFixed(3);
    }
    liveDot.style.opacity = (0.6 + 0.4 * Math.cos(t * 6.2)).toFixed(3);
  }
  applyAmbient();
  tl.fromTo(amb, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: applyAmbient }, 0);

  // ---------- CAMERA: slow push (1.00 -> 1.04) ----------

  // ---------- SCENE 1 (0.0-1.3): the card, the chip, the fingerprint draws + scan ----------

    { opacity: 0.35, scale: 0.94, filter: "blur(8px)" },
    { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0);

  tl.fromTo(el("scan"), { y: -90 }, { y: 440, duration: 0.88, ease: "sine.inOut" }, 0.4);
  tl.fromTo(el("progfill"), { scaleX: 0 }, { scaleX: 1, duration: 0.88, ease: "power1.inOut" }, 0.4);

  // ---------- SCENE 2 (1.3-2.5): unlock -> zoom-through -> account panel ----------
  // "opening" (1.30): print turns amber, ripples, lock opens
  tl.fromTo(el("fpg"), { stroke: "#B26BE8", strokeWidth: 5 }, { stroke: "#FEB022", strokeWidth: 6.5, duration: 0.22, ease: "power2.out" }, 1.3);
  tl.fromTo(el("printglow"), { opacity: 0, scale: 0.7 }, { opacity: 0.42, scale: 1, duration: 0.3, ease: "power2.out" }, 1.3);
  tl.fromTo(el("progfill"), { backgroundColor: "#B26BE8" }, { backgroundColor: "#FEB022", duration: 0.2, ease: "power2.out", immediateRender: false }, 1.3);
  tl.fromTo(el("ripgate1"), { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, 1.32);
  tl.fromTo(el("rip1"), { scale: 0.55, opacity: 0.95 }, { scale: 2, opacity: 0, duration: 0.6, ease: "power2.out" }, 1.32);
  tl.fromTo(el("ripgate2"), { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, 1.42);
  tl.fromTo(el("rip2"), { scale: 0.55, opacity: 0.8 }, { scale: 2.3, opacity: 0, duration: 0.6, ease: "power2.out" }, 1.42);
  tl.fromTo(el("lockg"), { stroke: "#B26BE8" }, { stroke: "#FEB022", duration: 0.25, ease: "power2.out" }, 1.3);
  tl.fromTo(el("shackle"), { y: 0 }, { y: -10, duration: 0.4, ease: "back.out(2.2)" }, 1.3);

  // inner zoom-through (cut at peak velocity, matched 18px blur): print pushes past camera...
  tl.fromTo(el("zoom"), { scale: 1, filter: "blur(0px)" }, { scale: 1.6, filter: "blur(18px)", duration: 0.22, ease: "power3.in" }, 1.52);
  tl.fromTo(el("zoomfade"), { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "none" }, 1.52);
  // ...and the account panel arrives from behind; lands on "account" (1.94)
  tl.fromTo(el("panel"),
    { opacity: 0, scale: 0.85, filter: "blur(18px)" },
    { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.56, ease: "expo.out" }, 1.66);
  // the header + label ride in on the panel (the zoom-through carries real content); inside it the
  // header letters settle, the divider draws, then the placeholder balance pops in after "account"
  tl.fromTo(el("head").querySelectorAll(".b2-balance-unknown-ch"), { opacity: 0.35, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.025 }, 1.66);
  tl.fromTo(el("avatar"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.82);
  var divLine = el("divline");
  var DL = divLine.getTotalLength();
  divLine.style.strokeDasharray = String(DL);
  divLine.style.strokeDashoffset = String(DL);
  tl.fromTo(divLine, { strokeDashoffset: DL }, { strokeDashoffset: 0, duration: 0.44, ease: "power2.out" }, 1.8);
  tl.fromTo(el("label"), { opacity: 0.3, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 1.76);
  // spring-pop-entrance: the placeholder balance 0,00,000 pops in column by column
  tl.fromTo(el("row").children, { opacity: 0, scale: 0.6, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.03 }, 1.98);
  tl.fromTo(el("ctxskel").children, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.07 }, 2.08);

  // ---------- SCENE 3 (2.5-3.8): every column spins and lands on "?" ----------
  // vertical-spring-ticker: three additive back.out springs per column (n items each), staggered
  // starts; the vertical motion blur is driven by each column's own summed velocity.
  var ITEM_H = 200;
  var COLS = [[[2.5,0.36,1.4,5],[2.7,0.36,1.4,6],[2.92,0.46,1.8,2]],[[2.535,0.36,1.4,6],[2.735,0.36,1.4,5],[2.944,0.46,1.8,2]],[[2.57,0.36,1.4,7],[2.77,0.36,1.4,6],[2.968,0.46,1.8,2]],[[2.605,0.36,1.4,5],[2.805,0.36,1.4,7],[2.992,0.46,1.8,2]],[[2.64,0.36,1.4,6],[2.84,0.36,1.4,5],[3.016,0.46,1.8,2]],[[2.675,0.36,1.4,7],[2.875,0.36,1.4,6],[3.04,0.46,1.8,2]]]; // per column: [[start, dur, overshoot, items], ...]
  function backOut(p, s) { if (p <= 0) return 0; if (p >= 1) return 1; var q = p - 1; return q * q * ((s + 1) * q + s) + 1; }
  function backOutVel(p, s) { if (p <= 0 || p >= 1) return 0; var q = p - 1; return 3 * (s + 1) * q * q + 2 * s * q; }
  var stacks = [], blurs = [], prog = [];
  function applyCol(c) {
    var st = COLS[c], pr = prog[c], pos = 0, vel = 0;
    for (var k = 0; k < st.length; k++) {
      pos += st[k][3] * backOut(pr[k].p, st[k][2]);
      vel += st[k][3] * backOutVel(pr[k].p, st[k][2]) / st[k][1];
    }
    stacks[c].style.transform = "translate3d(0," + (-pos * ITEM_H).toFixed(2) + "px,0)";
    var b = Math.min(26, Math.abs(vel) * ITEM_H / 25 * 0.1);
    blurs[c].setAttribute("stdDeviation", "0 " + b.toFixed(2));
  }
  function colUpdater(c) { return function () { applyCol(c); }; }
  for (var c = 0; c < COLS.length; c++) {
    stacks[c] = el("stk" + c);
    blurs[c] = el("cb" + c + "-node");
    // create every spring's progress proxy before any tween can call applyCol
    prog[c] = COLS[c].map(function () { return { p: 0 }; });
    for (var k = 0; k < COLS[c].length; k++) {
      tl.fromTo(prog[c][k], { p: 0 }, { p: 1, duration: COLS[c][k][1], ease: "none", onUpdate: colUpdater(c) }, COLS[c][k][0]);
    }
    applyCol(c);
  }

  // depth-of-field-blur: the world recedes while the reels spin, then the card rack-focuses onto the row
  tl.fromTo([el("floor"), el("bokehs"), el("dust")], { "--dof": "0px", opacity: 1 }, { "--dof": "6px", opacity: 0.6, duration: 0.6, ease: "power2.inOut" }, 2.5);
  tl.fromTo([el("ctxchip"), el("ctxlock"), el("ctxhead"), el("ctxdiv"), el("ctxlabel"), el("ctxskel")],
    { "--dof": "0px", opacity: 1 }, { "--dof": "3px", opacity: 0.5, duration: 0.5, ease: "power2.inOut" }, 2.86);

  // "balance" (3.14): ?,??,??? lands amber with glow + bloom, short shake, edge glow, light sweep
  tl.fromTo(el("row"),
    { color: "#9A96B2", textShadow: "0 0 0px rgba(254,176,34,0)" },
    { color: "#FEB022", textShadow: "0 0 40px rgba(254,176,34,0.45)", duration: 0.3, ease: "power2.out" }, 3.06);
  tl.fromTo(el("rowbloom"), { opacity: 0, scale: 0.8 }, { opacity: 0.38, scale: 1, duration: 0.4, ease: "power2.out" }, 3.04);
  var rowShake = el("rowshake");
  var shake = { p: 0 };
  tl.fromTo(shake, { p: 0 }, {
    p: 1, duration: 0.42, ease: "none",
    onUpdate: function () {
      var x = 14 * Math.exp(-4.6 * shake.p) * Math.sin(Math.PI * 2 * 5 * shake.p);
      rowShake.style.transform = "translate3d(" + x.toFixed(2) + "px,0,0)";
    }
  }, 3.16);
  tl.fromTo(el("cardglow"), { opacity: 0 }, { opacity: 1, duration: 0.38, ease: "power2.out" }, 3.12);
  tl.fromTo(el("amber"), { y: 0, opacity: 0.16 }, { y: 44, opacity: 0.24, duration: 0.5, ease: "power2.out", immediateRender: false }, 3.06);
  tl.fromTo(el("rowsheen"), { backgroundPosition: "100% 50%" }, { backgroundPosition: "0% 50%", duration: 0.46, ease: "none" }, 3.28);

  window.__timelines = window.__timelines || {};
  window.__timelines["b2-balance-unknown"] = tl;
})();
</script>
