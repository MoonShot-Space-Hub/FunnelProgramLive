  var STEP_AT = [1.66, 1.88, 2.1];
  var STEP_S = [1.7, 1.7, 2.3]; // back.out overshoot per step; the climax step lands harder
  var stack = el("stack"), vblur = el("vblur-node"), ticksG = el("ticks"), arc = el("arc"), you = el("you");
  var C_ARC = arc.getTotalLength();
  var steps = [{ p: 0 }, { p: 0 }, { p: 0 }];
  var drift = { p: 0 };
  function backOut(p, s) { if (p <= 0) return 0; if (p >= 1) return 1; var q = p - 1; return q * q * ((s + 1) * q + s) + 1; }
  function backOutVel(p, s) { if (p <= 0 || p >= 1) return 0; var q = p - 1; return 3 * (s + 1) * q * q + 2 * s * q; }
  function applyDial() {
    var pos = 0, vel = 0;
    for (var i = 0; i < steps.length; i++) {
      pos += backOut(steps[i].p, STEP_S[i]);
      vel += backOutVel(steps[i].p, STEP_S[i]) / STEP_DUR;
    }
    stack.style.transform = "translate3d(0," + (-pos * ITEM_H).toFixed(2) + "px,0)";
    // motion-blur-streak: vertical blur tracks the reel speed (px per frame at 25fps), sharp at rest
    var blurPx = Math.min(22, Math.abs(vel) * ITEM_H / 25 * 0.16);
    vblur.setAttribute("stdDeviation", "0 " + blurPx.toFixed(2));
    // tick dial: slow ambient turn + one spring click per year (counter to the amber hand)
    ticksG.setAttribute("transform", "rotate(" + (-10 * drift.p - 30 * pos).toFixed(3) + " 400 400)");
    // amber "+3 years" arc and the you-marker ride the same springs clockwise
    var len = pos * C_ARC / 12;
    arc.setAttribute("stroke-dasharray", len.toFixed(2) + " " + (C_ARC + 20).toFixed(2));
    arc.style.opacity = len > 0.5 ? "1" : "0";
    var a = (-90 + 30 * pos) * Math.PI / 180;
    you.style.transform = "translate(" + (400 + 330 * Math.cos(a) - 13).toFixed(2) + "px," + (400 + 330 * Math.sin(a) - 13).toFixed(2) + "px)";
  }
  applyDial();
  tl.fromTo(drift, { p: 0 }, { p: 1, duration: DUR, ease: "none", onUpdate: applyDial }, 0);
  steps.forEach(function (s, i) {
    tl.fromTo(s, { p: 0 }, { p: 1, duration: STEP_DUR, ease: "none", onUpdate: applyDial }, STEP_AT[i]);
  });

  // "years" (1.98): TODAY zooms through, the amber "+3 YEARS" pill arrives from behind
  tl.fromTo(el("today"), { scale: 1, opacity: 1, filter: "blur(0px)" }, { scale: 1.3, opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 1.92);
  tl.fromTo(el("pill"), { scale: 0.72, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 2.08);

  tl.fromTo(el("year"),
    { color: "#FDF2E0", textShadow: "0 0 0px rgba(254,176,34,0)" },
    { color: "#FEB022", textShadow: "0 0 40px rgba(254,176,34,0.45)", duration: 0.34, ease: "power2.out" }, 2.22);
  tl.fromTo(el("bloom"), { opacity: 0, scale: 0.8 }, { opacity: 0.4, scale: 1, duration: 0.5, ease: "power2.out" }, 2.1);
  var bloomCore = el("bloomcore");
  var breathe = { p: 0 };
  tl.fromTo(breathe, { p: 0 }, {
    p: Math.PI * 2 * 0.62, duration: DUR - 2.6, ease: "none",
    onUpdate: function () {
      var s = Math.sin(breathe.p);
      bloomCore.style.opacity = (0.9 + 0.1 * s).toFixed(3);
      bloomCore.style.transform = "scale(" + (1 + 0.03 * s).toFixed(4) + ")";
    }
  }, 2.6);
  // light sweep across the landed year
  tl.fromTo(el("yearsheen"), { backgroundPosition: "100% 50%" }, { backgroundPosition: "0% 50%", duration: 0.6, ease: "none" }, 2.46);

  // ---------- SCENE 3 (2.8-4.4): ring lifts, phone rises, hidden balance ----------
  tl.fromTo(el("clock"), { y: 0, scale: 1 }, { y: -316, scale: 0.38, duration: 0.72, ease: "power3.inOut" }, 2.86);

  // phone rises from below with a vertical motion-blur streak (blur shares the move's window + ease)
  var pblur = el("pblur-node");
  var pb = { v: 26 };
  function writePB() { pblur.setAttribute("stdDeviation", "0 " + pb.v.toFixed(2)); }
  writePB();
  tl.fromTo(el("phonewrap"), { y: 900, rotation: 8, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.62, ease: "expo.out" }, 2.9);
  tl.fromTo(pb, { v: 26 }, { v: 0, duration: 0.62, ease: "expo.out", onUpdate: writePB }, 2.9);
  tl.fromTo(el("phonefloat"), { y: 0 }, { y: -8, duration: DUR - 3.52, ease: "sine.inOut" }, 3.52);

  // screen builds after the landing
  tl.fromTo(el("hdr"), { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 3.12);
  tl.fromTo(el("bcard"), { opacity: 0, y: 28, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, 3.18);
  tl.fromTo(el("blabel"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.26);
  tl.fromTo(el("dots").querySelectorAll("i"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.7)", stagger: 0.03 }, 3.28);
  tl.fromTo(el("eye"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 3.3);
  var slash = el("slash");
  var SL = slash.getTotalLength();
  slash.style.strokeDasharray = String(SL);
  slash.style.strokeDashoffset = String(SL);
  tl.fromTo(slash, { strokeDashoffset: SL }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 3.42);
  tl.fromTo(el("qa").querySelectorAll(".b1-three-years-qb"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out", stagger: 0.04 }, 3.34);
  tl.fromTo(el("screen").querySelectorAll(".b1-three-years-tx"), { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.07 }, 3.42);
  // shimmer over the blurred balance (one bounded pass) + one glass sweep across the phone
  tl.fromTo(el("shimmer"), { x: -150 }, { x: 320, duration: 0.85, ease: "none" }, 3.45);
  tl.fromTo(el("glass"), { x: -260 }, { x: 360, duration: 0.7, ease: "none" }, 3.52);

  // "balance" (3.74): the hidden row pulses once (almost readable, then gone) ...
  var dotsPulse = el("dotspulse"), dots = el("dots"), dotsGlow = el("dotsglow");
  var pulse = { p: 0 };
  tl.fromTo(pulse, { p: 0 }, {
    p: 1, duration: 0.44, ease: "none",
    onUpdate: function () {
      var k = Math.sin(Math.PI * pulse.p);

      dots.style.filter = "blur(" + (13 - 5 * k).toFixed(2) + "px)";

  // ... and the amber "?" badge springs onto the phone corner
  tl.fromTo(el("badge"), { scale: 0, rotation: -28, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 3.74);
  tl.fromTo(el("badgegate"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 3.8);
  tl.fromTo(el("badgering"), { scale: 0.7, opacity: 0.95 }, { scale: 2, opacity: 0, duration: 0.55, ease: "power2.out" }, 3.8);

  window.__timelines = window.__timelines || {};
  window.__timelines["b1-three-years"] = tl;
