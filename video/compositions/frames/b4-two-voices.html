        var TODAY_AT = 3.33; // "today" -> rack focus to kindness

        var kind = $("kind"), harsh = $("harsh"), kbob = $("kbob"), hdof = $("hdof");
        var kw1 = $("kw1"), kw2 = $("kw2"), kw3 = $("kw3");
        var hw1 = $("hw1"), hwg = [$("hwg1"), $("hwg2")];
        var hcopies = [$("hwarm"), $("hcool")];
        var cam = $("cam"), grid = $("grid"), violet = $("violet"), amberGlow = $("amberglow"), redGlow = $("redglow");
        var vsring = $("vsring"), heartbeat = $("heartbeat"), boltpath = $("boltpath");

        var WW = 874;

        function kindPath(amp, ph, k1, k2, off) {
          var d = "";
          for (var i = 0; i <= 96; i++) {
            var u = i / 96;
            var x = u * WW;
            var env = Math.pow(Math.sin(Math.PI * u), 1.2);
            var y = 70 - amp * env * (0.62 * Math.sin(u * Math.PI * 2 * k1 - ph + off) + 0.38 * Math.sin(u * Math.PI * 2 * k2 + ph * 1.3 + off));
            d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(2);
          }
          return d;
        }
        function harshPath(amp, step) {
          var d = "";
          var n = 48;
          for (var i = 0; i <= n; i++) {
            var u = i / n;
            var x = u * WW;
            var env = 0.22 + 0.78 * Math.pow(Math.sin(Math.PI * u), 0.7);
            var h = hash(i * 7.31 + step * 13.7);
            var spike = hash(i * 3.7 + step * 5.1) > 0.8 ? 1 : 0.5;
            var y = 75 + (i % 2 ? 1 : -1) * amp * env * (0.25 + 0.75 * h) * spike;
            if (i === 0 || i === n) y = 75;
            d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(2);
          }
          return d;
        }
        // amplitude envelope of a glitch window (snap to 1, decay to 0 on power3.in)
        function win(t, at, dur) {
          if (t < at || t >= at + dur) return 0;
          var u = (t - at) / dur;
          return 1 - u * u * u;
        }

        // ---- the rig: procedural state as a pure function of local time ----
        function rig(t) {
          // calm sine voice
          var ampK = 16 + 32 * smooth((t - KIND_AT) / 0.5) + 10 * smooth((t - TODAY_AT) / 0.4);
          var ph = t * Math.PI * 2 * 0.55;
          kw1.setAttribute("d", kindPath(ampK, ph, 2.2, 3.7, 0));
          kw2.setAttribute("d", kindPath(ampK * 0.72, ph, 2.2, 3.7, 1.15));
          kw3.setAttribute("d", kindPath(ampK * 0.5, ph, 2.2, 3.7, -1.05));

          // jagged harsh voice, re-rolled every 0.06s (quantized, seeded)
          var stepH = Math.floor(t / 0.06 + 1e-6);
          var ampH = 56 * (1 - 0.38 * smooth((t - TODAY_AT) / 0.45));
          var hd = harshPath(ampH, stepH);
          hw1.setAttribute("d", hd);
          hwg[0].setAttribute("d", hd);
          hwg[1].setAttribute("d", hd);

          // chromatic glitch: entrance + two bursts, quantized-time hash
          var stepG = Math.floor(t / 0.04 + 1e-6);
          var amp = Math.max(win(t, HARSH_AT, 0.35), win(t, VOICE_AT, 0.18), win(t, USE_AT, 0.14));
          hcopies.forEach(function (el, layer) {
            if (amp > 0) {
              var jx = (hash(stepG * 13 + layer * 7) * 2 - 1) * 12 * amp;
              var jy = (hash(stepG * 29 + layer * 11) * 2 - 1) * 4 * amp;
              el.style.transform = "translate(" + jx.toFixed(2) + "px," + jy.toFixed(2) + "px)";
              el.style.opacity = 0.8;
            } else {
              el.style.transform = "translate(0px,0px)";
              el.style.opacity = 0;
            }
          });
          // waveform RGB flicker: sporadic low-level split + the bursts
          var flick = t >= SAME_AT + 0.15 && hash(stepH * 3.3 + 1) > 0.62 ? 0.4 : 0;
          var wa = Math.max(amp, flick);
          hwg.forEach(function (el, layer) {
            if (wa > 0) {
              var jx = (hash(stepG * 17 + layer * 5 + 3) * 2 - 1) * 12 * wa;
              var jy = (hash(stepG * 23 + layer * 9 + 1) * 2 - 1) * 5 * wa;
              el.setAttribute("transform", "translate(" + jx.toFixed(2) + " " + jy.toFixed(2) + ")");
              el.style.opacity = 0.75;
            } else {
              el.setAttribute("transform", "translate(0 0)");
              el.style.opacity = 0;
            }
          });

          // harsh card shake on "voice" + counter-phase idle bobs
          var sx = 0, sy = 0, sr = 0;
          if (t >= VOICE_AT && t < VOICE_AT + 0.32) {
            var env = Math.pow(1 - (t - VOICE_AT) / 0.32, 2);
            sx = (hash(stepG * 5 + 1) * 2 - 1) * 18 * env;
            sy = (hash(stepG * 9 + 4) * 2 - 1) * 6 * env;
            sr = (hash(stepG * 3 + 2) * 2 - 1) * 1.1 * env;
          }
          var bobK = t > 0.9 ? Math.sin(((t - 0.9) * Math.PI * 2) / 2.4) * 3 : 0;
          var bobH = t > 2.3 ? -Math.sin(((t - 2.3) * Math.PI * 2) / 2.4) * 3 : 0;
          kbob.style.transform = "translate3d(0," + bobK.toFixed(2) + "px,0)";
          hdof.style.transform = "translate3d(" + sx.toFixed(2) + "px," + (sy + bobH).toFixed(2) + "px,0) rotate(" + sr.toFixed(3) + "deg)";

          // camera: slow push, drift, landing bump from the harsh slam
          var push = 1 + 0.035 * (t / DUR);
          var by = 0, bs = 0;
          if (t >= 1.86) {
            var k = Math.max(0, 1 - (t - 1.86) / 0.35);
            by = 10 * k * k;
            bs = 0.01 * k * k;
          }
          var tr = t >= VOICE_AT && t < VOICE_AT + 0.25 ? (hash(stepG * 11 + 7) * 2 - 1) * 2.5 * (1 - (t - VOICE_AT) / 0.25) : 0;
          var dx = Math.sin(t * 1.3) * 4 + tr;
          var dy = Math.sin(t * 1.69) * 2.5 + by;
          cam.style.transform = "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px) scale(" + (push + bs).toFixed(4) + ")";

          // ambient decoratives
          vsring.style.transform = "rotate(" + (t * 38).toFixed(2) + "deg)";
          var beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2 * 1.1)), 6);
          heartbeat.setAttribute("transform", "translate(60 60) scale(" + (1 + 0.07 * beat).toFixed(4) + ") translate(-60 -60)");
          boltpath.style.opacity = (hash(stepH * 7 + 3) > 0.25 ? 1 : 0.45) * (amp > 0 && hash(stepG * 2 + 9) > 0.5 ? 0.5 : 1);
          grid.style.transform = "translate3d(0," + (-t * 14).toFixed(2) + "px,0)";
          violet.style.transform = "translate3d(" + (Math.sin(t * 0.7) * 40).toFixed(2) + "px," + (Math.sin(t * 0.5 + 1) * 30).toFixed(2) + "px,0)";
          amberGlow.style.transform = "scale(" + (1 + 0.07 * Math.sin(t * 2.1)).toFixed(4) + ")";
          redGlow.style.transform = "scale(" + (1 + 0.06 * Math.sin(t * 3.3)).toFixed(4) + ")";
        }

        // motion-blur proxies (directional, X axis), share window + ease with each sweep
        var mbk = $("mbk-node"), mbh = $("mbh-node");
        var bk = { v: 22 }, bh = { v: 26 };
        var writeK = function () { mbk.setAttribute("stdDeviation", bk.v.toFixed(2) + " 0"); };
        var writeH = function () { mbh.setAttribute("stdDeviation", bh.v.toFixed(2) + " 0"); };
        writeK();
        writeH();

        var tl = gsap.timeline({ paused: true });
        var drv = { t: 0 };
        rig(0);
        tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { rig(drv.t); } }, 0);

        gsap.set([kind, harsh], { transformPerspective: 1400, transformOrigin: "50% 50%" });

        // ---- Scene 1: KINDNESS card sweeps in from the left with a 3D tilt ----
        tl.fromTo(kind, { x: -700 }, { x: 0, duration: 0.75, ease: "expo.out" }, 0);
        tl.fromTo(kind, { rotationY: 14 }, { rotationY: 0, duration: 0.9, ease: "back.out(1.6)" }, 0);
        tl.fromTo(kind, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 0);
        tl.fromTo(bk, { v: 22 }, { v: 0, duration: 0.75, ease: "expo.out", onUpdate: writeK }, 0);
        tl.set(kind, { filter: "none" }, 0.8);

        tl.fromTo($("kchip"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo($("kdim"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.1);
        tl.fromTo($("kwrect"), { attr: { width: 0 } }, { attr: { width: 914 }, duration: 0.6, ease: "power2.out" }, 0.16);

        // "kindness" @0.37 — the word lights up (wipe + flare), blooms, punches
        tl.fromTo($("klit"), { clipPath: "inset(-60px 100% -60px -60px)" }, { clipPath: "inset(-60px -12% -60px -60px)", duration: 0.4, ease: "power3.out" }, KIND_AT);
        tl.fromTo($("kflare"), { x: 0 }, { x: 640, duration: 0.4, ease: "power3.out" }, KIND_AT);
        tl.fromTo($("kflare"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, KIND_AT);
        tl.to($("kflare"), { opacity: 0, duration: 0.14, ease: "power1.in" }, KIND_AT + 0.28);
        tl.fromTo($("kword"), { scale: 1.06 }, { scale: 1, duration: 0.5, ease: "power3.out" }, KIND_AT);
        tl.fromTo($("kbloom"), { opacity: 0 }, { opacity: 0.85, duration: 0.25, ease: "power2.out" }, KIND_AT + 0.24);
        tl.to($("kbloom"), { opacity: 0.45, duration: 0.5, ease: "power2.out" }, KIND_AT + 0.49);
        tl.fromTo($("kglow"), { opacity: 0.5 }, { opacity: 0.85, duration: 0.5, ease: "power2.out" }, KIND_AT);
        tl.fromTo($("heart"), { scale: 0, opacity: 0, rotation: -18, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(1.7)" }, 0.55);
        tl.fromTo($("ksheen"), { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 0.55, ease: "power2.inOut" }, 0.82);

        // ---- Scene 2: "or" @1.17 VS badge springs in ----
        tl.fromTo($("vs"), { scale: 0, rotation: -120, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(1.7)" }, OR_AT);
        tl.fromTo($("vsburst"), { scale: 0.8 }, { scale: 1.9, duration: 0.5, ease: "power2.out" }, OR_AT + 0.06);
        tl.fromTo($("vsburst"), { opacity: 0.9 }, { opacity: 0, duration: 0.5, ease: "power1.in", immediateRender: false }, OR_AT + 0.06);

        // "same" @1.73 — HARSH card slams in from the right
        tl.fromTo(harsh, { x: 700 }, { x: 0, duration: 0.5, ease: "power4.out" }, SAME_AT);
        tl.fromTo(harsh, { rotationY: -14 }, { rotationY: 0, duration: 0.65, ease: "back.out(1.5)" }, SAME_AT);
        tl.fromTo(harsh, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, SAME_AT);
        tl.fromTo(bh, { v: 26 }, { v: 0, duration: 0.5, ease: "power4.out", onUpdate: writeH }, SAME_AT);
        tl.set(harsh, { filter: "none" }, SAME_AT + 0.55);
        tl.fromTo(redGlow, { opacity: 0 }, { opacity: 0.16, duration: 0.5, ease: "power2.out" }, SAME_AT);

        tl.fromTo($("hchip"), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, SAME_AT + 0.12);
        tl.fromTo($("hwrect"), { attr: { x: 894, width: 0 } }, { attr: { x: -20, width: 914 }, duration: 0.5, ease: "power3.out" }, SAME_AT + 0.08);

        // "harsh" @2.05 — glitch-stretch entrance of HARSH VOICE (envelope runs in the rig)
        tl.fromTo($("hstack"), { scaleX: 1.6, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.35, ease: "power4.out" }, HARSH_AT);
        tl.fromTo($("bolt"), { scale: 0, opacity: 0, rotation: 20, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, HARSH_AT + 0.12);

        // ---- Scene 3: "today" @3.33 — light sweep + glow on KINDNESS, harsh card recedes ----
        tl.fromTo($("ksweep"), { x: -420, rotation: 20 }, { x: 1300, rotation: 20, duration: 0.48, ease: "power2.inOut" }, TODAY_AT);
        tl.to($("kglow"), { opacity: 1, duration: 0.4, ease: "power2.out" }, TODAY_AT);
        tl.fromTo($("kbright"), { opacity: 0 }, { opacity: 0.9, duration: 0.4, ease: "power2.out" }, TODAY_AT);
        tl.to($("kbloom"), { opacity: 0.8, duration: 0.4, ease: "power2.out" }, TODAY_AT);
        tl.to(kind, { scale: 1.025, duration: 0.5, ease: "power2.out" }, TODAY_AT);
        tl.fromTo(hdof, { "--dof": "0px" }, { "--dof": "2.2px", duration: 0.5, ease: "power2.inOut" }, TODAY_AT);
        tl.to(harsh, { opacity: 0.6, scale: 0.975, duration: 0.5, ease: "power2.inOut" }, TODAY_AT);
        tl.to(redGlow, { opacity: 0.06, duration: 0.5, ease: "power2.out" }, TODAY_AT);
        tl.to(amberGlow, { opacity: 0.28, duration: 0.5, ease: "power2.out" }, TODAY_AT);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
