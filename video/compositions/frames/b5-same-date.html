      <div id="b5-same-date-cam2">
        <div id="b5-same-date-beat">
          <div id="b5-same-date-beatbar"></div>
          <div id="b5-same-date-marker"></div>
        </div>
        <div class="b5-same-date-line" id="b5-same-date-l1">
          <div class="b5-same-date-word b5-same-date-depth" id="b5-same-date-same1">
            <div class="b5-same-date-dl b5-same-date-dback" data-layer="4" aria-hidden="true" style="color: rgba(140, 47, 194, 0.33)">SAME</div>
            <div class="b5-same-date-dl b5-same-date-dback" data-layer="3" aria-hidden="true" style="color: rgba(140, 47, 194, 0.46)">SAME</div>
            <div class="b5-same-date-dl b5-same-date-dback" data-layer="2" aria-hidden="true" style="color: rgba(140, 47, 194, 0.59)">SAME</div>
            <div class="b5-same-date-dl b5-same-date-dback" data-layer="1" aria-hidden="true" style="color: rgba(140, 47, 194, 0.72)">SAME</div>
            <div class="b5-same-date-dl b5-same-date-dfront" data-layer="0">SAME</div>
          </div>
          <div class="b5-same-date-word" id="b5-same-date-voicewrap">
            <span class="b5-same-date-amber" id="b5-same-date-voice">VOICE.</span>
          </div>
        </div>
        <div class="b5-same-date-line" id="b5-same-date-l2">
          <div class="b5-same-date-word b5-same-date-depth" id="b5-same-date-same2">
            <div class="b5-same-date-dl b5-same-date-dback" data-layer="4" aria-hidden="true" style="color: rgba(140, 47, 194, 0.33)">SAME</div>
            <div class="b5-same-date-dl b5-same-date-dback" data-layer="3" aria-hidden="true" style="color: rgba(140, 47, 194, 0.46)">SAME</div>
            <div class="b5-same-date-dl b5-same-date-dback" data-layer="2" aria-hidden="true" style="color: rgba(140, 47, 194, 0.59)">SAME</div>
            <div class="b5-same-date-dl b5-same-date-dback" data-layer="1" aria-hidden="true" style="color: rgba(140, 47, 194, 0.72)">SAME</div>
            <div class="b5-same-date-dl b5-same-date-dfront" data-layer="0">SAME</div>
          </div>
          <div class="b5-same-date-word b5-same-date-amber" id="b5-same-date-habits">HABITS.</div>
        </div>
        <div class="b5-same-date-line" id="b5-same-date-l3">
          <div class="b5-same-date-word b5-same-date-amber" id="b5-same-date-three">+3</div>
          <div class="b5-same-date-word b5-same-date-amber" id="b5-same-date-years">YEARS</div>
          <div id="b5-same-date-later"><span>L</span><span>A</span><span>T</span><span>E</span><span>R</span><i id="b5-same-date-cursor"></i></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var ID = "b5-same-date";
        var DUR = 5.75;
        var $ = function (s) {
          return document.getElementById(ID + "-" + s);
        };
        var clamp01 = function (v) {
          return v < 0 ? 0 : v > 1 ? 1 : v;
        };
        var smooth = function (v) {
          v = clamp01(v);
          return v * v * (3 - 2 * v);
        };
        var outCubic = function (v) {
          v = clamp01(v);
          return 1 - Math.pow(1 - v, 3);
        };

        // ---- word cues (local s) ----
        var CHANGED_AT = 0.88;
        var EXCEPT_AT = 1.28;
        var THE_AT = 1.6;
        var DATE_AT = 1.76;
        var ZOOM_AT = 2.28; // calendar zooms through (exit done by 2.44)
        // kinetic-beat-slam onset array — every word / chrome hit reads from here
        var BEATS = { same1: 2.4, voice: 2.72, same2: 3.36, habits: 3.76, three: 4.64, years: 5.04, later: 5.28 };
        // beat-bar hit rows (stage y of the word's glyph band)
        var HITS = [
          { t: BEATS.same1, y: 140, h: 112 },
          { t: BEATS.voice, y: 268, h: 148 },
          { t: BEATS.same2, y: 498, h: 112 },
          { t: BEATS.habits, y: 626, h: 148 },
          { t: BEATS.three, y: 876, h: 184 },
          { t: BEATS.years, y: 892, h: 96 },
          { t: BEATS.later, y: 1004, h: 46 }
        ];

        var cam1 = $("cam1"), cam2 = $("cam2"), grid = $("grid"), violet = $("violet"), amberGlow = $("amberglow");
        var marker = $("marker"), beatbar = $("beatbar"), cursor = $("cursor"), steam = $("steam");
        var tiles = [$("tile1"), $("tile2"), $("tile3")];
        var stacks = [
          { el: $("same1"), at: BEATS.same1 + 0.06 },
          { el: $("same2"), at: BEATS.same2 + 0.08 }
        ];
        stacks.forEach(function (s) {
          s.layers = Array.prototype.slice.call(s.el.querySelectorAll(".b5-same-date-dback"));
        });
        var OFF = 3.2; // px per depth layer (+x,+y => light from upper-left)

        // where the amber light sits: follows the focus (calendar -> line 1 -> line 2 -> line 3)
        var GLOW_PTS = [
          { t: 0, x: 540, y: 540 },
          { t: 2.3, x: 540, y: 540 },
          { t: 2.5, x: 470, y: 300 },
          { t: 3.36, x: 470, y: 300 },
          { t: 3.6, x: 560, y: 680 },
          { t: 4.64, x: 560, y: 680 },
          { t: 4.9, x: 470, y: 960 }
        ];
        function glowAt(t) {
          for (var i = GLOW_PTS.length - 1; i >= 0; i--) {
            if (t >= GLOW_PTS[i].t) {
              var a = GLOW_PTS[i], b = GLOW_PTS[i + 1];
              if (!b) return a;
              var u = smooth((t - a.t) / (b.t - a.t));
              return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
            }
          }
          return GLOW_PTS[0];
        }

        // ---- the rig: procedural state as a pure function of local time ----
        function rig(t) {
          // camera 1 (calendar): slow push 1.00 -> 1.05 with an extra lean-in on "except"
          var p1 = 1 + 0.035 * (t / 2.3) + 0.015 * smooth((t - EXCEPT_AT) / 0.6);
          cam1.style.transform =
            "translate(" + (Math.sin(t * 1.4) * 4).toFixed(2) + "px," + (Math.sin(t * 1.82) * 2.5).toFixed(2) + "px) scale(" + p1.toFixed(4) + ")";
          // camera 2 (kinetic type): its own slow push from the cut
          var p2 = 1 + 0.04 * clamp01((t - 2.3) / (DUR - 2.3));
          cam2.style.transform =
            "translate(" + (Math.sin(t * 1.1 + 2) * 3).toFixed(2) + "px," + (Math.sin(t * 1.43 + 1) * 2).toFixed(2) + "px) scale(" + p2.toFixed(4) + ")";

          // depth extrusion grows forward after each SAME slam (cascade back-to-front)
          stacks.forEach(function (s) {
            var g = outCubic((t - s.at) / 0.4);
            s.layers.forEach(function (el) {
              var i = Number(el.getAttribute("data-layer"));
              var fade = clamp01((t - (s.at + (4 - i) * 0.05)) / 0.22);
              el.style.transform = "translate(" + (i * OFF * g).toFixed(2) + "px," + (i * OFF * g).toFixed(2) + "px)";
              el.style.opacity = fade.toFixed(3);
            });
          });

          // beat bar: marker jumps to the hit row, bar + marker flash on every hit
          var last = -1;
          for (var k = 0; k < HITS.length; k++) if (t >= HITS[k].t) last = k;
          if (last < 0) {
            marker.style.opacity = 0;
            beatbar.style.opacity = 0.3;
          } else {
            var h = HITS[last], prev = last > 0 ? HITS[last - 1] : h;
            var u = outCubic((t - h.t) / 0.14);
            var y = prev.y + (h.y - prev.y) * u;
            var hh = prev.h + (h.h - prev.h) * u;
            marker.style.transform = "translate3d(0," + y.toFixed(2) + "px,0)";
            marker.style.height = hh.toFixed(1) + "px";
            var since = t - h.t;
            marker.style.opacity = (0.6 + 0.4 * Math.exp(-since / 0.12)).toFixed(3);
            beatbar.style.opacity = (0.28 + 0.55 * Math.exp(-since / 0.15)).toFixed(3);
          }
          marker.style.top = "-130px";

          // LATER cursor blink (finite, time-derived)
          cursor.style.opacity = t < BEATS.later ? 0 : Math.floor((t - BEATS.later) / 0.18) % 2 === 0 ? 1 : 0.15;

          // ambient decoratives
          tiles.forEach(function (el, i) {
            el.style.transform = "translate3d(0," + (Math.sin(t * 2.2 + i * 1.9) * 2.5).toFixed(2) + "px,0)";
          });
          steam.setAttribute("transform", "translate(0 " + (Math.sin(t * 3.1) * 1.6).toFixed(2) + ")");
          steam.style.opacity = (0.55 + 0.35 * Math.sin(t * 2.4)).toFixed(3);
          grid.style.transform = "translate3d(0," + (-t * 14).toFixed(2) + "px,0)";
          violet.style.transform = "translate3d(" + (Math.sin(t * 0.6) * 40).toFixed(2) + "px," + (Math.sin(t * 0.45 + 1) * 34).toFixed(2) + "px,0)";
          var gp = glowAt(t);
          amberGlow.style.transform =
            "translate3d(" + (gp.x - 280).toFixed(2) + "px," + (gp.y - 280).toFixed(2) + "px,0) scale(" + (1 + 0.06 * Math.sin(t * 2.3)).toFixed(4) + ")";
        }

        // motion-blur proxies: blur rides the same window + ease as each slam
        var blurs = {};
        function mb(name, axis, peak) {
          var node = $("mb" + name + "-n");
          var o = { v: peak };
          var w = function () {
            node.setAttribute("stdDeviation", axis === "x" ? o.v.toFixed(2) + " 0" : "0 " + o.v.toFixed(2));
          };
          w();
          blurs[name] = { o: o, w: w, peak: peak };
        }
        mb("voice", "y", 16);
        mb("same2", "x", 22);
        mb("habits", "x", 22);
        mb("three", "y", 18);
        mb("years", "y", 16);

        var tl = gsap.timeline({ paused: true });
        var drv = { t: 0 };
        rig(0);
        tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { rig(drv.t); } }, 0);

        // ================= Scene 1 (0.0 - 2.3): the calendar =================
        var cal = $("cal");
        tl.fromTo(
          cal,
          { opacity: 0, scale: 0.9, y: 70, rotationX: 16, transformPerspective: 1600, filter: "blur(10px)" },
          { opacity: 1, scale: 1, y: 0, rotationX: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" },
          0
        );
        tl.set(cal, { filter: "none" }, 0.72);
        tl.fromTo([$("ring1"), $("ring2")], { y: -36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.06 }, 0.1);
        tl.fromTo($("month"), { opacity: 0, letterSpacing: "0.6em" }, { opacity: 1, letterSpacing: "0.32em", duration: 0.5, ease: "power3.out" }, 0.12);
        tl.fromTo($("y26").children, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out", stagger: 0.05 }, 0.14);
        tl.fromTo(tiles, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)", stagger: 0.08 }, 0.3);

        // "changed" @0.88 — UNCHANGED ticks in letter by letter, hairlines draw out
        tl.fromTo([$("hairl"), $("hairr")], { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, CHANGED_AT);
        gsap.set($("hairl"), { transformOrigin: "100% 50%" });
        gsap.set($("hairr"), { transformOrigin: "0% 50%" });
        Array.prototype.slice.call($("unchtext").children).forEach(function (ch, i) {
          tl.fromTo(ch, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, CHANGED_AT + i * 0.03);
        });

        // "except" @1.28 — the calendar leans in
        tl.to(cal, { scale: 1.03, duration: 0.45, ease: "power2.out" }, EXCEPT_AT);

        // "the" @1.60 — the page corner lifts (anticipation); "date" @1.76 — it tears off
        var page = $("page");
        gsap.set(page, { transformPerspective: 1500, transformOrigin: "50% 0%" });
        tl.fromTo(page, { rotationX: 0, rotationZ: 0, y: 0 }, { rotationX: -9, duration: 0.16, ease: "power2.out" }, THE_AT);
        tl.to(page, { rotationX: -110, rotationZ: -4, y: -26, duration: 0.3, ease: "power1.in" }, DATE_AT);
        tl.fromTo(page, { filter: "blur(0px)" }, { filter: "blur(9px)", duration: 0.3, ease: "power2.in", immediateRender: false }, DATE_AT);
        tl.fromTo(page, { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none", immediateRender: false }, DATE_AT + 0.2);
        tl.fromTo($("light"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.in" }, THE_AT + 0.05);
        tl.fromTo($("shade"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, DATE_AT);
        // 2029 springs up with a glow bloom, then a light sweep
        tl.fromTo($("y29"), { scale: 0.82 }, { scale: 1, duration: 0.5, ease: "back.out(1.8)" }, DATE_AT + 0.1);
        tl.fromTo($("y29glow"), { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, DATE_AT + 0.14);
        tl.to($("y29glow"), { opacity: 0.65, duration: 0.3, ease: "power2.out" }, DATE_AT + 0.36);
        tl.fromTo(amberGlow, { opacity: 0.12 }, { opacity: 0.3, duration: 0.4, ease: "power2.out" }, DATE_AT + 0.1);
        tl.fromTo($("y29sheen"), { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 0.32, ease: "power2.inOut" }, 2.0);

        // 2.28 — zoom-through: scene 1 rushes past the camera (scale + blur, linear dim)
        var s1 = $("s1");
        tl.fromTo(s1, { scale: 1, filter: "blur(0px)" }, { scale: 1.6, filter: "blur(18px)", duration: 0.16, ease: "power3.in", immediateRender: false }, ZOOM_AT);
        tl.fromTo(s1, { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "none", immediateRender: false }, ZOOM_AT);
        tl.to(amberGlow, { opacity: 0.2, duration: 0.3, ease: "power2.out" }, ZOOM_AT);

        // ================= Scene 2 (2.3 - 5.75): kinetic-beat-slam =================
        tl.fromTo($("beat"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, ZOOM_AT + 0.06);

        // SAME @2.40 — scale + blur slam (hard, power4.out)
        tl.fromTo($("same1"), { scale: 1.9, opacity: 0, filter: "blur(12px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" }, BEATS.same1);
        tl.set($("same1"), { filter: "none" }, BEATS.same1 + 0.44);

        // VOICE. @2.72 — snaps up out of a mask line (expo.out), vertical streak
        tl.fromTo($("voice"), { yPercent: 105 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, BEATS.voice);
        tl.fromTo(blurs.voice.o, { v: 16 }, { v: 0, duration: 0.4, ease: "expo.out", onUpdate: blurs.voice.w }, BEATS.voice);

        // SAME @3.36 — side-snap from the left; line 1 dims to 55%
        tl.to($("l1"), { opacity: 0.55, duration: 0.3, ease: "power2.out" }, BEATS.same2);
        tl.fromTo($("same2"), { x: -520, opacity: 0 }, { x: 0, opacity: 1, duration: 0.38, ease: "expo.out" }, BEATS.same2);
        tl.fromTo(blurs.same2.o, { v: 22 }, { v: 0, duration: 0.38, ease: "expo.out", onUpdate: blurs.same2.w }, BEATS.same2);

        // HABITS. @3.76 — side-snap from the right
        tl.fromTo($("habits"), { x: 600, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, BEATS.habits);
        tl.fromTo(blurs.habits.o, { v: 22 }, { v: 0, duration: 0.4, ease: "expo.out", onUpdate: blurs.habits.w }, BEATS.habits);

        // +3 @4.64 — rise + rotate (circ.out momentum); lines 1-2 dim
        tl.to($("l1"), { opacity: 0.38, duration: 0.3, ease: "power2.out" }, BEATS.three);
        tl.to($("l2"), { opacity: 0.55, duration: 0.3, ease: "power2.out" }, BEATS.three);
        tl.fromTo($("three"), { y: 170, rotation: 12, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" }, BEATS.three);
        tl.fromTo(blurs.three.o, { v: 18 }, { v: 0, duration: 0.5, ease: "circ.out", onUpdate: blurs.three.w }, BEATS.three);

        // YEARS @5.04 — rise + rotate with a small overshoot settle
        tl.fromTo($("years"), { y: 120, rotation: -9, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, BEATS.years);
        tl.fromTo(blurs.years.o, { v: 16 }, { v: 0, duration: 0.45, ease: "power3.out", onUpdate: blurs.years.w }, BEATS.years);

        // LATER @5.28 — mono letters tick in on a stepped beat, cursor keeps blinking
        Array.prototype.slice.call($("later").querySelectorAll("span")).forEach(function (ch, i) {
          tl.fromTo(ch, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.06, ease: "steps(2)" }, BEATS.later + i * 0.045);
        });

        // light sweep across +3 after it lands; finale glow breath on line 3
        tl.fromTo($("three"), { textShadow: "0 0 40px rgba(254,176,34,0.45)" }, { textShadow: "0 0 70px rgba(254,176,34,0.75)", duration: 0.35, ease: "power2.out", immediateRender: false }, BEATS.three + 0.45);
        tl.to($("three"), { textShadow: "0 0 46px rgba(254,176,34,0.5)", duration: 0.5, ease: "sine.inOut" }, BEATS.three + 0.8);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
