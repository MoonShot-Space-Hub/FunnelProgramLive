  <script>
    (function () {
      const ID = "b7-two-futures";
      const P = ID + "-";
      const DUR = 3.6;
      const W = 1080, H = 1920;
      const $ = (s) => document.getElementById(P + s);
      const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
      const lerp = (a, b, k) => a + (b - a) * k;
      const sstep = (a, b, x) => {
        const k = clamp01((x - a) / (b - a));
        return k * k * (3 - 2 * k);
      };
      const prand = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };
      const D2R = Math.PI / 180;
      const E = {
        o2: gsap.parseEase("power2.out"),
        o3: gsap.parseEase("power3.out"),
        io2: gsap.parseEase("power2.inOut"),
        sio: gsap.parseEase("sine.inOut"),
        expo: gsap.parseEase("expo.out"),
      };
      const CUE = {
        future: 0.08, youre: 0.48, heading: 0.72, towards: 1.12, dont: 1.6, wait: 1.92,
        to: 2.24, start: 2.4, making: 2.64, a: 2.96, change: 3.12,
      };

      // ================= renderer / scene =================
      const canvas = $("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x2a1c4a, 30, 900);
      const FOV0 = 58;
      const camera = new THREE.PerspectiveCamera(FOV0, W / H, 0.5, 3200);
      camera.rotation.order = "YXZ";
      scene.add(camera);
      const UP = new THREE.Vector3(0, 1, 0);

      // sun: low on the horizon, just right of the CHANGE road's heading
      const PHI_SUN = 12 * D2R, EL_SUN = 2.4 * D2R;
      const SUN_DIR = new THREE.Vector3(Math.sin(PHI_SUN) * Math.cos(EL_SUN), Math.sin(EL_SUN), -Math.cos(PHI_SUN) * Math.cos(EL_SUN));

      // ================= shared sky / fog uniforms =================
      const U = {
        uB7Top: { value: new THREE.Color(0x0b0820) },
        uB7Mid: { value: new THREE.Color(0x221a52) },
        uB7HorL: { value: new THREE.Color(0x4c4766) },
        uB7HorR: { value: new THREE.Color(0x9a3a7e) },
        uB7Sun: { value: new THREE.Color(0xffa63a) },
        uB7FogL: { value: new THREE.Color(0x5d5876) },
        uB7SunDir: { value: SUN_DIR.clone() },
        uB7Boost: { value: 1 },
        uB7Time: { value: 0 },
      };
      const SKY_PARS = `
        uniform vec3 uB7Top; uniform vec3 uB7Mid; uniform vec3 uB7HorL; uniform vec3 uB7HorR;
        uniform vec3 uB7Sun; uniform vec3 uB7FogL; uniform vec3 uB7SunDir; uniform float uB7Boost;
        vec3 b7Sky(vec3 d, float sunK) {
          float el = d.y;
          float az = atan(d.x, -d.z);
          float rw = smoothstep(-0.32, 0.30, az);
          vec3 hor = mix(uB7HorL, uB7HorR, rw);
          vec3 c = mix(hor, uB7Mid, smoothstep(0.0, 0.2, el));
          c = mix(c, uB7Top, smoothstep(0.1, 0.48, el));
          vec2 hd = normalize(d.xz + vec2(1e-5, 0.0));
          vec2 sh = normalize(uB7SunDir.xz);
          float sa = max(dot(hd, sh), 0.0);
          float band = exp(-max(el, 0.0) * 15.0) * (pow(sa, 6.0) * 0.7 + pow(sa, 60.0) * 1.1);
          float sd = max(dot(d, uB7SunDir), 0.0);
          c += uB7Sun * (band * 0.5 + pow(sd, 28.0) * 0.14 + pow(sd, 120.0) * 0.8 * sunK) * uB7Boost * mix(0.55, 1.0, sunK);
          return c;
        }
      `;
      // per-direction fog: distant terrain melts into the sky colour of its own azimuth,
      // and the SAME road (left of the fork) sinks into a thick grey-violet fog bank.
      const FOG_FRAG = `
        #ifdef USE_FOG
          vec3 b7wd = (vec4(vB7View, 0.0) * viewMatrix).xyz;
          vec3 b7wp = cameraPosition + b7wd;
          vec3 b7fd = vec3(b7wd.x, 0.0, b7wd.z) + vec3(0.0, 0.0, -1e-4);
          b7fd = normalize(b7fd);
          b7fd.y = 0.012;
          vec3 b7fc = b7Sky(normalize(b7fd), 0.0) * 0.82;
          float b7ff = smoothstep(fogNear, fogFar, vFogDepth);
          float b7a = atan(b7wp.x, -b7wp.z);
          float b7lw = (1.0 - smoothstep(-0.17, -0.03, b7a)) * smoothstep(0.0, 22.0, -b7wp.z);
          float b7lf = smoothstep(0.0, 62.0, vFogDepth) * 0.98;
          b7ff = mix(b7ff, max(b7ff, b7lf), b7lw);
          b7fc = mix(b7fc, uB7FogL, b7lw * 0.85);
          gl_FragColor.rgb = mix(gl_FragColor.rgb, b7fc, b7ff);
        #endif
      `;
      const fogPatch = (sh) => {
        Object.keys(U).forEach((k) => (sh.uniforms[k] = U[k]));
        sh.vertexShader = sh.vertexShader
          .replace("#include <common>", "#include <common>\nvarying vec3 vB7View;")
          .replace("#include <fog_vertex>", "#include <fog_vertex>\n  vB7View = mvPosition.xyz;");
        sh.fragmentShader = sh.fragmentShader
          .replace("#include <common>", "#include <common>\nvarying vec3 vB7View;\n" + SKY_PARS)
          .replace("#include <fog_fragment>", FOG_FRAG);
      };
      const fogged = (m) => {
        m.onBeforeCompile = fogPatch;
        return m;
      };

      // ================= procedural textures (deterministic) =================
      function canvasTex(w, h, draw) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        draw(c.getContext("2d"), w, h);
        return new THREE.CanvasTexture(c);
      }
      const radial = (stops) => (g, w, h) => {
        const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
        stops.forEach(([o, a]) => r.addColorStop(o, `rgba(255,255,255,${a})`));
        g.fillStyle = r;
        g.fillRect(0, 0, w, h);
      };
      const glowTex = canvasTex(256, 256, radial([[0, 1], [0.1, 0.6], [0.3, 0.2], [0.6, 0.05], [1, 0]]));
      const discTex = canvasTex(256, 256, radial([[0, 1], [0.4, 1], [0.46, 0.55], [0.6, 0.12], [1, 0]]));
      const dotTex = canvasTex(64, 64, radial([[0, 1], [0.3, 0.75], [0.6, 0.18], [1, 0]]));
      const puffTex = canvasTex(256, 256, radial([[0, 0.9], [0.35, 0.6], [0.7, 0.18], [1, 0]]));
      const stripTex = canvasTex(128, 4, (g, w, h) => {
        const r = g.createLinearGradient(0, 0, w, 0);
        r.addColorStop(0, "rgba(255,255,255,0)");
        r.addColorStop(0.5, "rgba(255,255,255,1)");
        r.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = r;
        g.fillRect(0, 0, w, h);
      });
      const noiseTex = canvasTex(256, 256, (g, w, h) => {
        const img = g.createImageData(w, h);
        let seed = 1234567;
        const rnd = () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296;
        for (let i = 0; i < w * h; i++) {
          let v = 168 + rnd() * 72;
          const r = rnd();
          if (r < 0.03) v = 255;
          else if (r < 0.07) v = 118;
          img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
          img.data[i * 4 + 3] = 255;
        }
        g.putImageData(img, 0, 0);
      });
      noiseTex.wrapS = noiseTex.wrapT = THREE.RepeatWrapping;
      noiseTex.colorSpace = THREE.SRGBColorSpace;
      noiseTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

      // ================= road network =================
      // world: x right, y up, forward = -Z; heading h: 0 = -Z, + = toward +X
      const ROAD_W = 7, HALF = ROAD_W / 2;
      const TH = 11 * D2R, LC = 32;
      function buildPath(raw) {
        const pts = raw.map((p) => ({ x: p.x, z: p.z, s: 0, h: 0 }));
        for (let i = 1; i < pts.length; i++) pts[i].s = pts[i - 1].s + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].z - pts[i - 1].z);
        for (let i = 0; i < pts.length; i++) {
          const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
          pts[i].h = Math.atan2(b.x - a.x, -(b.z - a.z));
        }
        return { pts, len: pts[pts.length - 1].s };
      }
      function pathAt(path, s) {
        const pts = path.pts;
        if (s <= 0) {
          const p = pts[0];
          return { x: p.x + Math.sin(p.h) * s, z: p.z - Math.cos(p.h) * s, h: p.h };
        }
        if (s >= path.len) {
          const p = pts[pts.length - 1], d = s - path.len;
          return { x: p.x + Math.sin(p.h) * d, z: p.z - Math.cos(p.h) * d, h: p.h };
        }

        let g = 0;
        if (t < CUE.towards) g = 0;
        else if (t < 1.34) g = lerp(0, -4.0, E.sio((t - CUE.towards) / 0.22));
        else if (t < 1.66) g = lerp(-4.0, 4.0, E.sio((t - 1.34) / 0.32));
        else if (t < 2.05) g = lerp(4.0, 1.0, E.sio((t - 1.66) / 0.39));
        else g = 1.0;
        return g * D2R * (1 - E.io2(clamp01((t - CUE.start) / 0.42)));
      }
      function headBase(t) {
        const tt = Math.min(Math.max(t, -1), DUR + 1);
        const sc = camS(tt);
        const v = vel(Math.min(Math.max(tt, 0), DUR));
        const p = pathAt(CP, sc), a = pathAt(CP, sc + 1 + 0.35 * v);
        const base = Math.atan2(a.x - p.x, -(a.z - p.z)) + 2 * D2R;
        const b = E.io2(clamp01((tt - 2.38) / 0.8));
        return base + (PHI_SUN - base) * 0.8 * b;
      }
      function shakeAt(t) {
        let yaw = 0, pitch = 0, roll = 0, px = 0, py = 0;
        const a = t - CUE.dont;
        if (a > 0 && a < 0.5) {
          const env = Math.exp(-a * 9) * (1 - a / 0.5);
          yaw += 1.0 * D2R * env * Math.sin(a * 62);
          pitch += 0.8 * D2R * env * Math.sin(a * 51 + 1.3);
          roll += 1.3 * D2R * env * Math.sin(a * 44 + 0.6);
          px += 16 * env * Math.sin(a * 58 + 0.4);
          py += 11 * env * Math.sin(a * 49 + 2.0);
        }
        const b = t - CUE.wait;
        if (b > 0 && b < 0.3) {
          const env = Math.exp(-b * 12) * (1 - b / 0.3);
          yaw += 0.4 * D2R * env * Math.sin(b * 70);
          pitch += 0.35 * D2R * env * Math.sin(b * 58 + 0.9);
          px += 7 * env * Math.sin(b * 66 + 1.1);
          py += 5 * env * Math.sin(b * 54);
        }
        return { yaw, pitch, roll, px, py };
      }
      const PITCH = 7.9 * D2R;
      function camState(t) {
        const sc = camS(t);
        const p = pathAt(CP, sc);
        const v = vel(clamp01(t / DUR) * DUR);
        const bobAmp = t < 1.0 ? 1 : t < CUE.start ? lerp(1, 0.25, clamp01((t - 1.0) / 0.4)) : lerp(0.25, 0.7, clamp01((t - CUE.start) / 0.6));
        const bob = Math.sin(t * Math.PI * 2 * 1.7) * 0.05 * bobAmp;
        const sway = Math.sin(t * Math.PI * 2 * 0.85 + 0.7) * 0.05 * bobAmp;
        const sk = shakeAt(t);
        const hb = headBase(t);
        const head = hb + glance(t);
        const roll = (-0.18 * (headBase(t + 0.03) - headBase(t - 0.03))) / 0.06;
        const accel = E.io2(clamp01((t - CUE.start) / 1.0));
        const r = rightOf(head);
        return {
          x: p.x + r.x * sway,
          y: 2.15 + bob - 0.45 * accel,
          z: p.z + r.z * sway,
          yaw: -(head + sk.yaw),
          pitch: -PITCH + sk.pitch + Math.sin(t * Math.PI * 2 * 1.7 + 0.9) * 0.12 * D2R * bobAmp,
          roll: roll + sk.roll + Math.sin(t * Math.PI * 2 * 0.85) * 0.25 * D2R * bobAmp,
          fov: FOV0 + 7 * E.io2(clamp01((t - 2.45) / 1.05)),
          v,
          sk,
        };
      }

      // ================= speed lines along the CHANGE road =================
      const SL_N = 84;
      const slMat = new THREE.MeshBasicMaterial({
        map: stripTex, color: new THREE.Color(1.6, 1.15, 0.6), transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false, side: THREE.DoubleSide,
      });
      const slMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), slMat, SL_N);
      slMesh.frustumCulled = false;
      slMesh.renderOrder = 9;
      scene.add(slMesh);
      const slItems = [];
      for (let i = 0; i < SL_N; i++) {
        const s = 6 + prand(i * 3.3 + 1) * 190;
        const p = pathAt(RB, s), r = rightOf(p.h);
        const side = i % 2 ? 1 : -1;
        const lat = side * (4.3 + prand(i * 5.9 + 2) * 15);
        const y = 0.35 + Math.pow(prand(i * 7.1 + 3), 1.5) * 8;
        const pos = new THREE.Vector3(p.x + r.x * lat, y, p.z + r.z * lat);
        const d = new THREE.Vector3(Math.sin(p.h), 0, -Math.cos(p.h));
        const n = new THREE.Vector3(-r.x * lat, 1.8 - y, -r.z * lat).normalize();
        const wv = new THREE.Vector3().crossVectors(n, d).normalize();
        slItems.push({ pos, d, n, wv, b: 0.5 + prand(i * 11.7 + 4) * 0.9 });
        slMesh.setColorAt(i, new THREE.Color(1, 1, 1).multiplyScalar(0.5 + prand(i * 11.7 + 4) * 0.9));
      }
      const vx1 = new THREE.Vector3(), vx2 = new THREE.Vector3();
      function updateSpeedLines(v) {
        const L = 0.4 + v * 0.11;
        slItems.forEach((it, i) => {
          vx1.copy(it.d).multiplyScalar(L);
          vx2.copy(it.wv).multiplyScalar(0.055);
          mtx.makeBasis(vx1, vx2, it.n);
          mtx.setPosition(it.pos);
          slMesh.setMatrixAt(i, mtx);
        });
        slMesh.instanceMatrix.needsUpdate = true;
        slMat.opacity = 0.9 * sstep(14, 48, v);
      }

      // ================= amber particle bursts (camera space, ballistic in time) =================
      const PCOL = [new THREE.Color(2.2, 1.05, 0.12), new THREE.Color(2.4, 1.7, 0.65), new THREE.Color(2.2, 2.0, 1.6)];
      const camAt = camState(CUE.dont);
      function makeBurst(n, seed, sx, sy, rx0, ry0, spd0, spd1, size, life0, life1, fov) {
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
        const pts = new THREE.Points(
          geo,
          new THREE.PointsMaterial({ size, map: dotTex, vertexColors: true, transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, fog: false }),
        );
        pts.frustumCulled = false;
        pts.renderOrder = 20;
        camera.add(pts);
        const DZ = 9, th = Math.tan((fov / 2) * D2R);
        const ox = ((sx / W) * 2 - 1) * DZ * th * (W / H), oy = (1 - (sy / H) * 2) * DZ * th;
        const R6 = -6 * D2R;
        const parts = [];
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + (prand(seed + i * 3.1) - 0.5) * 0.7;
          const dx = Math.cos(a), dy = Math.sin(a);
          const ex = dx * rx0 * Math.cos(R6) - dy * ry0 * Math.sin(R6);
          const ey = dx * rx0 * Math.sin(R6) + dy * ry0 * Math.cos(R6);
          const ux = dx * Math.cos(R6) - dy * 0.6 * Math.sin(R6), uy = dx * Math.sin(R6) + dy * 0.6 * Math.cos(R6);
          const sp = lerp(spd0, spd1, prand(seed + i * 7.3));
          parts.push({
            ox: ox + ex, oy: oy + ey, oz: -DZ,
            vx: ux * sp, vy: uy * sp + 0.8, vz: (prand(seed + i * 5.7) - 0.3) * sp * 0.8,
            life: lerp(life0, life1, prand(seed + i * 9.9)), c: PCOL[i % 3],
          });
        }
        return { geo, pos, col, parts };
      }
      function updateBurst(b, tau) {
        b.parts.forEach((p, i) => {
          if (tau <= 0 || tau >= p.life) {
            b.pos[i * 3] = 0; b.pos[i * 3 + 1] = 0; b.pos[i * 3 + 2] = -9;
            b.col[i * 3] = b.col[i * 3 + 1] = b.col[i * 3 + 2] = 0;
            return;
          }
          const f = (1 - Math.exp(-4 * tau)) / 4;
          b.pos[i * 3] = p.ox + p.vx * f;
          b.pos[i * 3 + 1] = p.oy + p.vy * f - 1.7 * tau * tau;
          b.pos[i * 3 + 2] = p.oz + p.vz * f;
          const fade = Math.pow(1 - tau / p.life, 1.5) * Math.min(1, tau / 0.03);
          b.col[i * 3] = p.c.r * fade;
          b.col[i * 3 + 1] = p.c.g * fade;
          b.col[i * 3 + 2] = p.c.b * fade;
        });
        b.geo.attributes.position.needsUpdate = true;
        b.geo.attributes.color.needsUpdate = true;
      }
      const burstA = makeBurst(170, 11, 540, 340, 1.85, 1.0, 3, 11, 0.075, 0.6, 1.1, camAt.fov);
      const burstA2 = makeBurst(36, 71, 540, 340, 1.7, 0.9, 2, 7, 0.2, 0.5, 0.9, camAt.fov);
      const burstB = makeBurst(70, 131, 540, 440, 1.3, 0.45, 2.5, 8, 0.07, 0.45, 0.8, camAt.fov);

      // ================= DOM hooks =================
      const tagL = $("tag-l"), tagR = $("tag-r");
      const shakebox = $("shakebox"), shock = $("shock"), flash = $("flash"), line2 = $("line2");
      const ANCH_L = new THREE.Vector3(), ANCH_R = new THREE.Vector3();
      {
        const a = pathAt(LB, 55), b = pathAt(RB, 48);
        ANCH_L.set(a.x, 0.1, a.z);
        ANCH_R.set(b.x, 0.1, b.z);
      }
      const vp = new THREE.Vector3();
      const project = (v) => {
        vp.copy(v).project(camera);
        return { x: (vp.x + 1) * 0.5 * W, y: (1 - vp.y) * 0.5 * H, ok: vp.z > -1 && vp.z < 1 };
      };
      const fx = (v) => v.toFixed(1);

      // ================= one frame = pure function of local time =================
      function renderAt(t) {
        const c = camState(t);
        camera.position.set(c.x, c.y, c.z);
        camera.rotation.set(c.pitch, c.yaw, c.roll);
        camera.fov = c.fov;
        camera.updateProjectionMatrix();
        camera.updateMatrixWorld(true);
        sky.position.copy(camera.position);
        stars.position.copy(camera.position);
        sunGroup.position.copy(camera.position);

        // sun energy: wakes on "future", swells with the run, flares on "change"
        const acc = Math.pow(clamp01((t - CUE.start) / 1.2), 1.3);
        const f = t - CUE.change;
        const pulse = f <= 0 ? 0 : f < 0.07 ? f / 0.07 : Math.exp(-(f - 0.07) * 5.0);
        const settle = E.o2(clamp01(f / 0.45));
        const wake = E.o2(clamp01((t - CUE.future) / 0.7));
        const boost = 0.8 + 0.28 * wake + 0.5 * acc + 0.75 * pulse + 0.15 * settle;
        U.uB7Boost.value = boost;
        U.uB7Time.value = t;
        sunLight.intensity = 1.7 * boost;
        sunDisc.material.color.copy(SUN_C).multiplyScalar(0.75 + 0.3 * boost);
        sunDisc.scale.setScalar(210 * (1 + 0.06 * acc + 0.1 * pulse));
        halo.scale.setScalar(430 * (1 + 0.35 * acc + 0.9 * pulse + 0.15 * settle));
        halo.material.color.copy(HALO_C).multiplyScalar(0.7 + 0.45 * boost);
        haloWide.scale.setScalar(900 * (1 + 0.25 * acc + 0.5 * pulse));
        haloWide.material.color.copy(WIDE_C).multiplyScalar(0.6 + 0.4 * boost);
        streak.scale.set(1900 * (1 + 0.5 * pulse + 0.2 * acc), 34 * (1 + 0.6 * pulse), 1);
        streak.material.color.copy(STREAK_C).multiplyScalar(0.25 + 0.35 * acc + 0.9 * pulse);

        // amber road ignites outward from the fork on "future"
        setReveal(E.o2(clamp01((t - CUE.future) / 0.85)) * 950);
        matEdgeR.color.copy(AMBER_EDGE).multiplyScalar(1.6 + 0.4 * wake + 1.0 * acc + 1.2 * pulse);
        matGlowR.color.setRGB(1.0, 0.6, 0.12).multiplyScalar(0.35 + 0.25 * wake + 0.35 * acc + 0.5 * pulse);

        // dashes stretch into streaks, speed lines appear with velocity
        updateDashes(3.0 * (1 + 1.6 * sstep(20, 55, c.v)));
        updateSpeedLines(c.v);

        // stars twinkle
        for (let i = 0; i < STAR_N; i++) {
          const s = starData[i];
          const k = s.base * (0.6 + 0.4 * Math.sin(t * s.f + s.ph)) * (1 - 0.35 * acc);
          starCol[i * 3] = s.r * k;
          starCol[i * 3 + 1] = s.g * k;
          starCol[i * 3 + 2] = s.b * k;
        }
        starGeo.attributes.color.needsUpdate = true;

        // fog banks drift
        fogBanks.forEach((fb) => {
          fb.sp.position.x = fb.x + Math.sin(t * 0.6 + fb.ph) * 1.5;
          fb.sp.material.opacity = 0.44 * sstep(18, 45, fb.sp.position.distanceTo(camera.position));
        });

        // particle bursts
        updateBurst(burstA, t - CUE.dont);
        updateBurst(burstA2, t - CUE.dont);
        updateBurst(burstB, t - CUE.wait);

        renderer.render(scene, camera);

        // ---- DOM overlay ----
        const pl = project(ANCH_L), pr = project(ANCH_R);
        tagL.style.transform = `translate(${fx(pl.x)}px, ${fx(Math.min(pl.y, 1110))}px)`;
        tagL.style.opacity = (pl.ok ? sstep(110, 250, pl.x) * (1 - sstep(1000, 1100, pl.y)) : 0).toFixed(3);
        tagR.style.transform = `translate(${fx(Math.max(190, Math.min(890, pr.x)))}px, ${fx(Math.min(pr.y, 1110))}px)`;
        tagR.style.opacity = pr.ok ? "1" : "0";

        const sk = c.sk;
        const push = 1 + 0.03 * E.io2(clamp01((t - CUE.start) / 1.2));
        shakebox.style.transform = `translate(${sk.px.toFixed(2)}px, ${sk.py.toFixed(2)}px) scale(${push.toFixed(4)})`;

        const kk = (t - 1.7) / 0.62;
        if (kk > 0 && kk < 1) {
          const e = E.o2(kk);
          shock.style.transform = `rotate(-6deg) scale(${(0.62 + 1.28 * e).toFixed(4)})`;
          shock.style.opacity = (0.9 * (1 - e)).toFixed(3);
        } else {
          shock.style.transform = "rotate(-6deg) scale(0.62)";
          shock.style.opacity = "0";
        }
        const fl = t - 1.69;
        flash.style.opacity = (fl <= 0 || fl >= 0.4 ? 0 : fl < 0.06 ? (0.4 * fl) / 0.06 : 0.4 * (1 - E.o2((fl - 0.06) / 0.34))).toFixed(3);
        // "wait": second hit on the bottom line
        const wk = (t - CUE.wait) / 0.34;
        if (wk > 0 && wk < 1) {
          const e = E.o3(wk);
          const sc = 1.14 - 0.14 * e;
          line2.setAttribute("transform", `translate(350 280) scale(${sc.toFixed(4)}) translate(-350 -280)`);
          line2.style.fill = `rgb(${Math.round(lerp(255, 253, e))},${Math.round(lerp(210, 242, e))},${Math.round(lerp(122, 224, e))})`;
        } else {
          line2.removeAttribute("transform");
          line2.style.fill = "#FDF2E0";
        }
      }

      // ================= timeline =================
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);

      // road tags: SAME on "heading", CHANGE right after
      const lettersL = Array.from($("word-l").querySelectorAll("span"));
      const lettersR = Array.from($("word-r").querySelectorAll("span"));
      tl.fromTo($("pin-l"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, CUE.heading);
      tl.fromTo($("tick-l"), { scaleY: 0 }, { scaleY: 1, duration: 0.26, ease: "power2.out" }, CUE.heading + 0.04);
      tl.fromTo($("pill-l"), { opacity: 0, scale: 0.6, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(1.7)" }, CUE.heading + 0.08);
      tl.fromTo($("pill-l"), { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, CUE.heading + 0.08);
      tl.fromTo(lettersL, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.05 }, CUE.heading + 0.12);
      tl.fromTo($("pin-r"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, 0.92);
      tl.fromTo($("tick-r"), { scaleY: 0 }, { scaleY: 1, duration: 0.26, ease: "power2.out" }, 0.96);
      tl.fromTo($("pill-r"), { opacity: 0, scale: 0.6, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(1.7)" }, 1.0);
      tl.fromTo($("pill-r"), { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 1.0);
      tl.fromTo(lettersR, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.045 }, 1.04);
      tl.set([$("pill-l"), $("pill-r")], { filter: "none" }, 1.5);

      // DON'T WAIT slams (scale 2.4 -> 1, rot 3 -> -6, blur 18 -> 0)
      const stamp = $("stamp");
      tl.fromTo(stamp, { scale: 2.4, rotation: 3, filter: "blur(18px)" }, { scale: 1, rotation: -6, filter: "blur(0px)", duration: 0.34, ease: "power4.out" }, CUE.dont);
      tl.fromTo(stamp, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, CUE.dont);
      tl.set(stamp, { filter: "none" }, CUE.dont + 0.36);
      tl.fromTo($("stampglow"), { opacity: 0.85 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, CUE.wait);
      tl.fromTo($("stampglow"), { opacity: 1 }, { opacity: 0.7, duration: 0.5, ease: "sine.inOut", immediateRender: false }, CUE.wait + 0.12);
      tl.fromTo($("sheengrad"), { attr: { x1: -320, x2: -140 } }, { attr: { x1: 760, x2: 940 }, duration: 0.55, ease: "power2.inOut" }, 2.0);
      tl.fromTo($("stampglow"), { opacity: 0.7 }, { opacity: 0.95, duration: 0.42, ease: "sine.inOut", immediateRender: false }, 2.64);
      tl.fromTo($("stampglow"), { opacity: 0.95 }, { opacity: 0.8, duration: 0.5, ease: "sine.inOut", immediateRender: false }, 3.06);

      // the grey road falls away: SAME dims as the camera commits right
      tl.fromTo($("tagbody-l"), { opacity: 1 }, { opacity: 0.4, duration: 0.45, ease: "power2.out" }, 2.6);

      // "change": CHANGE locks in as a solid amber chip
      const pillR = $("pill-r");
      tl.fromTo(pillR, { scale: 1 }, { scale: 1.16, duration: 0.12, ease: "power2.out", immediateRender: false }, CUE.change);
      tl.fromTo(pillR, { scale: 1.16 }, { scale: 1, duration: 0.32, ease: "back.out(2)", immediateRender: false }, CUE.change + 0.12);
      tl.fromTo($("chip"), { scaleX: 0.35, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, CUE.change);
      tl.fromTo(
        pillR,
        { color: "#FEB022", textShadow: "0 0 18px rgba(254,176,34,0.55)", boxShadow: "0 0 26px rgba(254,176,34,0.35)" },
        { color: "#1A1030", textShadow: "0 0 0px rgba(254,176,34,0)", boxShadow: "0 0 46px rgba(254,176,34,0.8)", duration: 0.2, ease: "power2.out", immediateRender: false },
        CUE.change + 0.04,
      );
      tl.fromTo($("pin-r"), { scale: 1 }, { scale: 1.8, duration: 0.16, ease: "power2.out", immediateRender: false }, CUE.change);
      tl.fromTo($("pin-r"), { scale: 1.8 }, { scale: 1.2, duration: 0.3, ease: "sine.inOut", immediateRender: false }, CUE.change + 0.16);
      tl.fromTo($("labelsheen"), { x: -70, opacity: 1 }, { x: 290, opacity: 1, duration: 0.28, ease: "power2.inOut" }, CUE.change + 0.2);

      renderAt(0);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
