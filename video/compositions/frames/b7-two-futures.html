  <script>
    (function () {
      const ID = "b7-two-futures";
      const P = ID + "-";
      const DUR = 3.6;
      const SVGNS = "http://www.w3.org/2000/svg";
      const $ = (s) => document.getElementById(P + s);
      const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
      const lerp = (a, b, k) => a + (b - a) * k;
      const prand = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };
      const E = {
        o2: gsap.parseEase("power2.out"),
        o3: gsap.parseEase("power3.out"),
        io2: gsap.parseEase("power2.inOut"),
        sio: gsap.parseEase("sine.inOut"),
        expo: gsap.parseEase("expo.out"),
        back: gsap.parseEase("back.out(2.2)"),
      };
      const CUE = {
        future: 0.08, youre: 0.48, heading: 0.72, towards: 1.12, dont: 1.6, wait: 1.92,
        to: 2.24, start: 2.4, making: 2.64, a: 2.96, change: 3.12,
      };

      // ---------- perspective geometry ----------
      const HY = 280; // horizon (both vanishing points sit on it)
      const BASE_Y = 1100; // stem start, stage bottom
      const FORK = { x: 540, y: 900 };
      const W0 = 176; // road width at the base
      const width = (y) => (W0 * Math.max(0, y - HY)) / (BASE_Y - HY);
      const BR = {
        left: [FORK, { x: 540, y: 770 }, { x: 292, y: 520 }, { x: 250, y: HY }],
        right: [FORK, { x: 540, y: 770 }, { x: 788, y: 520 }, { x: 830, y: HY }],
      };
      const bez = (c, t) => {
        const u = 1 - t;
        const a = u * u * u, b = 3 * u * u * t, d = 3 * u * t * t, e = t * t * t;
        const x = a * c[0].x + b * c[1].x + d * c[2].x + e * c[3].x;
        const y = a * c[0].y + b * c[1].y + d * c[2].y + e * c[3].y;
        const dx = 3 * u * u * (c[1].x - c[0].x) + 6 * u * t * (c[2].x - c[1].x) + 3 * t * t * (c[3].x - c[2].x);
        const dy = 3 * u * u * (c[1].y - c[0].y) + 6 * u * t * (c[2].y - c[1].y) + 3 * t * t * (c[3].y - c[2].y);
        const l = Math.hypot(dx, dy) || 1;
        return { x, y, tx: dx / l, ty: dy / l };
      };
      const N = 140;
      function sampleBranch(c) {
        const pts = [];
        let acc = 0;
        for (let i = 0; i <= N; i++) {
          const p = bez(c, i / N);
          if (i > 0) acc += Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y);
          p.s = acc;
          pts.push(p);
        }
        pts.forEach((p) => (p.a = p.s / acc));
        return { pts, len: acc };
      }
      const left = sampleBranch(BR.left);
      const right = sampleBranch(BR.right);
      // point at arc fraction a (0 fork -> 1 vanishing point)
      function at(br, a) {
        const pts = br.pts;
        a = clamp01(a);
        let lo = 0, hi = N;
        while (hi - lo > 1) {
          const m = (lo + hi) >> 1;
          if (pts[m].a < a) lo = m; else hi = m;
        }
        const p0 = pts[lo], p1 = pts[hi];
        const k = p1.a === p0.a ? 0 : (a - p0.a) / (p1.a - p0.a);
        return { x: lerp(p0.x, p1.x, k), y: lerp(p0.y, p1.y, k), tx: lerp(p0.tx, p1.tx, k), ty: lerp(p0.ty, p1.ty, k) };
      }
      const fx = (v) => v.toFixed(1);
      function edges(br, innerSign) {
        // right-hand normal of an upward path = (-ty, tx)
        const L = [], R = [];
        br.pts.forEach((p) => {
          const w = width(p.y) / 2;
          L.push({ x: p.x + p.ty * w, y: p.y - p.tx * w });
          R.push({ x: p.x - p.ty * w, y: p.y + p.tx * w });
        });
        return { L, R };
      }
      const poly = (arr) => arr.map((p, i) => (i ? "L" : "M") + fx(p.x) + " " + fx(p.y)).join(" ");
      function ribbon(e) {
        return poly(e.L) + " " + e.R.slice().reverse().map((p) => "L" + fx(p.x) + " " + fx(p.y)).join(" ") + " Z";
      }
      const eL = edges(left), eR = edges(right);
      // inner edges start at the crotch (where they leave the other road)
      const crotchL = eL.R.findIndex((p) => p.x <= 540);
      const crotchR = eR.L.findIndex((p) => p.x >= 540);
      const cR = eR.L[Math.max(0, crotchR)], cL = eL.R[Math.max(0, crotchL)];
      $("cp-right").setAttribute(
        "d",
        `M540 ${FORK.y} L540 ${fx(cR.y)} ` + eR.L.slice(Math.max(0, crotchR)).map((p) => "L" + fx(p.x) + " " + fx(p.y)).join(" ") +
          ` L830 -100 L1400 -100 L1400 2000 L540 2000 Z`,
      );
      $("cp-left").setAttribute(
        "d",
        `M540 ${FORK.y} L540 ${fx(cL.y)} ` + eL.R.slice(Math.max(0, crotchL)).map((p) => "L" + fx(p.x) + " " + fx(p.y)).join(" ") +
          ` L250 -100 L-400 -100 L-400 2000 L540 2000 Z`,
      );
      const centre = (br) => "M" + fx(FORK.x) + " " + fx(FORK.y) + " " + br.pts.slice(1).map((p) => "L" + fx(p.x) + " " + fx(p.y)).join(" ");

      $("fill-left").setAttribute("d", ribbon(eL));
      $("fill-right").setAttribute("d", ribbon(eR));
      $("flare").setAttribute("d", ribbon(eR));
      $("e-lo").setAttribute("d", poly(eL.L));
      $("e-li").setAttribute("d", poly(eL.R.slice(Math.max(0, crotchL))));
      $("e-ro").setAttribute("d", poly(eR.R));
      $("e-ri").setAttribute("d", poly(eR.L.slice(Math.max(0, crotchR))));
      $("eg-ro").setAttribute("d", poly(eR.R));
      $("eg-ri").setAttribute("d", poly(eR.L.slice(Math.max(0, crotchR))));
      $("mp-left").setAttribute("d", centre(left));
      $("mp-right").setAttribute("d", centre(right));
      $("mp-flare").setAttribute("d", centre(right));
      const wB = width(BASE_Y) / 2, wF = width(FORK.y) / 2;
      $("fill-stem").setAttribute("d", `M${540 - wB} ${BASE_Y} L${540 - wF} ${FORK.y} L${540 + wF} ${FORK.y} L${540 + wB} ${BASE_Y} Z`);
      $("e-sl").setAttribute("d", `M${540 - wB} ${BASE_Y} L${540 - wF} ${FORK.y}`);
      $("e-sr").setAttribute("d", `M${540 + wB} ${BASE_Y} L${540 + wF} ${FORK.y}`);
      $("mp-stem").setAttribute("d", `M540 ${BASE_Y + 20} L540 ${FORK.y - 4}`);

      // ---------- measured stroke draws (svg-path-draw) ----------
      const prep = (el) => {
        const len = el.getTotalLength() + 2;
        el.style.strokeDasharray = `${len} ${len}`;
        el.style.strokeDashoffset = `${len}`;
        return len;
      };
      const LEN = {};
      ["e-sl", "e-sr", "e-lo", "e-li", "e-ro", "e-ri", "eg-ro", "eg-ri", "mp-stem", "mp-left", "mp-right", "mp-flare"].forEach(
        (k) => (LEN[k] = prep($(k))),
      );

      // ---------- generated DOM (setup only, deterministic) ----------
      // ground grid: rays to the centre vanishing point + perspective cross lines
      const gridRays = $("gridrays");
      for (let j = -9; j <= 9; j++) {
        const l = document.createElementNS(SVGNS, "line");
        l.setAttribute("x1", "540");
        l.setAttribute("y1", String(HY));
        l.setAttribute("x2", String(540 + j * 260));
        l.setAttribute("y2", "2200");
        gridRays.appendChild(l);
      }
      const gridLinesG = $("gridlines");
      const GL = 22, GZ0 = 0.4, GDZ = 0.62, GK = 700, GV = 0.34;
      const gridLines = [];
      for (let k = 0; k < GL; k++) {
        const l = document.createElementNS(SVGNS, "line");
        l.setAttribute("x1", "-200");
        l.setAttribute("x2", "1280");
        gridLinesG.appendChild(l);
        gridLines.push(l);
      }
      // sky stars
      const starsEl = $("stars");
      const STARS = 22;
      const stars = [];
      for (let i = 0; i < STARS; i++) {
        const el = document.createElement("div");
        el.className = P + "star";
        const size = 1.5 + prand(i * 7 + 2) * 2.5;
        el.style.width = size + "px";
        el.style.height = size + "px";
        const x = 30 + prand(i * 11 + 5) * 1020;
        const y = 130 + prand(i * 13 + 6) * 150;
        el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
        if (i % 3 === 0) el.style.background = "#B26BE8";
        starsEl.appendChild(el);
        stars.push({ el, ph: prand(i * 17 + 1) * 6.28, f: 1.2 + prand(i * 19 + 3) * 2.2, a: 0.25 + prand(i * 23 + 4) * 0.5 });
      }
      // centre marks (chase lights toward each vanishing point)
      const MARKS = 9;
      function makeMarks(g) {
        const arr = [];
        for (let i = 0; i < MARKS; i++) {
          const l = document.createElementNS(SVGNS, "line");
          l.setAttribute("opacity", "0");
          g.appendChild(l);
          arr.push(l);
        }
        return arr;
      }
      const marksL = makeMarks($("marks-left"));
      const marksR = makeMarks($("marks-right"));
      // chevrons along the amber path
      const CHEV = 6;
      const chevG = $("chevrons");
      const chevrons = [];
      const ZR = 6; // depth range for the perspective spacing
      const persp = (s) => (1 - 1 / (1 + s * ZR)) / (1 - 1 / (1 + ZR));
      for (let j = 0; j < CHEV; j++) {
        const pth = document.createElementNS(SVGNS, "path");
        pth.setAttribute("d", "M-15 8 L0 -7 L15 8");
        pth.setAttribute("opacity", "0");
        chevG.appendChild(pth);
        const a = persp((j + 0.7) / (CHEV + 0.6));
        const p = at(right, a);
        const sc = 0.35 + 0.75 * clamp01((p.y - HY) / (FORK.y - HY));
        const ang = (Math.atan2(p.ty, p.tx) * 180) / Math.PI + 90;
        pth.setAttribute("transform", `translate(${fx(p.x)} ${fx(p.y)}) rotate(${ang.toFixed(2)}) scale(${sc.toFixed(3)})`);
        pth.setAttribute("stroke-width", String((5 / sc).toFixed(2)));
        chevrons.push({ el: pth, a });
      }
      // ghosts for the dot's streak
      const ghostsEl = $("ghosts");
      const GHOSTS = 3;
      const ghosts = [];
      for (let k = 1; k <= GHOSTS; k++) {
        const g = document.createElement("div");
        g.className = P + "ghost";
        g.setAttribute("aria-hidden", "true");
        g.setAttribute("data-layout-allow-overlap", "");
        const c = document.createElement("div");
        c.className = P + "centered " + P + "ghostcore";
        g.appendChild(c);
        ghostsEl.appendChild(g);
        ghosts.push(g);
      }
      // amber particle burst pool (particle-burst, seeded)
      const burstEl = $("burst");
      const PCOUNT = 30;
      const palette = ["#FEB022", "#FFD27A", "#FDF2E0", "#FEB022", "#FFD27A"];
      const parts = [];
      const ROT = (-6 * Math.PI) / 180;
      for (let i = 0; i < PCOUNT; i++) {
        const el = document.createElement("div");
        el.className = P + "particle";
        const dot = i % 3 !== 0;
        const size = dot ? 5 + prand(i * 3 + 1) * 6 : 7 + prand(i * 3 + 1) * 8;
        el.style.width = size + "px";
        el.style.height = (dot ? size : size * 0.55) + "px";
        el.style.borderRadius = dot ? "50%" : "2px";
        el.style.background = palette[i % palette.length];
        el.style.boxShadow = `0 0 ${Math.round(size * 1.4)}px rgba(254,176,34,0.7)`;
        el.style.marginLeft = -size / 2 + "px";
        el.style.marginTop = -size / 2 + "px";
        burstEl.appendChild(el);
        const th = (i / PCOUNT) * Math.PI * 2 + (prand(i * 5 + 2) - 0.5) * 0.35;
        const ox0 = Math.cos(th) * 330, oy0 = Math.sin(th) * 175;
        const ox = ox0 * Math.cos(ROT) - oy0 * Math.sin(ROT);
        const oy = ox0 * Math.sin(ROT) + oy0 * Math.cos(ROT);
        const nl = Math.hypot(ox, oy) || 1;
        const sp = 300 + prand(i * 7 + 3) * 520;
        parts.push({ el, ox, oy, vx: (ox / nl) * sp, vy: (oy / nl) * sp - 120, spin: (prand(i * 11 + 4) * 2 - 1) * 540 });
      }
      // vanishing-point rays
      const raysEl = $("rays");
      const RAYS = 16;
      const rays = [];
      for (let i = 0; i < RAYS; i++) {
        const r = document.createElement("div");
        r.className = P + "ray";
        const len = 90 + prand(i * 13 + 7) * 170;
        r.style.width = len.toFixed(0) + "px";
        r.style.transform = `rotate(${(i * (360 / RAYS) + prand(i * 17 + 9) * 10).toFixed(2)}deg) scaleX(0)`;
        raysEl.appendChild(r);
        rays.push({ el: r, rot: i * (360 / RAYS) + prand(i * 17 + 9) * 10, delay: prand(i * 19 + 2) * 0.08 });
      }

      // ---------- virtual camera: slow push + impact shake, one writer ----------
      const world = $("world");
      const gridwrap = $("gridwrap");
      const cam = { s: 1 };
      const SHAKE_A = [[0, 0], [16, -11], [-13, 9], [10, 7], [-8, -6], [5, 4], [-3, -2], [1, 1], [0, 0]];
      const SHAKE_B = [[0, 0], [-7, 5], [5, -4], [-2, 2], [0, 0]];
      const sampleTable = (tbl, k) => {
        if (k <= 0 || k >= 1) return [0, 0];
        const f = k * (tbl.length - 1);
        const i = Math.floor(f);
        const r = f - i;
        return [lerp(tbl[i][0], tbl[i + 1][0], r), lerp(tbl[i][1], tbl[i + 1][1], r)];
      };
      let shakeX = 0, shakeY = 0;
      function applyCamera() {
        const tf = `translate(${shakeX.toFixed(2)}px, ${shakeY.toFixed(2)}px) scale(${cam.s.toFixed(5)})`;
        world.style.transform = tf;
        gridwrap.style.transform = tf;
      }

      // ---------- the dot: position is a pure function of time ----------
      const LAUNCH = 2.58, LAUNCH_DUR = 0.5;
      const depthScale = (y) => 0.26 + 0.74 * clamp01((y - HY) / (FORK.y - HY));
      function hesitate(t) {
        if (t < 1.12 || t > 1.58) return 0;
        if (t < 1.27) return -16 * E.sio((t - 1.12) / 0.15);
        if (t < 1.45) return lerp(-16, 16, E.sio((t - 1.27) / 0.18));
        return lerp(16, 0, E.sio((t - 1.45) / 0.13));
      }
      function dotState(t) {
        const st = { x: 540, y: 1066, s: 0, sx: 1, sy: 1, a: 0 };
        if (t < CUE.youre) return st;
        st.s = E.back(clamp01((t - CUE.youre) / 0.24));
        st.y = lerp(1066, FORK.y, E.io2(clamp01((t - 0.6) / 0.5)));
        st.x = 540 + hesitate(t);
        const an = E.o2(clamp01((t - CUE.start) / 0.18));
        const rel = clamp01((t - LAUNCH) / 0.08);
        st.y += 12 * an * (1 - rel);
        st.sy = 1 - 0.16 * an * (1 - rel);
        st.sx = 1 + 0.12 * an * (1 - rel);
        if (t > LAUNCH) {
          const u = E.o3(clamp01((t - LAUNCH) / LAUNCH_DUR));
          const p = at(right, u);
          st.x = p.x;
          st.y = p.y + 12 * an * (1 - rel);
          st.s = depthScale(p.y);
          st.a = u;
        }
        return st;
      }
      const dot = $("dot");
      const dotHalo = $("dothalo");
      const streak = $("streak"), streakGlow = $("streakglow");

      // ---------- procedural layer ----------
      const flareMask = $("mp-flare");
      const shock = $("shock"), flash = $("flash"), vpring = $("vpring");
      const branchDraw = (t, at0) => E.o2(clamp01((t - at0) / 0.75));
      function placeMarks(marks, br, t, drawn, speed, alpha) {
        for (let i = 0; i < MARKS; i++) {
          let s = (i / MARKS + t * speed) % 1;
          const a0 = persp(s);
          const z = 1 + s * ZR;
          const len = 0.06 / z;
          const a1 = Math.min(1, a0 + len);
          const p0 = at(br, a0), p1 = at(br, a1);
          const fade = clamp01(s / 0.08) * clamp01((1 - s) / 0.25) * (a1 <= drawn ? 1 : 0);
          const m = marks[i];
          m.setAttribute("x1", fx(p0.x));
          m.setAttribute("y1", fx(p0.y));
          m.setAttribute("x2", fx(p1.x));
          m.setAttribute("y2", fx(p1.y));
          m.setAttribute("stroke-width", (1.2 + 7 / z).toFixed(2));
          m.setAttribute("opacity", (fade * alpha).toFixed(3));
        }
      }
      function render(t) {
        // camera: slow push + two impact shakes
        const sa = sampleTable(SHAKE_A, (t - 1.7) / 0.32);
        const sb = sampleTable(SHAKE_B, (t - CUE.wait) / 0.16);
        shakeX = sa[0] + sb[0];
        shakeY = sa[1] + sb[1];
        applyCamera();
        // ground grid drifting toward camera (forward motion)
        for (let k = 0; k < GL; k++) {
          let z = (k * GDZ - t * GV) % (GL * GDZ);
          if (z < 0) z += GL * GDZ;
          z += GZ0;
          const y = HY + GK / z;
          gridLines[k].setAttribute("y1", fx(y));
          gridLines[k].setAttribute("y2", fx(y));
          gridLines[k].setAttribute("opacity", Math.pow(clamp01((y - HY) / 160), 1.5).toFixed(3));
        }
        // stars twinkle
        for (let i = 0; i < STARS; i++) {
          const s = stars[i];
          s.el.style.opacity = (s.a * (0.55 + 0.45 * Math.sin(t * s.f + s.ph))).toFixed(3);
        }
        // chase marks
        const marksIn = clamp01((t - 0.5) / 0.4);
        const dimL = 1 - 0.55 * E.o2(clamp01((t - 2.6) / 0.4));
        placeMarks(marksL, left, t, branchDraw(t, 0.26), 0.5, 0.6 * marksIn * dimL);
        placeMarks(marksR, right, t, branchDraw(t, 0.3), 0.5 + 0.35 * clamp01((t - LAUNCH) / 0.3), 0.95 * marksIn);
        // dot + velocity streak
        const d = dotState(t);
        dot.style.transform = `translate(${fx(d.x)}px, ${fx(d.y)}px) scale(${(d.s * d.sx).toFixed(4)}, ${(d.s * d.sy).toFixed(4)})`;
        const back = dotState(t - 0.04);
        const speed = Math.hypot(d.x - back.x, d.y - back.y) / 0.04;
        const gate = clamp01((speed - 420) / 900);
        const pulse = t > 1.1 && t < LAUNCH ? 1 + 0.18 * Math.sin((t - 1.1) * 9) : 1;
        dotHalo.style.transform = `scale(${(pulse * (1 + 0.9 * gate)).toFixed(4)})`;
        if (gate > 0 && t > CUE.youre) {
          let path = "";
          for (let k = 0; k <= 7; k++) {
            const q = dotState(t - k * 0.014);
            path += (k ? " L" : "M") + fx(q.x) + " " + fx(q.y);
          }
          streak.setAttribute("d", path);
          streakGlow.setAttribute("d", path);
          streak.setAttribute("stroke-width", (20 * d.s).toFixed(2));
          streakGlow.setAttribute("stroke-width", (40 * d.s).toFixed(2));
          streak.setAttribute("opacity", (0.85 * gate).toFixed(3));
          streakGlow.setAttribute("opacity", (0.8 * gate).toFixed(3));
        } else {
          streak.setAttribute("opacity", "0");
          streakGlow.setAttribute("opacity", "0");
        }
        for (let k = 0; k < GHOSTS; k++) {
          const q = dotState(t - (k + 1) * 0.03);
          ghosts[k].style.transform = `translate(${fx(q.x)}px, ${fx(q.y)}px) scale(${q.s.toFixed(4)})`;
          ghosts[k].style.opacity = (gate * (0.42 / (k + 1))).toFixed(3);
        }
        // lit flare follows the dot along the amber path
        const lit = t > LAUNCH ? d.a : 0;
        flareMask.style.strokeDashoffset = (LEN["mp-flare"] * (1 - lit)).toFixed(2);
        // chevrons light as the dot passes, then pulse toward the vanishing point
        for (let j = 0; j < CHEV; j++) {
          const c = chevrons[j];
          const g = clamp01((lit - c.a) / 0.05);
          const wave = Math.pow(Math.max(0, Math.cos(Math.PI * 2 * (t * 1.6 - c.a * 1.4))), 3);
          c.el.setAttribute("opacity", (g * (0.35 + 0.65 * wave)).toFixed(3));
        }
        // particle burst on the stamp impact (pure ballistic function of time)
        const PT = (t - 1.7) / 0.9;
        for (let i = 0; i < PCOUNT; i++) {
          const p = parts[i];
          if (PT <= 0 || PT >= 1) {
            p.el.style.opacity = "0";
            continue;
          }
          const ft = PT * 0.9;
          const x = p.ox + p.vx * ft;
          const y = p.oy + p.vy * ft + 0.5 * 420 * ft * ft;
          p.el.style.transform = `translate(${fx(x)}px, ${fx(y)}px) rotate(${(p.spin * ft).toFixed(1)}deg)`;
          p.el.style.opacity = Math.min(1, (1 - PT) / 0.35).toFixed(3);
        }
        // impact shockwave ring + flash (ephemeral: invisible outside their window)
        const sk = (t - 1.7) / 0.62;
        if (sk > 0 && sk < 1) {
          const e = E.o2(sk);
          shock.style.transform = `rotate(-6deg) scale(${(0.62 + 1.28 * e).toFixed(4)})`;
          shock.style.opacity = (0.95 * (1 - e)).toFixed(3);
        } else shock.style.opacity = "0";
        const fl = t - 1.69;
        flash.style.opacity = (fl <= 0 || fl >= 0.4 ? 0 : fl < 0.06 ? (0.42 * fl) / 0.06 : 0.42 * (1 - E.o2((fl - 0.06) / 0.34))).toFixed(3);
        const vk = (t - CUE.change) / 0.48;
        if (vk > 0 && vk < 1) {
          const e = E.o2(vk);
          vpring.style.transform = `scale(${(0.4 + 2.4 * e).toFixed(4)})`;
          vpring.style.opacity = (0.95 * (1 - vk)).toFixed(3);
        } else vpring.style.opacity = "0";
        // vanishing-point rays grow on "change", then rotate slowly
        const rt = t - CUE.change;
        for (let i = 0; i < RAYS; i++) {
          const r = rays[i];
          const g = E.expo(clamp01((rt - r.delay) / 0.42));
          const breathe = 1 + 0.08 * Math.sin(t * 6 + i * 1.7) * g;
          const spin = rt > 0 ? rt * 14 : 0;
          r.el.style.transform = `rotate(${(r.rot + spin).toFixed(2)}deg) scaleX(${(g * breathe).toFixed(4)})`;
          r.el.style.opacity = (g * 0.9).toFixed(3);
        }
      }

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
      tl.fromTo(cam, { s: 1 }, { s: 1.04, duration: DUR, ease: "none", onUpdate: applyCamera }, 0);

      // ground ambient
      tl.fromTo($("glow-violet"), { x: -40, y: 10, scale: 1 }, { x: 50, y: -30, scale: 1.06, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo($("haze"), { x: -30, opacity: 0.8 }, { x: 30, opacity: 1, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo($("fog"), { x: -20, scale: 1 }, { x: 26, scale: 1.08, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo($("glow-amber"), { x: 0, scale: 0.9 }, { x: -24, scale: 1, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo($("glow-amber"), { opacity: 0.16 }, { opacity: 0.38, duration: 0.5, ease: "power2.out", immediateRender: false }, CUE.change);
      tl.fromTo($("gridwrap"), { opacity: 0.4 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);

      // ---- Scene 1: the fork draws (svg-path-draw) ----
      const drawTo = (key, at0, dur, ease) =>
        tl.fromTo($(key), { strokeDashoffset: LEN[key] }, { strokeDashoffset: 0, duration: dur, ease }, at0);
      drawTo("e-sl", CUE.future, 0.26, "power1.in");
      drawTo("e-sr", CUE.future, 0.26, "power1.in");
      drawTo("mp-stem", CUE.future, 0.26, "power1.in");
      drawTo("e-lo", 0.26, 0.75, "power2.out");
      drawTo("mp-left", 0.26, 0.75, "power2.out");
      drawTo("e-li", 0.34, 0.67, "power2.out");
      drawTo("e-ro", 0.3, 0.75, "power2.out");
      drawTo("eg-ro", 0.3, 0.75, "power2.out");
      drawTo("mp-right", 0.3, 0.75, "power2.out");
      drawTo("e-ri", 0.38, 0.67, "power2.out");
      drawTo("eg-ri", 0.38, 0.67, "power2.out");

      // vanishing points light up as the paths arrive
      tl.fromTo($("vpstar-l"), { opacity: 0, scale: 0.4 }, { opacity: 0.6, scale: 1, duration: 0.5, ease: "power2.out" }, 0.84);
      tl.fromTo($("bloom"), { opacity: 0, scale: 0.08 }, { opacity: 0.85, scale: 0.26, duration: 0.5, ease: "back.out(2)" }, 0.88);

      // labels: SAME on "heading", CHANGE right after
      const lettersL = Array.from($("label-l").querySelectorAll("span"));
      const lettersR = Array.from($("label-r").querySelectorAll("span"));
      tl.fromTo(lettersL, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out", stagger: 0.05 }, CUE.heading);
      tl.fromTo($("tick-l"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.out" }, CUE.heading + 0.12);
      tl.fromTo(lettersR, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out", stagger: 0.045 }, 0.92);
      tl.fromTo($("tick-r"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.out" }, 1.02);

      // ---- Scene 2: DON'T WAIT slams (kinetic-beat-slam) ----
      const stamp = $("stamp");
      tl.fromTo(
        stamp,
        { scale: 2.4, rotation: 3, filter: "blur(18px)" },
        { scale: 1, rotation: -6, filter: "blur(0px)", duration: 0.34, ease: "power4.out" },
        CUE.dont,
      );
      tl.fromTo(stamp, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, CUE.dont);
      // impact: shockwave ring, flash, particles and shake are driven in render()
      // "wait": second hit on the bottom line
      const line2 = $("line2");
      tl.fromTo(
        line2,
        { scale: 1.14, fill: "#FFD27A", transformOrigin: "50% 60%" },
        { scale: 1, fill: "#FDF2E0", transformOrigin: "50% 60%", duration: 0.34, ease: "power3.out", immediateRender: false },
        CUE.wait,
      );
      tl.fromTo($("stampglow"), { opacity: 0.85 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, CUE.wait);
      tl.fromTo($("stampglow"), { opacity: 1 }, { opacity: 0.7, duration: 0.5, ease: "sine.inOut", immediateRender: false }, CUE.wait + 0.12);
      // light sweep across the glyphs after landing
      tl.fromTo($("sheengrad"), { attr: { x1: -320, x2: -140 } }, { attr: { x1: 760, x2: 940 }, duration: 0.55, ease: "power2.inOut" }, 2.0);
      // finite glow breath while held
      tl.fromTo($("stampglow"), { opacity: 0.7 }, { opacity: 0.95, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.64);

      // ---- Scene 3: the light takes the amber path ----
      tl.fromTo($("rglow"), { opacity: 0 }, { opacity: 0.9, duration: 0.45, ease: "power2.out" }, CUE.start);
      tl.fromTo($("left"), { opacity: 1 }, { opacity: 0.32, duration: 0.45, ease: "power2.out" }, 2.6);
      tl.fromTo($("label-l"), { opacity: 1 }, { opacity: 0.38, duration: 0.45, ease: "power2.out" }, 2.6);
      tl.fromTo($("vpstar-l"), { opacity: 0.6 }, { opacity: 0.2, duration: 0.45, ease: "power2.out", immediateRender: false }, 2.6);
      // "change": right vanishing point blooms
      tl.fromTo($("bloom"), { scale: 0.26, opacity: 0.85 }, { scale: 1.18, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, CUE.change);
      tl.fromTo($("bloom"), { scale: 1.18 }, { scale: 1, duration: 0.18, ease: "sine.inOut", immediateRender: false }, CUE.change + 0.3);
      tl.fromTo($("label-r"), { scale: 1 }, { scale: 1.16, duration: 0.12, ease: "power2.out", immediateRender: false }, CUE.change);
      tl.fromTo($("label-r"), { scale: 1.16 }, { scale: 1, duration: 0.32, ease: "back.out(2)", immediateRender: false }, CUE.change + 0.12);
      // CHANGE locks in as a solid amber chip
      tl.fromTo($("chip"), { scaleX: 0.35, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.34, ease: "back.out(1.6)" }, CUE.change);
      tl.fromTo(
        $("label-r"),
        { color: "#FEB022", textShadow: "0 0 22px rgba(254,176,34,0.55)" },
        { color: "#1A1030", textShadow: "0 0 0px rgba(254,176,34,0)", duration: 0.2, ease: "power2.out", immediateRender: false },
        CUE.change + 0.04,
      );
      tl.fromTo($("labelsheen"), { x: -70 }, { x: 290, duration: 0.28, ease: "power2.inOut" }, CUE.change + 0.2);
      tl.fromTo($("labelsheen"), { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, CUE.change + 0.2);

      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
