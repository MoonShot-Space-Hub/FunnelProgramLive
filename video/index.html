    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0820;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0820;
        font-family: "Montserrat", sans-serif;
      }

      /* ---------- A-roll: the speaker, inside a non-timed camera wrapper for punch-ins ---------- */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 540px 520px;
        will-change: transform, filter;
      }
      #a-roll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ---------- B-roll cutaways: one non-timed transition wrapper per sub-composition host ---------- */
      .bw {
        position: absolute;
        inset: 0;
        z-index: 10;
        will-change: transform, opacity, filter;
      }
      .bw > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }

      /* ---------- transitions ---------- */
      .lid {
        position: absolute;
        left: 0;
        width: 100%;
        height: 1010px;
        z-index: 45;
      }
      #lid-top {
        top: 0;
        background: linear-gradient(to bottom, #000 0%, #000 92%, rgba(0, 0, 0, 0) 100%);
      }
      #lid-bottom {
        bottom: 0;
        background: linear-gradient(to top, #000 0%, #000 92%, rgba(0, 0, 0, 0) 100%);
      }
      .block {
        position: absolute;
        inset: 0;
        z-index: 46;
      }
      .block.b-1 {
        background: #251f70;
      }
      .block.b-2 {
        background: #8c2fc2;
      }
      .block.b-3 {
        background: #0b0820;
      }

      /* ---------- caption gradient: black, behind the captions ---------- */
      #cap-gradient {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 1080px;
        z-index: 50;
        pointer-events: none;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.84) 24%,
          rgba(0, 0, 0, 0.66) 42%,
          rgba(0, 0, 0, 0.38) 60%,
          rgba(0, 0, 0, 0.14) 78%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      /* ---------- captions: y 1150–1480 ---------- */
      #captions {
        position: absolute;
        left: 0;
        top: 1150px;
        width: 100%;
        height: 330px;
        z-index: 60;
        pointer-events: none;
      }
      .cg {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 0;
        height: 330px;
        display: flex;
        flex-wrap: wrap;
        align-content: center;
        align-items: baseline;
        justify-content: center;
        column-gap: 24px;
        row-gap: 0;
        opacity: 0;
        visibility: hidden;
      }
      .cw {
        position: relative;
        display: inline-block;
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 80px;
        line-height: 1.1;
        letter-spacing: -0.015em;
        color: #fffdf8;
        text-shadow:
          0 4px 18px rgba(0, 0, 0, 0.6),
          0 2px 3px rgba(0, 0, 0, 0.7);
        transform-origin: 50% 70%;
        isolation: isolate;
        --mk: 0;
      }
      .cw.em {
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-size: 104px;
        letter-spacing: -0.03em;
        color: #feb022;
        text-shadow:
          0 0 38px rgba(254, 176, 34, 0.45),
          0 4px 16px rgba(0, 0, 0, 0.65);
      }
      .cw.em.red {
        color: #ff4d5e;
        text-shadow:
          0 0 38px rgba(255, 77, 94, 0.45),
          0 4px 16px rgba(0, 0, 0, 0.65);
      }
      /* marker bar that sweeps in under emphasis words */
      .cw.em::after {
        content: "";
        position: absolute;
        left: -6px;
        right: -6px;
        bottom: 14px;
        height: 22px;
        border-radius: 6px;
        background: rgba(140, 47, 194, 0.78);
        transform-origin: 0% 50%;
        transform: scaleX(var(--mk));
        z-index: -1;
      }
      .cw.em.red::after {
        background: rgba(120, 18, 40, 0.8);
      }

    </style>

      tl.set(".block", { xPercent: -101 }, 0);

            { opacity: 1, scale: 1, filter: "blur(0px)", duration: IN, ease: "expo.out" },

          tl.set(sel, { opacity: 1, scale: 1, filter: "blur(0px)" }, start);

        // exit: the cutaway falls back into the speaker
        tl.fromTo(
          sel,
          { opacity: 1, scale: 1, filter: "blur(0px)" },
          {
            opacity: 0,
            scale: 0.86,

            duration: OUT,

        [6.56, 9.48, 1.0, 1.04, "sine.inOut"],
        [9.48, 11.88, 1.16, 1.19, "sine.out"],
        [11.88, 13.96, 1.0, 1.03, "sine.out"],
        [13.96, 15.1, 1.22, 1.25, "sine.out"],
        [15.1, 15.4, 1.25, 1.34, "power2.in"],
        [18.62, 18.96, 1.12, 1.0, "power3.out"],
        [18.96, 19.96, 1.0, 1.03, "sine.out"],
        [19.96, 20.95, 1.17, 1.19, "sine.out"],
        [22.57, 22.92, 1.12, 1.0, "power3.out"],
        [22.92, 25.55, 1.0, 1.06, "sine.inOut"],
        [25.55, 25.85, 1.06, 1.14, "power2.in"],
        [29.12, 29.46, 1.26, 1.14, "power3.out"],
        [29.46, 32.4, 1.14, 1.18, "sine.inOut"],
        [32.4, 32.7, 1.18, 1.26, "power2.in"],
        [37.87, 38.22, 1.12, 1.0, "power3.out"],
        [38.22, 39.08, 1.0, 1.03, "sine.out"],
        [39.08, 40.0, 1.16, 1.18, "sine.out"],
        [44.77, 45.12, 1.3, 1.18, "power3.out"],
        [45.12, 46.4, 1.18, 1.21, "sine.out"],
        [46.4, 46.7, 1.21, 1.3, "power2.in"],
        [49.72, 50.07, 1.12, 1.0, "power3.out"],
        [50.07, 51.76, 1.0, 1.05, "sine.inOut"],
      ];
      CAM.forEach(([t0, t1, s0, s1, ease], i) => {
        tl.fromTo("#cam", { scale: s0 }, { scale: s1, duration: t1 - t0, ease, immediateRender: i === 0 }, t0);
      });
      // camera blur: soft on the way into each cutaway, clearing on the way back
      CUTS.forEach(([, start, end]) => {
        tl.fromTo("#cam", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.3, ease: "power2.in", immediateRender: false }, start);
        tl.fromTo("#cam", { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.34, ease: "power3.out", immediateRender: false }, end - OUT);
      });
      tl.set("#cam", { filter: "blur(0px)" }, 0);

      // ------------------------------------------------------------------ caption gradient
      tl.fromTo("#cap-gradient", { opacity: 0, yPercent: 12 }, { opacity: 1, yPercent: 0, duration: 0.3, ease: "power2.out" }, 0);
      // the b5 kinetic phase carries the words itself (34.78–38.15)
      tl.fromTo("#cap-gradient", { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.in", immediateRender: false }, 34.66);
      tl.fromTo("#cap-gradient", { opacity: 0, yPercent: 12 }, { opacity: 1, yPercent: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 37.98);

      // ------------------------------------------------------------------ captions
      const layer = document.getElementById("captions");
      const GROUPS = window.CAPTION_GROUPS;
      GROUPS.forEach((g, gi) => {
        const el = document.createElement("div");
        el.className = "cg";
        el.id = "cg-" + gi;
        g.words.forEach((w, wi) => {
          const s = document.createElement("span");
          s.className = "cw" + (w.tone ? " em " + w.tone : "");
          s.id = "cg-" + gi + "-w" + wi;
          s.textContent = w.text;
          el.appendChild(s);
        });
        layer.appendChild(el);
      });

      GROUPS.forEach((g, gi) => {
        const el = document.getElementById("cg-" + gi);
        tl.set(el, { visibility: "visible", opacity: 1, y: 0 }, g.start);
        g.words.forEach((w, wi) => {
          const s = document.getElementById("cg-" + gi + "-w" + wi);
          const at = Math.max(g.start, w.start - 0.04);
          if (w.tone) {
            // emphasis: slams in big and sharpens, then the marker bar sweeps under it
            tl.fromTo(
              s,
              { opacity: 0, scale: 1.9, y: -8, rotation: -5, filter: "blur(10px)" },
              { opacity: 1, scale: 1, y: 0, rotation: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out" },
              at,
            );
            tl.fromTo(s, { "--mk": 0 }, { "--mk": 1, duration: 0.28, ease: "power3.out" }, at + 0.12);
          } else {
            // spoken word pops up from below and flashes amber while it is said
            tl.fromTo(
              s,
              { opacity: 0, y: 44, scale: 0.7, color: "#FFD27A" },
              { opacity: 1, y: 0, scale: 1, color: "#FFD27A", duration: 0.24, ease: "back.out(2.2)" },
              at,
            );
            tl.fromTo(
              s,
              { color: "#FFD27A" },
              { color: "#FFFDF8", duration: 0.22, ease: "power1.out", immediateRender: false },
              Math.max(at + 0.12, w.end),
            );
          }
        });
        // exit, then a hard kill at the group's end
        tl.to(el, { opacity: 0, y: -16, duration: 0.1, ease: "power2.in" }, g.end - 0.1);
        tl.set(el, { opacity: 0, visibility: "hidden" }, g.end);
      });

      // ------------------------------------------------------------------ caption self-lint
      GROUPS.forEach((g, gi) => {
        const el = document.getElementById("cg-" + gi);
        tl.seek(g.end + 0.01);
        const cs = window.getComputedStyle(el);
        if (cs.opacity !== "0" && cs.visibility !== "hidden") {
          console.warn("[caption-lint] group " + gi + " still visible at t=" + (g.end + 0.01).toFixed(2) + "s");
        }
      });
      tl.seek(0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
