      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var OFF = 620;
          // Apple-style side entrance: slides in from its own edge, de-blurs, settles (expo.out).
          function enter(sel, side, at) {
            tl.fromTo(sel, { x: side * -OFF, opacity: 0, scale: 0.96, filter: "blur(14px)" },
              { x: 0, opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.85, ease: "expo.out", immediateRender: true }, at);
          }
          function leave(sel, side, at) {
            tl.to(sel, { x: side * -OFF, opacity: 0, scale: 0.97, filter: "blur(10px)", duration: 0.55, ease: "power3.in" }, at);
          }
          var L = 1, R = -1; // L enters from the left edge (x negative), R from the right

          enter("#lt", L, 0.35); leave("#lt", L, 3.4);
          enter("#c-chart", R, 2.3); leave("#c-chart", R, 6.5);
          enter("#c-book", L, 7.2); leave("#c-book", L, 11.1);
          tl.fromTo("#c-book-2019", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: true }, 10.25);

          enter("#c-reviews", R, 11.7); leave("#c-reviews", R, 15.15);
          gsap.utils.toArray("#root .star").forEach(function (el, i) {
            tl.fromTo(el, { scale: 0.3, opacity: 0.15 }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out", immediateRender: true }, 12.0 + i * 0.12);
          });

          enter("#c-awards", L, 15.8); leave("#c-awards", L, 20.1);
          enter("#c-system", R, 20.9); leave("#c-system", R, 24.95);

          enter("#c-edition", L, 25.5); leave("#c-edition", L, 30.45);
          tl.fromTo("#p-en", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: true }, 29.35);
          tl.fromTo("#p-hi", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: true }, 29.95);

          enter("#c-journey", R, 31.1); leave("#c-journey", R, 33.75);
          (function () {
            var p = document.getElementById("j-path"), len = p.getTotalLength();
            tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.6, ease: "power2.inOut", immediateRender: true }, 31.5);
            ["#j-a", "#j-b", "#j-c"].forEach(function (id, i) {
              tl.fromTo(id, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "expo.out", immediateRender: true }, 31.45 + i * 0.75);
            });
          })();

          enter("#c-free", R, 36.25); leave("#c-free", R, 40.35);
          tl.fromTo("#free-ship", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: true }, 36.9);
          tl.fromTo("#free-b", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: true }, 38.84);
          tl.fromTo("#free-a", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 38.8);
          (function () {
            var c = 2 * Math.PI * 92;
            tl.fromTo("#ring-arc", { strokeDasharray: c, strokeDashoffset: 0 }, { strokeDashoffset: c * 0.92, duration: 1.5, ease: "power1.inOut", immediateRender: true }, 38.9);
          })();

          enter("#c-media", R, 43.25); leave("#c-media", R, 49.2);
          [["#r1", 43.42], ["#r2", 44.26], ["#r3", 45.1], ["#r4", 46.27]].forEach(function (r) {
            tl.fromTo(r[0], { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: true }, r[1]);
          });
          gsap.utils.toArray("#root .strike").forEach(function (el, i) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: true }, 47.4 + i * 0.08);
          });
          tl.fromTo("#no-structure", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: true }, 47.55);

          enter("#c-noise", L, 49.9); leave("#c-noise", L, 55.55);
          enter("#c-cut", R, 56.1); leave("#c-cut", R, 60.05);
          tl.fromTo("#c-cut-2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: true }, 58.9);
          enter("#c-end", L, 60.6);

          tl.seek(0);
          window.__timelines["cards"] = tl;
        })();
