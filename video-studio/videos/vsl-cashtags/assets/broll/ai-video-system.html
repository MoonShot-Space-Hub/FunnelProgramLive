<!doctype html>
<html>
  <head>
    <style>
      html, body { margin: 0; padding: 0; background: #05070d; overflow: hidden; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1600" height="2000" style="width: 800px; height: 1000px"></canvas>
    <script>
      // Deterministic: every frame is a pure function of t (seconds). No clocks, seeded PRNG.
      const W = 1600, H = 2000, ctx = document.getElementById("c").getContext("2d");
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(20261013);
      const LINES = 34, PTS = 48;
      const lines = [];
      for (let i = 0; i < LINES; i++) {
        let y = 0.35 + rnd() * 0.4, walk = [];
        for (let k = 0; k < PTS; k++) { y += (rnd() - 0.5) * 0.09; y = Math.min(0.9, Math.max(0.1, y)); walk.push(y); }
        lines.push({ walk, phase: rnd() * 6.28, speed: 0.6 + rnd() * 1.6, hue: rnd() < 0.35 ? "red" : "grey", lane: i });
      }
      const dots = Array.from({ length: 70 }, () => ({ x: rnd(), y: 0.15 + rnd() * 0.75, p: rnd() * 6.28, r: 3 + rnd() * 7 }));
      const ease = (x) => (x < 0 ? 0 : x > 1 ? 1 : x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const clamp = (x) => Math.max(0, Math.min(1, x));
      const PLOT = { x0: 120, x1: W - 120, y0: 360, y1: H - 260 };
      const px = (u) => PLOT.x0 + u * (PLOT.x1 - PLOT.x0);
      const py = (v) => PLOT.y0 + v * (PLOT.y1 - PLOT.y0);
      // ordered target: rising staircase bands, one per line
      function target(i, k) {
        const u = k / (PTS - 1);
        const step = Math.floor(u * 6) / 6;
        const base = 0.86 - step * 0.62 - (u - step) * 0.25;
        return base + (i / LINES - 0.5) * 0.16;
      }
      function trend(u) { return 0.84 - 0.66 * Math.pow(u, 1.15) + 0.03 * Math.sin(u * 9); }

      window.render = function (t) {
        // background
        const g = ctx.createRadialGradient(W * 0.5, H * 0.35, 50, W * 0.5, H * 0.5, H * 0.8);
        g.addColorStop(0, "#132044"); g.addColorStop(0.55, "#0a1023"); g.addColorStop(1, "#05070d");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        // grid (fades in with order)
        const order = ease(clamp((t - 2.8) / 2.0));
        ctx.strokeStyle = `rgba(120,150,255,${0.05 + 0.1 * order})`; ctx.lineWidth = 2;
        for (let gx = 0; gx <= 8; gx++) { ctx.beginPath(); ctx.moveTo(px(gx / 8), py(0)); ctx.lineTo(px(gx / 8), py(1)); ctx.stroke(); }
        for (let gy = 0; gy <= 10; gy++) { ctx.beginPath(); ctx.moveTo(px(0), py(gy / 10)); ctx.lineTo(px(1), py(gy / 10)); ctx.stroke(); }
        // chaotic dots fade out as order arrives
        for (const d of dots) {
          const a = (1 - order) * 0.55;
          if (a <= 0.01) continue;
          ctx.fillStyle = `rgba(200,200,215,${a})`;
          ctx.beginPath();
          ctx.arc(px(d.x + 0.02 * Math.sin(t * 2 + d.p)), py(d.y + 0.02 * Math.cos(t * 1.7 + d.p)), d.r, 0, 6.283);
          ctx.fill();
        }
        // lines: jittering random walks -> ordered staircase
        const fadeLines = 1 - 0.75 * ease(clamp((t - 5.0) / 1.2));
        for (const L of lines) {
          ctx.beginPath();
          for (let k = 0; k < PTS; k++) {
            const jit = 0.05 * Math.sin(t * L.speed * 3 + L.phase + k * 0.7) * (1 - order);
            const v = (L.walk[k] + jit) * (1 - order) + target(L.lane, k) * order;
            const x = px(k / (PTS - 1)), y = py(v);
            k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          }
          const red = L.hue === "red";
          const r = Math.round((red ? 255 : 160) * (1 - order) + 60 * order);
          const gg = Math.round((red ? 90 : 165) * (1 - order) + 140 * order);
          const b = Math.round((red ? 100 : 180) * (1 - order) + 255 * order);
          ctx.strokeStyle = `rgba(${r},${gg},${b},${(0.35 + 0.25 * order) * fadeLines})`;
          ctx.lineWidth = 3 + 1.5 * order;
          ctx.stroke();
        }
        // the one clean trend line draws itself 5.0 -> 6.6 s
        const draw = ease(clamp((t - 5.0) / 1.6));
        if (draw > 0) {
          const n = Math.max(2, Math.round(200 * draw));
          const grad = ctx.createLinearGradient(px(0), 0, px(1), 0);
          grad.addColorStop(0, "#0a84ff"); grad.addColorStop(1, "#30d158");
          for (const [w, a] of [[34, 0.18], [18, 0.35], [9, 1]]) {
            ctx.beginPath();
            for (let k = 0; k < n; k++) { const u = (k / 199); const x = px(u), y = py(trend(u)); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
            ctx.strokeStyle = grad; ctx.globalAlpha = a; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
          }
          ctx.globalAlpha = 1;
          const ue = (n - 1) / 199; ctx.fillStyle = "#ffffff";
          ctx.beginPath(); ctx.arc(px(ue), py(trend(ue)), 16, 0, 6.283); ctx.fill();
        }
        // titles
        ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
        const g1 = 1 - ease(clamp((t - 2.6) / 0.6));
        if (g1 > 0) { ctx.globalAlpha = g1; ctx.fillStyle = "#a1a1aa"; ctx.font = "800 96px Inter, Helvetica, Arial, sans-serif"; ctx.fillText("Guessing", W / 2, 230); }
        const s1 = ease(clamp((t - 5.3) / 0.7));
        if (s1 > 0) { ctx.globalAlpha = s1; ctx.fillStyle = "#f5f5f7"; ctx.font = "900 120px Inter, Helvetica, Arial, sans-serif"; ctx.fillText("System", W / 2, 240 - 20 * (1 - s1)); }
        ctx.globalAlpha = 1;
      };
      window.render(0);
    </script>
  </body>
</html>
