    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });

        // ---- Camera: face-anchored punch-ins (coordinate-target-zoom, nested wrappers) ----
        // Inner translate T places the face (offset from frame centre, pre-scale) at screen y = py:
        //   T = (P - C) / S - offset, clamped so the scaled footage always covers the frame.
        function cam(S, faceX, faceY, py) {
          var ox = faceX - 540, oy = faceY - 960;
          var tx = 0 / S - ox, ty = (py - 960) / S - oy;
          var mx = 540 * (1 - 1 / S), my = 960 * (1 - 1 / S);
          return { s: S, x: Math.max(-mx, Math.min(mx, tx)), y: Math.max(-my, Math.min(my, ty)) };
        }
        function setCam(t, c) {
          tl.set("#cam-outer", { scale: c.s }, t);
          tl.set("#cam-inner", { x: c.x, y: c.y }, t);
        }
        function moveCam(t, dur, ease, from, to) {
          tl.fromTo("#cam-outer", { scale: from.s }, { scale: to.s, duration: dur, ease: ease, immediateRender: false }, t);
          tl.fromTo("#cam-inner", { x: from.x, y: from.y }, { x: to.x, y: to.y, duration: dur, ease: ease, immediateRender: false }, t);
        }
        var WIDE = { s: 1, x: 0, y: 0 };

        // Scene 1 — desk (face ~ 455,866): slow push through the hook.
        setCam(0, WIDE);
        moveCam(0.75, 2.75, "sine.inOut", WIDE, cam(1.1, 455, 866, 820));
        // Scene 2 — floor, phones (face ~ 513,676): gentle push.
        setCam(3.667, WIDE);
        moveCam(3.8, 2.3, "sine.inOut", WIDE, cam(1.06, 513, 676, 676));
        // Scene 3 — namaste pull-back already moves in camera; headroom for the "massive" shake.
        setCam(6.167, WIDE);
        setCam(7.2, cam(1.06, 474, 692, 692));
        // Scene 4 — window (face ~ 565,675): punch on "free", reframe on "where", punch on "learn".
        setCam(8.017, WIDE);
        var p1 = cam(1.28, 565, 675, 720), p1d = cam(1.33, 565, 675, 720);
        moveCam(8.82, 0.15, "power2.out", WIDE, p1);
        moveCam(8.97, 1.41, "none", p1, p1d);
        var r1 = cam(1.12, 610, 669, 660), r1d = cam(1.16, 610, 669, 660);
        setCam(10.38, r1);
        moveCam(10.38, 0.93, "none", r1, r1d);
        // 11.31-12.55 is covered by B-roll 3.
        // Scene 5 — CTA (face ~ 552,663): drift, then punch on "register".
        setCam(12.55, WIDE);
        var c1 = cam(1.06, 552, 663, 663);
        moveCam(12.6, 1.53, "sine.inOut", WIDE, c1);
        var p3 = cam(1.22, 552, 663, 640), p3d = cam(1.25, 552, 663, 640);
        moveCam(14.13, 0.15, "power2.out", c1, p3);
        moveCam(14.28, 0.77, "none", p3, p3d);

        // Impact shakes — baked, deterministic decaying wobble on the outermost wrapper.
        function shake(t0, amp, dur) {
          var steps = Math.round(dur * 30), prev = { x: 0, y: 0 };
          tl.set("#cam-shake", { x: 0, y: 0 }, t0);
          for (var i = 1; i <= steps; i++) {
            var u = i / steps, k = Math.exp(-3.2 * u) * (1 - u);
            var next = { x: amp * k * Math.sin(i * 2.1), y: amp * k * Math.cos(i * 1.7) };
            tl.fromTo("#cam-shake", { x: prev.x, y: prev.y }, { x: next.x, y: next.y, duration: dur / steps, ease: "none", immediateRender: false }, t0 + (i - 1) * (dur / steps));
            prev = next;
          }
          tl.set("#cam-shake", { x: 0, y: 0 }, t0 + dur);
        }
        shake(7.23, 14, 0.42);
        shake(8.86, 9, 0.24);

        // ---- Black gradient behind captions ----
        tl.fromTo("#scrim-fill", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: true }, 0.7);

        tl.seek(0);
        window.__timelines["main"] = tl;
      })();
