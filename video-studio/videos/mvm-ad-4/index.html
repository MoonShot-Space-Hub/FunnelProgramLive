        // Impact shakes — baked, deterministic decaying wobble on the outermost wrapper.
        function shake(t0, amp, dur) {
          var steps = Math.round(dur * 30), prev = { x: 0, y: 0 };
          tl.set("#cam-shake", { x: 0, y: 0 }, t0);
          for (var i = 1; i <= steps; i++) {
            var u = i / steps, k = Math.exp(-3.2 * u) * (1 - u);
            var next = { x: amp * k * Math.sin(i * 2.1), y: amp * k * Math.cos(i * 1.7) };
            tl.fromTo("#cam-shake", { x: prev.x, y: prev.y }, { x: next.x, y: next.y, duration: dur / steps, ease: "none", immediateRender: false }, t0 + (i - 1) * (dur / steps));
            prev = next;
          }
          tl.set("#cam-shake", { x: 0, y: 0 }, t0 + dur);
        }
        shake(18.16, 12, 0.36);
