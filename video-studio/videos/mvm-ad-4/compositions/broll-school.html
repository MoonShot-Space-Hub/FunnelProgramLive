      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          // Camera settle + slow grid drift.
          tl.fromTo("#bsch-world", { scale: 1.14 }, { scale: 1, duration: 0.42, ease: "power3.out", immediateRender: true }, 0);
          tl.fromTo("#bsch-grid", { scale: 1.08, y: 0 }, { scale: 1, y: -60, duration: 2.61, ease: "none", immediateRender: true }, 0);

          // Report card arrives; header, rows and progress strip stagger in.
          tl.fromTo("#bsch-card", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", immediateRender: true }, 0);
          tl.fromTo("#bsch-title", { x: -36, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: true }, 0.1);
          tl.fromTo("#bsch-ai", { x: 36, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: true }, 0.16);
          ["#bsch-r1", "#bsch-r2", "#bsch-r3"].forEach(function (id, i) {
            tl.fromTo(id, { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: true }, 0.2 + i * 0.07);
          });
          tl.fromTo("#bsch-prog", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: true }, 0.41);

          // "AI" (0.66): the assistant badge powers on - dim face out, pill lights, ink face in.
          tl.fromTo("#bsch-ai-off", { opacity: 1 }, { opacity: 0, duration: 0.04, ease: "none", immediateRender: true }, 0.66);
          tl.fromTo("#bsch-ai-lit", { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power1.out", immediateRender: true }, 0.7);
          tl.fromTo("#bsch-ai-on", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out", immediateRender: true }, 0.77);
          tl.fromTo("#bsch-ai-glow", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: true }, 0.7);
          tl.fromTo("#bsch-ai", { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out", immediateRender: false }, 0.7);
          tl.fromTo("#bsch-ai", { scale: 1.1 }, { scale: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, 0.8);
          tl.fromTo("#bsch-ai-ring", { opacity: 0, scale: 1 }, { opacity: 0.9, scale: 1.04, duration: 0.04, ease: "none", immediateRender: true }, 0.7);
          tl.fromTo("#bsch-ai-ring", { opacity: 0.9, scale: 1.04 }, { opacity: 0, scale: 1.4, duration: 0.46, ease: "power2.out", immediateRender: false }, 0.76);

          // "early" -> "do better in school": grades climb row by row and land on A / A+.
          var STEP = 0.26;
          var rows = [
            { n: 1, t0: 1.04, bars: [0.24, 0.5, 0.76, 0.96] },
            { n: 2, t0: 1.22, bars: [0.28, 0.52, 0.7, 0.9] },
            { n: 3, t0: 1.4, bars: [0.2, 0.48, 0.76, 0.98] },
          ];
          rows.forEach(function (r) {
            var L = function (k) { return "#bsch-l" + r.n + "-" + k; };
            for (var k = 0; k < 3; k++) {
              var at = r.t0 + k * STEP;
              var landing = k === 2;
              // Bar rises one notch.
              tl.fromTo("#bsch-f" + r.n, { scaleX: r.bars[k] }, { scaleX: r.bars[k + 1], duration: 0.24, ease: "power3.out", immediateRender: false }, at);
              // Current letter rolls up and out (first tween on letter 0, re-owning for letters 1-2).
              tl.fromTo(L(k), { y: 0, opacity: 1 }, { y: -40, opacity: 0, duration: landing ? 0.12 : 0.16, ease: "power2.in", immediateRender: k === 0 }, at);
              // Next letter rolls up and in; the final grade waits for the box to light up.
              var inAt = landing ? at + 0.2 : at + 0.06;
              tl.fromTo(L(k + 1), { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power3.out", immediateRender: true }, inAt);
            }
            var lit = r.t0 + 2 * STEP + 0.12;
            tl.fromTo("#bsch-gf" + r.n, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out", immediateRender: true }, lit);
            tl.fromTo("#bsch-g" + r.n,

              { borderColor: "#ffc93c", boxShadow: "0 0 46px rgba(255, 201, 60, 0.55)", duration: 0.12, ease: "power2.out", immediateRender: true }, lit);
            tl.fromTo("#bsch-g" + r.n, { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out", immediateRender: false }, lit + 0.06);
            tl.fromTo("#bsch-g" + r.n, { scale: 1.1 }, { scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false }, lit + 0.16);
          });

          // Overall progress rises with the grades, then clears for the label.
          tl.fromTo("#bsch-pf", { scaleX: 0.22 }, { scaleX: 0.94, duration: 0.9, ease: "power1.inOut", immediateRender: false }, 1.04);
          tl.fromTo("#bsch-prog", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.out", immediateRender: false }, 1.94);

          // "do better in school" (2.10): the label lands.
          tl.fromTo("#bsch-banner", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out", immediateRender: true }, 2.04);
          tl.fromTo("#bsch-banner", { y: 60 }, { y: 0, duration: 0.34, ease: "power3.out", immediateRender: false }, 2.04);
          tl.fromTo("#bsch-arrow", { x: -16, y: 16 }, { x: 0, y: 0, duration: 0.36, ease: "power3.out", immediateRender: true }, 2.1);
