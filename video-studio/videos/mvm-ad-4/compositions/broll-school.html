      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var STEP = 112; // one grade letter cell height

          // Camera settle + slow grid drift.
          tl.fromTo("#bsch-world", { scale: 1.14 }, { scale: 1, duration: 0.42, ease: "power3.out", immediateRender: true }, 0);
          tl.fromTo("#bsch-grid", { scale: 1.08, y: 0 }, { scale: 1, y: -60, duration: 2.61, ease: "none", immediateRender: true }, 0);

          // Report card arrives, header and rows stagger in.
          tl.fromTo("#bsch-card", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", immediateRender: true }, 0);
          tl.fromTo("#bsch-title", { x: -36, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: true }, 0.1);
          tl.fromTo("#bsch-ai", { x: 36, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: true }, 0.16);
          ["#bsch-r1", "#bsch-r2", "#bsch-r3"].forEach(function (id, i) {
            tl.fromTo(id, { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: true }, 0.2 + i * 0.07);
          });
          tl.fromTo("#bsch-prog", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: true }, 0.41);
          tl.fromTo("#bsch-pf", { scaleX: 0 }, { scaleX: 0.22, duration: 0.36, ease: "power3.out", immediateRender: true }, 0.47);
          // Starting (low) bar levels.
          tl.fromTo("#bsch-f1", { scaleX: 0 }, { scaleX: 0.24, duration: 0.36, ease: "power3.out", immediateRender: true }, 0.26);
          tl.fromTo("#bsch-f2", { scaleX: 0 }, { scaleX: 0.28, duration: 0.36, ease: "power3.out", immediateRender: true }, 0.33);
          tl.fromTo("#bsch-f3", { scaleX: 0 }, { scaleX: 0.2, duration: 0.36, ease: "power3.out", immediateRender: true }, 0.4);

          // "AI" (0.66): the assistant badge powers on.
          tl.fromTo("#bsch-ai",
            { backgroundColor: "#1d1912", borderColor: "#5d5850", color: "#b9b2a6" },
            { backgroundColor: "#ffc93c", borderColor: "#ffc93c", color: "#16110a", duration: 0.16, ease: "power2.out", immediateRender: false }, 0.66);
          tl.fromTo("#bsch-ai", { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out", immediateRender: false }, 0.66);
          tl.fromTo("#bsch-ai", { scale: 1.1 }, { scale: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, 0.76);
          tl.fromTo("#bsch-ai-glow", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: true }, 0.66);
          tl.fromTo("#bsch-ai-ring", { opacity: 0, scale: 1 }, { opacity: 0.9, scale: 1.04, duration: 0.04, ease: "none", immediateRender: true }, 0.66);
          tl.fromTo("#bsch-ai-ring", { opacity: 0.9, scale: 1.04 }, { opacity: 0, scale: 1.45, duration: 0.46, ease: "power2.out", immediateRender: false }, 0.72);

          // "early" -> "do better in school": grades climb row by row and land on A / A+.
          var rows = [
            { s: "#bsch-s1", f: "#bsch-f1", g: "#bsch-g1", t0: 1.04, bars: [0.24, 0.5, 0.76, 0.96] },
            { s: "#bsch-s2", f: "#bsch-f2", g: "#bsch-g2", t0: 1.22, bars: [0.28, 0.52, 0.7, 0.9] },
            { s: "#bsch-s3", f: "#bsch-f3", g: "#bsch-g3", t0: 1.4, bars: [0.2, 0.48, 0.76, 0.98] },
          ];
          rows.forEach(function (r) {
            for (var k = 0; k < 3; k++) {
              var at = r.t0 + k * 0.26;
              tl.fromTo(r.s, { y: -k * STEP }, { y: -(k + 1) * STEP, duration: 0.24, ease: "power3.out", immediateRender: k === 0 }, at);
              tl.fromTo(r.f, { scaleX: r.bars[k] }, { scaleX: r.bars[k + 1], duration: 0.24, ease: "power3.out", immediateRender: false }, at);
            }
            var land = r.t0 + 2 * 0.26 + 0.12;
            tl.fromTo(r.g,
              { backgroundColor: "#241c10", borderColor: "#4a4236", color: "#b9b2a6", boxShadow: "0 0 0px rgba(255, 201, 60, 0)" },
              { backgroundColor: "#ffc93c", borderColor: "#ffc93c", color: "#16110a", boxShadow: "0 0 46px rgba(255, 201, 60, 0.55)", duration: 0.16, ease: "power2.out", immediateRender: true }, land);
            tl.fromTo(r.g, { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out", immediateRender: false }, land);
            tl.fromTo(r.g, { scale: 1.1 }, { scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false }, land + 0.1);
          });

          // Overall progress rises with the grades, then hands off to the label.
          tl.fromTo("#bsch-pf", { scaleX: 0.22 }, { scaleX: 0.94, duration: 1.0, ease: "power1.inOut", immediateRender: false }, 1.04);
          tl.fromTo("#bsch-prog", { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.out", immediateRender: false }, 2.06);

          // "do better in school" (2.10): the label lands.
          tl.fromTo("#bsch-banner", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out", immediateRender: true }, 2.04);
          tl.fromTo("#bsch-arrow", { x: -16, y: 16 }, { x: 0, y: 0, duration: 0.36, ease: "power3.out", immediateRender: true }, 2.12);

          tl.seek(0);
          window.__timelines["broll-school"] = tl;
        })();
      </script>
