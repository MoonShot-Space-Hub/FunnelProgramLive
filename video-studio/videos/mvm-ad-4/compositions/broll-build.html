      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          // Camera settle, then a slow push that keeps the frame alive to the end.
          tl.fromTo("#bld-world", { scale: 1.14 }, { scale: 1, duration: 0.55, ease: "power3.out", immediateRender: true }, 0);
          tl.fromTo("#bld-world", { scale: 1 }, { scale: 1.03, duration: 2.0, ease: "sine.inOut", immediateRender: false }, 0.64);
          tl.fromTo("#bld-grid", { scale: 1.08, y: 0 }, { scale: 1, y: -60, duration: 2.64, ease: "none", immediateRender: true }, 0);

          // "They build" — headline word one, code card + phone arrive.

          tl.fromTo("#bld-w2", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: true }, 0.72);

          tl.fromTo("#bld-phone", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", immediateRender: true }, 0.04);

          // Each code line appears, lights up, and its UI block snaps into the phone.
          var steps = [
            { line: "#bld-l1", hl: "#bld-h1", blk: "#bld-hdr", snap: "#bld-s1", t: 0.1 },
            { line: "#bld-l2", hl: "#bld-h2", blk: "#bld-photo", snap: "#bld-s2", t: 0.3 },
            { line: "#bld-l3", hl: "#bld-h3", blk: "#bld-r1", snap: "#bld-s3", t: 0.5 },
            { line: "#bld-l4", hl: "#bld-h4", blk: "#bld-btn", snap: "#bld-s5", t: 0.74 },
          ];
          steps.forEach(function (s) {
            tl.fromTo(s.line, { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.16, ease: "power3.out", immediateRender: true }, s.t);
            tl.fromTo(s.hl, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out", immediateRender: true }, s.t + 0.06);
            tl.fromTo(s.hl, { opacity: 1 }, { opacity: 0.25, duration: 0.3, ease: "power2.out", immediateRender: false }, s.t + 0.26);
            tl.fromTo(s.blk, { x: -170, y: -10, scale: 0.86, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.24, ease: "power3.out", immediateRender: true }, s.t + 0.06);
            tl.fromTo(s.snap, { opacity: 0, scale: 1 }, { opacity: 1, duration: 0.03, ease: "none", immediateRender: true }, s.t + 0.2);
            tl.fromTo(s.snap, { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.08, duration: 0.24, ease: "power2.out", immediateRender: false }, s.t + 0.23);
          });
          // The second list row rides in with the first (one <List /> line, two rows).
          tl.fromTo("#bld-r2", { x: -170, y: -10, scale: 0.86, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.24, ease: "power3.out", immediateRender: true }, 0.64);
          tl.fromTo("#bld-s4", { opacity: 0, scale: 1 }, { opacity: 1, duration: 0.03, ease: "none", immediateRender: true }, 0.78);
          tl.fromTo("#bld-s4", { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.08, duration: 0.24, ease: "power2.out", immediateRender: false }, 0.81);

          // App finished: check badge + glow swell.
          tl.fromTo("#bld-check", { scale: 0, rotation: -70 }, { scale: 1, rotation: 0, duration: 0.3, ease: "power3.out", immediateRender: true }, 0.98);
          tl.fromTo("#bld-glow", { opacity: 0.55, scale: 1 }, { opacity: 1, scale: 1.06, duration: 0.3, ease: "power2.out", immediateRender: true }, 0.98);
          tl.fromTo("#bld-glow", { opacity: 1, scale: 1.06 }, { opacity: 0.7, scale: 1, duration: 0.6, ease: "sine.inOut", immediateRender: false }, 1.3);

          // Code card steps aside; finished app glides to centre stage.
          tl.fromTo("#bld-code", { x: 0, opacity: 1 }, { x: -160, opacity: 0, duration: 0.24, ease: "power2.in", immediateRender: false }, 1.02);
          tl.fromTo("#bld-phone", { x: 0 }, { x: -240, duration: 0.46, ease: "power3.inOut", immediateRender: false }, 1.08);

          // "other kids their age" — orbit ring opens and other builds pop out around the app.
          tl.fromTo("#bld-ring", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out", immediateRender: true }, 1.16);
          tl.fromTo("#bld-ellipse", { strokeDashoffset: 0 }, { strokeDashoffset: -240, duration: 1.48, ease: "none", immediateRender: true }, 1.16);

          var CX = 540, CY = 760, RX = 400, RY = 250, SIZE = 150, DRIFT = 8;
          var orbs = [
            { orb: "#bld-o1", tile: "#bld-t1", a0: 215, t: 1.22 },
            { orb: "#bld-o2", tile: "#bld-t2", a0: -35, t: 1.34 },
            { orb: "#bld-o3", tile: "#bld-t3", a0: 145, t: 1.46 },
            { orb: "#bld-o4", tile: "#bld-t4", a0: 35, t: 1.58 },
          ];
          function pos(deg) {
            var a = (deg * Math.PI) / 180;
            return { x: CX + RX * Math.cos(a) - SIZE / 2, y: CY + RY * Math.sin(a) - SIZE / 2 };
          }
          orbs.forEach(function (o) {
            // Slow drift along the ellipse: a plain x/y tween per tile (pure function of time,
            // no callbacks). Over 8 degrees the straight chord stays within ~1px of the arc.
            var p0 = pos(o.a0), p1 = pos(o.a0 + DRIFT);
            tl.fromTo(o.orb, { x: p0.x, y: p0.y }, { x: p1.x, y: p1.y, duration: 1.42, ease: "none", immediateRender: true }, 1.22);
            // Pop out from behind the finished app to its orbit slot.
            var a = (o.a0 * Math.PI) / 180;
            var dx = -RX * Math.cos(a) * 0.6;
            var dy = -RY * Math.sin(a) * 0.6;
            tl.fromTo(o.tile, { x: dx, y: dy, scale: 0.3, opacity: 0, rotation: -20 }, { x: 0, y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.36, ease: "power3.out", immediateRender: true }, o.t);
          });

          window.__timelines["broll-build"] = tl;
        })();
