  <!-- VHS overlay: scanlines, tracking bands, vignette -->
  <div id="c3-rewind-childhood-vhs" class="clip c3-rewind-childhood-layer" data-start="0" data-duration="2.1" data-track-index="2">

    <svg id="c3-rewind-childhood-band1" class="c3-rewind-childhood-band" viewBox="0 0 1080 60" aria-hidden="true"></svg>
    <svg id="c3-rewind-childhood-band2" class="c3-rewind-childhood-band" viewBox="0 0 1080 60" aria-hidden="true"></svg>

<script>
(function () {
  var DUR = 2.1;
  var ID = "c3-rewind-childhood";
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(name) { return document.getElementById(ID + "-" + name); }
  function svgEl(tag, attrs, parent) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function rng(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash(n) { var s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function seg(t, a, d) { return clamp01((t - a) / d); }
  var P2O = gsap.parseEase("power2.out");
  var P3O = gsap.parseEase("power3.out");
  var P2IO = gsap.parseEase("power2.inOut");
  var BACK2 = gsap.parseEase("back.out(2)");
  var TAU = Math.PI * 2;
  var R = rng(19980311);

  var tl = gsap.timeline({ paused: true });

  // ======================= BUILD: ground rings =======================
  var ringsRot = el("ringsrot");
  [[240, "4 10"], [360, "2 18"], [490, "26 14"], [640, "3 12"], [800, "40 22"]].forEach(function (r, i) {
    svgEl("circle", { cx: 800, cy: 700, r: r[0], fill: "none", stroke: "#FF5FB0", "stroke-width": i % 2 ? 2 : 3, "stroke-dasharray": r[1] }, ringsRot);
  });

  // ======================= BUILD: gold dust =======================
  var DUST = [];
  var dustHost = el("dusts");
  for (var di = 0; di < 30; di++) {
    var dx = 60 + R() * 960, dy = 130 + R() * 1500, ds = 4 + R() * 9;
    var dn = document.createElement("i");
    dn.className = ID + "-dust";
    dn.style.width = ds.toFixed(1) + "px";
    dn.style.height = ds.toFixed(1) + "px";
    dn.style.opacity = "0";
    dustHost.appendChild(dn);
    DUST.push({ n: dn, x: dx, y: dy, sp: 10 + R() * 26, ph: R() * TAU, fq: 2 + R() * 4, base: 0.25 + R() * 0.5, sway: 4 + R() * 10 });
  }

  // ======================= BUILD: dial ticks + ghost hands =======================
  var ticks = el("ticks");
  for (var k = 0; k < 72; k++) {
    var a = (k / 72) * TAU, long = k % 6 === 0;
    var r0 = long ? 340 : 360, r1 = 380;
    svgEl("line", {
      x1: (410 + r0 * Math.sin(a)).toFixed(1), y1: (410 - r0 * Math.cos(a)).toFixed(1),
      x2: (410 + r1 * Math.sin(a)).toFixed(1), y2: (410 - r1 * Math.cos(a)).toFixed(1),
      stroke: long ? "#FFE1A0" : "#FF5FB0", "stroke-opacity": long ? 0.55 : 0.35, "stroke-width": long ? 4 : 2, "stroke-linecap": "round"
    }, ticks);
  }
  var GHOSTS = [];
  var ghostHost = el("ghosts");
  for (var g = 0; g < 6; g++) {
    GHOSTS.push(svgEl("line", { x1: 410, y1: 410, x2: 410, y2: 70, stroke: "#FFE1A0", "stroke-width": 4, "stroke-linecap": "round", opacity: 0 }, ghostHost));
  }

  // ======================= BUILD: year ticker stacks =======================
  // Reverse-order stack (1998 on top ... 2026 at the bottom) so the strip rolls DOWN as the years rewind.
  var YEARS = 28, ITEM_H = 212;
  ["st", "stm", "stc"].forEach(function (sid) {
    var host = el(sid);
    for (var y = 1998; y <= 2026; y++) {
      var it = document.createElement("div");
      it.className = ID + "-item";
      it.textContent = String(y);
      host.appendChild(it);
    }
  });
  var stMain = el("st"), stM = el("stm"), stC = el("stc");
  var tkM = el("tkm"), tkC = el("tkc");
  // vertical-spring-ticker: three additive back.out springs (12 + 12 + 4 years), the last a casino land.
  var SPRINGS = [
    { at: 0.04, dur: 0.40, k: 12, e: gsap.parseEase("back.out(1.4)") },
    { at: 0.28, dur: 0.40, k: 12, e: gsap.parseEase("back.out(1.5)") },
    { at: 0.50, dur: 0.38, k: 4, e: gsap.parseEase("back.out(2.3)") }
  ];
  function springSum(t) {
    var s = 0;
    for (var i = 0; i < SPRINGS.length; i++) {
      var sp = SPRINGS[i];
      s += sp.k * sp.e(seg(t, sp.at, sp.dur));
    }
    return s;
  }
  var vblurNode = el("vblur-node");

  // ======================= BUILD: speech bubbles =======================
  function bubblePath(w, h, r, tb, tx, ty) {
    // rounded rect (0,0)-(w,h) with a tail leaving the bottom edge at tb..tb+34 toward (tx,ty)
    return "M " + r + " 0 L " + (w - r) + " 0 Q " + w + " 0 " + w + " " + r + " L " + w + " " + (h - r) +
      " Q " + w + " " + h + " " + (w - r) + " " + h + " L " + (tb + 34) + " " + h + " Q " + (tb + 26) + " " + (h + 14) + " " + tx + " " + ty +
      " Q " + (tb + 6) + " " + (h + 12) + " " + tb + " " + h + " L " + r + " " + h + " Q 0 " + h + " 0 " + (h - r) + " L 0 " + r + " Q 0 0 " + r + " 0 Z";
  }
  var BUB = [
    { id: "b1", cx: 480, cy: 462, w: 232, h: 116, tb: 148, tx: 214, ty: 172, at: 1.08, rot: -9 },
    { id: "b2", cx: 884, cy: 420, w: 232, h: 116, tb: 84, tx: 110, ty: 176, at: 1.18, rot: 8 },
    { id: "b3", cx: 668, cy: 300, w: 252, h: 124, tb: 122, tx: 176, ty: 184, at: 1.28, rot: -6 }
  ];
  var DOTS = [];
  BUB.forEach(function (b, bi) {
    var host = el(b.id);
    var left = b.cx - b.w / 2, top = b.cy - b.h / 2;
    host.style.left = left + "px";
    host.style.top = top + "px";
    host.style.width = b.w + "px";
    host.style.height = b.h + "px";
    host.style.transformOrigin = b.tx + "px " + b.ty + "px";
    var gid = ID + "-bg" + bi;
    var svg = '<svg width="' + b.w + '" height="' + b.h + '" viewBox="0 0 ' + b.w + " " + b.h + '" aria-hidden="true">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0.55" y2="1"><stop offset="0" stop-color="#2E1240" stop-opacity="0.97"/><stop offset="1" stop-color="#1E0D2B" stop-opacity="0.97"/></linearGradient></defs>' +
      '<path d="' + bubblePath(b.w, b.h, 40, b.tb, b.tx, b.ty) + '" fill="url(#' + gid + ')" stroke="#FF5FB0" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round"/>' +
      '<path d="M 40 4 L ' + (b.w - 40) + ' 4" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round"/>' +
      '<g class="' + ID + '-dots"></g></svg>';
    host.innerHTML = svg;
    var dg = host.querySelector("." + ID + "-dots");
    for (var j = 0; j < 3; j++) {
      var c = svgEl("circle", { cx: (b.w / 2 + (j - 1) * 46).toFixed(1), cy: (b.h / 2).toFixed(1), r: 11, fill: "#FFF5EA" }, dg);
      DOTS.push({ n: c, b: bi, j: j, at: b.at, cy: b.h / 2 });
    }
  });

  // ======================= BUILD: VHS tracking bands =======================
  var BANDS = [];
  for (var bnd = 0; bnd < 3; bnd++) {
    var bs = el("band" + bnd);
    svgEl("rect", { x: 0, y: 0, width: 1080, height: 2, fill: "#FFF5EA", "fill-opacity": 0.55 }, bs);
    for (var q = 0; q < 34; q++) {
      var w = 18 + R() * 150, h = 2 + R() * 5;
      svgEl("rect", { x: (R() * 1080).toFixed(1), y: (4 + R() * 46).toFixed(1), width: w.toFixed(1), height: h.toFixed(1), fill: q % 5 === 0 ? "#FF5FB0" : "#FFF5EA", "fill-opacity": (0.15 + R() * 0.45).toFixed(2) }, bs);
    }
    BANDS.push({ n: bs, y0: 200 + bnd * 690, sp: 900 + bnd * 260, sc: 0.8 + bnd * 0.5 });
  }

  // ======================= MASTER CLOCK (pure function of t) =======================
  var dial = el("dial"), dialHand = el("hand"), jit = el("jit"), fg = el("fg"), rewIn = el("rewin");
  var scan = el("scan"), wg = [el("wg1"), el("wg2"), el("wg3")], kid = el("kid"), ringsR = el("ringsrot");
  var SCENE2 = 0.9;

  function render(t) {
    // ---- ground ambience
    ringsR.setAttribute("transform", "rotate(" + (-4 - 9 * t).toFixed(3) + " 800 700)");
    for (var i = 0; i < DUST.length; i++) {
      var d = DUST[i];
      var tw = 0.55 + 0.45 * Math.sin(d.ph + t * d.fq);
      d.n.style.opacity = (d.base * tw * P2O(seg(t, 0, 0.5))).toFixed(3);
      d.n.style.transform = "translate(" + (d.x + d.sway * Math.sin(d.ph + t * 1.3)).toFixed(1) + "px," + (d.y - d.sp * t).toFixed(1) + "px)";
    }

    // ---- year ticker: additive springs -> translateY, velocity -> vertical blur
    var S = springSum(t);
    var v = (S - springSum(t - 0.02)) / 0.02; // years per second (analytic, seek-safe)
    var ty = -(YEARS - S) * ITEM_H;
    stMain.style.transform = "translateY(" + ty.toFixed(2) + "px)";
    stM.style.transform = "translateY(" + ty.toFixed(2) + "px)";
    stC.style.transform = "translateY(" + ty.toFixed(2) + "px)";
    var sig = Math.min(18, Math.abs(v) * ITEM_H * 0.0016);
    vblurNode.setAttribute("stdDeviation", "0 " + sig.toFixed(2));

    // ---- RGB split + tape jitter (frame-hashed, decays as the rewind lands)
    var f = Math.floor(t * 25 + 0.001);
    var env = 1 - P2O(seg(t, 0.78, 0.22));
    var spl = env * (4 + 7 * hash(f)) + Math.min(10, Math.abs(v) * 0.08) * env;
    tkM.style.transform = "translate(" + (-spl).toFixed(2) + "px," + (env * (hash(f + 7) - 0.5) * 4).toFixed(2) + "px)";
    tkC.style.transform = "translate(" + spl.toFixed(2) + "px," + (env * (hash(f + 3) - 0.5) * 4).toFixed(2) + "px)";
    tkM.style.opacity = (0.75 * env).toFixed(3);
    tkC.style.opacity = (0.7 * env).toFixed(3);
    var jenv = 1 - P2O(seg(t, 0.8, 0.35));
    var jx = jenv * (hash(f + 19) - 0.5) * 7 + (hash(f + 41) > 0.86 ? jenv * 9 : 0);
    jit.style.transform = "translateX(" + jx.toFixed(2) + "px)";
    fg.style.transform = "translateX(" + (jx * 0.6).toFixed(2) + "px)";

    // ---- dial spins backward, coupled to the counter (30 deg per year), with ghost trail
    var ang = -S * 30;
    dialHand.setAttribute("transform", "rotate(" + ang.toFixed(2) + " 410 410)");
    ticks.setAttribute("transform", "rotate(" + (-S * 6).toFixed(2) + " 410 410)");
    var spread = Math.min(16, Math.abs(v) * 0.5);
    for (var gi = 0; gi < GHOSTS.length; gi++) {
      GHOSTS[gi].setAttribute("transform", "rotate(" + (ang + spread * (gi + 1)).toFixed(2) + " 410 410)");
      GHOSTS[gi].setAttribute("opacity", (spread > 0.6 ? (0.42 / (gi + 1)) * Math.min(1, spread / 6) : 0).toFixed(3));
    }

    // ---- REWIND blink (VCR OSD: 6 frames on, 3 off) while rewinding
    if (t < SCENE2) rewIn.style.opacity = (f % 9) < 6 ? "1" : "0.18";
    else rewIn.style.opacity = "1";

    // ---- VHS tracking bands roll down; strong in Scene 1, a faint memory haze after
    var benv = 0.15 + 0.85 * (1 - P2O(seg(t, 0.82, 0.4)));
    for (var b = 0; b < BANDS.length; b++) {
      var B = BANDS[b];
      var by = ((B.y0 + B.sp * t) % 2100) - 120;
      B.n.style.transform = "translate(" + ((hash(f + b * 13) - 0.5) * 30 * benv).toFixed(1) + "px," + by.toFixed(1) + "px) scaleY(" + B.sc.toFixed(2) + ")";
      B.n.style.opacity = (benv * (0.55 + 0.35 * hash(f * 3 + b))).toFixed(3);
    }
    scan.style.opacity = (0.12 + 0.12 * benv).toFixed(3);

    // ---- bubble dots: a travelling "typing" wave
    for (var di2 = 0; di2 < DOTS.length; di2++) {
      var D = DOTS[di2];
      var on = seg(t, D.at + 0.18, 0.2);
      var w = Math.sin(TAU * 2.4 * (t - D.at) - D.j * 1.1);
      var lift = on * Math.max(0, w) * 9;
      D.n.setAttribute("cy", (D.cy - lift).toFixed(2));
      D.n.setAttribute("opacity", (on > 0 ? 0.45 + 0.55 * on * (0.55 + 0.45 * Math.max(0, w)) : 0.45).toFixed(3));
    }

    // ---- child grows on "growing"@1.40 and "up"@1.72 (scale steps with overshoot)
    var ks = 1 + 0.09 * BACK2(seg(t, 1.40, 0.3)) + 0.09 * BACK2(seg(t, 1.72, 0.3));
    kid.setAttribute("transform", "scale(" + ks.toFixed(4) + ")");

    // ---- house light breathes from "growing"@1.40 (sine-wave-loop, phase 0 at start)
    var ph = Math.max(0, t - 1.40) * (TAU / 1.4);
    var breathe = t > 1.40 ? Math.sin(ph) : 0;
    for (var w2 = 0; w2 < wg.length; w2++) {
      var s2 = 1 + 0.07 * Math.sin(ph + w2 * 0.9) * (t > 1.40 ? 1 : 0);
      wg[w2].setAttribute("transform", "translate(" + wg[w2].getAttribute("cx") + " " + wg[w2].getAttribute("cy") + ") scale(" + s2.toFixed(4) + ") translate(" + (-wg[w2].getAttribute("cx")) + " " + (-wg[w2].getAttribute("cy")) + ")");
    }
    el("warm").style.transform = "scale(" + (1 + 0.025 * breathe).toFixed(4) + ")";
  }
  render(0);
  var clock = { t: 0 };
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(clock.t); } }, 0);

  // ======================= CAMERA + PARALLAX =======================
  tl.fromTo(el("cam"), { scale: 1 }, { scale: 1.015, duration: SCENE2, ease: "power1.inOut" }, 0);
  tl.fromTo(el("cam"), { scale: 1.015 }, { scale: 1.075, duration: DUR - SCENE2, ease: "power1.in", immediateRender: false }, SCENE2);
  tl.fromTo(el("blob"), { x: -40, y: -10 }, { x: 70, y: 60, duration: DUR, ease: "sine.inOut" }, 0);
  tl.fromTo(el("goldglow"), { scale: 0.9 }, { scale: 1.12, duration: DUR, ease: "sine.inOut" }, 0);

  // ======================= SCENE 1 (0.0-0.9): rewind =======================
  // counter + viewfinder settle in from frame 0 (hero visible immediately)
  tl.fromTo(el("tickwrap"), { scale: 1.12, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
  tl.fromTo(el("dial"), { scale: 0.86, opacity: 0, rotation: 24 }, { scale: 1, opacity: 0.9, rotation: 0, duration: 0.6, ease: "expo.out" }, 0);
  var CORN = [
    { id: "cTL", ix: -36, iy: -30, fx: -148, fy: -104 },

  CORN.forEach(function (c, i) {
    tl.fromTo(el(c.id), { x: c.ix, y: c.iy, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.42, ease: "back.out(1.7)" }, 0.02 + i * 0.03);

  // landing: digits warm to gold + light sweep right after the casino land
  tl.fromTo(el("tkmain"), { color: "#FFF5EA", textShadow: "0 0 34px rgba(255,245,234,0.28)" }, { color: "#FFC24A", textShadow: "0 0 40px rgba(255,194,74,0.55)", duration: 0.22, ease: "power1.out" }, 0.72);
  tl.fromTo(el("tksheen"), { x: -180 }, { x: 600, duration: 0.36, ease: "power1.inOut" }, 0.74);

  // ======================= SCENE 2 (0.9-2.1): counter -> chip, childhood draws in =======================

  tl.fromTo(el("tickwrap"), { x: 0, y: 0, scale: 1 }, { x: 328, y: -350, scale: 0.25, duration: 0.3, ease: "power3.inOut", immediateRender: false }, SCENE2);
  tl.fromTo(el("tickwrap"), { filter: "blur(0px)" }, { filter: "blur(5px)", duration: 0.15, ease: "power2.in" }, SCENE2);
  tl.fromTo(el("tickwrap"), { filter: "blur(5px)" }, { filter: "blur(0px)", duration: 0.15, ease: "power2.out", immediateRender: false }, SCENE2 + 0.15);
  tl.fromTo(el("chip"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, SCENE2 + 0.2);
  tl.fromTo(el("chipsheen"), { x: -90 }, { x: 260, duration: 0.4, ease: "power1.inOut" }, SCENE2 + 0.42);
  // OSD: REWIND zoom-through swaps to PLAY
  tl.fromTo(el("rew"), { scale: 1, filter: "blur(0px)" }, { scale: 1.2, filter: "blur(10px)", duration: 0.12, ease: "power3.in", immediateRender: false }, SCENE2);

  tl.set(el("rew"), { opacity: 0 }, SCENE2 + 0.12);
  tl.fromTo(el("play"), { scale: 0.75, opacity: 0, filter: "blur(10px)" }, { scale: 0.75, opacity: 0, filter: "blur(10px)", duration: 0.01 }, 0);
  tl.fromTo(el("play"), { scale: 0.75, opacity: 0.15, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out", immediateRender: false }, SCENE2 + 0.12);

  CORN.forEach(function (c, i) {

  tl.fromTo(el("dial"), { opacity: 0.9, scale: 1 }, { opacity: 0.2, scale: 1.3, duration: 0.6, ease: "power2.out", immediateRender: false }, SCENE2);
  // warm light floods in
  tl.fromTo(el("warm"), { opacity: 0 }, { opacity: 0.42, duration: 0.6, ease: "power2.out" }, SCENE2 + 0.05);
  tl.fromTo(el("goldglow"), { opacity: 0.16 }, { opacity: 0.3, duration: 0.6, ease: "power2.out" }, SCENE2 + 0.05);

  // svg-path-draw: horizon, house, adults, child (stagger ~75%), then fills
  function prepDraw(node, pad) {
    var L = node.getTotalLength() * (pad || 1.04);

  var DRAWS = [

  // windows light up (flash, then hold) — light sweep on landing
  tl.fromTo(el("wins"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, 1.22);
  tl.fromTo(el("wglows"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.22);
  tl.fromTo(el("wglows"), { opacity: 1 }, { opacity: 0.78, duration: 0.3, ease: "power2.out", immediateRender: false }, 1.42);
  tl.fromTo(el("doorspill"), { opacity: 0.4, scaleX: 0.4, transformOrigin: "50% 0%" }, { opacity: 1, scaleX: 1, transformOrigin: "50% 0%", duration: 0.5, ease: "power3.out" }, 1.26);

  // speech bubbles pop from the grown-ups on "heard"@1.08 (spring-pop, origin at the tail)
  BUB.forEach(function (b) {
    tl.fromTo(el(b.id), { scale: 0, opacity: 0, rotation: b.rot }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, b.at);
  });
  // gentle float on the bubbles after they land (finite, sine)
  BUB.forEach(function (b, i) {
    tl.fromTo(el(b.id), { y: 0 }, { y: -6 - i * 2, duration: 0.6 + i * 0.08, ease: "sine.inOut", immediateRender: false }, b.at + 0.5);
  });

  window.__timelines = window.__timelines || {};
  window.__timelines["c3-rewind-childhood"] = tl;
})();
