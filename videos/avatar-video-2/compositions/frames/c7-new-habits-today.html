<script>
(function () {
  var P = "c7-new-habits-today-";
  var DUR = 4.58;
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(n) { return document.getElementById(P + n); }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function prand(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }

  // ONE onset grid: the voiceover word cues (local seconds)
  var CUE = { you: 0.16, can: 0.32, change: 0.56, habits: 0.96, theyve: 1.44, created: 1.84, and: 2.40, thats: 2.64, something: 2.96, you2: 3.36, can2: 3.60, begin: 3.76, today: 4.16 };

  var tl = gsap.timeline({ paused: true });

  // =================== GROUND (built once, deterministic) ===================
  var dustWrap = el("dust");
  var dust = [];
  for (var i = 0; i < 30; i++) {
    var d = document.createElement("div");
    d.className = "c7-dot";
    var sz = 3 + prand(i * 3 + 1) * 6;
    d.style.width = sz.toFixed(1) + "px";
    d.style.height = sz.toFixed(1) + "px";
    dustWrap.appendChild(d);
    dust.push({
      el: d,
      x: 40 + prand(i * 5 + 2) * 1000,
      y: 120 + prand(i * 7 + 3) * 1700,
      sp: 16 + prand(i * 11 + 4) * 42,
      sway: 6 + prand(i * 13 + 5) * 16,
      ph: prand(i * 17 + 6) * Math.PI * 2,
      fr: 1.4 + prand(i * 19 + 7) * 2.6,
      base: 0.35 + prand(i * 23 + 8) * 0.5
    });
  }

  // =================== LOOP GEOMETRY (measured) ===================
  var R = 230, CX = 300, CY = 300;
  function pt(a) { var r = a * Math.PI / 180; return [CX + R * Math.cos(r), CY + R * Math.sin(r)]; }
  var A0 = 295, A1 = 245 + 360; // clockwise arc, gap at the top node
  var s0 = pt(A0), s1 = pt(A1);
  var arc = el("arc");
  arc.setAttribute("d", "M " + s0[0].toFixed(2) + " " + s0[1].toFixed(2) + " A " + R + " " + R + " 0 1 1 " + s1[0].toFixed(2) + " " + s1[1].toFixed(2));
  var ARC_LEN = arc.getTotalLength();
  arc.style.strokeDasharray = ARC_LEN + " " + ARC_LEN;
  arc.style.strokeDashoffset = "0";
  (function () {
    var r = A1 * Math.PI / 180;
    var dx = -Math.sin(r), dy = Math.cos(r);   // clockwise tangent
    var nx = -dy, ny = dx;
    var tip = [s1[0] + dx * 46, s1[1] + dy * 46];
    var b1 = [s1[0] + nx * 36 - dx * 6, s1[1] + ny * 36 - dy * 6];
    var b2 = [s1[0] - nx * 36 - dx * 6, s1[1] - ny * 36 - dy * 6];
    el("arrowhead").setAttribute("points", [tip, b1, b2].map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "));
  })();
  var INF = el("inf");
  var INF_LEN = INF.getTotalLength();
  INF.style.strokeDasharray = (INF_LEN * 0.32).toFixed(1) + " " + (INF_LEN * 0.18).toFixed(1);

  // =================== STAIRCASE GEOMETRY ===================
  var STEP_W = 108, STEP_GAP = 15, H0 = 100, HSTEP = 80, BASE = 440;
  var stepsG = el("steps");
  var stepBase = [], stepLit = [], stepCap = [], stepLab = [];
  var tops = [];
  for (var s = 0; s < 5; s++) {
    var x = s * (STEP_W + STEP_GAP);
    var h = H0 + HSTEP * s;
    var top = BASE - h;
    tops.push({ x: x, top: top });
    var g = document.createElementNS(SVGNS, "g");
    g.setAttribute("id", P + "step" + s);
    var rb = document.createElementNS(SVGNS, "rect");
    rb.setAttribute("x", x); rb.setAttribute("y", top); rb.setAttribute("width", STEP_W); rb.setAttribute("height", h);
    rb.setAttribute("rx", 12); rb.setAttribute("fill", "rgba(255,194,74,0.14)");
    rb.setAttribute("stroke", "rgba(255,194,74,0.55)"); rb.setAttribute("stroke-width", "3");
    var rl = document.createElementNS(SVGNS, "rect");
    rl.setAttribute("x", x); rl.setAttribute("y", top); rl.setAttribute("width", STEP_W); rl.setAttribute("height", h);
    rl.setAttribute("rx", 12); rl.setAttribute("fill", "url(#" + P + "goldgrad)"); rl.setAttribute("opacity", "0");
    var cap = document.createElementNS(SVGNS, "rect");
    cap.setAttribute("x", x + 10); cap.setAttribute("y", top + 7); cap.setAttribute("width", STEP_W - 20); cap.setAttribute("height", 6);
    cap.setAttribute("rx", 3); cap.setAttribute("fill", "#FFF5EA"); cap.setAttribute("opacity", "0");
    var lab = document.createElementNS(SVGNS, "text");
    lab.setAttribute("x", x + STEP_W / 2); lab.setAttribute("y", BASE - 22); lab.setAttribute("text-anchor", "middle");
    lab.setAttribute("class", "c7-steplabel"); lab.setAttribute("opacity", "0");
    lab.textContent = "0" + (s + 1);
    g.appendChild(rb); g.appendChild(rl); g.appendChild(cap); g.appendChild(lab);
    stepsG.appendChild(g);
    stepBase.push(g); stepLit.push(rl); stepCap.push(cap); stepLab.push(lab);
  }
  // silhouette outline (the old ring's segment re-forming as stairs)
  var od = "M 0 " + BASE;
  tops.forEach(function (t) { od += " V " + t.top + " H " + (t.x + STEP_W); });
  od += " V " + BASE;
  var outline = el("outline");
  outline.setAttribute("d", od);
  var OUT_LEN = outline.getTotalLength();
  outline.style.strokeDasharray = OUT_LEN + " " + OUT_LEN;
  outline.style.strokeDashoffset = String(OUT_LEN);
  // climbing arrow: rounded stepped path above the step tops
  var pts = [[14, tops[0].top - 34]];
  for (var k = 1; k < 5; k++) {
    pts.push([tops[k].x - 4, tops[k - 1].top - 34]);
    pts.push([tops[k].x - 4, tops[k].top - 34]);
  }
  pts.push([tops[4].x + 70, tops[4].top - 34]);
  pts.push([600, -74]);
  function rounded(P2, r) {
    var dd = "M " + P2[0][0] + " " + P2[0][1];
    for (var q = 1; q < P2.length - 1; q++) {
      var a = P2[q - 1], b = P2[q], c = P2[q + 1];
      var l1 = Math.hypot(b[0] - a[0], b[1] - a[1]), l2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
      var rr = Math.min(r, l1 / 2, l2 / 2);
      var p1 = [b[0] - (b[0] - a[0]) / l1 * rr, b[1] - (b[1] - a[1]) / l1 * rr];
      var p2 = [b[0] + (c[0] - b[0]) / l2 * rr, b[1] + (c[1] - b[1]) / l2 * rr];
      dd += " L " + p1[0].toFixed(1) + " " + p1[1].toFixed(1) + " Q " + b[0] + " " + b[1] + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
    }
    var z = P2[P2.length - 1];
    return dd + " L " + z[0] + " " + z[1];
  }
  var climb = el("climb");
  climb.setAttribute("d", rounded(pts, 16));
  var CLIMB_LEN = climb.getTotalLength();
  climb.style.strokeDasharray = CLIMB_LEN + " " + CLIMB_LEN;
  climb.style.strokeDashoffset = String(CLIMB_LEN);
  var climbHead = el("climbhead");
  // arc-length at which the tip arrives over each step (sampled once at setup)
  var stepAt = [];
  (function () {
    var N = 240, si = 0;
    for (var n = 0; n <= N && si < 5; n++) {
      var L = CLIMB_LEN * n / N;
      var p = climb.getPointAtLength(L);
      while (si < 5 && p.x >= tops[si].x + 6 && p.y <= tops[si].top - 20) { stepAt.push(L); si++; }
    }
    while (stepAt.length < 5) stepAt.push(CLIMB_LEN);
  })();

  // check mark draw
  var check = el("checkpath");
  var CHECK_LEN = check.getTotalLength();
  check.style.strokeDasharray = CHECK_LEN + " " + CHECK_LEN;
  check.style.strokeDashoffset = String(CHECK_LEN);

  // =================== PARTICLE POOLS (index-seeded) ===================
  function makePool(field, n, seed, cfg) {
    var parts = [];
    for (var j = 0; j < n; j++) {
      var e = document.createElement("div");
      e.className = "c7-part";
      var size = cfg.smin + prand(seed + j * 3 + 1) * (cfg.smax - cfg.smin);
      var chip = cfg.chips && j % 3 === 0;
      e.style.width = size.toFixed(1) + "px";
      e.style.height = (chip ? size * 0.55 : size).toFixed(1) + "px";
      e.style.borderRadius = chip ? "2px" : "50%";
      var col = cfg.colors[j % cfg.colors.length];
      e.style.background = col;
      e.style.boxShadow = "0 0 " + (size * 1.2).toFixed(0) + "px " + col;
      e.style.marginLeft = (-size / 2).toFixed(1) + "px";
      e.style.marginTop = (-size / 2).toFixed(1) + "px";
      field.appendChild(e);
      var ang = cfg.radial ? prand(seed + j * 5 + 2) * Math.PI * 2 : -Math.PI / 2 + (prand(seed + j * 5 + 2) * 2 - 1) * cfg.cone;
      var spd = cfg.vmin + prand(seed + j * 7 + 3) * (cfg.vmax - cfg.vmin);
      var ox = 0, oy = 0;
      if (cfg.ring) { ox = Math.cos(ang) * cfg.ring; oy = Math.sin(ang) * cfg.ring; }
      parts.push({ el: e, ox: ox, oy: oy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, spin: (prand(seed + j * 11 + 4) * 2 - 1) * 540 });
    }
    return parts;
  }
  function burst(parts, at, flight, G, fadeFrac) {
    var drive = { T: 0 };
    tl.fromTo(drive, { T: 0 }, {
      T: 1, duration: flight, ease: "none", immediateRender: false,
      onUpdate: function () {
        var t = drive.T * flight;
        var fade = Math.min(1, (1 - drive.T) / fadeFrac);
        var pop = Math.min(1, drive.T / 0.06);
        for (var q = 0; q < parts.length; q++) {
          var p = parts[q];
          var x = p.ox + p.vx * t, y = p.oy + p.vy * t + 0.5 * G * t * t;
          p.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (p.spin * t).toFixed(0) + "deg)";
          p.el.style.opacity = drive.T === 0 || drive.T === 1 ? "0" : String(fade * pop);
        }
      }
    }, at);
  }
  var shards = makePool(el("shardfield"), 16, 400, { smin: 7, smax: 15, colors: ["#FF4D5E", "#E0218A", "#FF5FB0"], radial: true, ring: 230, vmin: 260, vmax: 560, chips: true });
  var sparks = makePool(el("sparkfield"), 16, 900, { smin: 5, smax: 10, colors: ["#FFE1A0", "#FFC24A", "#FFF5EA"], radial: true, vmin: 160, vmax: 420 });
  var stampBurst = makePool(el("burst"), 28, 1500, { smin: 6, smax: 15, colors: ["#FFC24A", "#FFE1A0", "#FFF5EA", "#FFC24A"], radial: true, ring: 70, vmin: 420, vmax: 980, chips: true });

  // =================== AMBIENT (one finite driver, pure function of t) ===================
  var blob = el("blob"), ringsSvg = el("rings"), loopSpin = el("loopspin"), rays = el("rays"), stairGlow = el("stairglow");
  var nodeIn = [el("n0r"), el("n1r"), el("n2r")];
  var amb = { t: 0 };
  function ambient(t) {
    var w = smooth(0, DUR, t); // warmth grows across the scene
    for (var q = 0; q < dust.length; q++) {
      var p = dust[q];
      var yy = p.y - p.sp * t * (1 + 0.6 * w);
      var xx = p.x + Math.sin(t * 0.9 + p.ph) * p.sway;
      var tw = 0.55 + 0.45 * Math.sin(p.fr * t + p.ph);
      p.el.style.transform = "translate(" + xx.toFixed(1) + "px," + yy.toFixed(1) + "px)";
      p.el.style.opacity = (p.base * tw * (0.55 + 0.75 * w)).toFixed(3);
    }
    blob.style.transform = "translate(" + (Math.sin(t * 0.5) * 60 + t * 18).toFixed(1) + "px," + (Math.cos(t * 0.4) * 40 + t * 10).toFixed(1) + "px) scale(" + (1 + 0.04 * Math.sin(t * 0.8)).toFixed(3) + ")";
    ringsSvg.style.transform = "rotate(" + (t * 5).toFixed(2) + "deg)";
    var ang = t * 52; // the old loop keeps cycling
    loopSpin.style.transform = "rotate(" + ang.toFixed(2) + "deg)";
    for (var n = 0; n < 3; n++) nodeIn[n].style.transform = "rotate(" + (-ang).toFixed(2) + "deg)";
    INF.style.strokeDashoffset = (-t * 160).toFixed(1);
    rays.style.transform = "rotate(" + (t * 7).toFixed(2) + "deg)";
    stairGlow.style.transform = "scale(" + (1 + 0.05 * Math.sin(t * 2.2)).toFixed(3) + ")";
  }
  ambient(0);
  tl.fromTo(amb, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { ambient(amb.t); } }, 0);

  // camera push 1.00 -> 1.045
  tl.fromTo(el("cam"), { scale: 1 }, { scale: 1.045, duration: DUR, ease: "sine.inOut" }, 0);

  // warmth: red stuck-tint drains on "change", gold light grows to the end
  tl.fromTo(el("redtint"), { opacity: 0.32 }, { opacity: 0, duration: 0.7, ease: "power2.out" }, CUE.change);
  tl.fromTo(el("goldglow"), { opacity: 0.1, scale: 0.8 }, { opacity: 0.28, scale: 1.25, duration: 1.4, ease: "power2.out" }, CUE.change);
  tl.to(el("goldglow"), { opacity: 0.55, scale: 2.4, y: 120, duration: 1.9, ease: "power2.inOut" }, 2.5);
  tl.fromTo(el("dawn"), { opacity: 0 }, { opacity: 0.1, duration: 1.6, ease: "sine.inOut" }, 0.9);
