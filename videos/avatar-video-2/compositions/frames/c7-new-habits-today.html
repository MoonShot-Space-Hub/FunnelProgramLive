<script>
(function () {
  var P = "c7-new-habits-today-";
  var DUR = 4.58;
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(n) { return document.getElementById(P + n); }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function prand(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  // ONE onset grid: the voiceover word cues (local seconds)
  var CUE = { you: 0.16, can: 0.32, change: 0.56, habits: 0.96, theyve: 1.44, created: 1.84, and: 2.40, thats: 2.64, something: 2.96, you2: 3.36, can2: 3.60, begin: 3.76, today: 4.16 };

  var tl = gsap.timeline({ paused: true });

  // =================== LOOP GEOMETRY (measured) ===================
  var R = 86, CX = 127, CY = 135;
  function pt(a) { var r = a * Math.PI / 180; return [CX + R * Math.cos(r), CY + R * Math.sin(r)]; }
  var A0 = 297, A1 = 243 + 360;
  var s0 = pt(A0), s1 = pt(A1);
  var arc = el("arc");
  arc.setAttribute("d", "M " + s0[0].toFixed(2) + " " + s0[1].toFixed(2) + " A " + R + " " + R + " 0 1 1 " + s1[0].toFixed(2) + " " + s1[1].toFixed(2));
  var ARC_LEN = arc.getTotalLength();
  arc.style.strokeDasharray = ARC_LEN + " " + ARC_LEN;
  arc.style.strokeDashoffset = "0";
  (function () {
    var r = A1 * Math.PI / 180;
    var dx = -Math.sin(r), dy = Math.cos(r);
    var nx = -dy, ny = dx;
    var tip = [s1[0] + dx * 24, s1[1] + dy * 24];
    var b1 = [s1[0] + nx * 20 - dx * 4, s1[1] + ny * 20 - dy * 4];
    var b2 = [s1[0] - nx * 20 - dx * 4, s1[1] - ny * 20 - dy * 4];
    el("arrowhead").setAttribute("points", [tip, b1, b2].map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "));
  })();
  var INF = el("inf");
  var INF_LEN = INF.getTotalLength();
  INF.style.strokeDasharray = (INF_LEN * 0.32).toFixed(1) + " " + (INF_LEN * 0.18).toFixed(1);

  // =================== STAIRCASE GEOMETRY ===================
  var STEP_W = 34, STEP_GAP = 10, H0 = 50, HSTEP = 38, BASE = 250;
  var stepsG = el("steps");
  var stepBase = [], stepLit = [], stepCap = [], stepLab = [], tops = [];
  for (var s = 0; s < 5; s++) {
    var x = s * (STEP_W + STEP_GAP), h = H0 + HSTEP * s, top = BASE - h;
    tops.push({ x: x, top: top });
    var g = document.createElementNS(SVGNS, "g");
    var rb = document.createElementNS(SVGNS, "rect");
    rb.setAttribute("x", x); rb.setAttribute("y", top); rb.setAttribute("width", STEP_W); rb.setAttribute("height", h);
    rb.setAttribute("rx", 6); rb.setAttribute("fill", "rgba(255,194,74,0.14)");
    rb.setAttribute("stroke", "rgba(255,194,74,0.6)"); rb.setAttribute("stroke-width", "2");
    var rl = document.createElementNS(SVGNS, "rect");
    rl.setAttribute("x", x); rl.setAttribute("y", top); rl.setAttribute("width", STEP_W); rl.setAttribute("height", h);
    rl.setAttribute("rx", 6); rl.setAttribute("fill", "url(#" + P + "goldgrad)"); rl.setAttribute("opacity", "0");
    var cap = document.createElementNS(SVGNS, "rect");
    cap.setAttribute("x", x + 5); cap.setAttribute("y", top + 4); cap.setAttribute("width", STEP_W - 10); cap.setAttribute("height", 4);
    cap.setAttribute("rx", 2); cap.setAttribute("fill", "#FFF5EA"); cap.setAttribute("opacity", "0");
    var lab = document.createElementNS(SVGNS, "text");
    lab.setAttribute("x", x + STEP_W / 2); lab.setAttribute("y", BASE - 10); lab.setAttribute("text-anchor", "middle");
    lab.setAttribute("class", "c7-steplabel"); lab.setAttribute("opacity", "0");
    lab.textContent = "0" + (s + 1);
    g.appendChild(rb); g.appendChild(rl); g.appendChild(cap); g.appendChild(lab);
    stepsG.appendChild(g);
    stepBase.push(g); stepLit.push(rl); stepCap.push(cap); stepLab.push(lab);
  }
  var od = "M 0 " + BASE;
  tops.forEach(function (t) { od += " V " + t.top + " H " + (t.x + STEP_W); });
  od += " V " + BASE;
  var outline = el("outline");
  outline.setAttribute("d", od);
  var OUT_LEN = outline.getTotalLength();
  outline.style.strokeDasharray = OUT_LEN + " " + OUT_LEN;
  outline.style.strokeDashoffset = String(OUT_LEN);
  var pts = [[6, tops[0].top - 22]];
  for (var k = 1; k < 5; k++) {
    pts.push([tops[k].x - 3, tops[k - 1].top - 22]);
    pts.push([tops[k].x - 3, tops[k].top - 22]);
  }
  pts.push([tops[4].x + 18, tops[4].top - 22]);
  pts.push([212, 10]);
  function rounded(Q, r) {
    var dd = "M " + Q[0][0] + " " + Q[0][1];
    for (var q = 1; q < Q.length - 1; q++) {
      var a = Q[q - 1], b = Q[q], c = Q[q + 1];
      var l1 = Math.hypot(b[0] - a[0], b[1] - a[1]), l2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
      var rr = Math.min(r, l1 / 2, l2 / 2);
      var p1 = [b[0] - (b[0] - a[0]) / l1 * rr, b[1] - (b[1] - a[1]) / l1 * rr];
      var p2 = [b[0] + (c[0] - b[0]) / l2 * rr, b[1] + (c[1] - b[1]) / l2 * rr];
      dd += " L " + p1[0].toFixed(1) + " " + p1[1].toFixed(1) + " Q " + b[0] + " " + b[1] + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
    }
    var z = Q[Q.length - 1];
    return dd + " L " + z[0] + " " + z[1];
  }
  var climb = el("climb");
  climb.setAttribute("d", rounded(pts, 8));
  var CLIMB_LEN = climb.getTotalLength();
  climb.style.strokeDasharray = CLIMB_LEN + " " + CLIMB_LEN;
  climb.style.strokeDashoffset = String(CLIMB_LEN);
  var climbHead = el("climbhead");
  var stepAt = [];
  (function () {
    var N = 240, si = 0;
    for (var n = 0; n <= N && si < 5; n++) {
      var L = CLIMB_LEN * n / N;
      var p = climb.getPointAtLength(L);
      while (si < 5 && p.x >= tops[si].x + 3 && p.y <= tops[si].top - 12) { stepAt.push(L); si++; }
    }
    while (stepAt.length < 5) stepAt.push(CLIMB_LEN);
  })();

  var check = el("checkpath");
  var CHECK_LEN = check.getTotalLength();
  check.style.strokeDasharray = CHECK_LEN + " " + CHECK_LEN;
  check.style.strokeDashoffset = String(CHECK_LEN);

  // motes inside the gold face (seeded)
  var motesWrap = el("motes"), motes = [];
  for (var m = 0; m < 12; m++) {
    var md = document.createElement("div");
    md.className = "c7-mote";
    motesWrap.appendChild(md);
    motes.push({ el: md, x: 20 + prand(m * 7 + 31) * 870, y: 20 + prand(m * 11 + 37) * 140, sp: 8 + prand(m * 13 + 41) * 16, ph: prand(m * 17 + 43) * 6.28, fr: 1.5 + prand(m * 19 + 47) * 2.5 });
  }

  // =================== PARTICLE POOLS (index-seeded, confined to their zone clips) ===================
  function makePool(field, n, seed, cfg) {
    var parts = [];
    for (var j = 0; j < n; j++) {
      var e = document.createElement("div");
      e.className = "c7-part";
      var size = cfg.smin + prand(seed + j * 3 + 1) * (cfg.smax - cfg.smin);
      var chip = cfg.chips && j % 3 === 0;
      e.style.width = size.toFixed(1) + "px";
      e.style.height = (chip ? size * 0.55 : size).toFixed(1) + "px";
      e.style.borderRadius = chip ? "2px" : "50%";
      var col = cfg.colors[j % cfg.colors.length];
      e.style.background = col;
      e.style.boxShadow = "0 0 " + (size * 1.2).toFixed(0) + "px " + col;
      e.style.marginLeft = (-size / 2).toFixed(1) + "px";
      e.style.marginTop = (-size / 2).toFixed(1) + "px";
      field.appendChild(e);
      var ang = (cfg.a0 + prand(seed + j * 5 + 2) * (cfg.a1 - cfg.a0)) * Math.PI / 180;
      var spd = cfg.vmin + prand(seed + j * 7 + 3) * (cfg.vmax - cfg.vmin);
      var ring = cfg.ring || 0;
      parts.push({ el: e, ox: Math.cos(ang) * ring, oy: Math.sin(ang) * ring, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, spin: (prand(seed + j * 11 + 4) * 2 - 1) * 540 });
    }
    return parts;
  }
  function burst(parts, at, flight, G, fadeFrac) {
    var drive = { T: 0 };
    tl.fromTo(drive, { T: 0 }, {
      T: 1, duration: flight, ease: "none", immediateRender: false,
      onUpdate: function () {
        var t = drive.T * flight;
        var fade = Math.min(1, (1 - drive.T) / fadeFrac);
        var pop = Math.min(1, drive.T / 0.06);
        for (var q = 0; q < parts.length; q++) {
          var p = parts[q];
          var x = p.ox + p.vx * t, y = p.oy + p.vy * t + 0.5 * G * t * t;
          p.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (p.spin * t).toFixed(0) + "deg)";
          p.el.style.opacity = drive.T === 0 || drive.T === 1 ? "0" : String(fade * pop);
        }
      }
    }, at);
  }
  // shards fly left/down only (away from the face side of the rail)
  var shards = makePool(el("shardfield"), 14, 400, { smin: 5, smax: 11, colors: ["#FF4D5E", "#E0218A", "#FF5FB0"], a0: 110, a1: 250, ring: 86, vmin: 160, vmax: 340, chips: true });
  var sparks = makePool(el("sparkfield"), 12, 900, { smin: 4, smax: 8, colors: ["#FFE1A0", "#FFC24A", "#FFF5EA"], a0: 150, a1: 330, vmin: 60, vmax: 150 });
  var stampBurst = makePool(el("burst"), 24, 1500, { smin: 5, smax: 12, colors: ["#FFC24A", "#FFE1A0", "#FFF5EA", "#FFC24A"], a0: 0, a1: 360, ring: 48, vmin: 300, vmax: 620, chips: true });
  var tickBurst = makePool(el("tickfield"), 10, 2200, { smin: 4, smax: 7, colors: ["#FFE1A0", "#FFC24A"], a0: 200, a1: 340, ring: 20, vmin: 90, vmax: 180 });

  // =================== AMBIENT (one finite driver, pure function of t) ===================
  var loopSpin = el("loopspin"), rays = el("rays"), stairGlow = el("stairglow"), calGlow = el("calglow");
  var nodeIn = [el("n0r"), el("n1r"), el("n2r")];
  var amb = { t: 0 };
  function ambient(t) {
    var ang = t * 60;
    loopSpin.style.transform = "rotate(" + ang.toFixed(2) + "deg)";
    for (var n = 0; n < 3; n++) nodeIn[n].style.transform = "rotate(" + (-ang).toFixed(2) + "deg)";
    INF.style.strokeDashoffset = (-t * 120).toFixed(1);
    rays.style.transform = "rotate(" + (t * 9).toFixed(2) + "deg)";
    stairGlow.style.transform = "scale(" + (1 + 0.05 * Math.sin(t * 2.4)).toFixed(3) + ")";
    calGlow.style.transform = "scale(" + (1 + 0.04 * Math.sin(t * 2.0 + 1)).toFixed(3) + ")";
    for (var q = 0; q < motes.length; q++) {
      var p = motes[q];
      var yy = ((p.y - p.sp * t) % 180 + 180) % 180;
      p.el.style.transform = "translate(" + (p.x + Math.sin(t + p.ph) * 8).toFixed(1) + "px," + yy.toFixed(1) + "px)";
      p.el.style.opacity = (0.35 + 0.35 * Math.sin(p.fr * t + p.ph)).toFixed(3);
    }
  }
  ambient(0);
  tl.fromTo(amb, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { ambient(amb.t); } }, 0);

  // per-zone camera push, each about its own centre
  ["toppush", "leftpush", "rightpush", "lowpush"].forEach(function (id) {
    tl.fromTo(el(id), { scale: 1 }, { scale: 1.03, duration: DUR, ease: "sine.inOut" }, 0);
  });

  // =================== SCENE 1: OLD HABITS headline + the loop ===================
  tl.fromTo(el("head"), { scale: 0.86, rotationX: -55, opacity: 0 },
    { scale: 1, rotationX: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 0);
  // blur lives on the perspective wrapper: a filter on the flipping card itself would flatten its 3D faces
  tl.fromTo(el("toppersp"), { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.36, ease: "power2.out" }, 0);
  tl.set(el("toppersp"), { filter: "none" }, 0.4);
  tl.fromTo(el("loopcard"), { x: -320, opacity: 1 }, { x: 0, duration: 0.5, ease: "power4.out" }, 0.04);
  tl.fromTo(el("loopcard"), { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.34, ease: "power2.out" }, 0.04);
  tl.fromTo(el("loop"), { scale: 0.6, rotation: -50 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.7)" }, 0.12);

  // "change": the loop snaps open, ring unravels, nodes implode, shards fly off to the left
  tl.to(el("loop"), { scale: 1.08, duration: 0.1, ease: "power2.out" }, CUE.change);
  tl.to(el("loop"), { scale: 0.9, duration: 0.4, ease: "power2.in" }, CUE.change + 0.1);
  tl.fromTo(arc, { strokeDashoffset: 0 }, { strokeDashoffset: ARC_LEN, duration: 0.44, ease: "power2.in" }, CUE.change + 0.04);
  tl.fromTo(el("arrowhead"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.out" }, CUE.change);
  [["n0", 0, 86], ["n1", -74, -43], ["n2", 74, -43]].forEach(function (nd, idx) {
    tl.fromTo(el(nd[0]), { x: 0, y: 0, scale: 1, opacity: 1 },
      { x: nd[1], y: nd[2], scale: 0.1, opacity: 0, duration: 0.36, ease: "power3.in", immediateRender: false }, CUE.change + 0.03 * idx);
  });
  tl.fromTo(el("loopcore"), { scale: 1, opacity: 1 }, { scale: 0.3, opacity: 0, duration: 0.28, ease: "power2.in", immediateRender: false }, CUE.change);
  tl.fromTo(el("loopword"), { opacity: 1, y: 0 }, { opacity: 0, y: 12, duration: 0.25, ease: "power2.in", immediateRender: false }, CUE.change + 0.04);
  tl.fromTo(el("loop"), { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power1.out", immediateRender: false }, CUE.change + 0.34);
  burst(shards, CUE.change + 0.06, 0.6, 520, 0.35);

  // ...the segment re-forms as a gold staircase in the same card
  tl.fromTo(outline, { strokeDashoffset: OUT_LEN }, { strokeDashoffset: 0, duration: 0.46, ease: "power2.out" }, CUE.change + 0.14);
  stepBase.forEach(function (g, idx) {
    tl.fromTo(g, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.46, ease: "back.out(1.5)" }, CUE.change + 0.16 + idx * 0.07);
  });
  tl.fromTo(stairGlow, { opacity: 0 }, { opacity: 0.6, duration: 0.6, ease: "power2.out" }, CUE.change + 0.2);

  // "habits": headline card flips (3D) to NEW HABITS; arrow climbs, steps light as the tip arrives
  tl.fromTo(el("head"), { rotationX: 0 }, { rotationX: 180, duration: 0.6, ease: "back.out(1.3)", immediateRender: false }, CUE.habits - 0.06);
  tl.to(el("head"), { scale: 1.05, duration: 0.18, ease: "power2.out" }, CUE.habits - 0.06);
  tl.to(el("head"), { scale: 1, duration: 0.42, ease: "power3.out" }, CUE.habits + 0.12);
  tl.fromTo(el("topglow"), { opacity: 0 }, { opacity: 0.55, duration: 0.5, ease: "power2.out" }, CUE.habits + 0.1);
  tl.fromTo(el("headsweep"), { x: -200, opacity: 0 }, { x: 1000, opacity: 1, duration: 0.6, ease: "power1.inOut" }, CUE.habits + 0.42);

  var climbP = { p: 0 };
  function climbUpdate() {
    var L = climbP.p * CLIMB_LEN;
    climb.style.strokeDashoffset = (CLIMB_LEN - L).toFixed(1);
    var a = climb.getPointAtLength(L), b = climb.getPointAtLength(Math.max(0, L - 2));
    var deg = L < 2 ? 0 : Math.atan2(a.y - b.y, a.x - b.x) * 180 / Math.PI;
    climbHead.setAttribute("transform", "translate(" + a.x.toFixed(1) + " " + a.y.toFixed(1) + ") rotate(" + deg.toFixed(1) + ")");
    climbHead.setAttribute("opacity", climbP.p > 0 ? "1" : "0");
    for (var q = 0; q < 5; q++) {
      var lit = clamp01((L - stepAt[q] + 14) / 28);
      stepLit[q].setAttribute("opacity", lit.toFixed(3));
      stepLab[q].setAttribute("opacity", lit.toFixed(3));
      var flash = clamp01((L - stepAt[q] + 14) / 14) * (1 - clamp01((L - stepAt[q] - 18) / 60));
      stepCap[q].setAttribute("opacity", (0.35 * lit + 0.65 * flash).toFixed(3));
    }
  }
  climbUpdate();
  tl.fromTo(climbP, { p: 0 }, { p: 1, duration: CUE.created - CUE.habits + 0.02, ease: "sine.inOut", immediateRender: false, onUpdate: climbUpdate }, CUE.habits);

  // "created": the arrow tops out with a spark burst
  burst(sparks, CUE.created + 0.02, 0.5, 80, 0.4);
  tl.to(stairGlow, { opacity: 1, duration: 0.3, ease: "power2.out" }, CUE.created);
  tl.to(stairGlow, { opacity: 0.6, duration: 0.4, ease: "power2.inOut" }, CUE.created + 0.3);

  // =================== SCENE 2 ===================
  // staircase rises straight up (x stays in the left column) into the headline card; headline makes room
  tl.to(el("stair"), { x: -5, y: -303, scale: 0.62, duration: 0.5, ease: "expo.inOut" }, CUE.and);
  tl.to(stairGlow, { x: -5, y: -303, scale: 0.6, opacity: 0.45, duration: 0.5, ease: "expo.inOut" }, CUE.and);
  tl.fromTo(el("newword"), { x: 0 }, { x: 108, duration: 0.5, ease: "expo.inOut", immediateRender: false }, CUE.and + 0.02);
  tl.fromTo(el("loopcard"), { scaleY: 1, opacity: 1 }, { scaleY: 0, opacity: 0, duration: 0.28, ease: "power2.in", immediateRender: false }, CUE.and);

  // tear-off calendar swings in from the right canvas edge
  tl.fromTo(el("cal"), { x: 380, rotationY: 50, rotation: 6, opacity: 1 },
    { x: 0, rotationY: 0, rotation: 0, duration: 0.62, ease: "back.out(1.2)" }, CUE.and + 0.1);
  tl.fromTo(el("cal"), { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 0.44, ease: "power2.out" }, CUE.and + 0.1);
  tl.fromTo(calGlow, { opacity: 0 }, { opacity: 0.4, duration: 0.6, ease: "power2.out" }, CUE.and + 0.3);
  tl.fromTo(el("frontsweep"), { x: -180, opacity: 0 }, { x: 380, opacity: 1, duration: 0.5, ease: "power1.inOut" }, CUE.something - 0.04);
  tl.to(el("frontsweep"), { opacity: 0, duration: 0.1, ease: "power1.in" }, CUE.something + 0.36);

  // 7-day tracker rises from the lower band's bottom edge
  tl.fromTo(el("track"), { y: 130 }, { y: 0, duration: 0.5, ease: "expo.out" }, CUE.you2 - 0.06);
  for (var bi = 0; bi < 7; bi++) {
    tl.fromTo(el("b" + bi), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2)" }, CUE.you2 + 0.04 + bi * 0.045);
  }
  tl.fromTo(el("rays"), { opacity: 0, scale: 0.7 }, { opacity: 0.3, scale: 1, duration: 0.8, ease: "power2.out" }, 3.2);

  // anticipation lift, then "begin": the page flips back over the binding (rotateX, perspective) to TODAY
  tl.fromTo(el("front"), { rotationX: 0 }, { rotationX: 6, duration: 0.4, ease: "sine.inOut" }, CUE.you2);
  tl.to(el("front"), { rotationX: -100, y: -10, duration: 0.34, ease: "power2.in" }, CUE.begin);
  tl.fromTo(el("frontshade"), { opacity: 0 }, { opacity: 0.55, duration: 0.34, ease: "power2.in", immediateRender: false }, CUE.begin);
  tl.fromTo(el("todaypage"), { filter: "brightness(0.55)" }, { filter: "brightness(1)", duration: 0.4, ease: "power2.out" }, CUE.begin + 0.08);
  tl.fromTo(el("today"), { scale: 0.7, opacity: 0, y: 16, filter: "blur(10px)" },
    { scale: 1, opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, CUE.begin + 0.18);
  tl.fromTo(el("todayglow"), { opacity: 0, scale: 0.8 }, { opacity: 0.7, scale: 1, duration: 0.46, ease: "power2.out" }, CUE.begin + 0.22);
  tl.to(calGlow, { opacity: 0.7, duration: 0.4, ease: "power2.out" }, CUE.begin + 0.2);

  // "today": DAY 1 stamp slams the corner; shockwave + gold burst (inside the right column); tracker ticks day 1
  tl.fromTo(el("stamp"), { scale: 2.5, rotation: -42, opacity: 0 },
    { scale: 1, rotation: -12, opacity: 1, duration: 0.26, ease: "power4.out" }, CUE.today - 0.08);
  tl.fromTo(el("stamp"), { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, CUE.today - 0.08);
  tl.to(el("cal"), { y: 9, x: -4, duration: 0.06, ease: "power2.out" }, CUE.today + 0.02);
  tl.to(el("cal"), { y: 0, x: 0, duration: 0.34, ease: "back.out(2)" }, CUE.today + 0.08);
  tl.fromTo(el("sh0"), { scale: 0.6, opacity: 0.95 }, { scale: 1.9, opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, CUE.today + 0.02);
  tl.fromTo(el("sh1"), { scale: 0.5, opacity: 0.7 }, { scale: 1.4, opacity: 0, duration: 0.34, ease: "power2.out", immediateRender: false }, CUE.today + 0.08);
  burst(stampBurst, CUE.today + 0.02, 0.4, 240, 0.3);
  tl.to(calGlow, { opacity: 1, scale: 1.1, duration: 0.3, ease: "power2.out" }, CUE.today + 0.02);
  tl.to(el("rays"), { opacity: 0.6, scale: 1.1, duration: 0.36, ease: "power2.out" }, CUE.today);
  tl.fromTo(el("todaysweep"), { x: -180, opacity: 0 }, { x: 380, opacity: 1, duration: 0.34, ease: "power1.inOut" }, CUE.today + 0.06);
  tl.fromTo(el("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, CUE.today + 0.06);
  tl.to(el("todayglow"), { opacity: 1, duration: 0.3, ease: "power2.out" }, CUE.today + 0.04);
  tl.fromTo(el("box0fill"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "back.out(2.2)" }, CUE.today + 0.04);
  tl.fromTo(check, { strokeDashoffset: CHECK_LEN }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, CUE.today + 0.14);
  burst(tickBurst, CUE.today + 0.08, 0.36, 300, 0.35);
  tl.fromTo(el("ticksweep"), { x: -140, opacity: 0 }, { x: 520, opacity: 1, duration: 0.36, ease: "power1.inOut" }, CUE.today + 0.12);

  window.__timelines = window.__timelines || {};
  window.__timelines["c7-new-habits-today"] = tl;
})();
</script>
