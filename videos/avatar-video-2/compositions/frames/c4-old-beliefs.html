                  <span class="c4-old-beliefs-w" id="c4-old-beliefs-w-like"><span class="c4-old-beliefs-t">LIKE</span></span>
                  <span class="c4-old-beliefs-w" id="c4-old-beliefs-w-us"><span class="c4-old-beliefs-t">US</span></span>

                <div class="c4-old-beliefs-row" style="font-size: 92px">
                  <span class="c4-old-beliefs-w" id="c4-old-beliefs-w-can"><span class="c4-old-beliefs-t">CAN</span></span>
                  <span class="c4-old-beliefs-w c4-old-beliefs-big" id="c4-old-beliefs-w-never">
                    <i class="c4-old-beliefs-ripple" id="c4-old-beliefs-rp-never-1"></i><i class="c4-old-beliefs-ripple" id="c4-old-beliefs-rp-never-2"></i><i class="c4-old-beliefs-ripple" id="c4-old-beliefs-rp-never-3"></i>
                    <span id="c4-old-beliefs-sparks"></span>
                    <span class="c4-old-beliefs-t c4-old-beliefs-tglow" id="c4-old-beliefs-gl-never" data-layout-ignore aria-hidden="true">NEVER</span>
                    <span class="c4-old-beliefs-t c4-old-beliefs-tred" data-layout-allow-overlap>NEVER</span>

                <div class="c4-old-beliefs-row" style="font-size: 92px">
                  <span class="c4-old-beliefs-w" id="c4-old-beliefs-w-be"><span class="c4-old-beliefs-t">BE</span></span>
                  <span class="c4-old-beliefs-w" id="c4-old-beliefs-w-wealthy"><span class="c4-old-beliefs-t">WEALTHY.</span></span>

            <svg class="c4-old-beliefs-qc" id="c4-old-beliefs-qc3" viewBox="0 0 84 60" aria-hidden="true"><g fill="url(#c4-old-beliefs-qgrad)" filter="url(#c4-old-beliefs-qglow)" transform="rotate(180 42 30)"><circle cx="20" cy="40" r="17" /><path d="M4 38 C4 19 13 7 33 1 L35 8 C22 13 17 22 18 31 Z" /><circle cx="62" cy="40" r="17" /><path d="M46 38 C46 19 55 7 75 1 L77 8 C64 13 59 22 60 31 Z" /></g></svg>

        <!-- heavy chains across the stack + padlock -->
        <svg id="c4-old-beliefs-chains" viewBox="0 0 1080 1920" aria-hidden="true"><g id="c4-old-beliefs-chainA"></g><g id="c4-old-beliefs-chainB"></g></svg>
        <svg id="c4-old-beliefs-lock" viewBox="0 0 124 160" aria-hidden="true">
          <g id="c4-old-beliefs-shackle">
            <path d="M28 82 L28 46 C28 22 43 8 62 8 C81 8 96 22 96 46 L96 82" fill="none" stroke="#1a0f22" stroke-width="22" stroke-linecap="round" />
            <path d="M28 82 L28 46 C28 22 43 8 62 8 C81 8 96 22 96 46 L96 82" fill="none" stroke="url(#c4-old-beliefs-steel)" stroke-width="15" stroke-linecap="round" />
          </g>
          <rect x="6" y="70" width="112" height="86" rx="18" fill="url(#c4-old-beliefs-lockbody)" stroke="#a99bb5" stroke-width="4" />
          <rect x="14" y="76" width="96" height="6" rx="3" fill="rgba(255,255,255,0.18)" />
          <g filter="url(#c4-old-beliefs-qglow)" fill="#ff4d5e">

    <!-- ===== Top FX ===== -->
    <div id="c4-old-beliefs-fx" class="clip" data-start="0" data-duration="5.92" data-track-index="2">
      <div id="c4-old-beliefs-flash"></div>
    </div>

    <script>
      (function () {
        var ID = "c4-old-beliefs";
        var DUR = 5.92;
        var $ = function (s) {
          return document.getElementById(ID + "-" + s);
        };
        var hash = function (n) {
          var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        };
        var SVGNS = "http://www.w3.org/2000/svg";

        // ---- word cues (local seconds, from the voiceover) ----
        var CUE = {
          money: 0.1, hard: 0.74, to: 1.06, earn: 1.22,
          wanting: 1.78, more: 2.18, is: 2.5, selfish: 2.74,
          people: 3.62, like: 3.94, us: 4.18, can: 4.5, never: 4.74, be: 4.98, wealthy: 5.22
        };
        var LEAD = 0.03; // a word starts arriving a frame before its cue, so it reads ON the cue
        // card beats (the rhythmic spine: one slam per belief, red hit inside each)
        var CARD1 = 0.0, CARD2 = 1.62, CARD3 = 3.46;
        var HIT1 = 0.8, HIT2 = 2.78, HIT3 = 4.76; // red-word impact frames

        var cam = $("cam");
        var cin = [$("cin1"), $("cin2"), $("cin3")];
        var dots = [$("dot1"), $("dot2"), $("dot3")];
        var gmag = $("gmag"), ggold = $("ggold"), gred = $("gred"), grings = $("grings");
        var mb1 = $("mb1-node"), mb2 = $("mb2-node");

        // ---- seeded gold dust ----
        var dustBox = $("dustbox");
        var dust = [];
        for (var i = 0; i < 30; i++) {
          var d = document.createElement("i");
          d.className = ID + "-dust";
          var size = 3 + Math.round(hash(i * 5.3 + 1) * 5);
          d.style.width = size + "px";
          d.style.height = size + "px";
          dustBox.appendChild(d);
          dust.push({
            el: d,
            x: 50 + hash(i * 3.1 + 2) * 980,
            y: 160 + hash(i * 7.7 + 3) * 1560,
            v: 12 + hash(i * 2.3 + 4) * 26,
            sway: 6 + hash(i * 4.1 + 5) * 14,
            f: 1.1 + hash(i * 6.7 + 6) * 2.2,
            p: hash(i * 8.9 + 7) * 6.283
          });
        }

        // ---- sparks inside NEVER (index-derived angles) ----
        var sparkBox = $("sparks");
        var sparks = [];
        for (var s = 0; s < 14; s++) {
          var sp = document.createElement("i");
          sp.className = ID + "-spark";
          sparkBox.appendChild(sp);
          var ang = (s / 14) * 360 + (hash(s * 9.1) * 2 - 1) * 9;
          sparks.push({ el: sp, a: ang, r: 230 + hash(s * 3.7) * 170 });
        }

        // ---- chain links along two crossing diagonals ----
        function buildChain(g, x1, y1, x2, y2) {
          var dx = x2 - x1, dy = y2 - y1;
          var len = Math.sqrt(dx * dx + dy * dy);
          var ang = (Math.atan2(dy, dx) * 180) / Math.PI;
          var pitch = 42;
          var n = Math.floor(len / pitch) + 1;
          var links = [];
          for (var k = 0; k < n; k++) {
            var u = k / (n - 1);
            var px = x1 + dx * u, py = y1 + dy * u;
            var outer = document.createElementNS(SVGNS, "g");
            outer.setAttribute("transform", "translate(" + px.toFixed(1) + " " + py.toFixed(1) + ") rotate(" + ang.toFixed(2) + ")");
            var inner = document.createElementNS(SVGNS, "g");
            if (k % 2 === 0) {
              inner.innerHTML =
                '<ellipse cx="0" cy="0" rx="27" ry="15" fill="none" stroke="#1a0f22" stroke-width="14"/>' +
                '<ellipse cx="0" cy="0" rx="27" ry="15" fill="none" stroke="url(#' + ID + '-steel)" stroke-width="9"/>' +
                '<path d="M-18 -11 Q0 -17 18 -11" fill="none" stroke="#fff5ea" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round"/>';
            } else {
              inner.innerHTML =
                '<rect x="-29" y="-7" width="58" height="14" rx="7" fill="#1a0f22"/>' +
                '<rect x="-27" y="-5" width="54" height="10" rx="5" fill="url(#' + ID + '-steel)"/>' +
                '<rect x="-20" y="-4" width="40" height="2.5" rx="1.2" fill="#fff5ea" fill-opacity="0.7"/>';
            }
            outer.appendChild(inner);
            g.appendChild(outer);
            links.push(inner);
          }
          return links;
        }
        var chainA = buildChain($("chainA"), 92, 706, 988, 1062);
        var chainB = buildChain($("chainB"), 988, 706, 92, 1062);

        // ---- procedural rig: pure function of local time (seek-safe) ----
        function win(t, at, dur) {
          if (t < at || t >= at + dur) return 0;
          var u = (t - at) / dur;
          return (1 - u) * (1 - u);
        }
        function expoVel(t, at, dur) {
          if (t < at || t >= at + dur) return 0;
          return Math.pow(2, (-10 * (t - at)) / dur);
        }
        function rig(t) {
          var f = Math.floor(t / 0.04 + 1e-6); // one shake sample per frame (25 fps)
          // camera shake: keyframed, finite windows on the red hits
          var e1 = win(t, HIT1, 0.36), e2 = win(t, HIT2, 0.3), e3 = win(t, HIT3, 0.5);
          var ax = 13 * e1 + 9 * e2 + 22 * e3;
          var ay = 8 * e1 + 6 * e2 + 8 * e3;
          var ar = 0.35 * e1 + 0.25 * e2 + 0.9 * e3;
          var sx = (hash(f * 13.1 + 1) * 2 - 1) * ax;
          var sy = (hash(f * 7.3 + 2) * 2 - 1) * ay;
          var sr = (hash(f * 3.9 + 3) * 2 - 1) * ar;
          // landing bumps when each card slams down
          var bump = 7 * win(t, CARD1 + 0.12, 0.3) + 7 * win(t, CARD2 + 0.14, 0.3) + 9 * win(t, CARD3 + 0.12, 0.32);
          var push = 1 + 0.02 * (t / DUR) + 0.008 * win(t, HIT3, 0.45);
          var dx = Math.sin(t * 0.9) * 3 + sx;
          var dy = Math.sin(t * 1.3 + 0.6) * 2 + sy + bump;
          cam.style.transform = "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px) rotate(" + sr.toFixed(3) + "deg) scale(" + push.toFixed(4) + ")";

          // idle bob per card (starts after its landing) + vertical motion blur on the stacking drops
          var b1 = t > 0.45 ? Math.sin((t - 0.45) * 2.4) * 3.5 : 0;
          var b2 = t > 2.05 ? Math.sin((t - 2.05) * 2.1 + 1.1) * 3 : 0;
          var b3 = t > 3.9 ? Math.sin((t - 3.9) * 2.6) * 3.5 : 0;
          var m1 = 16 * expoVel(t, CARD2 - 0.04, 0.5) + 14 * expoVel(t, 3.38, 0.6);
          var m2 = 16 * expoVel(t, 3.4, 0.6);
          mb1.setAttribute("stdDeviation", "0 " + m1.toFixed(2));
          mb2.setAttribute("stdDeviation", "0 " + m2.toFixed(2));
          cin[0].style.filter = m1 > 0.15 ? "url(#" + ID + "-mb1)" : "none";
          cin[1].style.filter = m2 > 0.15 ? "url(#" + ID + "-mb2)" : "none";
          cin[0].style.transform = "translate3d(0," + b1.toFixed(2) + "px,0)";
          cin[1].style.transform = "translate3d(0," + b2.toFixed(2) + "px,0)";
          cin[2].style.transform = "translate3d(0," + b3.toFixed(2) + "px,0)";
          for (var c = 0; c < 3; c++) {
            dots[c].style.opacity = (0.55 + 0.45 * Math.sin(t * 5.2 + c * 1.7)).toFixed(3);
          }

          // ground drift (slower than foreground = depth)
          gmag.style.transform = "translate3d(" + (Math.sin(t * 0.55) * 46).toFixed(2) + "px," + (Math.sin(t * 0.4 + 1) * 34).toFixed(2) + "px,0)";
          ggold.style.transform = "scale(" + (1 + 0.08 * Math.sin(t * 1.7)).toFixed(4) + ")";
          gred.style.transform = "scale(" + (1 + 0.05 * Math.sin(t * 3.1) + 0.12 * e3).toFixed(4) + ")";
          grings.style.transform = "rotate(" + (t * 4.5).toFixed(2) + "deg) scale(" + (1 + 0.04 * e3 + 0.02 * e1).toFixed(4) + ")";
          for (var k = 0; k < dust.length; k++) {
            var q = dust[k];
            var y = q.y - q.v * t;
            var x = q.x + Math.sin(t * 0.8 + q.p) * q.sway;
            q.el.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0)";
            q.el.style.opacity = (0.18 + 0.55 * Math.max(0, Math.sin(t * q.f + q.p))).toFixed(3);
          }
        }

        var tl = gsap.timeline({ paused: true });
        var drv = { t: 0 };
        rig(0);
        tl.fromTo(drv, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { rig(drv.t); } }, 0);

        // ---- helpers ----
        var F0 = "blur(0px) brightness(1) saturate(1)";
        function show(el, at) {
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, at);
        }
        function unblur(el, at) {
          tl.set(el, { filter: "none" }, at);
        }
        var NOIR = { immediateRender: false };
        function fade(el, at, peak, dur) {
          // invisible from-state first, then a later fromTo that never renders early
          tl.fromTo(el, { opacity: 0 }, { opacity: peak, duration: 0.04, ease: "none" }, at);
          tl.fromTo(el, { opacity: peak }, { opacity: 0, duration: dur - 0.04, ease: "power2.in", immediateRender: false }, at + 0.04);
        }
        function ripple(id, at, scaleTo) {
          tl.fromTo($(id), { scale: 0.35 }, { scale: scaleTo, duration: 0.6, ease: "power2.out" }, at);
          fade($(id), at, 0.95, 0.6);
        }
        function echo(id, at) {
          tl.fromTo($(id), { scale: 1 }, { scale: 1.16, duration: 0.6, ease: "power2.out" }, at);
          fade($(id), at, 0.85, 0.6);
        }
        function sheen(id, at) {
          tl.fromTo($(id), { x: -440, rotation: 16, opacity: 1 }, { x: 1180, rotation: 16, opacity: 1, duration: 0.62, ease: "power2.inOut" }, at);
        }
        function chip(n, at) {
          tl.fromTo($("chip" + n), { opacity: 0, y: 16, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.8)" }, at);
          tl.fromTo($("qo" + n), { opacity: 0, scale: 0, rotation: -50 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, at - 0.03);
        }
        function closeQuote(n, at) {
          tl.fromTo($("qc" + n), { opacity: 0, scale: 0, rotation: 50 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2)" }, at);
        }
        function redHit(word, at, glowPeak, glowHold) {
          tl.fromTo($("gl-" + word), { opacity: 0 }, { opacity: glowPeak, duration: 0.12, ease: "power2.out" }, at);
          tl.fromTo($("gl-" + word), { opacity: glowPeak }, { opacity: glowHold, duration: 0.6, ease: "power2.out", immediateRender: false }, at + 0.12);
          tl.fromTo($("ul-" + word), { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.out" }, at + 0.2);
        }
        var flashN = 0;
        function flash(at, peak) {
          tl.fromTo($("flash"), { opacity: 0 }, { opacity: peak, duration: 0.05, ease: "none", immediateRender: flashN === 0 }, at);
          tl.fromTo($("flash"), { opacity: peak }, { opacity: 0, duration: 0.34, ease: "power2.out", immediateRender: false }, at + 0.05);
          flashN++;
        }

        var card1 = $("card1"), card2 = $("card2"), card3 = $("card3");
        gsap.set([card1, card2, card3], { transformOrigin: "50% 50%" });
        gsap.set($("w-never"), { transformPerspective: 900 });

        // ================= Scene 1 (0.0–1.7): card 1 slams in centre-high =================
        tl.fromTo(card1, { opacity: 0, scale: 1.1, y: -24, filter: "blur(14px) brightness(1.25) saturate(1)" }, { opacity: 1, scale: 1, y: 0, filter: F0, duration: 0.38, ease: "power4.out" }, CARD1);
        echo("echo1a", CARD1 + 0.14);
        echo("echo1b", CARD1 + 0.26);
        chip(1, CARD1 + 0.16);

        // "MONEY" — push-through slam (scale + blur)
        show($("w-money"), CUE.money - LEAD);
        tl.fromTo($("w-money"), { scale: 1.5, filter: "blur(16px)" }, { scale: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" }, CUE.money - LEAD);
        unblur($("w-money"), CUE.money + 0.45);

        // "HARD" — red, drops from above with overshoot, shake + flash on impact
        show($("w-hard"), CUE.hard - LEAD);
        tl.fromTo($("w-hard"), { y: -120, scale: 1.6, rotation: -9, filter: "blur(12px)" }, { y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.6)" }, CUE.hard - LEAD);
        unblur($("w-hard"), CUE.hard + 0.52);
        redHit("hard", HIT1, 0.95, 0.5);
        ripple("rp-hard-1", HIT1, 2.6);
        ripple("rp-hard-2", HIT1 + 0.1, 3.1);
        flash(HIT1, 0.16);
        tl.fromTo(gred, { opacity: 0 }, { opacity: 0.12, duration: 0.4, ease: "power2.out" }, HIT1);

        // "TO EARN." — side snaps from the right
        show($("w-to"), CUE.to - LEAD);
        tl.fromTo($("w-to"), { x: 80, filter: "blur(10px)" }, { x: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, CUE.to - LEAD);
        unblur($("w-to"), CUE.to + 0.36);
        show($("w-earn"), CUE.earn - LEAD);
        tl.fromTo($("w-earn"), { x: 110, skewX: -14, filter: "blur(10px)" }, { x: 0, skewX: 0, filter: "blur(0px)", duration: 0.38, ease: "expo.out" }, CUE.earn - LEAD);
        unblur($("w-earn"), CUE.earn + 0.4);
        closeQuote(1, 1.4);
        sheen("sheen1", 1.48);

        // ================= Scene 2 (1.7–3.5): card 1 sinks into the stack, card 2 drops in =================
        tl.fromTo(card1, { y: 0, scale: 1 }, { y: 336, scale: 0.82, duration: 0.5, ease: "expo.out", immediateRender: false }, CARD2 - 0.04);
        tl.fromTo(card1, { filter: F0 }, { filter: "blur(0px) brightness(0.72) saturate(0.85)", duration: 0.5, ease: "power2.out", immediateRender: false }, CARD2);
        tl.fromTo(card2, { opacity: 0, y: -150, rotation: -4, filter: "blur(12px) brightness(1.25) saturate(1)" }, { opacity: 1, y: 0, rotation: 0, filter: F0, duration: 0.46, ease: "back.out(1.4)" }, CARD2);
        echo("echo2a", CARD2 + 0.18);
        echo("echo2b", CARD2 + 0.3);
        chip(2, CARD2 + 0.16);

        // "WANTING" — heavy rise with a tilt
        show($("w-wanting"), CUE.wanting - LEAD);
        tl.fromTo($("w-wanting"), { y: 70, rotation: 7, filter: "blur(10px)" }, { y: 0, rotation: 0, filter: "blur(0px)", duration: 0.45, ease: "circ.out" }, CUE.wanting - LEAD);
        unblur($("w-wanting"), CUE.wanting + 0.47);
        // "MORE" — overshoot pop
        show($("w-more"), CUE.more - LEAD);
        tl.fromTo($("w-more"), { scale: 0.2 }, { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, CUE.more - LEAD);
        // "IS" — snap from the left
        show($("w-is"), CUE.is - LEAD);
        tl.fromTo($("w-is"), { x: -70, filter: "blur(8px)" }, { x: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, CUE.is - LEAD);
        unblur($("w-is"), CUE.is + 0.32);
        // "SELFISH." — red scale slam, shake + flash
        show($("w-selfish"), CUE.selfish - LEAD);
        tl.fromTo($("w-selfish"), { scale: 1.6, filter: "blur(18px)" }, { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, CUE.selfish - LEAD);
        unblur($("w-selfish"), CUE.selfish + 0.47);
        redHit("selfish", HIT2, 0.95, 0.5);
        ripple("rp-selfish-1", HIT2, 2.4);
        ripple("rp-selfish-2", HIT2 + 0.1, 2.9);
        flash(HIT2, 0.2);
        tl.fromTo(gred, { opacity: 0.12 }, { opacity: 0.2, duration: 0.4, ease: "power2.out", immediateRender: false }, HIT2);
        closeQuote(2, 3.0);
        sheen("sheen2", 3.06);

        // ================= Scene 3 (3.5–5.92): compact stack, card 3 slams in on top =================
        tl.fromTo(card1, { y: 336, scale: 0.82, rotation: 0 }, { y: 561, scale: 0.58, rotation: -3, duration: 0.6, ease: "expo.out", immediateRender: false }, 3.38);
        tl.fromTo(card1, { filter: "blur(0px) brightness(0.72) saturate(0.85)" }, { filter: "blur(0px) brightness(0.56) saturate(0.75)", duration: 0.5, ease: "power2.out", immediateRender: false }, 3.4);
        tl.fromTo(card2, { y: 0, scale: 1, rotation: 0 }, { y: 435, scale: 0.64, rotation: 2.5, duration: 0.6, ease: "expo.out", immediateRender: false }, 3.4);
        tl.fromTo(card2, { filter: F0 }, { filter: "blur(0px) brightness(0.72) saturate(0.85)", duration: 0.5, ease: "power2.out", immediateRender: false }, 3.44);
        tl.fromTo(card3, { opacity: 0, scale: 1.1, filter: "blur(16px) brightness(1.3) saturate(1)" }, { opacity: 1, scale: 1, filter: F0, duration: 0.42, ease: "power4.out" }, CARD3);
        echo("echo3a", CARD3 + 0.14);
        echo("echo3b", CARD3 + 0.26);
        chip(3, CARD3 + 0.14);

        // "PEOPLE LIKE US" — a triplet of drops, alternating tilt
        [["people", -8], ["like", 8], ["us", -6]].forEach(function (p) {
          var el = $("w-" + p[0]);
          show(el, CUE[p[0]] - LEAD);
          tl.fromTo(el, { y: -80, rotation: p[1], filter: "blur(10px)" }, { y: 0, rotation: 0, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, CUE[p[0]] - LEAD);
          unblur(el, CUE[p[0]] + 0.42);
        });
