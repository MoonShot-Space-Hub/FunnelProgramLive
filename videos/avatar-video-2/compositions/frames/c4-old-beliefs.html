                <span class="c4-old-beliefs-w" id="c4-old-beliefs-w-wealthy"><span class="c4-old-beliefs-t">WEALTHY.</span></span>
              </div>
            </div>
            <div class="c4-old-beliefs-flash" id="c4-old-beliefs-flash3"></div>
          </div>
          <svg class="c4-old-beliefs-qo" id="c4-old-beliefs-qo3" aria-hidden="true"><use href="#c4-old-beliefs-q66" /></svg>
          <div class="c4-old-beliefs-chip" id="c4-old-beliefs-chip3"><i></i>HEARD AT HOME</div>
          <svg class="c4-old-beliefs-qc c4-old-beliefs-qc-in" id="c4-old-beliefs-qc3" aria-hidden="true"><use href="#c4-old-beliefs-q99" /></svg>
        </div>
      </div>

      <!-- chains + padlocks across the two RAIL cards (never the face) -->
      <svg id="c4-old-beliefs-chains" viewBox="0 0 1080 1920" aria-hidden="true"><g id="c4-old-beliefs-chainL1"></g><g id="c4-old-beliefs-chainL2"></g><g id="c4-old-beliefs-chainR1"></g><g id="c4-old-beliefs-chainR2"></g></svg>
      <svg class="c4-old-beliefs-lock" id="c4-old-beliefs-lockL" viewBox="0 0 124 160" aria-hidden="true">
        <g class="c4-old-beliefs-shackle" id="c4-old-beliefs-shackleL">
          <path d="M28 82 L28 46 C28 22 43 8 62 8 C81 8 96 22 96 46 L96 82" fill="none" stroke="#1a0f22" stroke-width="22" stroke-linecap="round" />
          <path d="M28 82 L28 46 C28 22 43 8 62 8 C81 8 96 22 96 46 L96 82" fill="none" stroke="url(#c4-old-beliefs-steel)" stroke-width="15" stroke-linecap="round" />
        </g>
        <rect x="6" y="70" width="112" height="86" rx="18" fill="url(#c4-old-beliefs-lockbody)" stroke="#a99bb5" stroke-width="5" />
        <g filter="url(#c4-old-beliefs-qglow)" fill="#ff4d5e"><circle cx="62" cy="106" r="12" /><path d="M55 110 L69 110 L66 136 L58 136 Z" /></g>
      </svg>
      <svg class="c4-old-beliefs-lock" id="c4-old-beliefs-lockR" viewBox="0 0 124 160" aria-hidden="true">
        <g class="c4-old-beliefs-shackle" id="c4-old-beliefs-shackleR">
          <path d="M28 82 L28 46 C28 22 43 8 62 8 C81 8 96 22 96 46 L96 82" fill="none" stroke="#1a0f22" stroke-width="22" stroke-linecap="round" />
          <path d="M28 82 L28 46 C28 22 43 8 62 8 C81 8 96 22 96 46 L96 82" fill="none" stroke="url(#c4-old-beliefs-steel)" stroke-width="15" stroke-linecap="round" />
        </g>
        <rect x="6" y="70" width="112" height="86" rx="18" fill="url(#c4-old-beliefs-lockbody)" stroke="#a99bb5" stroke-width="5" />
        <g filter="url(#c4-old-beliefs-qglow)" fill="#ff4d5e"><circle cx="62" cy="106" r="12" /><path d="M55 110 L69 110 L66 136 L58 136 Z" /></g>
      </svg>
    </div>

    <script>
      (function () {
        var ID = "c4-old-beliefs";
        var DUR = 5.92;
        var $ = function (s) {
          return document.getElementById(ID + "-" + s);
        };
        var hash = function (n) {
          var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        };
        var SVGNS = "http://www.w3.org/2000/svg";

        // ---- word cues (local seconds, from the voiceover) ----
        var CUE = {
          money: 0.1, hard: 0.74, to: 1.06, earn: 1.22,
          wanting: 1.78, more: 2.18, is: 2.5, selfish: 2.74,
          people: 3.62, like: 3.94, us: 4.18, can: 4.5, never: 4.74, be: 4.98, wealthy: 5.22
        };
        var LEAD = 0.03; // a word starts arriving a frame before its cue, so it reads ON the cue
        var CARD1 = 0.0, CARD2 = 1.62, CARD3 = 3.46; // one card per belief: the rhythmic spine
        var HIT1 = 0.8, HIT2 = 2.78, HIT3 = 4.76; // red-word impact frames

        var cin1 = $("cin1"), cin2 = $("cin2"), cin3 = $("cin3"), cin1c = $("cin1c"), cin2c = $("cin2c");

        // ---- sparks inside NEVER (clipped by card 3's body) ----
        var sparks = [];
        for (var s = 0; s < 12; s++) {
          var sp = document.createElement("i");
          sp.className = ID + "-spark";
          $("sparks").appendChild(sp);
          sparks.push({ el: sp, a: (s / 12) * 360 + (hash(s * 9.1) * 2 - 1) * 9, r: 200 + hash(s * 3.7) * 160 });
        }

        // ---- chain links: an X across each rail card ----
        function buildChain(g, x1, y1, x2, y2) {
          var dx = x2 - x1, dy = y2 - y1;
          var len = Math.sqrt(dx * dx + dy * dy);
          var ang = (Math.atan2(dy, dx) * 180) / Math.PI;
          var n = Math.floor(len / 26) + 1;
          var links = [];
          for (var k = 0; k < n; k++) {
            var u = k / (n - 1);
            var outer = document.createElementNS(SVGNS, "g");
            outer.setAttribute("transform", "translate(" + (x1 + dx * u).toFixed(1) + " " + (y1 + dy * u).toFixed(1) + ") rotate(" + ang.toFixed(2) + ")");
            var inner = document.createElementNS(SVGNS, "g");
            if (k % 2 === 0) {
              inner.innerHTML =
                '<ellipse cx="0" cy="0" rx="16" ry="9" fill="none" stroke="#1a0f22" stroke-width="9"/>' +
                '<ellipse cx="0" cy="0" rx="16" ry="9" fill="none" stroke="url(#' + ID + '-steel)" stroke-width="5.5"/>' +
                '<path d="M-10 -6.5 Q0 -10 10 -6.5" fill="none" stroke="#fff5ea" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round"/>';
            } else {
              inner.innerHTML =
                '<rect x="-17" y="-4.5" width="34" height="9" rx="4.5" fill="#1a0f22"/>' +
                '<rect x="-15.5" y="-3" width="31" height="6" rx="3" fill="url(#' + ID + '-steel)"/>';
            }
            outer.appendChild(inner);
            g.appendChild(outer);
            links.push(inner);
          }
          return links;
        }
        var chains = [
          buildChain($("chainL1"), 84, 540, 330, 718),
          buildChain($("chainL2"), 330, 540, 84, 718),
          buildChain($("chainR1"), 702, 540, 996, 720),
          buildChain($("chainR2"), 996, 540, 702, 720)
        ];

        // ---- procedural rig: pure function of local time (seek-safe) ----
        // Shake and push act on each card about its OWN centre, never on the frame or the footage.
        function win(t, at, dur) {
          if (t < at || t >= at + dur) return 0;
          var u = (t - at) / dur;
          return (1 - u) * (1 - u);
        }
        function shake(f, seed, e, ax, ay) {
          return [(hash(f * 13.1 + seed) * 2 - 1) * ax * e, (hash(f * 7.3 + seed * 3) * 2 - 1) * ay * e, (hash(f * 3.9 + seed * 5) * 2 - 1) * e];
        }
        function setT(el, x, y, r, sc) {
          el.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0) rotate(" + r.toFixed(3) + "deg) scale(" + sc.toFixed(4) + ")";
        }
        function rig(t) {
          var f = Math.floor(t / 0.04 + 1e-6); // one shake sample per frame (25 fps), finite windows only
          var push = 1 + 0.01 * (t / DUR);
          // top-band cards: bob only upward and shake biased upward so nothing dips toward the face zone
          var s1 = shake(f, 1, win(t, HIT1, 0.36), 8, 4);
          var b1 = t > 0.45 ? (Math.sin((t - 0.45) * 2.4) - 1) * 1.5 : 0;
          setT(cin1, s1[0], b1 - Math.abs(s1[1]), s1[2] * 0.35, push);
          var s2 = shake(f, 2, win(t, HIT2, 0.3), 6, 3);
          var b2 = t > 2.05 ? (Math.sin((t - 2.05) * 2.1) - 1) * 1.5 : 0;
          setT(cin2, s2[0], b2 - Math.abs(s2[1]), s2[2] * 0.25, push);
          var s3 = shake(f, 3, win(t, HIT3, 0.5), 9, 4);
          var b3 = t > 3.9 ? Math.sin((t - 3.9) * 2.6) * 1.5 : 0;
          setT(cin3, s3[0], b3 + s3[1], s3[2] * 0.5, push);
          // rail cards: idle bob + a small jolt when the chains clamp on "never"
          var j = win(t, HIT3 + 0.04, 0.3);
          var jl = shake(f, 4, j, 3, 2), jr = shake(f, 5, j, 3, 2);
          setT(cin1c, jl[0], Math.sin(t * 2.2) * 2 + jl[1], 0, 1);
          setT(cin2c, jr[0], Math.sin(t * 2.0 + 1.3) * 2 + jr[1], 0, 1);
        }

        var tl = gsap.timeline({ paused: true });
        var drv = { t: 0 };
        rig(0);
        tl.fromTo(drv, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { rig(drv.t); } }, 0);

        // ---- helpers (every from-state explicit; later same-property tweens never render early) ----
        var F0 = "blur(0px) brightness(1) saturate(1)";
        function show(el, at) {
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, at);
        }
        function unblur(el, at) {
          tl.set(el, { filter: "none" }, at);
        }
        function fade(el, at, peak, dur) {
          tl.fromTo(el, { opacity: 0 }, { opacity: peak, duration: 0.04, ease: "none" }, at);
          tl.fromTo(el, { opacity: peak }, { opacity: 0, duration: dur - 0.04, ease: "power2.in", immediateRender: false }, at + 0.04);
        }
        function ripple(id, at, scaleTo) {
          tl.fromTo($(id), { scale: 0.35 }, { scale: scaleTo, duration: 0.6, ease: "power2.out" }, at);
          fade($(id), at, 0.95, 0.6);
        }
        function echo(id, at, sc) {
          tl.fromTo($(id), { scale: 1 }, { scale: sc, duration: 0.55, ease: "power2.out" }, at);
          fade($(id), at, 0.85, 0.55);
        }
        function sheen(id, at) {
          tl.fromTo($(id), { x: -420, rotation: 16, opacity: 1 }, { x: 1150, rotation: 16, opacity: 1, duration: 0.62, ease: "power2.inOut" }, at);
        }
        function chip(n, at) {
          tl.fromTo($("chip" + n), { opacity: 0, y: 12, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.8)" }, at);
          tl.fromTo($("qo" + n), { opacity: 0, scale: 0, rotation: -50 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, at - 0.03);
        }
        function closeQuote(n, at) {
          tl.fromTo($("qc" + n), { opacity: 0, scale: 0, rotation: 50 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2)" }, at);
        }
        function redHit(word, at, glowPeak, glowHold) {
          tl.fromTo($("gl-" + word), { opacity: 0 }, { opacity: glowPeak, duration: 0.12, ease: "power2.out" }, at);
          tl.fromTo($("gl-" + word), { opacity: glowPeak }, { opacity: glowHold, duration: 0.6, ease: "power2.out", immediateRender: false }, at + 0.12);
          tl.fromTo($("ul-" + word), { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.out" }, at + 0.2);
        }
        function flash(id, at, peak) {
          tl.fromTo($(id), { opacity: 0 }, { opacity: peak, duration: 0.05, ease: "none" }, at);
          tl.fromTo($(id), { opacity: peak }, { opacity: 0, duration: 0.34, ease: "power2.out", immediateRender: false }, at + 0.05);
        }

        var card1 = $("card1"), card2 = $("card2"), card3 = $("card3"), card1c = $("card1c"), card2c = $("card2c");
        gsap.set($("w-never"), { transformPerspective: 900 });

        // ================= Scene 1 (0.0–1.7): belief 1 slams into the TOP band =================
        tl.fromTo(card1, { opacity: 0, scale: 1.03, transformOrigin: "50% 50%", filter: "blur(12px) brightness(1.25) saturate(1)" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", filter: F0, duration: 0.38, ease: "power4.out" }, CARD1);
        echo("echo1", CARD1 + 0.14, 1.03);
        chip(1, CARD1 + 0.16);

        // "MONEY" — push-through slam (scale + blur), clipped inside the card
        show($("w-money"), CUE.money - LEAD);
        tl.fromTo($("w-money"), { scale: 1.5, filter: "blur(14px)" }, { scale: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" }, CUE.money - LEAD);
        unblur($("w-money"), CUE.money + 0.45);
        // "HARD" — red, drops in from the card's top edge with overshoot; card-local shake + flash
        show($("w-hard"), CUE.hard - LEAD);
        tl.fromTo($("w-hard"), { y: -100, scale: 1.5, rotation: -9 }, { y: 0, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, CUE.hard - LEAD);
        // blur rides a non-overshooting ease (an overshoot would drive blur() negative = invalid CSS)
        tl.fromTo($("w-hard"), { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, CUE.hard - LEAD);
        unblur($("w-hard"), CUE.hard + 0.52);
        redHit("hard", HIT1, 0.95, 0.5);
        ripple("rp-hard-1", HIT1, 2.2);
        ripple("rp-hard-2", HIT1 + 0.1, 2.7);
        flash("flash1", HIT1, 0.3);
        // "TO EARN." — side snaps from the right
        show($("w-to"), CUE.to - LEAD);
        tl.fromTo($("w-to"), { x: 80, filter: "blur(10px)" }, { x: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, CUE.to - LEAD);
        unblur($("w-to"), CUE.to + 0.36);
        show($("w-earn"), CUE.earn - LEAD);
        tl.fromTo($("w-earn"), { x: 110, skewX: -14, filter: "blur(10px)" }, { x: 0, skewX: 0, filter: "blur(0px)", duration: 0.38, ease: "expo.out" }, CUE.earn - LEAD);
        unblur($("w-earn"), CUE.earn + 0.4);
        closeQuote(1, 1.4);
        sheen("sheen1", 1.46);

        // ================= Scene 2 (1.7–3.5): belief 1 folds into the LEFT rail, belief 2 takes the TOP band =================
        // the top card collapses into its own bottom-left corner (stays inside the top band) ...
        tl.fromTo(card1, { scale: 1, opacity: 1, transformOrigin: "0% 100%" }, { scale: 0.3, opacity: 0, transformOrigin: "0% 100%", duration: 0.3, ease: "power2.in", immediateRender: false }, CARD2 - 0.06);
        // ... and its compact twin unfolds down the rail from that corner
        tl.fromTo(card1c, { opacity: 0, scale: 0.3, transformOrigin: "0% 0%" }, { opacity: 1, scale: 1, transformOrigin: "0% 0%", duration: 0.45, ease: "back.out(1.2)" }, CARD2 + 0.12);
        tl.fromTo(card1c, { filter: "blur(8px) brightness(1.3) saturate(1)" }, { filter: F0, duration: 0.32, ease: "power3.out" }, CARD2 + 0.12);
        tl.fromTo(card1c, { filter: F0 }, { filter: "blur(0px) brightness(0.8) saturate(0.85)", duration: 0.5, ease: "power2.out", immediateRender: false }, CARD2 + 0.7);
        // belief 2 grows in place with a tilt settle
        tl.fromTo(card2, { opacity: 0, scale: 0.92, rotation: -1.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 0, transformOrigin: "50% 50%", duration: 0.46, ease: "back.out(1.4)" }, CARD2);
        tl.fromTo(card2, { filter: "blur(12px) brightness(1.25) saturate(1)" }, { filter: F0, duration: 0.34, ease: "power3.out" }, CARD2);
        echo("echo2", CARD2 + 0.18, 1.03);
        chip(2, CARD2 + 0.16);

        // "WANTING" — heavy rise with a tilt (rises in from the card's bottom edge)
        show($("w-wanting"), CUE.wanting - LEAD);
        tl.fromTo($("w-wanting"), { y: 70, rotation: 7, filter: "blur(10px)" }, { y: 0, rotation: 0, filter: "blur(0px)", duration: 0.45, ease: "circ.out" }, CUE.wanting - LEAD);
        unblur($("w-wanting"), CUE.wanting + 0.47);
        // "MORE" — pop
        show($("w-more"), CUE.more - LEAD);
        tl.fromTo($("w-more"), { scale: 0.2 }, { scale: 1, duration: 0.4, ease: "back.out(1.4)" }, CUE.more - LEAD);
        // "IS" — snap from the left
        show($("w-is"), CUE.is - LEAD);
        tl.fromTo($("w-is"), { x: -70, filter: "blur(8px)" }, { x: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, CUE.is - LEAD);
        unblur($("w-is"), CUE.is + 0.32);
        // "SELFISH." — red scale slam, card-local shake + flash
        show($("w-selfish"), CUE.selfish - LEAD);
        tl.fromTo($("w-selfish"), { scale: 1.6, filter: "blur(16px)" }, { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, CUE.selfish - LEAD);
        unblur($("w-selfish"), CUE.selfish + 0.47);
        redHit("selfish", HIT2, 0.95, 0.5);
        ripple("rp-selfish-1", HIT2, 2.1);
        ripple("rp-selfish-2", HIT2 + 0.1, 2.6);
        flash("flash2", HIT2, 0.32);
        closeQuote(2, 3.0);
        sheen("sheen2", 3.04);

        // ================= Scene 3 (3.5–5.92): belief 2 folds into the RIGHT rail, belief 3 owns the lower band =================
        tl.fromTo(card2, { scale: 1, opacity: 1, transformOrigin: "100% 100%" }, { scale: 0.3, opacity: 0, transformOrigin: "100% 100%", duration: 0.3, ease: "power2.in", immediateRender: false }, 3.36);
        tl.fromTo(card2c, { opacity: 0, scale: 0.3, transformOrigin: "100% 0%" }, { opacity: 1, scale: 1, transformOrigin: "100% 0%", duration: 0.45, ease: "back.out(1.2)" }, 3.54);
        tl.fromTo(card2c, { filter: "blur(8px) brightness(1.3) saturate(1)" }, { filter: F0, duration: 0.32, ease: "power3.out" }, 3.54);
        tl.fromTo(card2c, { filter: F0 }, { filter: "blur(0px) brightness(0.8) saturate(0.85)", duration: 0.5, ease: "power2.out", immediateRender: false }, 4.1);
        tl.fromTo(card1c, { filter: "blur(0px) brightness(0.8) saturate(0.85)" }, { filter: "blur(0px) brightness(0.66) saturate(0.75)", duration: 0.5, ease: "power2.out", immediateRender: false }, 3.6);
        // belief 3 grows in place, biggest card of the scene
        tl.fromTo(card3, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.3)" }, CARD3);
        tl.fromTo(card3, { filter: "blur(14px) brightness(1.3) saturate(1)" }, { filter: F0, duration: 0.34, ease: "power3.out" }, CARD3);
        echo("echo3", CARD3 + 0.16, 1.02);
        chip(3, CARD3 + 0.14);

        // "PEOPLE LIKE US" — a triplet of drops from the card's top edge, alternating tilt
        [["people", -8], ["like", 8], ["us", -6]].forEach(function (p) {
          var el = $("w-" + p[0]);
          show(el, CUE[p[0]] - LEAD);
          tl.fromTo(el, { y: -80, rotation: p[1], filter: "blur(10px)" }, { y: 0, rotation: 0, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, CUE[p[0]] - LEAD);
          unblur(el, CUE[p[0]] + 0.42);
        });
        // "CAN" — snap from the left
        show($("w-can"), CUE.can - LEAD);
        tl.fromTo($("w-can"), { x: -80, filter: "blur(10px)" }, { x: 0, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, CUE.can - LEAD);
        unblur($("w-can"), CUE.can + 0.34);
        // "NEVER" — the biggest hit: tilt-down slam, card flash, card shake, zone-confined bloom, sparks, ripples
        show($("w-never"), CUE.never - LEAD);
        tl.fromTo($("w-never"), { scale: 1.5, y: -40, rotationX: 62 }, { scale: 1, y: 0, rotationX: 0, duration: 0.5, ease: "back.out(1.4)" }, CUE.never - LEAD);
        tl.fromTo($("w-never"), { filter: "blur(22px)" }, { filter: "blur(0px)", duration: 0.34, ease: "power3.out" }, CUE.never - LEAD);
        unblur($("w-never"), CUE.never + 0.52);
        redHit("never", HIT3, 1, 0.62);
        ripple("rp-never-1", HIT3, 1.5);
        ripple("rp-never-2", HIT3 + 0.09, 1.85);
        ripple("rp-never-3", HIT3 + 0.18, 2.2);
        flash("flash3", HIT3, 0.45);
        tl.fromTo(card3, { scale: 1.02 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, HIT3);
        tl.fromTo($("bloom3"), { opacity: 0 }, { opacity: 0.55, duration: 0.28, ease: "power2.out" }, HIT3);
        tl.fromTo($("bloom3"), { opacity: 0.55 }, { opacity: 0.32, duration: 0.7, ease: "power2.out", immediateRender: false }, HIT3 + 0.28);
        sparks.forEach(function (q, i) {
          var rad = (q.a * Math.PI) / 180;
          var at = HIT3 + 0.02 + (i % 3) * 0.015;
          tl.fromTo(q.el, { x: 0, y: 0, rotation: q.a, scaleX: 0.3 }, { x: Math.cos(rad) * q.r, y: Math.sin(rad) * q.r * 0.6, rotation: q.a, scaleX: 1, duration: 0.55, ease: "power3.out" }, at);
          fade(q.el, at, 1, 0.55);
        });
        // heavy chains draw across BOTH rail cards, link by link, then the padlocks clamp
        chains.forEach(function (links, c) {
          links.forEach(function (lk, i) {
            tl.fromTo(lk, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2.6)" }, HIT3 + 0.02 + (c % 2) * 0.08 + i * 0.016);
          });
        });

        // "BE WEALTHY." — rises; the padlocks snap shut
        show($("w-be"), CUE.be - LEAD);
        tl.fromTo($("w-be"), { y: 56, filter: "blur(8px)" }, { y: 0, filter: "blur(0px)", duration: 0.38, ease: "circ.out" }, CUE.be - LEAD);
        unblur($("w-be"), CUE.be + 0.4);
        show($("w-wealthy"), CUE.wealthy - LEAD);
        tl.fromTo($("w-wealthy"), { y: 56, scale: 1.14, filter: "blur(10px)", transformOrigin: "0% 60%" }, { y: 0, scale: 1, filter: "blur(0px)", transformOrigin: "0% 60%", duration: 0.42, ease: "circ.out" }, CUE.wealthy - LEAD);
        unblur($("w-wealthy"), CUE.wealthy + 0.47);
        ["L", "R"].forEach(function (sd, k) {
