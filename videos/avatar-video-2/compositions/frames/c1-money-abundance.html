    var len = 430 + prand(i * 5 + 4) * 170;

  }

  // ---------- globe: projected wireframe (rotation = shifting meridians) ----------
  var R = 270, TILT = 0.42, CT = Math.cos(TILT), ST = Math.sin(TILT);
  var gFront = el("gfront"), gBack = el("gback"), gNodes = el("nodes");
  var LATS = [-60, -30, 0, 30, 60], NMER = 12;
  var glines = [];
  function mkPath(parent) { var q = document.createElementNS(SVGNS, "path"); parent.appendChild(q); return q; }
  for (i = 0; i < LATS.length; i++) glines.push({ lat: true, v: LATS[i] * PI / 180, f: mkPath(gFront), b: mkPath(gBack) });
  for (i = 0; i < NMER; i++) glines.push({ lat: false, v: (i / NMER) * TAU, f: mkPath(gFront), b: mkPath(gBack) });
  var nodes = [];
  for (i = 0; i < 14; i++) {
    var nc = document.createElementNS(SVGNS, "circle");
    nc.setAttribute("r", (4 + prand(i * 23 + 1) * 3).toFixed(1));
    nc.setAttribute("fill", "#FFF3C8");
    gNodes.appendChild(nc);
    var halo = document.createElementNS(SVGNS, "circle");
    halo.setAttribute("r", "13");
    halo.setAttribute("fill", "#FFC24A");
    gNodes.insertBefore(halo, nc);
    nodes.push({ c: nc, h: halo, lat: (prand(i * 3 + 7) * 2 - 1) * 1.05, lon: prand(i * 7 + 5) * TAU, ph: prand(i * 9 + 3) * TAU });
  }
  function proj(lat, lon, out) {
    var cl = Math.cos(lat);
    var x0 = R * cl * Math.sin(lon), y0 = -R * Math.sin(lat), z0 = R * cl * Math.cos(lon);

  }
  var pa = [0, 0, 0], pb = [0, 0, 0];
  function drawLine(L, phi) {
    var n = L.lat ? 56 : 28, fs = "", bs = "", lastF = -2, lastB = -2, k;
    for (k = 0; k < n; k++) {
      var t0 = k / n, t1 = (k + 1) / n;
      if (L.lat) { proj(L.v, t0 * TAU + phi, pa); proj(L.v, t1 * TAU + phi, pb); }
      else { proj(-PI / 2 + t0 * PI, L.v + phi, pa); proj(-PI / 2 + t1 * PI, L.v + phi, pb); }
      if (pa[2] + pb[2] >= 0) {
        if (lastF !== k) fs += "M" + f1(pa[0]) + " " + f1(pa[1]);
        fs += "L" + f1(pb[0]) + " " + f1(pb[1]); lastF = k + 1;
      } else {
        if (lastB !== k) bs += "M" + f1(pa[0]) + " " + f1(pa[1]);
        bs += "L" + f1(pb[0]) + " " + f1(pb[1]); lastB = k + 1;
      }
    }

    L.b.setAttribute("d", bs || "M0 0");
  }
  function globeAt(t) {
    var phi = 0.62 * t + 1.7 * (1 - Math.exp(-3.4 * t));
    for (var k = 0; k < glines.length; k++) drawLine(glines[k], phi);
    for (k = 0; k < nodes.length; k++) {
      var nd = nodes[k];

      var vis = smooth(pa[2] / R * 3);
      var tw = 0.55 + 0.45 * Math.sin(nd.ph + t * 9);
      nd.c.setAttribute("cx", f1(pa[0])); nd.c.setAttribute("cy", f1(pa[1]));
      nd.h.setAttribute("cx", f1(pa[0])); nd.h.setAttribute("cy", f1(pa[1]));
      nd.c.setAttribute("opacity", (vis * (0.6 + 0.4 * tw)).toFixed(3));
      nd.h.setAttribute("opacity", (vis * 0.28 * tw).toFixed(3));

  }

  // ---------- burst: coins + notes fly outward from behind the globe (center-outward-expansion) ----------
  // [kind, size, targetX, targetY, depth(0 far,1 mid,2 near), rot]
  var BURST = [
    ["coin", 104, -380, -392, 1, -12],
    ["note", 172, 352, -414, 1, 16],
    ["coin", 72, 128, -472, 0, 8],
    ["coin", 128, -446, 150, 2, 14],
    ["note", 150, -214, -486, 0, -10],
    ["coin", 92, 446, 168, 1, -8],
    ["note", 200, 468, -166, 2, -22],
    ["coin", 64, -474, -150, 0, 0],

    ["coin", 78, 436, 322, 1, -14]

  var bursts = [];
  BURST.forEach(function (b, k) {
    var it = item(el(b[4] === 2 ? "burstnear" : "burstback"), b[0], b[1], 540, 600, b[4] > 0);
    bursts.push({ it: it, b: b, k: k, ph: prand(k * 31 + 3) * TAU, spin: 3 + prand(k * 37 + 1) * 4 });
  });

  // ---------- rain: parallax layers (seeded) ----------
  var RAIN_AT = 0.72;
  var rain = [];
  function addRain(layer, count, smin, smax, vmin, vmax, xs, seed, noteEvery) {
    for (var k = 0; k < count; k++) {
      var kind = noteEvery && k % noteEvery === noteEvery - 1 ? "note" : "coin";
      var size = smin + prand(seed + k * 3 + 1) * (smax - smin);
      if (kind === "note") size *= 1.6;
      var x = xs ? xs[k % xs.length] + (prand(seed + k * 5 + 2) - 0.5) * 60 : 40 + ((k + prand(seed + k * 5 + 2) * 0.8) / count) * 1000;
      var it = item(el(layer), kind, size, x, 0, layer !== "rainfar");
      rain.push({ it: it, y0: -size - 40 - prand(seed + k * 7 + 3) * 620, v: vmin + prand(seed + k * 11 + 4) * (vmax - vmin), w: (6 + prand(seed + k * 13 + 5) * 8) * (k % 2 ? 1 : -1), ph: prand(seed + k * 17 + 6) * TAU, rot: (prand(seed + k * 19 + 7) - 0.5) * 50, note: kind === "note" });
    }
  }
  addRain("rainfar", 12, 34, 52, 620, 880, null, 100, 0);
  addRain("rainmid", 10, 62, 88, 980, 1280, null, 300, 4);
  addRain("rainnear", 4, 124, 150, 1500, 1850, [70, 1000, 180, 900], 500, 0);

  // ---------- orbit rings (orbit-3d-entry): two tilted rings, z-ordered around the globe ----------
  var RINGS = [
    { rx: 400, ry: 104, tilt: -10 * PI / 180, n: 7, size: 80, w: 0.95, at: 0.72 },
    { rx: 340, ry: 143, tilt: 17 * PI / 180, n: 6, size: 64, w: -1.15, at: 0.78 }
  ];
  var orbs = [];
  RINGS.forEach(function (rg, r) {
    for (var k = 0; k < rg.n; k++) {
      var o = document.createElement("div");
      o.className = P + "orb";
      o.style.width = rg.size + "px"; o.style.height = rg.size + "px";
      o.style.marginLeft = (-rg.size / 2) + "px"; o.style.marginTop = (-rg.size / 2) + "px";
      var inn = document.createElement("div");
      inn.className = P + "in " + P + "sh";
      var spn = document.createElement("div");
      spn.className = P + "in";
      spn.appendChild(money("coin"));
      inn.appendChild(spn);
      o.appendChild(inn);
      el("orbits").appendChild(o);
      orbs.push({ o: o, i: inn, sp: spn, rg: rg, a0: (k / rg.n) * TAU + r * 0.4, ord: r + k * 2, ph: prand(r * 50 + k * 7) * TAU });
    }
  });

  // ---------- chip sparkle pool ----------
  var sparks = [];
  for (i = 0; i < 20; i++) {
    var star = i % 3 !== 2;
    var sa = i / 20 * TAU + (prand(i * 5 + 1) - 0.5) * 0.3;
    var ox = Math.cos(sa) * 380, oy = Math.sin(sa) * 54;
    var nx = Math.cos(sa) / 380, ny = Math.sin(sa) / 54, nl = Math.sqrt(nx * nx + ny * ny);
    nx /= nl; ny /= nl;
    var spd = 300 + prand(i * 7 + 2) * 340;
    var sz = star ? 22 + prand(i * 11 + 3) * 20 : 7 + prand(i * 11 + 3) * 5;
    var node;
    if (star) {
      node = document.createElementNS(SVGNS, "svg");
      node.setAttribute("viewBox", "-32 -32 64 64");
      node.setAttribute("width", f1(sz)); node.setAttribute("height", f1(sz));
      var su = document.createElementNS(SVGNS, "use");
      su.setAttribute("href", "#" + P + "star");
      su.setAttribute("x", "-32"); su.setAttribute("y", "-32"); su.setAttribute("width", "64"); su.setAttribute("height", "64");
      node.appendChild(su);
    } else {
      node = document.createElement("i");
      node.style.width = f1(sz) + "px"; node.style.height = f1(sz) + "px";
      node.style.borderRadius = "50%"; node.style.background = "#FFE1A0"; node.style.boxShadow = "0 0 12px #FFC24A";
    }
    node.setAttribute("class", P + "spk");
    node.style.marginLeft = f1(-sz / 2) + "px"; node.style.marginTop = f1(-sz / 2) + "px";
    el("sparks").appendChild(node);
    sparks.push({ el: node, ox: ox, oy: oy, vx: nx * spd, vy: ny * spd * 0.7, k: 4.5 + prand(i * 13 + 4) * 1.5, spin: (prand(i * 17 + 5) * 2 - 1) * 280, star: star });

  var tl = gsap.timeline({ paused: true });

  // ---------- AMBIENT: one finite clock, every layer a pure function of t ----------
  var blob = el("blob"), blob2 = el("blob2"), gold = el("goldglow"), ringG = el("ringg"), raysEl = el("rayg");
  var amb = { t: 0 };

    var t = amb.t, k;

    blob.style.transform = "translate(" + f1(40 * Math.sin(t * 0.9)) + "px," + f1(-30 * t) + "px)";
    blob2.style.transform = "translate(" + f1(-30 * t) + "px," + f1(20 * Math.sin(t * 1.1)) + "px)";
    gold.style.opacity = (0.16 + 0.03 * Math.sin(t * 2.4)).toFixed(3);
    ringG.setAttribute("transform", "rotate(" + (t * 6).toFixed(2) + ")");
    for (k = 0; k < dust.length; k++) {
      var dd = dust[k];

    // rays: slow rotation

    // globe

    // burst items: tumble/spin + float once launched
    for (k = 0; k < bursts.length; k++) {
      var bu = bursts[k], b = bu.b;

      rr.it.o.style.opacity = "1";
      rr.it.o.style.transform = "translateY(" + f1(y) + "px)";
      if (rr.note) {
        rr.it.i.style.transform = "rotate(" + f1(rr.rot + 22 * Math.sin(rr.ph + rt * 7)) + "deg) scaleY(" + (0.4 + 0.6 * Math.abs(Math.cos(rr.ph + rt * 6))).toFixed(3) + ")";
      } else {

        rr.it.i.style.transform = "rotate(" + f1(rr.rot) + "deg) scaleX(" + (Math.abs(c) < 0.06 ? 0.06 : c).toFixed(3) + ")";

      var ob = orbs[k], rg = ob.rg;

      var ex = Math.cos(a) * rg.rx, ey = Math.sin(a) * rg.ry;

      var dep = Math.sin(a);

      ob.o.style.zIndex = String(dep >= 0 ? 31 + Math.round(dep * 8) : 11 + Math.round((dep + 1) * 8));
      ob.o.style.opacity = (0.72 + 0.28 * (dep + 1) / 2).toFixed(3);

  // ---------- camera: slow push (1.00 -> 1.05) ----------
  tl.fromTo(el("cam"), { scale: 1, y: 0 }, { scale: 1.05, y: -6, duration: DUR, ease: "power1.inOut" }, 0);

  // ---------- SCENE 1 (0.0-0.7): globe bursts in, rays bloom, coins + notes fly out ----------
  tl.fromTo(el("flash"), { scale: 0.35, opacity: 0.95 }, { scale: 1.5, opacity: 0, duration: 0.5, ease: "power2.out" }, 0);
  tl.fromTo(el("globewrap"), { scale: 0.4, rotation: -28 }, { scale: 1, rotation: 0, duration: 0.62, ease: "back.out(1.5)" }, 0);
  tl.fromTo(el("globewrap"), { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.34, ease: "power3.out" }, 0);
  tl.set(el("globewrap"), { filter: "none" }, 0.36);
  tl.fromTo(el("rays"), { scale: 0.45, opacity: 0 }, { scale: 1, opacity: 0.42, duration: 0.7, ease: "power2.out" }, 0.02);
  tl.fromTo(el("goldglow"), { scale: 0.7 }, { scale: 1, duration: 0.8, ease: "power2.out" }, 0);
  // globe light sweep right after it lands
  tl.fromTo(el("gsheen"), { attr: { x: -560 } }, { attr: { x: 420 }, duration: 0.55, ease: "power1.inOut" }, 0.5);

  bursts.forEach(function (bu) {
    var b = bu.b, near = b[4] === 2, far = b[4] === 0;
    var st = near ? 0.4 : 0;

      { x: b[2] * st, y: b[3] * st, scale: near ? 0.5 : 0.2, rotation: b[5] - 160, opacity: 0, filter: "blur(" + (near ? 16 : 10) + "px)" },

      at);

  // ---------- SCENE 2 (0.7-1.88): "money" -> rain + orbit rings; "world" -> chip ----------

  // chip springs in on "world" @1.36, glow blooms as one beat, sparkle burst, light sweep
  tl.fromTo(el("chip"), { scale: 0.3, y: 46, rotationX: -70, opacity: 0, transformPerspective: 800 }, { scale: 1, y: 0, rotationX: 0, opacity: 1, duration: 0.46, ease: "back.out(1.8)" }, 1.36);

  var SPARK_AT = 1.42, FLIGHT = 0.46, drv = { T: 0 };
  function writeSparks() {

    for (var k = 0; k < sparks.length; k++) {

      var x = q.ox + q.vx * e / q.k, y = q.oy + q.vy * e / q.k + 80 * tt * tt;

  tl.fromTo(drv, { T: 0 }, { T: 1, duration: FLIGHT, ease: "none", onUpdate: writeSparks }, SPARK_AT);

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
