  for (i = 0; i < LATS.length; i++) glines.push({ lat: true, v: LATS[i] * PI / 180, f: mkPath(gFront), b: mkPath(gBack) });
  for (i = 0; i < NMER; i++) glines.push({ lat: false, v: (i / NMER) * TAU, f: mkPath(gFront), b: mkPath(gBack) });
  var nodes = [];
  for (i = 0; i < 12; i++) {
    var halo = document.createElementNS(SVGNS, "circle");
    halo.setAttribute("r", "26"); halo.setAttribute("fill", "#FFC24A");
    gNodes.appendChild(halo);
    var nc = document.createElementNS(SVGNS, "circle");
    nc.setAttribute("r", (9 + prand(i * 23 + 1) * 5).toFixed(1)); nc.setAttribute("fill", "#FFF3C8");
    gNodes.appendChild(nc);
    nodes.push({ c: nc, h: halo, lat: (prand(i * 3 + 7) * 2 - 1) * 1.05, lon: prand(i * 7 + 5) * TAU, ph: prand(i * 9 + 3) * TAU });
  }
  function proj(lat, lon, out) {
    var cl = Math.cos(lat);
    var x0 = R * cl * Math.sin(lon), y0 = -R * Math.sin(lat), z0 = R * cl * Math.cos(lon);
    out[0] = x0; out[1] = y0 * CT + z0 * ST; out[2] = -y0 * ST + z0 * CT;
  }
  var pa = [0, 0, 0], pb = [0, 0, 0];
  function drawLine(L, phi) {
    var n = L.lat ? 48 : 24, fs = "", bs = "", lastF = -2, lastB = -2, k;
    for (k = 0; k < n; k++) {
      var t0 = k / n, t1 = (k + 1) / n;
      if (L.lat) { proj(L.v, t0 * TAU + phi, pa); proj(L.v, t1 * TAU + phi, pb); }
      else { proj(-PI / 2 + t0 * PI, L.v + phi, pa); proj(-PI / 2 + t1 * PI, L.v + phi, pb); }
      if (pa[2] + pb[2] >= 0) {
        if (lastF !== k) fs += "M" + f1(pa[0]) + " " + f1(pa[1]);
        fs += "L" + f1(pb[0]) + " " + f1(pb[1]); lastF = k + 1;
      } else {
        if (lastB !== k) bs += "M" + f1(pa[0]) + " " + f1(pa[1]);
        bs += "L" + f1(pb[0]) + " " + f1(pb[1]); lastB = k + 1;
      }
    }
    L.f.setAttribute("d", fs || "M0 0");
    L.b.setAttribute("d", bs || "M0 0");
  }
  function globeAt(t) {
    var phi = 0.7 * t + 1.7 * (1 - Math.exp(-3.4 * t));
    for (var k = 0; k < glines.length; k++) drawLine(glines[k], phi);
    for (k = 0; k < nodes.length; k++) {
      var nd = nodes[k];
      proj(nd.lat, nd.lon + phi, pa);
      var vis = smooth(pa[2] / R * 3), tw = 0.55 + 0.45 * Math.sin(nd.ph + t * 9);
      nd.c.setAttribute("cx", f1(pa[0])); nd.c.setAttribute("cy", f1(pa[1]));
      nd.h.setAttribute("cx", f1(pa[0])); nd.h.setAttribute("cy", f1(pa[1]));
      nd.c.setAttribute("opacity", (vis * (0.6 + 0.4 * tw)).toFixed(3));
      nd.h.setAttribute("opacity", (vis * 0.28 * tw).toFixed(3));
    }
  }

  // ---------- burst inside the card: coins + notes fly outward from behind the globe ----------
  // [kind, size, targetX, targetY (offset from card centre), depth 0 far / 1 mid / 2 near, rot]
  var BURST = [
    ["coin", 64, -404, -46, 1, -12],
    ["note", 112, 386, -44, 1, 14],
    ["coin", 50, -352, 54, 0, 6],
    ["coin", 56, 344, 56, 0, -6],
    ["note", 88, -236, -64, 0, -8],
    ["coin", 78, 426, 42, 2, 10],
    ["coin", 46, 236, -68, 0, 0],
    ["coin", 74, -434, 36, 2, -14]
  ];
  var bursts = [];
  BURST.forEach(function (b, k) {
    var it = item(el("burst"), b[0], b[1], 457, 97, b[4] > 0, false);
    bursts.push({ it: it, b: b, k: k, ph: prand(k * 31 + 3) * TAU, spin: 3 + prand(k * 37 + 1) * 4 });
  });

  // ---------- orbit rings (orbit-3d-entry) ----------
  var RINGS = [
    { rx: 330, ry: 42, tilt: -5 * PI / 180, n: 7, size: 40, w: 1.0, at: 0.72 },
    { rx: 268, ry: 50, tilt: 6 * PI / 180, n: 6, size: 34, w: -1.2, at: 0.78 }
  ];
  var orbs = [];
  RINGS.forEach(function (rg, r) {
    for (var k = 0; k < rg.n; k++) {
      var o = document.createElement("div");
      o.className = P + "orb";
      o.style.width = rg.size + "px"; o.style.height = rg.size + "px";
      o.style.marginLeft = (-rg.size / 2) + "px"; o.style.marginTop = (-rg.size / 2) + "px";
      var inn = document.createElement("div");
      inn.className = P + "in " + P + "sh";
      var spn = document.createElement("div");
      spn.className = P + "in";
      spn.appendChild(money("coin"));
      inn.appendChild(spn);
      o.appendChild(inn);
      el("orbits").appendChild(o);
      orbs.push({ o: o, i: inn, sp: spn, rg: rg, a0: (k / rg.n) * TAU + r * 0.4, ph: prand(r * 50 + k * 7) * TAU });
    }
  });

  // ---------- rail rain (seeded), x stays inside each rail ----------
  var RAIN_AT = 0.72, rain = [];
  function addRain(layer, w, count, smin, smax, vmin, vmax, seed, noteEvery) {
    for (var k = 0; k < count; k++) {
      var kind = noteEvery && k % noteEvery === noteEvery - 1 ? "note" : "coin";
      var size = smin + prand(seed + k * 3 + 1) * (smax - smin);
      if (kind === "note") size *= 1.5;
      var half = size / 2;
      var x = half + ((k + 0.2 + prand(seed + k * 5 + 2) * 0.6) / count) * (w - size);
      var it = item(el(layer), kind, size, x, 0, layer.indexOf("far") < 0, false);
      var hh = kind === "note" ? size * 0.5 : size;
      rain.push({ it: it, h: hh, d: prand(seed + k * 7 + 3) * 0.42, span: 524 + hh * 2 + 20, v: vmin + prand(seed + k * 11 + 4) * (vmax - vmin), w: (6 + prand(seed + k * 13 + 5) * 7) * (k % 2 ? 1 : -1), ph: prand(seed + k * 17 + 6) * TAU, rot: (prand(seed + k * 19 + 7) - 0.5) * 40, note: kind === "note" });
    }
  }
  addRain("Lfar", 280, 6, 36, 50, 380, 520, 100, 0);
  addRain("Lmid", 280, 5, 62, 84, 600, 760, 200, 4);
  addRain("Lnear", 280, 2, 100, 116, 900, 1050, 300, 0);
  addRain("Rfar", 330, 7, 36, 50, 380, 520, 400, 0);
  addRain("Rmid", 330, 5, 62, 84, 600, 760, 500, 3);
  addRain("Rnear", 330, 2, 100, 116, 900, 1050, 600, 0);

  // ---------- chip sparkle pool (stays inside the LOWER band) ----------
  var sparks = [];
  for (i = 0; i < 20; i++) {
    var star = i % 3 !== 2;
    var sa = i / 20 * TAU + (prand(i * 5 + 1) - 0.5) * 0.3;
    var ox = Math.cos(sa) * 410, oy = Math.sin(sa) * 46;
    var nx = Math.cos(sa) / 410, ny = Math.sin(sa) / 46, nl = Math.sqrt(nx * nx + ny * ny);
    nx /= nl; ny /= nl;
    var spd = 260 + prand(i * 7 + 2) * 300;
    var sz = star ? 20 + prand(i * 11 + 3) * 16 : 7 + prand(i * 11 + 3) * 4;
    var node;
    if (star) {
      node = document.createElementNS(SVGNS, "svg");
      node.setAttribute("viewBox", "-32 -32 64 64");
      node.setAttribute("width", f1(sz)); node.setAttribute("height", f1(sz));
      var su = document.createElementNS(SVGNS, "use");
      su.setAttribute("href", "#" + P + "star");
      su.setAttribute("x", "-32"); su.setAttribute("y", "-32"); su.setAttribute("width", "64"); su.setAttribute("height", "64");
      node.appendChild(su);
    } else {
      node = document.createElement("i");
      node.style.width = f1(sz) + "px"; node.style.height = f1(sz) + "px";
      node.style.borderRadius = "50%"; node.style.background = "#FFE1A0"; node.style.boxShadow = "0 0 12px #FFC24A";
    }
    node.setAttribute("class", P + "spk");
    node.style.marginLeft = f1(-sz / 2) + "px"; node.style.marginTop = f1(-sz / 2) + "px";
    el("sparks").appendChild(node);
    sparks.push({ el: node, ox: ox, oy: oy, vx: nx * spd, vy: ny * spd * 0.25, k: 4.5 + prand(i * 13 + 4) * 1.5, spin: (prand(i * 17 + 5) * 2 - 1) * 280, star: star });
  }

  var tl = gsap.timeline({ paused: true });

  // ---------- AMBIENT: one finite clock ----------
  var raysEl = el("rayg"), cglow = el("cglow");
  var amb = { t: 0 };
  function applyAmbient() {
    var t = amb.t, k;
    cglow.style.opacity = (0.85 + 0.15 * Math.sin(t * 3)).toFixed(3);
    for (k = 0; k < dust.length; k++) {
      var dd = dust[k];
      dd.el.style.transform = "translate(" + f1(dd.x + 8 * Math.sin(dd.ph + t * 1.4)) + "px," + f1(dd.y - dd.v * t) + "px)";
      dd.el.style.opacity = (dd.base * (0.5 + 0.5 * Math.sin(dd.ph + t * dd.tw))).toFixed(3);
    }
    raysEl.setAttribute("transform", "rotate(" + (t * 10).toFixed(2) + ")");
    globeAt(t);
    for (k = 0; k < bursts.length; k++) {
      var bu = bursts[k], b = bu.b;
      var lt = Math.max(0, t - 0.06 - bu.k * 0.03);
      var bob = 4 * Math.sin(bu.ph + t * 2.4) * smooth(lt / 0.6);
      if (b[0] === "coin") {
        var sx = Math.cos(bu.ph + lt * bu.spin * (1 + 2.5 * Math.exp(-3 * lt)));
        bu.it.i.style.transform = "translateY(" + f1(bob) + "px) scaleX(" + (Math.abs(sx) < 0.06 ? 0.06 * (sx < 0 ? -1 : 1) : sx).toFixed(3) + ")";
      } else {
        bu.it.i.style.transform = "translateY(" + f1(bob) + "px) rotate(" + f1(8 * Math.sin(bu.ph + t * 3)) + "deg) scaleY(" + (0.55 + 0.45 * Math.abs(Math.cos(bu.ph + lt * 5.5))).toFixed(3) + ")";
      }
    }
    var rt = t - RAIN_AT;
    for (k = 0; k < rain.length; k++) {
      var rr = rain[k];
      var lr = rt - rr.d;
      if (lr < 0) { rr.it.o.style.opacity = "0"; continue; }
      // continuous pour: constant fall, wrapped (pure function of t); wrap point sits below the masked fade
      var y = -rr.h + ((rr.v * lr) % rr.span);
      rr.it.o.style.opacity = "1";
      rr.it.o.style.transform = "translateY(" + f1(y) + "px)";
      if (rr.note) {
        rr.it.i.style.transform = "rotate(" + f1(rr.rot + 22 * Math.sin(rr.ph + lr * 7)) + "deg) scaleY(" + (0.4 + 0.6 * Math.abs(Math.cos(rr.ph + lr * 6))).toFixed(3) + ")";
      } else {
        var c = Math.cos(rr.ph + rr.w * lr);
        rr.it.i.style.transform = "rotate(" + f1(rr.rot) + "deg) scaleX(" + (Math.abs(c) < 0.06 ? 0.06 : c).toFixed(3) + ")";
      }
    }
    for (k = 0; k < orbs.length; k++) {
      var ob = orbs[k], rg = ob.rg;
      var lo = Math.max(0, t - rg.at);
      var a = ob.a0 + rg.w * (lo + 0.35 * (1 - Math.exp(-4 * lo)));
      var ex = Math.cos(a) * rg.rx, ey = Math.sin(a) * rg.ry;
      var x = ex * Math.cos(rg.tilt) - ey * Math.sin(rg.tilt);
      var yy = ex * Math.sin(rg.tilt) + ey * Math.cos(rg.tilt);
      var dep = Math.sin(a);
      ob.o.style.transform = "translate(" + f1(x) + "px," + f1(yy) + "px) scale(" + (0.82 + 0.24 * dep).toFixed(3) + ")";
      ob.o.style.zIndex = String(dep >= 0 ? 31 + Math.round(dep * 8) : 11 + Math.round((dep + 1) * 8));
      ob.o.style.opacity = (0.72 + 0.28 * (dep + 1) / 2).toFixed(3);
      var spin = Math.cos(ob.ph + t * 7);
      ob.sp.style.transform = "scaleX(" + (Math.abs(spin) < 0.12 ? 0.12 * (spin < 0 ? -1 : 1) : spin).toFixed(3) + ")";
    }
  }
  applyAmbient();
  tl.fromTo(amb, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: applyAmbient }, 0);

  // ---------- SCENE 1 (0.0-0.7): the card grows in place, globe bursts in, rays bloom, money flies out ----------
  tl.fromTo(el("card"), { scaleX: 0.55, scaleY: 0.4, opacity: 0 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.32, ease: "expo.out" }, 0);
  // slow push on the card about its own centre
  tl.fromTo(el("card"), { scale: 1 }, { scale: 1.03, duration: DUR - 0.32, ease: "power1.inOut", immediateRender: false }, 0.32);
  tl.fromTo(el("flash"), { scale: 0.35, opacity: 0.95 }, { scale: 1.4, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.04);
  tl.fromTo(el("globewrap"), { scale: 0.35, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.62, ease: "back.out(1.6)" }, 0.02);
  tl.fromTo(el("globewrap"), { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, 0.02);
  tl.set(el("globewrap"), { filter: "none" }, 0.36);
  tl.fromTo(el("rays"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 0.5, duration: 0.7, ease: "power2.out" }, 0.04);
  tl.fromTo(el("gsheen"), { attr: { x: -560 } }, { attr: { x: 420 }, duration: 0.55, ease: "power1.inOut" }, 0.52);
  tl.fromTo(el("cardsheen"), { x: -260 }, { x: 960, duration: 0.6, ease: "power1.inOut" }, 0.5);

  bursts.forEach(function (bu) {
    var b = bu.b, near = b[4] === 2, far = b[4] === 0;
    var st = near ? 0.4 : 0;
    tl.fromTo(bu.it.o,
      { x: b[2] * st, y: b[3] * st, scale: near ? 0.5 : 0.2, rotation: b[5] - 160, opacity: 0, filter: "blur(" + (near ? 12 : 8) + "px)" },
      { x: b[2], y: b[3], scale: 1, rotation: b[5], opacity: far ? 0.75 : 1, filter: "blur(" + (near ? 3 : far ? 1.2 : 0) + "px)", duration: 0.85, ease: "expo.out" },
      0.06 + bu.k * 0.03);
  });

  // ---------- SCENE 2 (0.7-1.88): "money" -> orbits + rail rain; "world" -> chip ----------
  ["rbA", "rfA", "rbB", "rfB"].forEach(function (n, k) {
    var pth = el(n), L = pth.getTotalLength() * 1.02;
    pth.style.strokeDasharray = f1(L);
    tl.fromTo(pth, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.72 + (k > 1 ? 0.06 : 0));
  });
  orbs.forEach(function (ob, k) {
    tl.fromTo(ob.i,
      { rotationX: 70, rotationY: -100, z: -240, scale: 0.4, opacity: 0, transformPerspective: 500 },
      { rotationX: 0, rotationY: 0, z: 0, scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)" },
      ob.rg.at + (k % 7) * 0.035);
  });

  tl.fromTo(el("chip"), { scale: 0.3, y: 30, rotationX: -70, opacity: 0, transformPerspective: 800 }, { scale: 1, y: 0, rotationX: 0, opacity: 1, duration: 0.46, ease: "back.out(1.8)" }, 1.36);
  tl.fromTo(el("chipglow"), { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 0.42, duration: 0.4, ease: "power2.out" }, 1.38);
  tl.fromTo(el("chipsheen"), { x: -240 }, { x: 900, duration: 0.36, ease: "power1.inOut" }, 1.52);

  var SPARK_AT = 1.42, FLIGHT = 0.46, drv = { T: 0 };
  function writeSparks() {
    var T = drv.T, tt = T * FLIGHT;
    var op = T <= 0 ? 0 : smooth(T / 0.1) * (1 - smooth((T - 0.45) / 0.55));
    for (var k = 0; k < sparks.length; k++) {
      var q = sparks[k], e = 1 - Math.exp(-q.k * tt);
      var x = q.ox + q.vx * e / q.k, y = q.oy + q.vy * e / q.k + 60 * tt * tt;
      if (y < -56) y = -56; if (y > 66) y = 66; // band-confined: y 892-1014
      var sc = q.star ? 0.4 + 0.6 * smooth(T / 0.2) : 1;
      q.el.style.transform = "translate(" + f1(x) + "px," + f1(y) + "px) rotate(" + f1(q.spin * tt) + "deg) scale(" + sc.toFixed(3) + ")";
      q.el.style.opacity = op.toFixed(3);
    }
  }
  writeSparks();
  tl.fromTo(drv, { T: 0 }, { T: 1, duration: FLIGHT, ease: "none", onUpdate: writeSparks, immediateRender: false }, SPARK_AT);

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
</template>
