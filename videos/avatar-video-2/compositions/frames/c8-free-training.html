<script>
(function () {
  var P = "c8-free-training-";
  var DUR = 2.2;
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(n) { return document.getElementById(P + n); }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function prand(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  // ONE onset grid: the voiceover word cues (local seconds)
  var CUE = { start: 0.10, with: 0.42, the: 0.66, free: 0.82, one: 1.22, hour: 1.54, training: 1.78 };

  var tl = gsap.timeline({ paused: true });

  // =================== CLOCK RING (measured) ===================
  var sweep = el("sweep");
  var SWEEP_LEN = sweep.getTotalLength();
  sweep.style.strokeDasharray = SWEEP_LEN + " " + SWEEP_LEN;
  sweep.style.strokeDashoffset = String(SWEEP_LEN);
  var ticksG = el("ticks");
  var ticks = [];
  for (var k = 0; k < 12; k++) {
    var a = (k * 30 - 90) * Math.PI / 180;
    var r1 = k % 3 === 0 ? 79 : 82, r2 = 90;
    var ln = document.createElementNS(SVGNS, "line");
    ln.setAttribute("x1", (100 + Math.cos(a) * r1).toFixed(1));
    ln.setAttribute("y1", (100 + Math.sin(a) * r1).toFixed(1));
    ln.setAttribute("x2", (100 + Math.cos(a) * r2).toFixed(1));
    ln.setAttribute("y2", (100 + Math.sin(a) * r2).toFixed(1));
    ln.setAttribute("stroke", "#FFC24A");
    ln.setAttribute("stroke-width", k % 3 === 0 ? "4" : "2.5");
    ln.setAttribute("stroke-linecap", "round");
    ln.setAttribute("stroke-opacity", "0.25");
    ticksG.appendChild(ln);
    ticks.push(ln);
  }
  var head = el("sweephead"), timeEl = el("time"), barFill = el("barfill");

  // =================== PARTICLES (index-seeded, inside the right column clip) ===================
  function makePool(field, n, seed, cfg) {
    var parts = [];
    for (var j = 0; j < n; j++) {
      var e = document.createElement("div");
      e.className = "c8-part";
      var size = cfg.smin + prand(seed + j * 3 + 1) * (cfg.smax - cfg.smin);
      var chip = j % 3 === 0;
      e.style.width = size.toFixed(1) + "px";
      e.style.height = (chip ? size * 0.55 : size).toFixed(1) + "px";
      e.style.borderRadius = chip ? "2px" : "50%";
      var col = cfg.colors[j % cfg.colors.length];
      e.style.background = col;
      e.style.boxShadow = "0 0 " + (size * 1.2).toFixed(0) + "px " + col;
      e.style.marginLeft = (-size / 2).toFixed(1) + "px";
      e.style.marginTop = (-size / 2).toFixed(1) + "px";
      field.appendChild(e);
      var ang = prand(seed + j * 5 + 2) * Math.PI * 2;
      var spd = cfg.vmin + prand(seed + j * 7 + 3) * (cfg.vmax - cfg.vmin);
      parts.push({ el: e, ox: Math.cos(ang) * cfg.rx, oy: Math.sin(ang) * cfg.ry, vx: Math.cos(ang) * spd * 0.7, vy: Math.sin(ang) * spd, spin: (prand(seed + j * 11 + 4) * 2 - 1) * 600 });
    }
    return parts;
  }
  function burst(parts, at, flight, G, fadeFrac) {
    var drive = { T: 0 };
    tl.fromTo(drive, { T: 0 }, {
      T: 1, duration: flight, ease: "none", immediateRender: false,
      onUpdate: function () {
        var t = drive.T * flight;
        var fade = Math.min(1, (1 - drive.T) / fadeFrac);
        var pop = Math.min(1, drive.T / 0.06);
        for (var q = 0; q < parts.length; q++) {
          var p = parts[q];
          var x = p.ox + p.vx * t, y = p.oy + p.vy * t + 0.5 * G * t * t;
          p.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (p.spin * t).toFixed(0) + "deg)";
          p.el.style.opacity = drive.T === 0 || drive.T === 1 ? "0" : String(fade * pop);
        }
      }
    }, at);
  }
  var freeBurst = makePool(el("burst"), 26, 2100, { smin: 5, smax: 13, colors: ["#FFC24A", "#FFE1A0", "#FFF5EA", "#FF5FB0"], rx: 130, ry: 60, vmin: 260, vmax: 620 });

  // =================== AMBIENT (one finite driver) ===================
  var floatEl = el("cardfloat"), pulses = [el("pulse0"), el("pulse1")], sglow = el("stampglow");
  var amb = { t: 0 };
  function ambient(t) {
    floatEl.style.transform = "translateY(" + (Math.sin(t * 2.6) * 3).toFixed(2) + "px) rotateY(" + (Math.sin(t * 1.7 + 0.6) * 1.0).toFixed(2) + "deg)";
    sglow.style.transform = "scale(" + (1 + 0.05 * Math.sin(t * 3.0)).toFixed(3) + ")";
    for (var w = 0; w < 2; w++) {
      var u = (t - 0.34 - w * 0.42) / 0.84;
      if (u < 0 || u > 2) { pulses[w].style.opacity = "0"; continue; }
      var f = u - Math.floor(u);
      pulses[w].style.transform = "scale(" + (1 + f * 0.55).toFixed(3) + ")";
      pulses[w].style.opacity = (0.75 * (1 - f) * (1 - f)).toFixed(3);
    }
  }
  ambient(0);
  tl.fromTo(amb, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { ambient(amb.t); } }, 0);
  ["toppush", "leftpush", "rightpush"].forEach(function (id) {
    tl.fromTo(el(id), { scale: 1 }, { scale: 1.03, duration: DUR, ease: "sine.inOut" }, 0);
  });

  // =================== SCENE 1: the card tilts in from the right edge ===================
  tl.fromTo(el("card"), { x: 460, rotationY: 34, opacity: 1 },
    { x: 0, rotationY: 0, duration: 0.72, ease: "power3.out" }, 0);
  tl.fromTo(el("card"), { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 0);
  tl.fromTo(el("topglow"), { opacity: 0 }, { opacity: 0.6, duration: 0.6, ease: "power2.out" }, 0.3);
  tl.fromTo(el("chip"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.7)" }, 0.24);
  tl.fromTo(el("play"), { scale: 0, rotation: -90, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.26);
  tl.fromTo(el("title"), { y: 76, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.48, ease: "expo.out" }, 0.34);
  tl.fromTo(el("cardsweep"), { x: -260, opacity: 0 }, { x: 1000, opacity: 1, duration: 0.62, ease: "power1.inOut" }, 0.56);

  // =================== SCENE 2: FREE slams onto the card's corner ===================
  tl.fromTo(el("stamp"), { scale: 2.8, rotation: -26, opacity: 0 },
    { scale: 1, rotation: -8, opacity: 1, duration: 0.3, ease: "power4.out" }, CUE.free - 0.06);
  tl.fromTo(el("stamp"), { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, CUE.free - 0.06);
  tl.fromTo(el("freeglow"), { opacity: 0 }, { opacity: 0.85, duration: 0.3, ease: "power2.out" }, CUE.free + 0.02);
  tl.fromTo(sglow, { opacity: 0 }, { opacity: 0.8, duration: 0.3, ease: "power2.out" }, CUE.free);
  tl.to(sglow, { opacity: 0.45, duration: 0.6, ease: "power2.inOut" }, CUE.free + 0.3);
  tl.to(el("card"), { y: 8, duration: 0.07, ease: "power2.out" }, CUE.free + 0.04);
  tl.to(el("card"), { y: 0, duration: 0.4, ease: "back.out(2.2)" }, CUE.free + 0.11);
  tl.fromTo(el("sh0"), { scale: 0.5, opacity: 0.95 }, { scale: 1.7, opacity: 0, duration: 0.42, ease: "power2.out", immediateRender: false }, CUE.free + 0.04);
  tl.fromTo(el("sh1"), { scale: 0.4, opacity: 0.7 }, { scale: 1.3, opacity: 0, duration: 0.36, ease: "power2.out", immediateRender: false }, CUE.free + 0.1);
  burst(freeBurst, CUE.free + 0.04, 0.6, 520, 0.3);
  tl.fromTo(el("stampsweep"), { x: -140, opacity: 0 }, { x: 360, opacity: 1, duration: 0.4, ease: "power1.inOut" }, CUE.free + 0.26);

  // "one hour": readout card slides in from the left edge; the ring sweeps 60 minutes
  tl.fromTo(el("readcard"), { x: -300 }, { x: 0, duration: 0.42, ease: "power4.out" }, CUE.one - 0.12);
  tl.fromTo(el("readcard"), { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, CUE.one - 0.12);
  var clk = { p: 0 };
  function clockUpdate() {
    var p = clk.p;
    sweep.style.strokeDashoffset = (SWEEP_LEN * (1 - p)).toFixed(2);
    var a = (p * 360 - 90) * Math.PI / 180;
    head.setAttribute("cx", (100 + Math.cos(a) * 70).toFixed(1));
    head.setAttribute("cy", (100 + Math.sin(a) * 70).toFixed(1));
    head.setAttribute("opacity", p > 0 && p < 1 ? "1" : "0");
    for (var q = 0; q < 12; q++) {
      var lit = clamp01((p * 12 - q + 0.2) / 0.6);
      ticks[q].setAttribute("stroke-opacity", (0.25 + 0.75 * lit).toFixed(3));
    }
    var secs = Math.round(p * 3600);
    var mm = Math.floor(secs / 60), ss = secs % 60;
    timeEl.textContent = (mm < 10 ? "0" : "") + mm + ":" + (ss < 10 ? "0" : "") + ss;
    barFill.style.transform = "scaleX(" + p.toFixed(4) + ")";
  }
  clockUpdate();
  tl.fromTo(clk, { p: 0 }, { p: 1, duration: CUE.training - CUE.one + 0.04, ease: "power1.inOut", immediateRender: false, onUpdate: clockUpdate }, CUE.one);

  tl.fromTo(el("underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.36, ease: "expo.out" }, CUE.training);

  tl.fromTo(el("time"), { scale: 1 }, { scale: 1.14, duration: 0.09, ease: "power2.out", immediateRender: false }, CUE.training + 0.04);
  tl.to(el("time"), { scale: 1, duration: 0.3, ease: "back.out(2)" }, CUE.training + 0.13);
  tl.fromTo(el("play"), { scale: 1 }, { scale: 1.12, duration: 0.09, ease: "power2.out", immediateRender: false }, CUE.training + 0.04);
  tl.to(el("play"), { scale: 1, duration: 0.32, ease: "back.out(2.2)" }, CUE.training + 0.13);
  tl.fromTo(el("readsweep"), { x: -200, opacity: 0 }, { x: 300, opacity: 1, duration: 0.34, ease: "power1.inOut" }, CUE.training + 0.06);
  tl.to(el("topglow"), { opacity: 0.85, duration: 0.3, ease: "power2.out" }, CUE.training);

  window.__timelines = window.__timelines || {};
  window.__timelines["c8-free-training"] = tl;
})();
