    [-320, 120, 445, 10, 430, 540, 0.0, 0.8],
    [-340, 330, 575, 45, 430, 600, 0.14, 0.8],
    [-300, 560, 285, 350, 430, 620, 0.3, 0.8],
    [-300, 900, 295, 710, 430, 660, 0.46, 0.8],
    [-320, 260, 405, 250, 430, 580, 0.6, 0.8]
  ];
  var words = WP.map(function (w, k) { return { el: el("w" + k), blur: el("mb" + k + "n"), w: w }; });
  function qpt(w, u) {
    var a = 1 - u;
    return [a * a * w[0] + 2 * a * u * w[2] + u * u * w[4], a * a * w[1] + 2 * a * u * w[3] + u * u * w[5]];
  }
  function qdt(w, u) {
    return [2 * (1 - u) * (w[2] - w[0]) + 2 * u * (w[4] - w[2]), 2 * (1 - u) * (w[3] - w[1]) + 2 * u * (w[5] - w[3])];
  }
  // progress along path: fast entry, readable hover at mid-flight, fast swoop into the head
  var HOV = 0.82;
  function wu(x) { return x + HOV * Math.sin(TAU * x) / TAU; }
  function wdu(x) { return 1 + HOV * Math.cos(TAU * x); }
  function bu(x) { return x * x * (1.6 - 0.6 * x); }

  // data bits stream along the same five paths
  var bits = [];
  for (i = 0; i < 30; i++) {
    var b = document.createElement("i");
    b.className = P + "bit";
    b.style.background = i % 4 === 0 ? "#FFC24A" : "#FF5FB0";
    b.style.boxShadow = i % 4 === 0 ? "0 0 10px #FFC24A" : "0 0 10px #E0218A";
    el("bits").appendChild(b);
    bits.push({ el: b, w: WP[i % 5], t0: 0.0 + i * 0.038, dur: 0.5 + prand(i * 7 + 3) * 0.2, off: (prand(i * 11 + 5) - 0.5) * 40 });
  }

  // absorption pulse rings at the back of the head (one per word)
  var ringsEl = el("rings"), pulses = [];
  WP.forEach(function (w, k) {
    var r = document.createElement("i");
    r.className = P + "ring";
    var rp = qpt(w, 0.84);
    r.style.left = f1(rp[0] - 50) + "px"; r.style.top = f1(rp[1] - 50) + "px"; r.style.width = "100px"; r.style.height = "100px";
    r.style.border = "4px solid #FF5FB0"; r.style.boxShadow = "0 0 18px rgba(224,33,138,0.8)";
    ringsEl.appendChild(r);
    pulses.push({ el: r, at: w[6] + w[7] * 0.8 });
  });

  // circuit node dots at trace ends
  var circPaths = el("circ").querySelectorAll("path"), cnodes = [];
  for (i = 0; i < circPaths.length; i++) {
    var len = circPaths[i].getTotalLength();
    circPaths[i].style.strokeDasharray = f1(len + 2);
    circPaths[i].style.strokeDashoffset = f1(len + 2);
    var end = circPaths[i].getPointAtLength(len);
    var cn = document.createElementNS(SVGNS, "circle");
    cn.setAttribute("cx", f1(end.x)); cn.setAttribute("cy", f1(end.y)); cn.setAttribute("r", "7");
    cn.setAttribute("opacity", "0");
    el("cnodes").appendChild(cn);
    cnodes.push({ c: cn, len: len, p: circPaths[i] });
  }

  // progress-track ticks every 5%
  var tickG = el("tickg");
  for (i = 1; i < 20; i++) { var tk = document.createElementNS(SVGNS, "line"); tk.setAttribute("x1", f1(i * 706 / 20)); tk.setAttribute("x2", f1(i * 706 / 20)); tk.setAttribute("y1", 0); tk.setAttribute("y2", 22); tickG.appendChild(tk); }

  var tl = gsap.timeline({ paused: true });

  // ---------- AMBIENT: one finite clock ----------
  var blob = el("blob"), gold = el("goldglow"), dotsEl = el("dots"), shake = el("shake"), brain = el("brainglow"), coinGlow = el("coinglow"), headWrap = el("headwrap");
  var amb = { t: 0 };
  var SLAM = 2.12;
  function applyAmbient() {
    var t = amb.t, k;
    blob.style.transform = "translate(" + f1(-36 * t) + "px," + f1(24 * Math.sin(t * 1.1)) + "px)";
    gold.style.opacity = (0.1 + 0.18 * smooth((t - 1.4) / 0.5) + 0.03 * Math.sin(t * 2.6)).toFixed(3);
    gridG.setAttribute("transform", "translate(" + f1(-14 * t) + "," + f1(-22 * t) + ")");
    for (k = 0; k < dust.length; k++) {
      var dd = dust[k];
      dd.el.style.transform = "translate(" + f1(dd.x + 10 * Math.sin(dd.ph + t * 1.3)) + "px," + f1(dd.y - dd.v * t) + "px)";
      dd.el.style.opacity = (dd.base * (0.55 + 0.45 * Math.sin(dd.ph + t * dd.tw))).toFixed(3);
    }
    // head: gentle float
    headWrap.style.transform = "translateY(" + f1(4 * Math.sin(t * 2.2)) + "px)";
    // words in flight (motion blur follows path speed)
    for (k = 0; k < words.length; k++) {
      var wd = words[k], w = wd.w;
      var x = (t - w[6]) / w[7];
      if (x <= 0 || x >= 1) { wd.el.style.opacity = "0"; wd.blur.setAttribute("stdDeviation", "0 0"); continue; }
      var u = wu(x), pt = qpt(w, u), dv = qdt(w, u), sp = wdu(x) / w[7];
      var vx = dv[0] * sp, vy = dv[1] * sp, speed = Math.sqrt(vx * vx + vy * vy);
      var ang = Math.atan2(vy, vx) * 180 / Math.PI * 0.45;
      var sc = 1 - 0.35 * smooth((u - 0.6) / 0.4);
      wd.el.style.transform = "translate(" + f1(pt[0]) + "px," + f1(pt[1]) + "px) rotate(" + f1(ang) + "deg) scale(" + sc.toFixed(3) + ")";
      wd.el.style.opacity = (smooth(x / 0.12) * (1 - smooth((u - 0.86) / 0.14))).toFixed(3);
      var bl = Math.min(9, Math.max(0, speed - 500) / 220);
      wd.blur.setAttribute("stdDeviation", (bl * Math.abs(Math.cos(ang * Math.PI / 180))).toFixed(2) + " " + (bl * 0.25).toFixed(2));
    }
    // data bits
    for (k = 0; k < bits.length; k++) {
      var bt = bits[k], bx = (t - bt.t0) / bt.dur;
      if (bx <= 0 || bx >= 1) { bt.el.style.opacity = "0"; continue; }
      var bp = qpt(bt.w, bu(bx));
      bt.el.style.transform = "translate(" + f1(bp[0]) + "px," + f1(bp[1] + bt.off * (1 - bx)) + "px) rotate(45deg)";
      bt.el.style.opacity = (smooth(bx / 0.15) * (1 - smooth((bx - 0.8) / 0.2)) * 0.9).toFixed(3);
    }
    // absorption pulses
    for (k = 0; k < pulses.length; k++) {
      var pl = pulses[k], pt2 = (t - pl.at) / 0.4;
      if (pt2 <= 0 || pt2 >= 1) { pl.el.style.opacity = "0"; continue; }
      pl.el.style.transform = "scale(" + (0.3 + 1.5 * (1 - Math.pow(1 - pt2, 3))).toFixed(3) + ")";
      pl.el.style.opacity = (0.9 * (1 - pt2)).toFixed(3);
    }
    // LEARNING dots tick
    var nd = Math.floor(t * 7) % 4;
    dotsEl.textContent = nd === 0 ? "   " : nd === 1 ? ".  " : nd === 2 ? ".. " : "...";
    // brain glow: dim pulse per absorbed word, then full on "believe"
    var pulse = 0;
    for (k = 0; k < pulses.length; k++) pulse += 0.22 * Math.exp(-Math.pow((t - pulses[k].at - 0.06) / 0.1, 2));
    var bg = Math.min(1, pulse + 0.85 * smooth((t - 1.32) / 0.45) + 0.12 * Math.sin((t - 1.32) * 5) * smooth((t - 1.8) / 0.2));
    brain.setAttribute("opacity", bg.toFixed(3));
    coinGlow.style.opacity = (0.45 * smooth((t - 1.5) / 0.35) * (0.9 + 0.1 * Math.sin(t * 6))).toFixed(3);
    // impact shake: decaying, pure function of t
    var st = t - SLAM;
    if (st > 0) {
      var amp = 14 * Math.exp(-11 * st);
      shake.style.transform = "translate(" + f1(amp * Math.sin(st * 70)) + "px," + f1(amp * 0.7 * Math.sin(st * 53 + 1)) + "px)";
    } else shake.style.transform = "translate(0px,0px)";
  }
  applyAmbient();
  tl.fromTo(amb, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: applyAmbient }, 0);

  // camera push
  tl.fromTo(el("cam"), { scale: 1 }, { scale: 1.04, duration: DUR, ease: "power1.inOut" }, 0);

  // ---------- SCENE 1 (0.0-1.2): head outline draws over a panel fill; beliefs stream in ----------
  var hline = el("hline"), hglow = el("hglow"), HL = hline.getTotalLength() * 1.02;
  hline.style.strokeDasharray = f1(HL); hglow.style.strokeDasharray = f1(HL);
  tl.fromTo(el("hfill"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
  tl.fromTo(headWrap, { scale: 0.9, x: 40 }, { scale: 1, x: 0, duration: 0.7, ease: "expo.out" }, 0);
  tl.fromTo(hline, { strokeDashoffset: HL }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.02);
  tl.fromTo(hglow, { strokeDashoffset: HL }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.02);

  // readout card rises in and starts "LEARNING..."
  tl.fromTo(el("card"), { y: 60, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.16);

  // progress: slow creep while learning, then a fast fill on "believe" @1.32
  var fill = el("fill"), pctEl = el("pct"), prog = { p: 0 };
  function writeProg() {
    fill.style.transform = "scaleX(" + prog.p.toFixed(4) + ")";
    pctEl.textContent = Math.round(prog.p * 100) + "%";
  }
  writeProg();
  tl.fromTo(prog, { p: 0 }, { p: 0.24, duration: 1.0, ease: "none", onUpdate: writeProg }, 0.3);
  tl.fromTo(prog, { p: 0.24 }, { p: 1, duration: 0.5, ease: "power3.inOut", onUpdate: writeProg, immediateRender: false }, 1.32);

  // circuits light up as the beliefs install
  cnodes.forEach(function (cn, k) {
    tl.fromTo(cn.p, { strokeDashoffset: cn.len + 2 }, { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" }, 1.34 + k * 0.035);
    tl.fromTo(cn.c, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.12, ease: "none" }, 1.6 + k * 0.035);
  });

  // ---------- SCENE 2 (1.2-2.44): installed 100%, coin rises, padlock slams on "money" ----------
  tl.fromTo(el("la"), { y: 0, opacity: 1 }, { y: -44, opacity: 0, duration: 0.22, ease: "power2.in" }, 1.3);
  tl.fromTo(el("lb"), { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, 1.42);
  tl.fromTo(el("card"), { boxShadow: "0 30px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08), 0 0 0px rgba(255,194,74,0)" },
    { boxShadow: "0 30px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08), 0 0 46px rgba(255,194,74,0.55)", duration: 0.3, ease: "power2.out" }, 1.8);
  tl.fromTo(el("card"), { borderColor: "rgba(255,95,176,0.40)" }, { borderColor: "rgba(255,194,74,0.85)", duration: 0.2, ease: "none" }, 1.8);
  tl.fromTo(el("cardsheen"), { x: -240 }, { x: 900, duration: 0.45, ease: "power1.inOut" }, 1.84);

  // gold coin rises to the centre of the brain
  tl.fromTo(el("coin"), { y: 260, scale: 0.35, opacity: 0, rotationY: -160, transformPerspective: 700 },
    { y: 0, scale: 1, opacity: 1, rotationY: 0, duration: 0.5, ease: "back.out(1.6)" }, 1.46);

  // padlock slams down (kinetic-beat-slam: scale + blur, power4.out), shackle snaps shut on impact
  tl.fromTo(el("lock"), { scale: 2.5, y: -120, opacity: 0, filter: "blur(14px)" }, { scale: 1, y: 0, opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.in" }, 1.96);
  tl.set(el("lock"), { filter: "none" }, 2.12);
  tl.fromTo(el("lock"), { scaleX: 1, scaleY: 1 }, { scaleX: 1.08, scaleY: 0.9, duration: 0.05, ease: "power2.out", immediateRender: false }, SLAM);
  tl.to(el("lock"), { scaleX: 1, scaleY: 1, duration: 0.26, ease: "back.out(3)" }, SLAM + 0.05);
  tl.fromTo(el("shk"), { y: -34 }, { y: 0, duration: 0.07, ease: "power4.in" }, SLAM - 0.02);
  tl.fromTo(el("flash"), { scale: 0.5, opacity: 0 }, { scale: 1.1, opacity: 0.9, duration: 0.05, ease: "none" }, SLAM + 0.03);
  tl.to(el("flash"), { scale: 1.4, opacity: 0, duration: 0.26, ease: "power2.out" }, SLAM + 0.08);
  tl.fromTo(el("ripple"), { scale: 0.35, opacity: 0 }, { scale: 0.5, opacity: 1, duration: 0.04, ease: "none" }, SLAM + 0.03);
  tl.to(el("ripple"), { scale: 2.3, opacity: 0, duration: 0.3, ease: "power2.out" }, SLAM + 0.07);
  tl.fromTo(el("coin"), { scale: 1 }, { scale: 0.9, duration: 0.08, ease: "power2.out", immediateRender: false }, SLAM);
  tl.fromTo(el("locksheen"), { attr: { x: -40 } }, { attr: { x: 300 }, duration: 0.24, ease: "power1.inOut" }, SLAM + 0.08);

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
