        var QUOTE = '<g fill="#a8507f"><circle cx="20" cy="40" r="17"/><path d="M4 38 C4 19 13 7 33 1 L35 8 C22 13 17 22 18 31 Z"/><circle cx="62" cy="40" r="17"/><path d="M46 38 C46 19 55 7 75 1 L77 8 C64 13 59 22 60 31 Z"/></g>';

        function pts(list) {
          return list.map(function (p) { return p[0] + "," + p[1]; }).join(" ");
        }
        function poly(c, side) {
          var a = c.crack, n = a.length, H = c.h, out = [];
          if (side === "a") {
            out.push("-320px -320px", a[0][0] + "px -320px");
            a.forEach(function (p) { out.push(p[0] + "px " + p[1] + "px"); });
            out.push(a[n - 1][0] + "px " + (H + 320) + "px", "-320px " + (H + 320) + "px");
          } else {
            out.push(a[0][0] + "px -320px");
            a.forEach(function (p) { out.push(p[0] + "px " + p[1] + "px"); });
            out.push(a[n - 1][0] + "px " + (H + 320) + "px", "1260px " + (H + 320) + "px", "1260px -320px");
          }
          return "polygon(" + out.join(", ") + ")";
        }
        // text attribute: the one real copy is allowed to overlap its clipped twin; every other copy is ignored by layout
        function cardCopy(c, textAttr) {
          var rows = c.rows.map(function (r) {
            var words = r[1].map(function (w) {
              var cls = P + "w" + (w[1] ? " " + P + "red" : "") + (w[1] === "rb" ? " " + P + "big" : "");
              var ul = w[1] ? '<i class="' + P + 'ul"></i>' : "";
              return '<span class="' + cls + '" ' + textAttr + ">" + w[0] + ul + "</span>";
            }).join("");
            return '<div class="' + P + 'row" style="font-size:' + r[0] + 'px">' + words + "</div>";
          }).join("");
          return (
            '<div class="' + P + 'tail"></div>' +
            '<div class="' + P + 'body"><div class="' + P + 'text">' + rows + "</div></div>" +
            '<svg class="' + P + 'qo" viewBox="0 0 84 60" aria-hidden="true">' + QUOTE + "</svg>" +
            '<div class="' + P + 'chip" ' + textAttr + "><i></i>HEARD AT HOME</div>" +
            '<svg class="' + P + 'qc" viewBox="0 0 84 60" aria-hidden="true"><g transform="rotate(180 42 30)">' + QUOTE + "</g></svg>" +
            '<div class="' + P + 'stamp" ' + textAttr + ">OLD</div>"
          );
        }
        function fanHTML(isLens) {
          return CARDS.map(function (c, i) {
            var n = i + 1;
            var ign = 'data-layout-ignore aria-hidden="true"';
            var attrA = isLens ? ign : "data-layout-allow-overlap";
            var crack = pts(c.crack);
            var br = c.br.map(function (b) {
              return '<polyline class="' + P + "kb" + n + '" points="' + pts(b) + '" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" fill="none" stroke="#ffe1a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
            }).join("");
            var puff = "";
            for (var k = 0; k < 10; k++) {
              var cp = c.crack[1 + (k % (c.crack.length - 2))];
              puff += '<i class="' + P + "puffp " + P + "pf" + n + '" style="left:' + cp[0] + "px;top:" + cp[1] + 'px"></i>';
            }
            return (
              '<div class="' + P + "card " + P + "c" + n + '" style="top:' + c.top + "px;height:" + c.h + 'px">' +
              '<div class="' + P + "half " + P + "h" + n + 'a" style="clip-path:' + poly(c, "a") + '">' + cardCopy(c, attrA) + "</div>" +
              '<div class="' + P + "half " + P + "h" + n + 'b" style="clip-path:' + poly(c, "b") + '">' + cardCopy(c, ign) + "</div>" +
              '<svg class="' + P + 'crack" width="940" height="' + c.h + '" viewBox="0 0 940 ' + c.h + '" aria-hidden="true">' +
              '<polyline class="' + P + "kg" + n + '" points="' + crack + '" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" fill="none" stroke="#ffc24a" stroke-opacity="0.55" stroke-width="16" stroke-linejoin="round" filter="url(#' + P + 'kglow)"/>' +
              '<polyline class="' + P + "k" + n + '" points="' + crack + '" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" fill="none" stroke="#fff5ea" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>' +
              br + "</svg>" + puff + "</div>"
            );
          }).join("");
        }
        $("fan").innerHTML = fanHTML(false);
        $("lensfan").innerHTML = fanHTML(true);
        var q = function (sel) {
          return Array.prototype.slice.call(document.querySelectorAll("." + P + sel));
        };

        // ---- seeded gold dust ----
        var dustBox = $("dustbox");
        var dust = [];
        for (var i = 0; i < 30; i++) {
          var d = document.createElement("i");
          d.className = P + "dust";
          var size = 3 + Math.round(hash(i * 5.3 + 11) * 5);
          d.style.width = size + "px";
          d.style.height = size + "px";
          dustBox.appendChild(d);
          dust.push({
            el: d,
            x: 50 + hash(i * 3.1 + 12) * 980,
            y: 160 + hash(i * 7.7 + 13) * 1560,
            v: 12 + hash(i * 2.3 + 14) * 26,
            sway: 6 + hash(i * 4.1 + 15) * 14,
            f: 1.1 + hash(i * 6.7 + 16) * 2.2,
            p: hash(i * 8.9 + 17) * 6.283
          });
        }
        // ---- sparks around the question mark (index-derived angles) ----
        var sparks = [];
        for (var s = 0; s < 12; s++) {
          var sp = document.createElement("i");
          sp.className = P + "spark";
          $("qsparks").appendChild(sp);
          sparks.push({ el: sp, a: (s / 12) * 360 + 15 + (hash(s * 9.1 + 3) * 2 - 1) * 8, r: 250 + hash(s * 3.7 + 1) * 120 });
        }

        // ---- magnifier path: Catmull-Rom through inspection stops, ending on NEVER ----
        var LP = [[250, 452], [500, 442], [735, 712], [540, 896]];
        var R = 130, MAG = 1.55, SWEEP_A = 0.12, SWEEP_B = 1.08;
        function cr(p0, p1, p2, p3, u) {
          var u2 = u * u, u3 = u2 * u;
          return 0.5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (-p0 + 3 * p1 - 3 * p2 + p3) * u3);
        }
        function lensAt(t) {
          var g = (t - SWEEP_A) / (SWEEP_B - SWEEP_A);
          g = g < 0 ? 0 : g > 1 ? 1 : g;
          g = 0.5 - 0.5 * Math.cos(Math.PI * g); // ease in-out
          var seg = Math.min(2, Math.floor(g * 3));
          var u = g * 3 - seg;
          var a = LP[Math.max(0, seg - 1)], b = LP[seg], c = LP[seg + 1], d = LP[Math.min(3, seg + 2)];
          var x = cr(a[0], b[0], c[0], d[0], u), y = cr(a[1], b[1], c[1], d[1], u);
          var hv = smooth((t - SWEEP_B) / 0.3);
          x += Math.sin((t - SWEEP_B) * 2.4) * 7 * hv;
          y += Math.sin((t - SWEEP_B) * 1.9 + 1.2) * 6 * hv;
          return [x, y];
        }

        var cam = $("cam"), mag = $("mag"), lensfan = $("lensfan"), qfloat = $("qfloat");
        var gmag = $("gmag"), ggold = $("ggold"), grings = $("grings");
        function win(t, at, dur) {
          if (t < at || t >= at + dur) return 0;
          var u = (t - at) / dur;
          return (1 - u) * (1 - u);
        }
        function rig(t) {
          var f = Math.floor(t / 0.04 + 1e-6);
          // camera: slow push, drift, a landing bump for the "?", a small crunch when the cards split
          var bump = 10 * win(t, QUESTIONING + 0.1, 0.34);
          var e = win(t, BELIEFS + 0.02, 0.22);
          var sx = (hash(f * 13.1 + 5) * 2 - 1) * 6 * e;
          var sy = (hash(f * 7.3 + 6) * 2 - 1) * 4 * e;
          var push = 1 + 0.03 * (t / DUR) + 0.012 * win(t, QUESTIONING + 0.1, 0.5);
          cam.style.transform = "translate(" + (Math.sin(t * 1.1) * 3 + sx).toFixed(2) + "px," + (Math.sin(t * 1.5 + 0.4) * 2 + bump + sy).toFixed(2) + "px) scale(" + push.toFixed(4) + ")";

          // magnifier + magnified copy (same camera space)
          var L = lensAt(t);
          var tilt = Math.sin(t * 2.1) * 3 + (L[0] - 500) * 0.012;
          mag.style.transform = "translate(" + (L[0] - R).toFixed(2) + "px," + (L[1] - R).toFixed(2) + "px) rotate(" + tilt.toFixed(2) + "deg)";
          // counter-rotate inside the tilted lens, then magnify about the lens centre
          lensfan.style.transform = "translate(" + R + "px," + R + "px) rotate(" + (-tilt).toFixed(2) + "deg) scale(" + MAG + ") translate(" + (-L[0]).toFixed(2) + "px," + (-L[1]).toFixed(2) + "px)";

          // the "?" floats once it has landed
          var fl = smooth((t - 1.6) / 0.4);
          qfloat.style.transform = "translate3d(0," + (Math.sin((t - 1.6) * 2.6) * 7 * fl).toFixed(2) + "px,0) rotate(" + (Math.sin((t - 1.6) * 1.9) * 1.6 * fl).toFixed(2) + "deg)";

          // ground drift
          gmag.style.transform = "translate3d(" + (Math.sin(t * 0.55 + 2) * 46).toFixed(2) + "px," + (Math.sin(t * 0.4 + 3) * 34).toFixed(2) + "px,0)";
          ggold.style.transform = "scale(" + (1 + 0.08 * Math.sin(t * 1.7) + 0.35 * smooth((t - QUESTIONING) / 0.4)).toFixed(4) + ")";
          grings.style.transform = "rotate(" + (t * -4.5).toFixed(2) + "deg)";
          for (var k = 0; k < dust.length; k++) {
            var o = dust[k];
            o.el.style.transform = "translate3d(" + (o.x + Math.sin(t * 0.8 + o.p) * o.sway).toFixed(1) + "px," + (o.y - o.v * t).toFixed(1) + "px,0)";
            o.el.style.opacity = (0.18 + 0.55 * Math.max(0, Math.sin(t * o.f + o.p))).toFixed(3);
          }
        }

        var tl = gsap.timeline({ paused: true });
        var drv = { t: 0 };
        rig(0);
        tl.fromTo(drv, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { rig(drv.t); } }, 0);

        function fade(el, at, peak, dur) {
          tl.fromTo(el, { opacity: 0 }, { opacity: peak, duration: 0.04, ease: "none" }, at);
          tl.fromTo(el, { opacity: peak }, { opacity: 0, duration: dur - 0.04, ease: "power2.in", immediateRender: false }, at + 0.04);
        }

        // ================= Scene 1 (0.0–1.1): the old cards fan out, stamped, inspected =================
        CARDS.forEach(function (c, i) {
          var n = i + 1, at = i * 0.07;
          var els = q("c" + n);
          tl.fromTo(els, { x: 0, y: 40, scale: 0.3, rotation: c.fan.r * -1.5, opacity: 0, filter: "blur(10px)" }, { x: c.fan.x, y: c.fan.y, scale: c.fan.s, rotation: c.fan.r, opacity: 1, filter: "blur(0px)", duration: 0.62, ease: "expo.out" }, at);
          tl.set(els, { filter: "none" }, at + 0.64);
        });
        q("stamp").forEach(function (el, j) {
          var n = Math.floor(j / 2) % 3; // halves come in pairs per card, fan then lens copy
          var at = 0.34 + n * 0.1;
          tl.fromTo(el, { opacity: 0, scale: 1.9, rotation: -2 }, { opacity: 0.9, scale: 1, rotation: 9, duration: 0.3, ease: "power4.out", immediateRender: true }, at);
        });
        tl.fromTo($("magin"), { scale: 0.4, opacity: 0, rotation: -30 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "back.out(1.7)" }, SWEEP_A);

        // ================= Scene 2 (1.1–2.82): the "?" slams in; cracks; the beliefs split =================
        var Q = $("q");
        tl.fromTo(Q, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, QUESTIONING - 0.03);
        tl.fromTo(Q, { scale: 2.1, rotation: -16, y: -40, filter: "blur(22px)" }, { scale: 1, rotation: 0, y: 0, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.5)" }, QUESTIONING - 0.03);
        tl.set(Q, { filter: "none" }, QUESTIONING + 0.5);
        tl.fromTo($("halo"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, QUESTIONING);
        tl.fromTo($("qbloom"), { opacity: 0, scale: 0.8 }, { opacity: 0.42, scale: 1, duration: 0.35, ease: "power2.out" }, QUESTIONING + 0.08);
        tl.fromTo($("qbloom"), { opacity: 0.42 }, { opacity: 0.3, duration: 0.6, ease: "power2.out", immediateRender: false }, QUESTIONING + 0.43);
        tl.fromTo($("qglow"), { opacity: 0 }, { opacity: 0.9, duration: 0.14, ease: "power2.out" }, QUESTIONING + 0.1);
        tl.fromTo($("qglow"), { opacity: 0.9 }, { opacity: 0.55, duration: 0.6, ease: "power2.out", immediateRender: false }, QUESTIONING + 0.24);
        ["ring1", "ring2", "ring3"].forEach(function (id, k) {
          var at = QUESTIONING + 0.1 + k * 0.1;
          tl.fromTo($(id), { scale: 0.4 }, { scale: 1.7 + k * 0.35, duration: 0.6, ease: "power2.out" }, at);
          fade($(id), at, 0.9, 0.6);
        });
        sparks.forEach(function (o, k) {
          var rad = (o.a * Math.PI) / 180, at = QUESTIONING + 0.1 + (k % 3) * 0.015;
          tl.fromTo(o.el, { x: 0, y: 0, rotation: o.a, scaleX: 0.3 }, { x: Math.cos(rad) * o.r, y: Math.sin(rad) * o.r, rotation: o.a, scaleX: 1, duration: 0.55, ease: "power3.out" }, at);
          fade(o.el, at, 1, 0.55);
        });
        // light sweep across the landed "?"
        tl.fromTo($("qsheen"), { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 0.55, ease: "power2.inOut" }, 1.56);

        // "old" — crack lines draw across each card (svg-path-draw)
        [2, 1, 3].forEach(function (n, k) {
          var at = OLD - 0.03 + k * 0.06;
          tl.fromTo(q("k" + n), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.26, ease: "power2.out" }, at);
          tl.fromTo(q("kg" + n), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.26, ease: "power2.out" }, at);
          tl.fromTo(q("kb" + n), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "power2.out" }, at + 0.16);
        });

        // "beliefs" — the cards split along the cracks, gold light leaks, dust puffs
        [1, 2, 3].forEach(function (n, k) {
          var at = BELIEFS - 0.02 + k * 0.03;
          tl.fromTo(q("h" + n + "a"), { x: 0, y: 0, rotation: 0, transformOrigin: "15% 50%" }, { x: -12, y: 5, rotation: -1.8, duration: 0.42, ease: "expo.out" }, at);
          tl.fromTo(q("h" + n + "b"), { x: 0, y: 0, rotation: 0, transformOrigin: "85% 50%" }, { x: 12, y: -5, rotation: 2.1, duration: 0.42, ease: "expo.out" }, at);
          tl.fromTo(q("kg" + n), { attr: { "stroke-opacity": 0.55, "stroke-width": 16 } }, { attr: { "stroke-opacity": 0.95, "stroke-width": 26 }, duration: 0.3, ease: "power2.out" }, at);
          var parts = q("pf" + n);
          parts.forEach(function (el, j) {
            var idx = j % 10;
            var ang = hash(idx * 4.7 + n * 13.1) * 6.283;
            var dist = 50 + hash(idx * 2.9 + n * 7.7) * 90;
            tl.fromTo(el, { x: 0, y: 0, scale: 0.6 }, { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist - 30, scale: 1.6 + hash(idx + n) * 1.4, duration: 0.6, ease: "power3.out" }, at + 0.02);
            fade(el, at + 0.02, 0.95, 0.6);
          });
        });
        tl.fromTo(Q, { scale: 1.07 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, BELIEFS);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
