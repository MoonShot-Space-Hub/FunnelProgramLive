              '<div class="' + P + "half " + P + "h" + n + 'b" style="clip-path:' + poly(c, "b") + '">' + cardCopy(c, ign) + "</div>" +
              '<svg class="' + P + 'crack" width="' + c.w + '" height="' + c.h + '" viewBox="0 0 ' + c.w + " " + c.h + '" aria-hidden="true">' +
              '<polyline class="' + P + "kg" + n + '" points="' + crack + '" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" fill="none" stroke="#ffc24a" stroke-opacity="0.55" stroke-width="10" stroke-linejoin="round" filter="url(#' + P + 'kglow)"/>' +
              '<polyline class="' + P + "k" + n + '" points="' + crack + '" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" fill="none" stroke="#fff5ea" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>' +
              br + "</svg>" + puff + "</div>"
            );
          }).join("");
        }
        $("fan").innerHTML = fanHTML(false);
        $("lensfan").innerHTML = fanHTML(true);
        var q = function (sel) {
          return Array.prototype.slice.call(document.querySelectorAll("." + P + sel));
        };

        // ---- sparks around the "?" (index-derived angles, flattened to the band) ----
        var sparks = [];
        for (var s = 0; s < 12; s++) {
          var sp = document.createElement("i");
          sp.className = P + "spark";
          $("qsparks").appendChild(sp);
          sparks.push({ el: sp, a: (s / 12) * 360 + 15 + (hash(s * 9.1 + 3) * 2 - 1) * 8, r: 190 + hash(s * 3.7 + 1) * 110 });
        }

        // ---- magnifier route: LEFT rail -> rounded corner -> LOWER band -> rounded corner -> RIGHT rail.
        //      Sampled once at build (deterministic); every lens position keeps the lens + handle out of the face zone.
        var R = 60, MAG = 1.6, SWEEP_A = 0.08, SWEEP_B = 1.3;
        var route = [];
        (function () {
          var k;
          for (k = 0; k <= 20; k++) route.push([207, 600 + (290 * k) / 20]);
          for (k = 1; k <= 12; k++) { var a = (Math.PI / 2) * (k / 12); route.push([267 - 60 * Math.cos(a), 890 + 60 * Math.sin(a)]); }
          for (k = 1; k <= 30; k++) route.push([267 + (523 * k) / 30, 950]);
          for (k = 1; k <= 12; k++) { var b = (Math.PI / 2) * (k / 12); route.push([790 + 60 * Math.sin(b), 890 + 60 * Math.cos(b)]); }
          for (k = 1; k <= 16; k++) route.push([850, 890 - (220 * k) / 16]);
        })();
        var cum = [0];
        for (var r = 1; r < route.length; r++) {
          var ddx = route[r][0] - route[r - 1][0], ddy = route[r][1] - route[r - 1][1];
          cum.push(cum[r - 1] + Math.sqrt(ddx * ddx + ddy * ddy));
        }
        var TOTAL = cum[cum.length - 1];
        function lensAt(t) {
          var g = (t - SWEEP_A) / (SWEEP_B - SWEEP_A);
          g = g < 0 ? 0 : g > 1 ? 1 : g;
          g = 0.5 - 0.5 * Math.cos(Math.PI * g);
          var d = g * TOTAL, i = 1;
          while (i < cum.length - 1 && cum[i] < d) i++;
          var seg = cum[i] - cum[i - 1] || 1, u = (d - cum[i - 1]) / seg;
          var x = route[i - 1][0] + (route[i][0] - route[i - 1][0]) * u;
          var y = route[i - 1][1] + (route[i][1] - route[i - 1][1]) * u;
          var hv = smooth((t - SWEEP_B) / 0.25);
          return [x + Math.sin((t - SWEEP_B) * 2.4) * 5 * hv, y + Math.sin((t - SWEEP_B) * 1.9 + 1.2) * 5 * hv];
        }

        var mag = $("mag"), lensfan = $("lensfan"), qfloat = $("qfloat"), qbloom = $("qbloom");
        function rig(t) {
          var L = lensAt(t);
          var tilt = Math.sin(t * 2.1) * 1.5;
          mag.style.transform = "translate(" + (L[0] - R).toFixed(2) + "px," + (L[1] - R).toFixed(2) + "px) rotate(" + tilt.toFixed(2) + "deg)";
          // counter-rotate inside the tilted lens, then magnify about the lens centre
          lensfan.style.transform = "translate(" + R + "px," + R + "px) rotate(" + (-tilt).toFixed(2) + "deg) scale(" + MAG + ") translate(" + (-L[0]).toFixed(2) + "px," + (-L[1]).toFixed(2) + "px)";
          // the "?" floats once landed (inside the band)
          var fl = smooth((t - 1.6) / 0.4);
          qfloat.style.transform = "translate3d(0," + (Math.sin((t - 1.6) * 2.6) * 4 * fl).toFixed(2) + "px,0) rotate(" + (Math.sin((t - 1.6) * 1.9) * 1.5 * fl).toFixed(2) + "deg)";
          qbloom.style.transform = "scale(" + (1 + 0.05 * Math.sin(t * 2.3) * fl).toFixed(4) + ")";
        }

        var tl = gsap.timeline({ paused: true });
        var drv = { t: 0 };
        rig(0);
        tl.fromTo(drv, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { rig(drv.t); } }, 0);

        function fade(el, at, peak, dur) {
          tl.fromTo(el, { opacity: 0 }, { opacity: peak, duration: 0.04, ease: "none" }, at);
          tl.fromTo(el, { opacity: peak }, { opacity: 0, duration: dur - 0.04, ease: "power2.in", immediateRender: false }, at + 0.04);
        }

        // ================= Scene 1 (0.0–1.1): the old cards grow in place in their zones, stamped, inspected =================
        CARDS.forEach(function (c, i) {
          var n = i + 1, at = i * 0.07;
          var els = q("c" + n);
          tl.fromTo(els, { scale: 0.5, rotation: 0, opacity: 0, filter: "blur(10px) brightness(1)" }, { scale: 1, rotation: c.fan.r, opacity: 1, filter: "blur(0px) brightness(1)", duration: 0.6, ease: "expo.out" }, at);
        });
        q("stamp").forEach(function (el, j) {
          var n = Math.floor(j / 2) % 3; // halves come in pairs per card: fan copy first, then lens copy
          tl.fromTo(el, { opacity: 0, scale: 1.4, rotation: -2 }, { opacity: 0.92, scale: 1, rotation: 8, duration: 0.28, ease: "power4.out" }, 0.34 + n * 0.1);
        });
        tl.fromTo($("magin"), { scale: 0.4, opacity: 0, rotation: -30 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "back.out(1.7)" }, SWEEP_A);

        // ================= Scene 2 (1.1–2.82): the "?" slams into the TOP band; cracks; the beliefs split =================
        var Q = $("q");
        tl.fromTo($("scrim"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, QUESTIONING - 0.06);
        tl.fromTo(Q, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, QUESTIONING - 0.03);
        tl.fromTo(Q, { scale: 2, rotation: -16, y: -30 }, { scale: 1, rotation: 0, y: 0, duration: 0.5, ease: "back.out(1.5)" }, QUESTIONING - 0.03);
        // blur on its own non-overshooting ease (back.out would push blur() negative = invalid CSS)
        tl.fromTo(Q, { filter: "blur(18px)" }, { filter: "blur(0px)", duration: 0.34, ease: "power3.out" }, QUESTIONING - 0.03);
        tl.set(Q, { filter: "none" }, QUESTIONING + 0.36);
        tl.fromTo(qbloom, { opacity: 0 }, { opacity: 0.45, duration: 0.3, ease: "power2.out" }, QUESTIONING + 0.08);
        tl.fromTo(qbloom, { opacity: 0.45 }, { opacity: 0.3, duration: 0.6, ease: "power2.out", immediateRender: false }, QUESTIONING + 0.38);
        tl.fromTo($("qglow"), { opacity: 0 }, { opacity: 0.9, duration: 0.14, ease: "power2.out" }, QUESTIONING + 0.1);
        tl.fromTo($("qglow"), { opacity: 0.9 }, { opacity: 0.55, duration: 0.6, ease: "power2.out", immediateRender: false }, QUESTIONING + 0.24);
        ["ring1", "ring2", "ring3"].forEach(function (id, k) {
          var at = QUESTIONING + 0.1 + k * 0.1;
          tl.fromTo($(id), { scale: 0.5 }, { scale: 1.6 + k * 0.4, duration: 0.6, ease: "power2.out" }, at);
          fade($(id), at, 0.9, 0.6);
        });
        sparks.forEach(function (o, k) {
          var rad = (o.a * Math.PI) / 180, at = QUESTIONING + 0.1 + (k % 3) * 0.015;
          tl.fromTo(o.el, { x: 0, y: 0, rotation: o.a, scaleX: 0.3 }, { x: Math.cos(rad) * o.r, y: Math.sin(rad) * o.r * 0.45, rotation: o.a, scaleX: 1, duration: 0.55, ease: "power3.out" }, at);
          fade(o.el, at, 1, 0.55);
        });
        // the cards step back a little so the "?" owns the moment
        CARDS.forEach(function (c, i) {
          tl.fromTo(q("c" + (i + 1)), { filter: "blur(0px) brightness(1)" }, { filter: "blur(0px) brightness(0.82)", duration: 0.35, ease: "power2.out", immediateRender: false }, QUESTIONING + 0.05);
        });
        // light sweep across the landed "?"
        tl.fromTo($("qsheen"), { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 0.55, ease: "power2.inOut" }, 1.56);

        // "old" — crack lines draw across each card (svg-path-draw)
        [1, 3, 2].forEach(function (n, k) {
          var at = OLD - 0.03 + k * 0.06;
          tl.fromTo(q("k" + n), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.26, ease: "power2.out" }, at);
          tl.fromTo(q("kg" + n), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.26, ease: "power2.out" }, at);
          tl.fromTo(q("kb" + n), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "power2.out" }, at + 0.16);
        });

        // "beliefs" — the cards split along the cracks, gold light leaks, dust puffs (kept inside each card's zone)
        var SPLIT = [
          { ax: -6, ay: 3, ar: -1.6, bx: 6, by: -3, br: 1.6 },
          { ax: -6, ay: 3, ar: -1.6, bx: 6, by: -3, br: 1.6 },
          { ax: -7, ay: 2, ar: -0.8, bx: 7, by: -2, br: 0.6 }
        ];
        CARDS.forEach(function (c, k) {
          var n = k + 1, at = BELIEFS - 0.02 + k * 0.03, sp = SPLIT[k];
          tl.fromTo(q("h" + n + "a"), { x: 0, y: 0, rotation: 0, transformOrigin: "15% 50%" }, { x: sp.ax, y: sp.ay, rotation: sp.ar, transformOrigin: "15% 50%", duration: 0.42, ease: "expo.out" }, at);
          tl.fromTo(q("h" + n + "b"), { x: 0, y: 0, rotation: 0, transformOrigin: "85% 50%" }, { x: sp.bx, y: sp.by, rotation: sp.br, transformOrigin: "85% 50%", duration: 0.42, ease: "expo.out" }, at);
          tl.fromTo(q("kg" + n), { attr: { "stroke-opacity": 0.55, "stroke-width": 10 } }, { attr: { "stroke-opacity": 0.95, "stroke-width": 16 }, duration: 0.3, ease: "power2.out" }, at);
          q("pf" + n).forEach(function (el, j) {
            var idx = j % 8;
            var ang;
            if (c.puff.spread > 6) {
              ang = hash(idx * 4.7 + n * 13.1) * 6.283;
            } else {
              // card 3: puffs stay level (never rise toward the face zone)
              ang = (idx % 2 ? Math.PI : 0) + (hash(idx * 4.7 + n * 13.1) * 2 - 1) * 0.35;
            }
            var dist = c.puff.dist * (0.5 + 0.5 * hash(idx * 2.9 + n * 7.7));
            tl.fromTo(el, { x: 0, y: 0, scale: 0.6 }, { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist * (c.wide ? 0.4 : 1), scale: 1.4 + hash(idx + n) * 1.2, duration: 0.6, ease: "power3.out" }, at + 0.02);
            fade(el, at + 0.02, 0.95, 0.6);
          });
        });
        tl.fromTo(Q, { scale: 1.07 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, BELIEFS);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
