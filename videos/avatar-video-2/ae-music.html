        background: transparent;
        font-family: "Montserrat", sans-serif;
      }

      /* A-roll inside a non-timed camera wrapper for punch-ins (face centre ≈ 500, 660) */
      #cam {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform-origin: 500px 660px;
        will-change: transform, filter;
      }
      #a-roll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* cutaway wrappers (non-timed) around each sub-composition host */
      .bw {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        will-change: opacity, filter;
      }
      .bw > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }

      /* black gradient behind the captions */
      #cap-gradient {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 1040px;
        z-index: 30;
        pointer-events: none;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.84) 30%,
          rgba(0, 0, 0, 0.76) 55%,
          rgba(0, 0, 0, 0.68) 66%,
          rgba(0, 0, 0, 0.44) 82%,
          rgba(0, 0, 0, 0.16) 92%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      /* captions: y 1030–1248, inside Instagram's Reels safe zone (bottom 35% kept clear) */
      #captions {
        position: absolute;
        left: 0;
        top: 1030px;
        width: 100%;
        height: 218px;
        z-index: 60;
        pointer-events: none;
      }
      .cg {
        position: absolute;
        left: 75px;
        right: 75px;
        top: 0;
        height: 218px;
        display: flex;
        flex-wrap: wrap;
        align-content: center;
        align-items: baseline;
        justify-content: center;
        column-gap: 22px;
        row-gap: 0;
        opacity: 0;
        visibility: hidden;
      }
      .cw {
        position: relative;
        display: inline-block;
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 74px;
        line-height: 1.1;
        letter-spacing: -0.015em;
        color: #fff5ea;
        text-shadow:
          0 4px 18px rgba(0, 0, 0, 0.6),
          0 2px 3px rgba(0, 0, 0, 0.7);
        transform-origin: 50% 70%;
        isolation: isolate;
        --mk: 0;
      }
      .cw.em {
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-size: 96px;
        letter-spacing: -0.03em;
        color: #ffc24a;
        text-shadow:
          0 0 38px rgba(255, 194, 74, 0.5),
          0 4px 16px rgba(0, 0, 0, 0.65);
      }
      .cw.em.red {
        color: #ff4d5e;
        text-shadow:
          0 0 38px rgba(255, 77, 94, 0.45),
          0 4px 16px rgba(0, 0, 0, 0.65);
      }
      .cw.em::after {
        content: "";
        position: absolute;
        left: -6px;
        right: -6px;
        bottom: 14px;
        height: 22px;
        border-radius: 6px;
        background: rgba(224, 33, 138, 0.8);
        transform-origin: 0% 50%;
        transform: scaleX(var(--mk));
        z-index: -1;
      }
      .cw.em.long {
        font-size: 80px;
      }
      .cw.em.red::after {
        background: rgba(70, 8, 30, 0.85);
      }
