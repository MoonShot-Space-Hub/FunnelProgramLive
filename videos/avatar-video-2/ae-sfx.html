<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Montserrat", sans-serif;
      }

      /* A-roll inside a non-timed camera wrapper for punch-ins (face centre ≈ 500, 660) */
      #cam {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform-origin: 500px 660px;
        will-change: transform, filter;
      }
      #a-roll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* cutaway wrappers (non-timed) around each sub-composition host */
      .bw {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        will-change: opacity, filter;
      }
      .bw > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }

      /* black gradient behind the captions */
      #cap-gradient {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 1040px;
        z-index: 30;
        pointer-events: none;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.84) 30%,
          rgba(0, 0, 0, 0.76) 55%,
          rgba(0, 0, 0, 0.68) 66%,
          rgba(0, 0, 0, 0.44) 82%,
          rgba(0, 0, 0, 0.16) 92%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      /* captions: y 1030–1248, inside Instagram's Reels safe zone (bottom 35% kept clear) */
      #captions {
        position: absolute;
        left: 0;
        top: 1030px;
        width: 100%;
        height: 218px;
        z-index: 60;
        pointer-events: none;
      }
      .cg {
        position: absolute;
        left: 75px;
        right: 75px;
        top: 0;
        height: 218px;
        display: flex;
        flex-wrap: wrap;
        align-content: center;
        align-items: baseline;
        justify-content: center;
        column-gap: 22px;
        row-gap: 0;
        opacity: 0;
        visibility: hidden;
      }
      .cw {
        position: relative;
        display: inline-block;
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 74px;
        line-height: 1.1;
        letter-spacing: -0.015em;
        color: #fff5ea;
        text-shadow:
          0 4px 18px rgba(0, 0, 0, 0.6),
          0 2px 3px rgba(0, 0, 0, 0.7);
        transform-origin: 50% 70%;
        isolation: isolate;
        --mk: 0;
      }
      .cw.em {
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-size: 96px;
        letter-spacing: -0.03em;
        color: #ffc24a;
        text-shadow:
          0 0 38px rgba(255, 194, 74, 0.5),
          0 4px 16px rgba(0, 0, 0, 0.65);
      }
      .cw.em.red {
        color: #ff4d5e;
        text-shadow:
          0 0 38px rgba(255, 77, 94, 0.45),
          0 4px 16px rgba(0, 0, 0, 0.65);
      }
      .cw.em::after {
        content: "";
        position: absolute;
        left: -6px;
        right: -6px;
        bottom: 14px;
        height: 22px;
        border-radius: 6px;
        background: rgba(224, 33, 138, 0.8);
        transform-origin: 0% 50%;
        transform: scaleX(var(--mk));
        z-index: -1;
      }
      .cw.em.long {
        font-size: 80px;
      }
      .cw.em.red::after {
        background: rgba(70, 8, 30, 0.85);
      }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ------------------------------------------------------------------ speaker camera
      // [t0, t1, scale0, scale1, ease]: wide (1.00-1.05) and punched (1.08-1.12) shots alternate at
      // sentence boundaries. Max 1.12 keeps her face inside the face zone the overlays avoid.
      const CAM = [
        [0.0, 2.48, 1.0, 1.04, "sine.inOut"],
        [2.48, 6.8, 1.1, 1.12, "sine.out"],
        [6.8, 9.28, 1.0, 1.03, "sine.out"],
        [9.28, 11.04, 1.1, 1.12, "sine.out"],
        [11.04, 19.04, 1.0, 1.04, "sine.inOut"],
        [19.04, 21.36, 1.1, 1.12, "sine.out"],
        [21.36, 25.04, 1.0, 1.03, "sine.out"],
        [25.04, 29.2, 1.08, 1.12, "sine.inOut"],
        [29.2, 36.72, 1.0, 1.05, "sine.inOut"],
        [36.72, 40.0, 1.1, 1.12, "sine.out"],
        [40.0, 43.32, 1.0, 1.04, "sine.out"],
      ];
      CAM.forEach(([t0, t1, s0, s1, ease], i) => {
        tl.fromTo("#cam", { scale: s0 }, { scale: s1, duration: t1 - t0, ease, immediateRender: i === 0 }, t0);
      });

      window.__timelines["ae-sfx"] = tl;
    </script>
