<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Starter — 10X Coaching title card</title>
    <script src="vendor/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #251f70;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
        background: radial-gradient(circle at 78% 22%, #8c2fc2 0%, #652ca5 38%, #251f70 100%);
      }
      #title-card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 160px;
        gap: 36px;
      }
      #kicker {
        color: #feb022;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #headline {
        color: #ffffff;
        font-size: 150px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      #accent {
        width: 320px;
        height: 12px;
        background: #feb022;
        transform-origin: left center;
      }
      #subline {
        color: #f6f7fe;
        font-size: 44px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="title-card">
        <div id="kicker" class="clip" data-start="0" data-duration="5" data-track-index="0">HyperFrames is set up</div>
        <h1 id="headline" class="clip" data-start="0" data-duration="5" data-track-index="1">10X Coaching 2026</h1>
        <div id="accent" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
        <p id="subline" class="clip" data-start="0" data-duration="5" data-track-index="3">Edit this file, or ask Claude: “Using /hyperframes, …”</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kicker", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
      tl.fromTo("#headline", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.4);
      tl.fromTo("#accent", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 0.9);
      tl.fromTo("#subline", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 1.3);
      tl.to("#title-card > *", { opacity: 0, duration: 0.4, ease: "power1.in", stagger: 0.05 }, 4.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
