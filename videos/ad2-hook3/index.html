    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1a0509;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a0509;
        font-family: "Montserrat", sans-serif;
      }

      /* A-roll inside a non-timed camera wrapper for punch-ins (face centre ≈ 540, 640) */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 540px 640px;
        will-change: transform, filter;
      }
      #a-roll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* cutaway wrappers (non-timed) around each sub-composition host */
      .bw {
        position: absolute;
        inset: 0;
        z-index: 10;
        will-change: transform, opacity, filter;
      }
      .bw > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      .block {
        position: absolute;
        inset: 0;
        z-index: 46;
      }
      .block.b-1 {
        background: #4a0a14;
      }
      .block.b-2 {
        background: #ff9f1c;
      }
      .block.b-3 {
        background: #c8102e;
      }

      /* black gradient behind the captions */
      #cap-gradient {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 1080px;
        z-index: 50;
        pointer-events: none;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.84) 24%,
          rgba(0, 0, 0, 0.66) 42%,
          rgba(0, 0, 0, 0.38) 60%,
          rgba(0, 0, 0, 0.14) 78%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      /* captions: y 1150–1480 */
      #captions {
        position: absolute;
        left: 0;
        top: 1150px;
        width: 100%;
        height: 330px;
        z-index: 60;
        pointer-events: none;
      }
      .cg {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 0;
        height: 330px;
        display: flex;
        flex-wrap: wrap;
        align-content: center;
        align-items: baseline;
        justify-content: center;
        column-gap: 24px;
        row-gap: 0;
        opacity: 0;
        visibility: hidden;
      }
      .cw {
        position: relative;
        display: inline-block;
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 80px;
        line-height: 1.1;
        letter-spacing: -0.015em;
        color: #fff8ee;
        text-shadow:
          0 4px 18px rgba(0, 0, 0, 0.6),
          0 2px 3px rgba(0, 0, 0, 0.7);
        transform-origin: 50% 70%;
        isolation: isolate;
        --mk: 0;
      }
      .cw.em {
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-size: 104px;
        letter-spacing: -0.03em;
        color: #ff9f1c;
        text-shadow:
          0 0 38px rgba(255, 159, 28, 0.5),
          0 4px 16px rgba(0, 0, 0, 0.65);
      }
      .cw.em.red {
        color: #ff3b4e;
        text-shadow:
          0 0 38px rgba(255, 59, 78, 0.45),
          0 4px 16px rgba(0, 0, 0, 0.65);
      }
      .cw.em::after {
        content: "";
        position: absolute;
        left: -6px;
        right: -6px;
        bottom: 14px;
        height: 22px;
        border-radius: 6px;
        background: rgba(200, 16, 46, 0.82);
        transform-origin: 0% 50%;
        transform: scaleX(var(--mk));
        z-index: -1;
      }
      .cw.em.red::after {
        background: rgba(90, 8, 20, 0.85);
      }
    </style>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ------------------------------------------------------------------ cutaways
      // [wrapper, start, end, transition in, exit to speaker?]
      const CUTS = [
        ["#bw-g1a", 2.48, 5.38, "zoom", false],
        ["#bw-g1b", 5.38, 9.58, "zoom", false],
        ["#bw-g2", 9.58, 14.34, "blocks", true],
        ["#bw-g3", 17.42, 19.32, "blocks", true],
        ["#bw-g4", 24.6, 29.92, "zoom", true],
        ["#bw-g5", 36.48, 44.1, "zoom", true],
      ];
      const IN = 0.34;
      const OUT = 0.28;
      tl.set(".block", { xPercent: -101 }, 0);

      CUTS.forEach(([sel, start, end, kind, exit]) => {
        if (kind === "zoom") {
          tl.fromTo(
            sel,
            { opacity: 0, scale: 1.24, filter: "blur(18px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: IN, ease: "expo.out" },
            start,
          );
        } else {
          tl.set(sel, { opacity: 1, scale: 1, filter: "blur(0px)" }, start);
        }
        if (exit) {
          tl.fromTo(
            sel,
            { opacity: 1, scale: 1, filter: "blur(0px)" },
            { opacity: 0, scale: 0.86, filter: "blur(16px)", duration: OUT, ease: "power3.in", immediateRender: false },
            end - OUT,
          );
        }
      });

      // staggered blocks into g2 and the loss beat
      [9.58, 17.42].forEach((t) => {
        ["#blk-1", "#blk-2", "#blk-3"].forEach((b, i) => {
          tl.fromTo(b, { xPercent: -101 }, { xPercent: 0, duration: 0.2, ease: "power3.in", immediateRender: false }, t - 0.26 + i * 0.03);
        });
        ["#blk-3", "#blk-2", "#blk-1"].forEach((b, i) => {
          tl.fromTo(b, { xPercent: 0 }, { xPercent: 101, duration: 0.24, ease: "power3.out", immediateRender: false }, t + 0.02 + i * 0.05);
        });
      });

      // ------------------------------------------------------------------ speaker camera
      // [t0, t1, scale0, scale1, ease]
      const CAM = [
        [0.0, 2.48, 1.0, 1.07, "sine.inOut"],
        [2.48, 2.78, 1.07, 1.15, "power2.in"],
        [14.06, 14.4, 1.14, 1.0, "power3.out"],
        [14.4, 16.02, 1.0, 1.03, "sine.out"],
        [16.02, 17.42, 1.16, 1.19, "sine.out"],
        [19.04, 19.4, 1.12, 1.0, "power3.out"],
        [19.4, 22.04, 1.0, 1.04, "sine.inOut"],
        [22.04, 24.6, 1.15, 1.18, "sine.out"],
        [29.64, 29.98, 1.12, 1.0, "power3.out"],
        [29.98, 31.56, 1.0, 1.03, "sine.out"],
        [31.56, 33.92, 1.13, 1.16, "sine.out"],
        [33.92, 35.56, 1.0, 1.03, "sine.out"],
        [35.56, 36.48, 1.18, 1.2, "sine.out"],
        [43.82, 44.16, 1.12, 1.0, "power3.out"],
        [44.16, 50.36, 1.0, 1.05, "sine.inOut"],
        [50.36, 52.36, 1.1, 1.13, "sine.out"],
      ];
      CAM.forEach(([t0, t1, s0, s1, ease], i) => {
        tl.fromTo("#cam", { scale: s0 }, { scale: s1, duration: t1 - t0, ease, immediateRender: i === 0 }, t0);
      });
      tl.set("#cam", { filter: "blur(0px)" }, 0);
      CUTS.forEach(([, start, end, , exit]) => {
        tl.fromTo("#cam", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.3, ease: "power2.in", immediateRender: false }, start);
        if (exit) {
          tl.fromTo("#cam", { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.34, ease: "power3.out", immediateRender: false }, end - OUT);
        }
      });

      // ------------------------------------------------------------------ caption gradient
      tl.fromTo("#cap-gradient", { opacity: 0, yPercent: 12 }, { opacity: 1, yPercent: 0, duration: 0.3, ease: "power2.out" }, 0);

      // ------------------------------------------------------------------ captions
      const layer = document.getElementById("captions");
      const GROUPS = window.CAPTION_GROUPS;
      GROUPS.forEach((g, gi) => {
        const el = document.createElement("div");
        el.className = "cg";
        el.id = "cg-" + gi;
        g.words.forEach((w, wi) => {
          const s = document.createElement("span");
          s.className = "cw" + (w.tone ? " em " + w.tone : "");
          s.id = "cg-" + gi + "-w" + wi;
          s.textContent = w.text;
          el.appendChild(s);
        });
        layer.appendChild(el);
      });
      GROUPS.forEach((g, gi) => {
        const el = document.getElementById("cg-" + gi);
        tl.set(el, { visibility: "visible", opacity: 1, y: 0 }, g.start);
        g.words.forEach((w, wi) => {
          const s = document.getElementById("cg-" + gi + "-w" + wi);
          const at = Math.max(g.start, w.start - 0.04);
          if (w.tone) {
            tl.fromTo(
              s,
              { opacity: 0, scale: 1.9, y: -8, rotation: -5, filter: "blur(10px)" },
              { opacity: 1, scale: 1, y: 0, rotation: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out" },
              at,
            );
            tl.fromTo(s, { "--mk": 0 }, { "--mk": 1, duration: 0.28, ease: "power3.out" }, at + 0.12);
          } else {
            tl.fromTo(
              s,
              { opacity: 0, y: 44, scale: 0.7, color: "#FFC93C" },
              { opacity: 1, y: 0, scale: 1, color: "#FFC93C", duration: 0.24, ease: "back.out(2.2)" },
              at,
            );
            tl.fromTo(s, { color: "#FFC93C" }, { color: "#FFF8EE", duration: 0.22, ease: "power1.out", immediateRender: false }, Math.max(at + 0.12, w.end));
          }
        });
        tl.to(el, { opacity: 0, y: -16, duration: 0.1, ease: "power2.in" }, g.end - 0.1);
        tl.set(el, { opacity: 0, visibility: "hidden" }, g.end);
      });

      // caption self-lint
      GROUPS.forEach((g, gi) => {
        const el = document.getElementById("cg-" + gi);
        tl.seek(g.end + 0.01);
        const cs = window.getComputedStyle(el);
        if (cs.opacity !== "0" && cs.visibility !== "hidden") {
          console.warn("[caption-lint] group " + gi + " still visible at t=" + (g.end + 0.01).toFixed(2) + "s");
        }
      });
      tl.seek(0);

      window.__timelines["main"] = tl;
    </script>
