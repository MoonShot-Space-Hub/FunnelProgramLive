<script>
(function () {
  var ID = "g5-bundle-free";
  var P = ID + "-";
  var DUR = 7.62;
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(n) { return document.getElementById(P + n); }
  function prand(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

  // ---------- setup (deterministic, runs once) ----------
  // split headline text into per-character spans
  var splits = document.querySelectorAll("#" + P + "titleA, #" + P + "hdB, #" + P + "subB, #" + P + "hdC, #" + P + "subC");
  for (var s = 0; s < splits.length; s++) {
    var txt = splits[s].textContent;
    splits[s].textContent = "";
    for (var c = 0; c < txt.length; c++) {
      var sp = document.createElement("span");
      sp.className = P + "ch";
      sp.textContent = txt.charAt(c);
      splits[s].appendChild(sp);
    }
  }
  function chars(n) { return el(n).querySelectorAll("." + P + "ch"); }

  // rangoli ring: petals, dots, inner lotus
  var rgp = el("rg-petals"), rgd = el("rg-dots"), rgl = el("rg-lotus");
  for (var i = 0; i < 32; i++) {
    var p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", "M0 -600 C30 -570 30 -528 0 -496 C-30 -528 -30 -570 0 -600 Z");

    p.setAttribute("stroke-width", "3");
    p.setAttribute("transform", "rotate(" + (i * 11.25) + ")");
    rgp.appendChild(p);
  }
  for (i = 0; i < 48; i++) {
    var a = i * Math.PI * 2 / 48;
    var d = document.createElementNS(SVGNS, "circle");
    d.setAttribute("cx", (470 * Math.cos(a)).toFixed(2));
    d.setAttribute("cy", (470 * Math.sin(a)).toFixed(2));
    d.setAttribute("r", i % 3 === 0 ? "8" : "5");
    rgd.appendChild(d);
  }
  for (i = 0; i < 16; i++) {
    var lp = document.createElementNS(SVGNS, "path");
    lp.setAttribute("d", "M0 -400 C58 -360 70 -300 0 -270 C-70 -300 -58 -360 0 -400 Z");
    lp.setAttribute("stroke", "#C8102E");
    lp.setAttribute("stroke-width", "3");
    lp.setAttribute("transform", "rotate(" + (i * 22.5) + ")");
    rgl.appendChild(lp);
  }

  // string-light bokeh (seeded)
  var bokehBox = el("bokeh");
  var BK_COL = ["255,201,60", "255,159,28", "255,231,160", "255,201,60", "229,0,125"];
  var bokeh = [];
  for (i = 0; i < 30; i++) {
    var b = document.createElement("i");
    b.className = P + "bk";
    var size = 22 + prand(i * 3 + 1) * 110;
    var col = BK_COL[i % 7 === 6 ? 4 : i % 4];
    b.style.left = (prand(i * 3 + 2) * 1080 - size / 2).toFixed(1) + "px";
    b.style.top = (prand(i * 5 + 7) * 1600 - size / 2).toFixed(1) + "px";
    b.style.width = size.toFixed(1) + "px";
    b.style.height = size.toFixed(1) + "px";
    b.style.background = "radial-gradient(circle closest-side, rgba(" + col + ",0.9) 0%, rgba(" + col + ",0.45) 55%, rgba(" + col + ",0) 100%)";
    bokehBox.appendChild(b);
    bokeh.push({ el: b, base: 0.1 + prand(i * 11 + 3) * 0.32, ph: prand(i * 13 + 5) * 6.283, sp: 0.8 + prand(i * 17 + 2) * 2.2, dx: 6 + prand(i * 19 + 4) * 16, dy: 10 + prand(i * 23 + 1) * 26 });
  }

  // mirror-work dots around card A (world coords: [x, y, size])
  var MIRRORS = [[180,156,28],[400,146,22],[620,154,26],[770,144,20],[88,256,24],[88,410,30],[92,532,20],[998,300,26],[1000,450,22],[994,548,18]];
  var mirrorBox = el("mirrors");
  var mirrors = [];
  for (i = 0; i < MIRRORS.length; i++) {
    var m = MIRRORS[i];
    var md = document.createElement("div");
    md.className = P + "mirror";
    md.style.left = (m[0] - m[2] / 2) + "px";
    md.style.top = (m[1] - m[2] / 2) + "px";
    md.style.width = m[2] + "px";
    md.style.height = m[2] + "px";
    var g = document.createElement("i");
    g.className = P + "glint";
    md.appendChild(g);
    mirrorBox.appendChild(md);
    mirrors.push({ el: md, glint: g, ph: prand(i * 7 + 1) * 6.283 });
  }

  // marigold petals (back + front layers) and gold sparks
  var PET_COL = [["#FFC93C", "#FF9F1C"], ["#FF9F1C", "#E0700E"], ["#FFE7A0", "#FFC93C"], ["#FF9F1C", "#C8102E"]];
  var petals = [];
  for (i = 0; i < 40; i++) {
    var front = i >= 34;
    var pe = document.createElement("i");
    pe.className = P + "petal";
    var w = (front ? 34 : 17) + prand(i * 3 + 1) * (front ? 22 : 22);
    var h = w * 0.66;
    var pc = PET_COL[i % 4];
    pe.style.width = w.toFixed(1) + "px";
    pe.style.height = h.toFixed(1) + "px";
    pe.style.marginLeft = (-w / 2).toFixed(1) + "px";
    pe.style.marginTop = (-h / 2).toFixed(1) + "px";
    pe.style.background = "linear-gradient(180deg, " + pc[0] + " 0%, " + pc[1] + " 100%)";
    if (front) pe.style.filter = "blur(3px)";
    (front ? el("petalsFront") : el("petalsBack")).appendChild(pe);
    // back petals burst outward from under the stamp's rim; front petals fly past the lens
    var ang = front
      ? (i % 2 ? 0.25 : Math.PI - 0.25) + (prand(i * 5 + 2) * 2 - 1) * 0.5
      : (i / 34) * Math.PI * 2 + (prand(i * 5 + 2) - 0.5) * 0.3;
    var spd = front ? 900 + prand(i * 7 + 3) * 700 : 520 + prand(i * 7 + 3) * 620;
    petals.push({
      el: pe, front: front,
      ox: front ? 0 : Math.cos(ang) * 320, oy: front ? 0 : Math.sin(ang) * 130,
      vx: Math.cos(ang) * spd * (front ? 1 : 0.55), vy: Math.sin(ang) * spd - (front ? 0 : 140),
      k: 3.3 + prand(i * 13 + 5) * 1.3,
      rot0: prand(i * 17 + 9) * 360, spin: (prand(i * 11 + 4) * 2 - 1) * 520,
      ph: prand(i * 19 + 6) * 6.283, fl: 5 + prand(i * 23 + 8) * 5
    });
  }
  var sparks = [];
  for (i = 0; i < 18; i++) {
    var sk = document.createElement("i");
    sk.className = P + "spark";
    el("sparks").appendChild(sk);
    var sa = i * Math.PI * 2 / 18 + (prand(i * 29 + 3) - 0.5) * 0.3;
    sparks.push({ el: sk, a: sa, v: 1100 + prand(i * 31 + 7) * 800 });
  }
  var rays = [];
  for (i = 0; i < 14; i++) {
    var ry = document.createElement("i");
    ry.className = P + "ray";
    el("rays").appendChild(ry);
    rays.push({ el: ry, a: i * 360 / 14 + 6, r0: 210 + prand(i * 37 + 1) * 60 });
  }

  var tl = gsap.timeline({ paused: true });

  // ---------- AMBIENT: one finite clock (pure function of t) ----------
  var slotA = el("slotA"), slotB = el("slotB"), slotC = el("slotC"), floatEl = el("float");
  var amb = { t: 0 };
  function bobEnv(t, a, b) { return smooth((t - a) / 0.6) * (1 - smooth((t - b) / 0.5)); }
  function applyAmbient() {
    var t = amb.t, j;
    for (j = 0; j < bokeh.length; j++) {
      var k = bokeh[j];
      var tw = 0.62 + 0.38 * Math.sin(k.ph + t * k.sp);
      k.el.style.opacity = (k.base * tw).toFixed(3);
      k.el.style.transform = "translate(" + (k.dx * Math.sin(k.ph + t * 0.5)).toFixed(2) + "px," + (-k.dy * t / DUR * 2 + 4 * Math.cos(k.ph + t * 0.4)).toFixed(2) + "px)";
    }
    for (j = 0; j < mirrors.length; j++) {
      mirrors[j].glint.style.opacity = (0.45 + 0.55 * Math.max(0, Math.sin(mirrors[j].ph + t * 3.1))).toFixed(3);
    }
    // counter-phase idle bob after each card docks; damped once the ribbon ties the bundle
    var w = Math.sin(t * 2 * Math.PI / 2.6);
    slotA.style.transform = "translate(0px," + (-2.5 * w * bobEnv(t, 1.15, 4.9)).toFixed(2) + "px)";
    slotB.style.transform = "translate(0px," + (2.5 * w * bobEnv(t, 3.4, 4.9)).toFixed(2) + "px)";
    slotC.style.transform = "translate(0px," + (-2.5 * w * bobEnv(t, 4.55, 4.9)).toFixed(2) + "px)";
    // the tied bundle floats as one
    floatEl.style.transform = "translate(0px," + (-3 * Math.sin((t - 5.3) * 2 * Math.PI / 3.2) * smooth((t - 5.3) / 0.6)).toFixed(2) + "px)";
  }
  applyAmbient();
  tl.fromTo(amb, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: applyAmbient }, 0);

  tl.fromTo(el("rangoli"), { rotation: 0 }, { rotation: 16, duration: DUR, ease: "none" }, 0);
  tl.fromTo(el("rg-inner"), { rotation: 0, svgOrigin: "0 0" }, { rotation: -30, svgOrigin: "0 0", duration: DUR, ease: "none" }, 0);
  tl.fromTo(el("blob"), { x: -40, y: -20 }, { x: 70, y: 50, duration: DUR, ease: "sine.inOut" }, 0);
  tl.fromTo(el("goldglow"), { scale: 0.92 }, { scale: 1.12, duration: DUR, ease: "sine.inOut" }, 0);

  // ---------- CAMERA ----------
  tl.fromTo(el("cam"), { scale: 1 }, { scale: 1.04, duration: DUR, ease: "none" }, 0);
  // rig: Scene 1 frames the hero card low-centre; the camera follows the bundle up as it grows
  tl.fromTo(el("rig"), { y: 220 }, { y: 0, duration: 2.4, ease: "power3.inOut" }, 2.1);

  // motion-blur helper: blur proxy shares the move's window + ease (expo.out => blur ~ velocity)
  function motionBlur(wrapId, nodeId, from, at, dur, ease, axis) {
    var wrap = el(wrapId), node = el(nodeId), pr = { b: from };
    function write() {
      if (pr.b < 0.25 || pr.b >= from) { wrap.style.filter = "none"; node.setAttribute("stdDeviation", "0 0"); return; }

      node.setAttribute("stdDeviation", axis === "y" ? "0 " + pr.b.toFixed(2) : pr.b.toFixed(2) + " 0");
    }
    tl.fromTo(pr, { b: from }, { b: 0, duration: dur, ease: ease, onUpdate: write }, at);
    return write;
  }

  // ---------- SCENE 1 (0.0-2.0): hero card tilts in, light sweep, sparkles ----------
  // split-tilt entry: from its own side, rotateY TILT+OVERSHOOT settling to TILT
  tl.fromTo(el("cardA"),
    { x: -300, rotationY: 40, rotationX: 10, rotation: -5, z: -260, opacity: 0, transformPerspective: 1600 },
    { x: 0, rotationY: 8, rotationX: 0, rotation: 0, z: 0, opacity: 1, transformPerspective: 1600, duration: 1.0, ease: "expo.out" }, 0.1);
  var wA = motionBlur("mbwA", "mbA-n", 34, 0.1, 1.0, "expo.out", "x");
  wA();
  // glow blooms behind the hero, resolving with its settle (ambient-glow-bloom)
  tl.fromTo(el("aglow"), { opacity: 0, scale: 0.82 }, { opacity: 0.3, scale: 1, duration: 0.9, ease: "power2.out" }, 0.12);
  tl.fromTo(el("aglow"), { opacity: 0.3 }, { opacity: 0, duration: 1.0, ease: "power1.inOut", immediateRender: false }, 2.3);

  tl.fromTo(el("tileA"), { scale: 0, rotation: -20, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.34);
  tl.fromTo(chars("titleA"),
    { opacity: 0, y: 46, rotationX: -80, transformPerspective: 600 },
    { opacity: 1, y: 0, rotationX: 0, transformPerspective: 600, duration: 0.55, ease: "power4.out", stagger: 0.03 }, 0.4);
  tl.fromTo(el("chipA"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.62);
  tl.fromTo([el("bar"), el("tc0"), el("tc1")], { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.05 }, 0.7);
  // the scrubber fills to the end on "everything"
  tl.fromTo(el("barfill"), { scaleX: 0 }, { scaleX: 1, duration: 1.05, ease: "power2.inOut" }, 0.78);
  tl.fromTo(el("knob"), { x: 0 }, { x: 560, duration: 1.05, ease: "power2.inOut" }, 0.78);
  // light sweep after the landing
  tl.fromTo(el("sheenA"), { x: -420 }, { x: 1300, duration: 0.75, ease: "power1.inOut" }, 1.02);

  // "everything" 1.52: mirror-work dots pop around the card, star glints flash
  var mOrder = [2, 1, 3, 0, 7, 4, 8, 5, 9, 6];
  for (i = 0; i < mOrder.length; i++) {
    tl.fromTo(mirrors[mOrder[i]].el, { scale: 0, rotation: -120, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.48 + i * 0.035);
  }
  [[0, 1.54], [1, 1.64], [2, 1.74], [3, 1.86]].forEach(function (sg) {
    var st = el("star" + sg[0]);
    tl.fromTo(st, { scale: 0, rotation: 0, opacity: 0 }, { scale: 1, rotation: 45, opacity: 1, duration: 0.16, ease: "power2.out" }, sg[1]);
    tl.to(st, { scale: 0, rotation: 90, opacity: 0, duration: 0.3, ease: "power2.in" }, sg[1] + 0.16);
  });

  // ---------- SCENE 2 (2.0-5.4): + / RISK / + / MIND dock into a fanned, ribboned bundle ----------
  tl.fromTo(el("plus1"), { scale: 0, rotation: -120, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 2.14);
  tl.fromTo(el("pring1"), { scale: 0.6, opacity: 0 }, { scale: 0.8, opacity: 0.9, duration: 0.05, ease: "none" }, 2.22);
  tl.to(el("pring1"), { scale: 2.3, opacity: 0, duration: 0.5, ease: "power2.out" }, 2.27);

  // RISK MANAGEMENT slides in from the right (opposing tilt), horizontal motion blur
  tl.fromTo(el("cardB"),
    { x: 760, rotationY: -36, rotation: 7, opacity: 0, transformPerspective: 1600 },
    { x: 0, rotationY: -8, rotation: 2.5, opacity: 1, transformPerspective: 1600, duration: 0.85, ease: "expo.out" }, 2.64);
  var wB = motionBlur("mbwB", "mbB-n", 40, 2.64, 0.85, "expo.out", "x");
  wB();
  tl.fromTo(el("tileB"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)" }, 2.8);
  tl.fromTo(chars("hdB"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", stagger: 0.04 }, 2.74);
  tl.fromTo(chars("subB"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out", stagger: 0.022 }, 2.9);
  var shO = el("shieldO"), shC = el("shieldC");
  var SHO = shO.getTotalLength(), SHC = shC.getTotalLength();
  shO.style.strokeDasharray = SHO; shC.style.strokeDasharray = SHC;
  tl.fromTo(shO, { strokeDashoffset: SHO }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 2.84);
  tl.fromTo(shC, { strokeDashoffset: SHC }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 3.24);
  // the + locks with a quarter turn when RISK docks
  tl.fromTo(el("plus1"), { rotation: 0 }, { rotation: 90, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 3.0);
  tl.fromTo(el("sheenB"), { x: -420 }, { x: 1300, duration: 0.7, ease: "power1.inOut" }, 3.26);

  tl.fromTo(el("plus2"), { scale: 0, rotation: -120, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 3.5);
  tl.fromTo(el("pring2"), { scale: 0.6, opacity: 0 }, { scale: 0.8, opacity: 0.9, duration: 0.05, ease: "none" }, 3.58);
  tl.to(el("pring2"), { scale: 2.3, opacity: 0, duration: 0.5, ease: "power2.out" }, 3.63);

  // MIND MANAGEMENT slides in from the left
  tl.fromTo(el("cardC"),
    { x: -760, rotationY: 36, rotation: -7, opacity: 0, transformPerspective: 1600 },
    { x: 0, rotationY: 8, rotation: -1.5, opacity: 1, transformPerspective: 1600, duration: 0.85, ease: "expo.out" }, 3.76);
  var wC = motionBlur("mbwC", "mbC-n", 40, 3.76, 0.85, "expo.out", "x");
  wC();
  tl.fromTo(el("tileC"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)" }, 3.92);
  tl.fromTo(chars("hdC"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", stagger: 0.04 }, 3.86);
  tl.fromTo(chars("subC"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out", stagger: 0.022 }, 4.08);
  var lot = [el("lotus0"), el("lotus1"), el("lotus2"), el("lotus3")];
  lot.forEach(function (lp, li) {
    var L = lp.getTotalLength();
    lp.style.strokeDasharray = L;
    tl.fromTo(lp, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 3.96 + li * 0.07);
  });
  tl.fromTo(el("lotus4"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2.5)" }, 4.26);
  tl.fromTo(el("plus2"), { rotation: 0 }, { rotation: 90, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 4.12);
  tl.fromTo(el("sheenC"), { x: -420 }, { x: 1300, duration: 0.7, ease: "power1.inOut" }, 4.4);

  // the stack fans out
  tl.fromTo(el("cardA"), { rotation: 0 }, { rotation: -2, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 4.3);

  // gold ribbon wraps the bundle top -> bottom, tails drop, bow pops, the bundle cinches
  tl.fromTo(el("ribbon"), { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.inOut" }, 4.55);
  tl.fromTo(el("tail1"), { rotation: 16, scaleY: 0 }, { rotation: 16, scaleY: 1, duration: 0.45, ease: "back.out(2)" }, 5.12);
  tl.fromTo(el("tail2"), { rotation: -16, scaleY: 0 }, { rotation: -16, scaleY: 1, duration: 0.45, ease: "back.out(2)" }, 5.16);
  tl.fromTo(el("bow"), { scale: 0, rotation: -30, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, opacity: 1, transformOrigin: "50% 50%", duration: 0.55, ease: "back.out(2.2)" }, 5.06);
  tl.fromTo(el("stack"), { scaleX: 1 }, { scaleX: 0.982, duration: 0.1, ease: "power2.in" }, 5.08);
  tl.to(el("stack"), { scaleX: 1, duration: 0.5, ease: "back.out(2.5)" }, 5.18);
  tl.fromTo(el("rgloss"), { y: -220 }, { y: 900, duration: 0.65, ease: "power1.inOut" }, 5.3);
  // one light pass across the tied bundle
  tl.fromTo(el("sheenA"), { x: -420 }, { x: 1300, duration: 0.7, ease: "power1.inOut", immediateRender: false }, 5.36);
  tl.fromTo(el("sheenB"), { x: -420 }, { x: 1300, duration: 0.7, ease: "power1.inOut", immediateRender: false }, 5.44);
  tl.fromTo(el("sheenC"), { x: -420 }, { x: 1300, duration: 0.7, ease: "power1.inOut", immediateRender: false }, 5.52);

  // ---------- SCENE 3 (5.4-7.62): stack dims, FREE stamp slams with a marigold burst ----------
  tl.fromTo(el("dim"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 6.1);
  tl.to(el("stack"), { scale: 0.95, duration: 0.7, ease: "power2.out" }, 6.1);
  // glow anticipates, then blooms on the impact
  tl.fromTo(el("sglow"), { opacity: 0, scale: 0.78 }, { opacity: 0.12, scale: 0.84, duration: 0.55, ease: "power1.in" }, 6.3);
  tl.to(el("sglow"), { opacity: 0.42, scale: 1, duration: 0.45, ease: "power2.out" }, 6.9);
  var sgc = el("sglowcore"), brth = { p: 0 };
  tl.fromTo(brth, { p: 0 }, {
    p: Math.PI * 2 * 0.25, duration: DUR - 7.36, ease: "none",
    onUpdate: function () { var s = Math.sin(brth.p); sgc.style.opacity = (1 - 0.08 * s).toFixed(3); sgc.style.transform = "scale(" + (1 + 0.025 * s).toFixed(4) + ")"; }
  }, 7.36);

  // kinetic slam: scale + blur resolve on a hard power4 attack, landing on "free"
  tl.fromTo(el("stamp"),
    { scale: 2.5, rotation: -20, opacity: 0, filter: "blur(16px)" },
    { scale: 1, rotation: -8, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" }, 6.78);
  // impact squash -> overshoot settle
  tl.fromTo(el("thump"), { scale: 0.9 }, { scale: 1, duration: 0.6, ease: "elastic.out(1.1, 0.42)" }, 6.92);
  tl.fromTo(el("shock"), { scale: 0.4, opacity: 0 }, { scale: 0.5, opacity: 0.95, duration: 0.04, ease: "none" }, 6.9);
  tl.to(el("shock"), { scale: 2.3, opacity: 0, duration: 0.6, ease: "power2.out" }, 6.94);
  // the dimmed stack recoils from the hit
  tl.to(el("stack"), { scale: 0.93, duration: 0.07, ease: "power2.out" }, 6.92);
  tl.to(el("stack"), { scale: 0.95, duration: 0.45, ease: "back.out(2)" }, 6.99);
  // light sweep through the letters once it has landed
  tl.fromTo(el("sshine"), { backgroundPosition: "100% 50%" }, { backgroundPosition: "0% 50%", duration: 0.5, ease: "none" }, 7.16);
  [[4, 7.2], [5, 7.32]].forEach(function (sg) {
    var st = el("star" + sg[0]);
    tl.fromTo(st, { scale: 0, rotation: 0, opacity: 0 }, { scale: 1, rotation: 45, opacity: 1, duration: 0.16, ease: "power2.out" }, sg[1]);
    tl.to(st, { scale: 0, rotation: 90, opacity: 0, duration: 0.28, ease: "power2.in" }, sg[1] + 0.16);
  });

  // camera shake on impact (decaying, pure function of time)
  var shakeEl = el("shake"), shk = { T: 0 }, SHK = 0.45;
  function writeShake() {
    var tt = shk.T * SHK;
    if (shk.T <= 0 || shk.T >= 1) { shakeEl.style.transform = "translate(0px,0px)"; return; }
    var amp = 15 * Math.exp(-7 * tt);
    shakeEl.style.transform = "translate(" + (amp * Math.sin(2 * Math.PI * 11 * tt)).toFixed(2) + "px," + (0.8 * amp * Math.sin(2 * Math.PI * 13 * tt)).toFixed(2) + "px) rotate(" + (0.035 * amp * Math.sin(2 * Math.PI * 9 * tt)).toFixed(3) + "deg)";
  }
  writeShake();
  tl.fromTo(shk, { T: 0 }, { T: 1, duration: SHK, ease: "none", onUpdate: writeShake }, 6.92);

  // marigold-petal burst: drag + gravity ballistic, seeded, driver ease "none"
  var BURST = 6.92, FLIGHT = DUR - BURST, G = 620;
  var drv = { T: 0 };
  function writeBurst() {
    var T = drv.T, t = T * FLIGHT, j;
    var fade = T <= 0 ? 0 : 1 - smooth((T - 0.7) / 0.3);
    for (j = 0; j < petals.length; j++) {
      var q = petals[j];
      var e = 1 - Math.exp(-q.k * t);
      var x = q.ox + q.vx * e / q.k + 14 * Math.sin(4 * t + q.ph) * (1 - Math.exp(-2 * t));
      var y = q.oy + q.vy * e / q.k + (G / q.k) * (t - e / q.k);
      var rot = q.rot0 + q.spin * e / q.k + 40 * t;
      var fl = 0.3 + 0.7 * Math.abs(Math.cos(q.fl * t + q.ph));
      var sc = q.front ? 1 + 0.6 * T : 1;
      q.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + rot.toFixed(1) + "deg) scale(" + (sc * fl).toFixed(3) + "," + sc.toFixed(3) + ")";
      q.el.style.opacity = fade.toFixed(3);
    }
    var sf = T <= 0 ? 0 : 1 - smooth((T - 0.25) / 0.5);
    for (j = 0; j < sparks.length; j++) {
      var sp2 = sparks[j];
      var vNow = sp2.v * Math.exp(-7 * t);
      var dist = sp2.v * (1 - Math.exp(-7 * t)) / 7 + 120;
      var len = 10 + vNow * 0.05;
      sp2.el.style.width = len.toFixed(1) + "px";
      sp2.el.style.transform = "rotate(" + (sp2.a * 180 / Math.PI).toFixed(2) + "deg) translate(" + dist.toFixed(1) + "px,-2.5px)";
      sp2.el.style.opacity = sf.toFixed(3);
    }
    var rp = clamp01(t / 0.38);
    var re = 1 - Math.pow(1 - rp, 3);
    for (j = 0; j < rays.length; j++) {
      var r = rays[j];
      r.el.style.transform = "rotate(" + r.a + "deg) translate(" + (r.r0 + 230 * re).toFixed(1) + "px,0px) scale(" + (1 - rp).toFixed(3) + ",1)";
      r.el.style.opacity = (T <= 0 ? 0 : 1 - rp).toFixed(3);
    }
  }
  writeBurst();
  tl.fromTo(drv, { T: 0 }, { T: 1, duration: FLIGHT, ease: "none", onUpdate: writeBurst }, BURST);

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
