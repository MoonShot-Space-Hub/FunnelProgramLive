      sp.g.setAttribute("transform", "translate(" + px.toFixed(1) + " " + py.toFixed(1) + ") rotate(" + (sp.rot * p).toFixed(1) + ") scale(" + Math.max(0.001, ss).toFixed(3) + ")");
      sp.g.setAttribute("opacity", (1 - p * p).toFixed(3));
    }
  }
  render(0);
  var clock = { t: 0 };
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(clock.t); } }, 0);

  // ======================= CAMERA: slow push + parallax =======================
  tl.fromTo(el("cam"), { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);
  tl.fromTo(el("lights"), { scale: 1, y: 0 }, { scale: 1.025, y: -6, duration: DUR, ease: "none" }, 0);
  tl.fromTo(el("blob"), { x: -30, y: -20 }, { x: 60, y: 50, duration: DUR, ease: "sine.inOut" }, 0);

  // ======================= SCENE 1 (0.0-1.3): rangoli draws, garbo rises, rays bloom =======================
  function prepDraw(node) {
    var L = node.getTotalLength() * 1.02;
    node.style.strokeDasharray = L.toFixed(1);
    node.style.strokeDashoffset = L.toFixed(1);
    return L;
  }
  var L1 = prepDraw(el("hring"));
  tl.fromTo(el("hring"), { strokeDashoffset: L1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.12);
  var L2 = prepDraw(el("hscallop"));
  tl.fromTo(el("hscallop"), { strokeDashoffset: L2 }, { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 0.28);
  var L3 = prepDraw(el("hstar"));
  tl.fromTo(el("hstar"), { strokeDashoffset: L3 }, { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" }, 0.44);
  var L4 = prepDraw(el("hinner"));
  tl.fromTo(el("hinner"), { strokeDashoffset: L4 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.58);
  var hdots = el("haloC").querySelectorAll("circle");
  for (var q = 0; q < hdots.length; q++) {
    tl.fromTo(hdots[q], { attr: { r: 0 } }, { attr: { r: q % 2 ? 3.2 : 4.6 }, duration: 0.32, ease: "back.out(2)" }, 0.7 + q * 0.014);
  }
  var L5 = prepDraw(el("fring"));
  tl.fromTo(el("fring"), { strokeDashoffset: L5 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 0.34);
  var L6 = prepDraw(el("fscallop"));
  tl.fromTo(el("fscallop"), { strokeDashoffset: L6 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 0.48);
  var L7 = prepDraw(el("finner"));
  tl.fromTo(el("finner"), { strokeDashoffset: L7 }, { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" }, 0.6);

  // garbo rises into the centre with a vertical motion blur and an overshoot settle
  tl.fromTo(el("garborise"), { y: 300, scale: 0.82 }, { y: 0, scale: 1, duration: 0.85, ease: "back.out(1.4)" }, 0.1);
  tl.fromTo(el("garborise"), { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power1.out" }, 0.1);
  var vb = el("vblur-node"), vbp = { v: 16 };
  function writeVB() { vb.setAttribute("stdDeviation", "0 " + vbp.v.toFixed(2)); }
  writeVB();
  tl.fromTo(vbp, { v: 16 }, { v: 0, duration: 0.55, ease: "power2.out", onUpdate: writeVB }, 0.1);
  // flame ignites as the pot lands
  tl.fromTo(el("flameignite"), { scale: 0, opacity: 0, transformOrigin: "50% 100%" }, { scale: 1, opacity: 1, transformOrigin: "50% 100%", duration: 0.5, ease: "back.out(2)" }, 0.42);
  // gold rays + bloom land with the garbo settle (one beat)
  tl.fromTo(el("bloom"), { opacity: 0, scale: 0.8 }, { opacity: 0.42, scale: 1, duration: 0.85, ease: "power2.out" }, 0.2);
  tl.fromTo(el("rays"), { opacity: 0, scale: 0.7 }, { opacity: 0.34, scale: 1, duration: 0.95, ease: "power2.out" }, 0.25);
  tl.fromTo(el("goldglow"), { scale: 0.8 }, { scale: 1.08, duration: DUR, ease: "sine.inOut" }, 0);
  // light sweep across the landed pot
  tl.fromTo(el("potsheen"), { x: -40 }, { x: 470, duration: 0.6, ease: "power1.inOut" }, 0.98);

  // ======================= SCENE 2 (1.3-2.9): dancers expand + orbit (driven by the clock), title chip =======================
  // "navratri" @2.08: cream chip pops above the garbo with motion blur, shockwave, sparkle burst
  tl.fromTo(el("chip"), { scale: 0.35, y: 46, rotation: -5, opacity: 0 }, { scale: 1, y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(1.7)" }, CHIP_T - 0.02);
  var cb = el("cblur-node"), cbp = { v: 12 };
  function writeCB() { cb.setAttribute("stdDeviation", "0 " + cbp.v.toFixed(2)); }
  writeCB();
  tl.fromTo(cbp, { v: 12 }, { v: 0, duration: 0.3, ease: "power2.out", onUpdate: writeCB }, CHIP_T);
  tl.fromTo(el("chipsheen"), { x: -160 }, { x: 640, duration: 0.5, ease: "power1.inOut" }, CHIP_T + 0.36);

  window.__timelines = window.__timelines || {};
  window.__timelines["g1-navratri-ring"] = tl;
})();
</script>
