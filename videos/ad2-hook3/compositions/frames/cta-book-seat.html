    gl.className = P + "glint";
    md.appendChild(gl);
    el("mirrors").appendChild(md);
    mirrors.push({ el: md, glint: gl, ph: prand(j * 7 + 3) * 6.283 });
  }

  // badge text -> per-character spans (spaces kept as nbsp)
  var spl = el("badge").querySelectorAll("." + P + "split");
  for (j = 0; j < spl.length; j++) {
    var txt = spl[j].textContent;
    spl[j].textContent = "";
    for (var c = 0; c < txt.length; c++) {
      var sp = document.createElement("span");
      sp.className = P + "ch";
      sp.textContent = txt.charAt(c) === " " ? " " : txt.charAt(c);
      spl[j].appendChild(sp);
    }
  }

  // gold sparkle pool for "now": emitted from the button's rim, outward
  var sparks = [];
  for (j = 0; j < 24; j++) {
    var star = j % 3 !== 2;
    var a = j / 24 * Math.PI * 2 + (prand(j * 5 + 1) - 0.5) * 0.25;
    var ox = Math.cos(a) * 392, oy = Math.sin(a) * 62;
    var nx = Math.cos(a) / 392, ny = Math.sin(a) / 62;
    var nl = Math.sqrt(nx * nx + ny * ny);
    nx /= nl; ny /= nl;
    var spd = 260 + prand(j * 7 + 2) * 300;
    var size = star ? 20 + prand(j * 11 + 3) * 18 : 7 + prand(j * 11 + 3) * 4;
    var node;
    if (star) {
      node = document.createElementNS(SVGNS, "svg");
      node.setAttribute("viewBox", "-32 -32 64 64");
      node.setAttribute("width", size.toFixed(1));
      node.setAttribute("height", size.toFixed(1));
      var u2 = document.createElementNS(SVGNS, "use");
      u2.setAttribute("href", "#" + P + "star");
      u2.setAttribute("x", "-32"); u2.setAttribute("y", "-32"); u2.setAttribute("width", "64"); u2.setAttribute("height", "64");
      node.appendChild(u2);
    } else {
      node = document.createElement("i");
      node.style.width = size.toFixed(1) + "px";
      node.style.height = size.toFixed(1) + "px";
      node.style.borderRadius = "50%";
      node.style.background = "#FFE7A0";
      node.style.boxShadow = "0 0 12px #FFC93C";
    }
    node.setAttribute("class", P + "spk");
    node.style.marginLeft = (-size / 2).toFixed(1) + "px";
    node.style.marginTop = (-size / 2).toFixed(1) + "px";
    el("sparks").appendChild(node);
    sparks.push({ el: node, ox: ox, oy: oy, vx: nx * spd, vy: ny * spd * 0.6, k: 5 + prand(j * 13 + 4) * 1.5, spin: (prand(j * 17 + 5) * 2 - 1) * 260, star: star });
  }

  var tl = gsap.timeline({ paused: true });

  // ---------- AMBIENT: one finite clock, pure function of t ----------
  var chevIn = [el("chev0").firstElementChild, el("chev1").firstElementChild, el("chev2").firstElementChild];
  var chipGlow = el("chipglow"), btnGlow = el("btnglow");
  var amb = { t: 0 };
  function applyAmbient() {
    var t = amb.t, i;
    // strands: damped swing after the drop lands, then a gentle sway
    for (i = 0; i < strands.length; i++) {
      var st = strands[i], tau = t - 0.42;
      var th = 0;
      if (tau > 0) th = 9 * Math.exp(-2.4 * tau) * Math.sin(5.6 * tau + i * 0.4) + 2.4 * Math.sin(1.5 * tau + st.ph) * smooth(tau / 1.2);
      st.g.setAttribute("transform", "translate(" + st.x + ",22) rotate(" + th.toFixed(3) + ")");
    }
    for (i = 0; i < leaves.length; i++) {
      var lf = leaves[i];
      lf.g.setAttribute("transform", "translate(" + lf.x.toFixed(2) + "," + lf.y.toFixed(2) + ") rotate(" + (lf.base + 3.5 * Math.sin(1.9 * t + lf.ph)).toFixed(3) + ")");
    }
    // string lights switch on left -> right on "link", then twinkle
    for (i = 0; i < bulbs.length; i++) {
      var bu = bulbs[i];
      var on = smooth((t - (0.56 + bu.i * 0.022)) / 0.1);
      bu.g.setAttribute("opacity", (on * (0.5 + 0.5 * Math.max(0, Math.sin(3.3 * t + bu.ph)))).toFixed(3));
    }
    for (i = 0; i < mirrors.length; i++) {
      mirrors[i].glint.style.opacity = (0.45 + 0.55 * Math.max(0, Math.sin(mirrors[i].ph + t * 3.1))).toFixed(3);
    }
    // bounded breathe on the chip glow once the chip has landed
    var cg = smooth((t - 1.6) / 0.5);
    chipGlow.style.opacity = (cg * (0.26 + 0.04 * Math.sin((t - 1.6) * 2.1))).toFixed(3);
    // button glow: rises with the button, flares on the release and on "now"
    var bgl = smooth((t - 6.3) / 0.5) * 0.28 + 0.16 * Math.exp(-Math.pow((t - 7.25) / 0.18, 2)) + 0.14 * Math.exp(-Math.pow((t - 7.86) / 0.14, 2));
    btnGlow.style.opacity = Math.min(0.45, bgl).toFixed(3);
    // chevrons: a downward bounce wave (top -> bottom)
    var env = smooth((t - 6.95) / 0.3);
    for (i = 0; i < chevIn.length; i++) {
      var w = Math.max(0, Math.sin(2 * Math.PI * (t - 6.95) / 0.8 - i * 0.9));
      chevIn[i].style.transform = "translate(0px," + (5 * w * env).toFixed(2) + "px)";
      chevIn[i].style.opacity = (1 - env * (1 - (0.45 + 0.55 * w))).toFixed(3);
    }
  }
  applyAmbient();
  tl.fromTo(amb, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: applyAmbient }, 0);

  // ---------- SCENE 1 (0.0-3.0): toran drops in, string lights, FREE 1-HOUR MASTERCLASS chip ----------
  tl.fromTo(el("scrim"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
  tl.fromTo(el("tor"), { y: -210 }, { y: 0, duration: 0.75, ease: "back.out(1.5)" }, 0.04);

  // chip springs in on "one hour masterclass"
  tl.fromTo(el("chip"), { scale: 0.3, opacity: 0, y: 26 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.6)" }, 1.46);
  tl.fromTo(el("free"), { scale: 0, rotation: -14 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, 1.62);
  tl.fromTo(el("chip").querySelectorAll("." + P + "sep, ." + P + "chiptxt"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out", stagger: 0.06 }, 1.66);
  mirrors.forEach(function (m, i) {
    tl.fromTo(m.el, { scale: 0, rotation: -120, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.78 + i * 0.05);
  });
  tl.fromTo(el("chipsheen"), { x: -260 }, { x: 900, duration: 0.65, ease: "power1.inOut" }, 2.06);

  // ---------- SCENE 2 (3.0-6.2): BECOME A SYSTEMATIC TRADER ticks in ----------
  tl.fromTo(el("badge"), { scaleX: 0.2, scaleY: 0.6, opacity: 0 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, 4.84);
  var bch = el("btxt").querySelectorAll("." + P + "ch");
  tl.fromTo(bch, { rotationX: -95, opacity: 0, y: 8, transformPerspective: 400 }, { rotationX: 0, opacity: 1, y: 0, transformPerspective: 400, duration: 0.3, ease: "power3.out", stagger: 0.016 }, 4.92);
  var bstep = el("bstep"), barrow = el("barrow");
  var BS = bstep.getTotalLength(), BA = barrow.getTotalLength();
  bstep.style.strokeDasharray = BS; barrow.style.strokeDasharray = BA;
  tl.fromTo(bstep, { strokeDashoffset: BS }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 4.98);
  tl.fromTo(barrow, { strokeDashoffset: BA }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 5.4);
  tl.fromTo(el("badgesheen"), { x: -260 }, { x: 900, duration: 0.6, ease: "power1.inOut" }, 5.6);

  // ---------- SCENE 3 (6.2-8.01): BOOK YOUR SEAT, cursor tap, chevrons, sparkle burst ----------
  tl.fromTo(el("bscrim"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 6.2);
  tl.fromTo(el("btnwrap"), { y: 150, scale: 0.55, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, 6.24);
  // vertical motion blur on the rise
  var mbw = el("btnmb"), mbn = el("mb-n"), mbp = { b: 18 };
  function writeMB() {
    if (mbp.b < 0.25 || mbp.b >= 18) { mbw.style.filter = "none"; mbn.setAttribute("stdDeviation", "0 0"); return; }
    mbw.style.filter = "url(#" + P + "mb)";
    mbn.setAttribute("stdDeviation", "0 " + mbp.b.toFixed(2));
  }
  writeMB();
  tl.fromTo(mbp, { b: 18 }, { b: 0, duration: 0.34, ease: "power2.out", onUpdate: writeMB }, 6.24);
  tl.fromTo(el("btnsheen"), { x: -260 }, { x: 960, duration: 0.6, ease: "power1.inOut" }, 6.76);

  [0, 1, 2].forEach(function (i) {
    tl.fromTo(el("chev" + i), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 6.6 + i * 0.08);
  });

  // cursor-click-ripple: move (ends before the click) -> click on "book" -> ripples from the click point
  tl.fromTo(el("hand"), { x: 600, y: 40, rotation: 14, opacity: 0 }, { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 6.44);
  tl.fromTo(el("hand"), { scale: 1 }, { scale: 0.84, duration: 0.09, ease: "power2.in" }, 7.0);
  tl.to(el("hand"), { scale: 1, duration: 0.14, ease: "power2.out" }, 7.09);
  // press-release-spring on the button: linear press, spring release (adjacent => continuous)
  tl.fromTo(el("btn"), { scale: 1 }, { scale: 0.92, duration: 0.12, ease: "power1.in" }, 7.0);
  tl.to(el("btn"), { scale: 1, duration: 0.6, ease: "back.out(2.2)" }, 7.12);
  [0, 1, 2].forEach(function (i) {
    var r = el("rip" + i), at = 7.03 + i * 0.09;
    tl.fromTo(r, { scale: 0.2, opacity: 0 }, { scale: 0.45, opacity: 0.95, duration: 0.05, ease: "none" }, at);
    tl.to(r, { scale: 2.6, opacity: 0, duration: 0.7, ease: "power2.out" }, at + 0.05);
  });
  tl.fromTo(el("burst"), { scale: 0.9, opacity: 0 }, { scale: 1.25, opacity: 0.8, duration: 0.4, ease: "power2.out" }, 7.12);
  tl.to(el("burst"), { opacity: 0, duration: 0.5, ease: "power2.in" }, 7.52);
  tl.fromTo(el("pulse"), { scaleX: 1, scaleY: 1, opacity: 0 }, { scaleX: 1.01, scaleY: 1.04, opacity: 0.95, duration: 0.05, ease: "none" }, 7.12);
  tl.to(el("pulse"), { scaleX: 1.09, scaleY: 1.45, opacity: 0, duration: 0.6, ease: "power2.out" }, 7.17);
  // the hand eases off the label after the tap
  tl.to(el("hand"), { x: 310, y: 16, rotation: -6, duration: 0.6, ease: "power2.inOut" }, 7.3);
  tl.fromTo(el("btnsheen"), { x: -260 }, { x: 960, duration: 0.6, ease: "power1.inOut", immediateRender: false }, 7.42);

  // "now" 7.80: gold sparkle burst off the button rim (drag ballistic, seeded)
  // the burst's life is 0.5s; the driver covers the part that fits before the end of the scene
  var BURST = 7.76, LIFE = 0.5, WIN = DUR - BURST;
  var drv = { T: 0 };
  function writeSparks() {
    var t = drv.T * WIN, T = t / LIFE;
    var op = drv.T <= 0 ? 0 : smooth(T / 0.08) * (1 - smooth((T - 0.3) / 0.7));
    for (var i = 0; i < sparks.length; i++) {
      var q = sparks[i];
      var e = 1 - Math.exp(-q.k * t);
      var x = q.ox + q.vx * e / q.k;
      var y = q.oy + q.vy * e / q.k + 60 * t * t;
      var sc = q.star ? 0.4 + 0.6 * smooth(T / 0.15) : 1;
      q.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (q.spin * t).toFixed(1) + "deg) scale(" + sc.toFixed(3) + ")";
      q.el.style.opacity = op.toFixed(3);
    }
  }
  writeSparks();
  tl.fromTo(drv, { T: 0 }, { T: 1, duration: WIN, ease: "none", onUpdate: writeSparks }, BURST);

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
</template>
