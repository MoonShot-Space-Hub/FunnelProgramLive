      var n = document.createElement("i");
      n.className = ID + "-bar";
      n.style.left = (b * 18) + "px";
      host.appendChild(n);
      BARS.push({ n: n, f: 7 + b * 1.7 + (b % 2) * 2.3, ph: b * 1.3 });
    }
  })();

  // ======================= BUILD: footprints (16 steps) + three layouts =======================
  var CX = 540, CY = 735, NF = 16;
  var SOLE = "M -3 -24 C 8 -26 15 -16 14 -4 C 13 6 9 10 9 18 C 9 30 4 35 -1 35 C -7 35 -11 30 -10 20 C -9 10 -13 4 -14 -6 C -15 -18 -11 -23 -3 -24 Z";
  var TOES = [[-9, -33, 5.6], [-1, -36.5, 4.2], [6, -34.5, 3.7], [11.5, -30.5, 3.2], [15.5, -24.5, 2.8]];
  var FEET = [];
  (function () {
    var host = el("footgroup");
    for (var i = 0; i < NF; i++) {
      var outer = svgEl("g", { opacity: 0 }, host);
      var inner = svgEl("g", { transform: i % 2 ? "" : "scale(-1 1)" }, outer);
      svgEl("path", { d: SOLE }, inner);
      for (var k = 0; k < TOES.length; k++) svgEl("circle", { cx: TOES[k][0], cy: TOES[k][1], r: TOES[k][2] }, inner);
      FEET.push({ g: outer });
    }
  })();
  function rotFromDir(dx, dy) { return Math.atan2(dx, -dy) * 180 / Math.PI; }
  function placeAlong(pts, offset) {
    // distribute NF steps along a polyline by arc length, alternating left/right of travel
    var cum = [0];
    for (var i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    var total = cum[cum.length - 1], out = [];
    for (var s = 0; s < NF; s++) {
      var target = total * (s + 0.5) / NF, j = 1;
      while (j < pts.length - 1 && cum[j] < target) j++;
      var segLen = cum[j] - cum[j - 1] || 1, u = (target - cum[j - 1]) / segLen;
      var x = lerp(pts[j - 1][0], pts[j][0], u), y = lerp(pts[j - 1][1], pts[j][1], u);
      var dx = pts[j][0] - pts[j - 1][0], dy = pts[j][1] - pts[j - 1][1], L = Math.hypot(dx, dy) || 1;
      var nx = -dy / L, ny = dx / L, side = s % 2 ? 1 : -1;
      out.push({ x: x + nx * offset * side, y: y + ny * offset * side, r: rotFromDir(dx, dy) });
    }
    return out;
  }
  function pathD(pts) { return pts.map(function (p, i) { return (i ? "L " : "M ") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" "); }
  var circlePts = [];
  for (var ci = 0; ci <= 96; ci++) { var ca = -Math.PI / 2 - (ci / 96) * TAU; circlePts.push([CX + 178 * Math.cos(ca), CY + 178 * Math.sin(ca)]); }
  var zigPts = [[180, 640], [360, 840], [540, 640], [720, 840], [900, 640]];
  var spinPts = [];
  for (var si = 0; si <= 120; si++) { var su = si / 120; var sa = -2.5 * Math.PI + su * 3 * Math.PI; var sr = 46 + 140 * su; spinPts.push([CX + sr * Math.cos(sa), CY + sr * Math.sin(sa)]); }
  var LAYOUTS = [placeAlong(circlePts, 15), placeAlong(zigPts, 17), placeAlong(spinPts, 13)];
  // unwrap rotations so each re-form turns the short way
  for (var li = 1; li < LAYOUTS.length; li++) {
    for (var fi = 0; fi < NF; fi++) {
      var prev = LAYOUTS[li - 1][fi].r, cur = LAYOUTS[li][fi].r;
      while (cur - prev > 180) cur -= 360;
      while (cur - prev < -180) cur += 360;
      LAYOUTS[li][fi].r = cur;
    }
  }
  el("gcircle").setAttribute("d", pathD(circlePts));
  el("gzig").setAttribute("d", pathD(zigPts));
  el("gspin").setAttribute("d", pathD(spinPts));

  // ======================= BUILD: rhythm waveform (6/8 accents) =======================
  var WX0 = 100, WX1 = 980, WCY = 770, WAMP = 116, NP = 12, PW = (WX1 - WX0) / NP;
  var ACC = [1, 0.42, 0.58, 0.82, 0.42, 0.58];
  function accentOf(k) { return ACC[((k - 1) % 6 + 6) % 6]; }
  function peakY(k) {
    var x = WX0 + PW * (k + 0.25);
    var env = Math.min(1, (x - WX0) / (PW * 0.5), (WX1 - x) / (PW * 0.5));
    return WCY - WAMP * accentOf(k) * env;
  }
  (function () {
    var d = "";
    for (var x = WX0; x <= WX1 + 0.01; x += 4) {
      var k = Math.min(NP - 1, Math.floor((x - WX0) / PW));
      var env = Math.min(1, (x - WX0) / (PW * 0.5), (WX1 - x) / (PW * 0.5));
      var y = WCY - WAMP * accentOf(k) * env * Math.sin(TAU * (x - WX0) / PW);
      d += (x === WX0 ? "M " : " L ") + x.toFixed(1) + " " + y.toFixed(1);
    }
    el("wpath").setAttribute("d", d);
    el("wglowpath").setAttribute("d", d);
    el("wsweep").setAttribute("d", d);
  })();
  var WDOTS = [];
  var DRAW_AT = 2.3, DRAW_DUR = 1.25;
  function headTime(x) { // when the sine.inOut draw head reaches x
    var f = (x - WX0) / (WX1 - WX0);
    return DRAW_AT + DRAW_DUR * Math.acos(1 - 2 * f) / Math.PI;
  }
  (function () {
    var host = el("wdots");
    for (var k = 0; k < NP; k++) {
      var px = WX0 + PW * (k + 0.25), py = peakY(k);
      WDOTS.push({ n: svgEl("circle", { cx: px.toFixed(1), cy: py.toFixed(1), r: 0, fill: "#FFF4E0" }, host), on: headTime(px), acc: accentOf(k) });
    }
  })();
  // 6/8 beat grid: eighth = 0.2s; accents on 1 (strong) and 4 (medium); strong downbeat lands on "rhythm" @3.66
  var BEATS = [];
  for (var bb = 0; bb < 9; bb++) BEATS.push({ t: 2.46 + 0.2 * bb, lv: [0.3, 0.07, 0.07, 0.18, 0.07, 0.07][bb % 6] });
  var ACCENT_TIMES = [3.06, 3.66];
  var DANDIYAS = [];
  (function () {
    var host = el("dandiyas");
    [1, 4, 7, 10].forEach(function (k, j) {
      var px = WX0 + PW * (k + 0.25), py = peakY(k) - 46;
      var g = svgEl("g", { transform: "translate(" + px.toFixed(1) + " " + py.toFixed(1) + ") scale(0)" }, host);
      var sticks = [];
      [-1, 1].forEach(function (side) {
        var sg = svgEl("g", {}, g);
        svgEl("path", { d: "M " + (side * 30) + " 46 L " + (side * -10) + " -30", stroke: "#FFC93C", "stroke-width": 6, "stroke-linecap": "round" }, sg);
        svgEl("path", { d: "M " + (side * 30) + " 46 L " + (side * -10) + " -30", stroke: "#C8102E", "stroke-width": 6, "stroke-dasharray": "5 6", "stroke-linecap": "butt" }, sg);
        svgEl("circle", { cx: side * -10, cy: -30, r: 4.5, fill: "#FFF4E0" }, sg);
        svgEl("path", { d: "M " + (side * 30) + " 46 l " + (side * 4) + " 14 M " + (side * 30) + " 46 l " + (side * -3) + " 15", stroke: "#E5007D", "stroke-width": 2.4, "stroke-linecap": "round" }, sg);
        sticks.push({ g: sg, side: side });
      });
      var spark = svgEl("g", { opacity: 0 }, g);
      for (var r = 0; r < 8; r++) {
        var a = (r / 8) * TAU + 0.2;
        svgEl("line", { x1: (Math.cos(a) * 10).toFixed(2), y1: (Math.sin(a) * 10).toFixed(2), x2: (Math.cos(a) * 26).toFixed(2), y2: (Math.sin(a) * 26).toFixed(2), stroke: r % 2 ? "#FFF4E0" : "#FFC93C", "stroke-width": 3, "stroke-linecap": "round" }, spark);
      }
      svgEl("circle", { cx: 0, cy: 0, r: 7, fill: "#FFF4E0" }, spark);
      var on = headTime(px);
      var clicks = [on + 0.08];
      ACCENT_TIMES.forEach(function (ta) { if (ta > on + 0.2) clicks.push(ta); });
      DANDIYAS.push({ g: g, sticks: sticks, spark: spark, x: px, y: py, on: on, clicks: clicks });
    });
  })();

  // ======================= MASTER CLOCK (pure function of t) =======================
  var TICKS = [0.06, 0.58, 1.10], STEP_DUR = 0.6, ITEM_H = 116;
  var BOUNCE = [gsap.parseEase("back.out(1.8)"), gsap.parseEase("back.out(1.8)"), gsap.parseEase("back.out(2.3)")];
  function tickerPos(t) { var s = 0; for (var i = 0; i < TICKS.length; i++) s += BOUNCE[i](seg(t, TICKS[i], STEP_DUR)); return s; }
  var stack = el("stack"), tblur = el("tblur-node"), disc = el("disc"), cardFlash = el("cardflash"), mandRot = el("mandrot");
  var footGroup = el("footgroup"), ripple = el("ripple"), wgroup = el("wgroup"), wglow = el("wglowpath"), wsweep = el("wsweep"), comet = el("comet"), wpath = el("wpath");
  var WAVE_L = 0, SWEEP_L = 0;
  var ARRIVE_AT = 0.1, REFORM = [0.58, 1.10], REFORM_DUR = 0.38, FLASH_T = 1.42;
  var COL_A = [255, 244, 224], COL_F = [255, 159, 28], COL_S = [255, 196, 120];
  function mix(a, b, p) { return "rgb(" + Math.round(lerp(a[0], b[0], p)) + "," + Math.round(lerp(a[1], b[1], p)) + "," + Math.round(lerp(a[2], b[2], p)) + ")"; }
  function beatAmp(t) {
    var amp = 0;
    for (var i = 0; i < BEATS.length; i++) { var dt = t - BEATS[i].t; if (dt >= 0) amp = BEATS[i].lv * Math.exp(-dt / 0.11); }
    return amp;
  }
  function clickClose(dt) { if (dt < 0) return 0; if (dt < 0.06) { var u = dt / 0.06; return u * u; } return Math.exp(-(dt - 0.06) / 0.09); }

  function render(t) {
    // ground ambience
    mandRot.setAttribute("transform", "rotate(" + (5 * t).toFixed(3) + " 540 540)");
    for (var i = 0; i < BOKEH.length; i++) {
      var b = BOKEH[i];
      b.n.style.opacity = (b.base * (0.7 + 0.3 * Math.sin(b.ph + t * b.fq))).toFixed(3);
      b.n.style.transform = "translate(" + (b.amp * Math.sin(b.ph + t * 0.55)).toFixed(2) + "px," + (b.amp * 0.7 * Math.cos(b.ph * 1.3 + t * 0.4) - 9 * t).toFixed(2) + "px)";
    }
    // slot-machine ticker: additive back.out springs + velocity-matched vertical blur
    var pos = tickerPos(t), vel = Math.abs(pos - tickerPos(t - 1 / 60)) * ITEM_H;
    stack.style.transform = "translateY(" + (-pos * ITEM_H).toFixed(2) + "px)";
    tblur.setAttribute("stdDeviation", "0 " + Math.min(14, vel * 0.55).toFixed(2));
    // vinyl spins, kicking forward on each tick; card rim flashes on each tick
    var spin = 95 * t, flash = 0;
    for (var k = 0; k < TICKS.length; k++) {
      spin += 80 * P3O(seg(t, TICKS[k], 0.5));
      var dtk = t - TICKS[k] - 0.1;
      if (dtk >= 0) flash = Math.max(flash, Math.exp(-dtk / 0.22));
    }
    disc.setAttribute("transform", "rotate(" + spin.toFixed(2) + " 95 95)");
    cardFlash.style.opacity = (0.75 * flash).toFixed(3);
    // eq bars: free-running before the beat grid, accent-driven after it
    var ba = beatAmp(t);
    for (var q = 0; q < BARS.length; q++) {
      var B = BARS[q];
      var h = 0.18 + 0.5 * Math.abs(Math.sin(t * B.f + B.ph)) * (0.7 + 0.3 * Math.sin(t * 3.1 + q)) + ba * 1.6 * (q % 3 === 0 ? 1 : 0.6) + flash * 0.25;
      B.n.style.transform = "scaleY(" + Math.min(1, h).toFixed(3) + ")";
    }

    // footprints: waterfall arrival (binary opacity) -> re-form to zig-zag -> re-form to spin
    var flashP = t >= FLASH_T ? Math.exp(-(t - FLASH_T) / 0.25) : 0;
    var settle = P2O(seg(t, FLASH_T, 0.5));
    var fbase = [lerp(COL_A[0], COL_S[0], settle), lerp(COL_A[1], COL_S[1], settle), lerp(COL_A[2], COL_S[2], settle)];
    footGroup.setAttribute("fill", mix(fbase, COL_F, Math.min(1, flashP * 1.15)));
    for (var f = 0; f < NF; f++) {
      var F = FEET[f];
      var ta = ARRIVE_AT + f * 0.022;
      if (t < ta) { F.g.setAttribute("opacity", "0"); continue; }
      var travel = f < 4 ? 78 : f < 12 ? 52 : 40, wdur = f < 4 ? 0.19 : 0.15;
      var dy = travel * (1 - P4O(seg(t, ta, wdur)));
      var A = LAYOUTS[0][f], x = A.x, y = A.y, r = A.r, lift = 0, sc = 1, op = 1;
      for (var m = 0; m < REFORM.length; m++) {
        var p = seg(t, REFORM[m] + f * 0.008, REFORM_DUR);
        if (p <= 0) break;
        var e = P3IO(p), Bm = LAYOUTS[m + 1][f], Am = LAYOUTS[m][f];
        x = lerp(Am.x, Bm.x, e); y = lerp(Am.y, Bm.y, e); r = lerp(Am.r, Bm.r, e);
        var arc = Math.sin(Math.PI * p);
        lift = 26 * arc; sc = 1 - 0.14 * arc; op = 1 - 0.5 * arc;
      }
      // "steps" flash: per-foot scale bump rippling outward from the centre
      var dist = Math.hypot(x - CX, y - CY);
      var fb = t >= FLASH_T + dist * 0.0006 ? Math.exp(-(t - FLASH_T - dist * 0.0006) / 0.18) : 0;
      sc *= 1 + 0.22 * fb;
      F.g.setAttribute("opacity", op.toFixed(3));
      F.g.setAttribute("transform", "translate(" + x.toFixed(2) + " " + (y + dy - lift).toFixed(2) + ") rotate(" + r.toFixed(2) + ") scale(" + (sc * 1.08).toFixed(4) + ")");
    }
    var rp = seg(t, FLASH_T, 0.7);
    ripple.setAttribute("r", (60 + 260 * P2O(rp)).toFixed(1));
    ripple.setAttribute("opacity", (rp > 0 && rp < 1 ? 0.85 * (1 - rp) : 0).toFixed(3));

    // rhythm waveform: comet rides the draw head; 6/8 pulse; dots land as the head passes
    var dp = SIO(seg(t, DRAW_AT, DRAW_DUR));
    if (t > DRAW_AT && dp < 1) {
      var pt = wpath.getPointAtLength(WAVE_L * dp);
      comet.setAttribute("transform", "translate(" + pt.x.toFixed(1) + " " + pt.y.toFixed(1) + ")");
      comet.setAttribute("opacity", Math.min(1, (t - DRAW_AT) * 8).toFixed(3));
    } else {
      comet.setAttribute("opacity", "0");
    }
    var lockFlash = t >= 3.66 ? Math.exp(-(t - 3.66) / 0.3) : 0;
    var sy = 1 + ba * 1.15;
    wgroup.setAttribute("transform", "translate(0 " + WCY + ") scale(1 " + sy.toFixed(4) + ") translate(0 " + (-WCY) + ")");
    wglow.setAttribute("opacity", Math.min(0.95, 0.38 + ba * 1.4 + lockFlash * 0.5).toFixed(3));
    var sp = seg(t, 3.66, 0.5);
    wsweep.style.strokeDashoffset = (SWEEP_L + 140 - (SWEEP_L + 280) * sp).toFixed(1);
    wsweep.setAttribute("opacity", (sp > 0 && sp < 1 ? 0.95 * Math.sin(Math.PI * sp) : 0).toFixed(3));
    for (var w = 0; w < WDOTS.length; w++) {
      var D = WDOTS[w];
      var dpop = BACK2(seg(t, D.on, 0.3));
      D.n.setAttribute("r", (dpop * (3 + 3 * D.acc) * (1 + ba * 2.2 * D.acc)).toFixed(2));
    }
    // dandiya pairs pop in at their peaks and click on arrival + on the accent beats
    for (var j = 0; j < DANDIYAS.length; j++) {
      var Dd = DANDIYAS[j];
      var pop = BACK2(seg(t, Dd.on, 0.34));
      Dd.g.setAttribute("transform", "translate(" + Dd.x.toFixed(1) + " " + Dd.y.toFixed(1) + ") scale(" + Math.max(0.0001, pop * 1.3).toFixed(4) + ")");
      var close = 0, last = -1;
      for (var c = 0; c < Dd.clicks.length; c++) { var dtc = t - Dd.clicks[c]; close = Math.max(close, clickClose(dtc)); if (dtc >= 0) last = dtc; }
      var open = 26 * (1 - close);
      Dd.sticks[0].g.setAttribute("transform", "rotate(" + (-open).toFixed(2) + " -30 46)");
      Dd.sticks[1].g.setAttribute("transform", "rotate(" + open.toFixed(2) + " 30 46)");
      var sk = last >= 0.04 ? (last - 0.04) / 0.34 : -1;
      if (sk >= 0 && sk < 1) {
        Dd.spark.setAttribute("opacity", (1 - sk * sk).toFixed(3));
        Dd.spark.setAttribute("transform", "translate(0 -16) scale(" + (0.5 + 1.1 * P2O(sk)).toFixed(3) + ")");
      } else {
        Dd.spark.setAttribute("opacity", "0");
      }
    }
  }

  // ======================= SCENE 3 setup: measured path draw =======================
  WAVE_L = wpath.getTotalLength();
  SWEEP_L = WAVE_L;
  [wpath, wglow].forEach(function (p) { p.style.strokeDasharray = (WAVE_L * 1.02).toFixed(1); p.style.strokeDashoffset = (WAVE_L * 1.02).toFixed(1); });
  wsweep.style.strokeDasharray = "140 " + (WAVE_L + 400).toFixed(1);
  render(0);
  var clock = { t: 0 };
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(clock.t); } }, 0);

  // ======================= CAMERA + ambient =======================
  tl.fromTo(el("cam"), { scale: 1 }, { scale: 1.04, duration: DUR, ease: "none" }, 0);
  tl.fromTo(el("blob"), { x: 30, y: -20 }, { x: -60, y: 40, duration: DUR, ease: "sine.inOut" }, 0);
  tl.fromTo(el("goldglow"), { scale: 0.9 }, { scale: 1.1, duration: DUR, ease: "sine.inOut" }, 0);

  // ======================= SCENE 1 (0.0-1.4): card + ticker, footprints re-form per song =======================
  tl.fromTo(el("card"), { y: 60, scale: 0.94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);
  tl.fromTo(el("vinyl"), { scale: 0.5, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.7)" }, 0.04);
  tl.fromTo(el("label"), { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.1);
  tl.fromTo(el("eq"), { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.45, ease: "expo.out", transformOrigin: "50% 100%" }, 0.14);
  tl.fromTo(el("cardsheen"), { x: -200 }, { x: 980, duration: 0.7, ease: "power1.inOut" }, 0.42);
  // guides: each layout's path draws on its song tick; the previous one dims away
  var guides = [el("gcircle"), el("gzig"), el("gspin")], GT = [0.1, 0.58, 1.1];
  guides.forEach(function (g, i) {
    var L = g.getTotalLength() * 1.02;
    g.style.strokeDasharray = L.toFixed(1);
    g.style.strokeDashoffset = L.toFixed(1);
    tl.fromTo(g, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, GT[i]);
    if (i < guides.length - 1) tl.fromTo(g, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.out", immediateRender: false }, GT[i + 1]);
  });

  // ======================= SCENE 2 (1.4-2.3): "steps" — chip springs in =======================
  tl.fromTo(el("chip"), { scale: 0, opacity: 0, rotation: -8, y: 24 }, { scale: 1, opacity: 1, rotation: 0, y: 0, duration: 0.55, ease: "back.out(1.6)" }, FLASH_T);
  tl.fromTo(el("chipsheen"), { x: -140 }, { x: 460, duration: 0.45, ease: "power1.inOut" }, FLASH_T + 0.42);

  // ======================= SCENE 3 (2.3-4.2): rack focus to the rhythm waveform =======================
  var feetWrap = el("feetwrap"), fwb = { v: 0 };
  tl.fromTo(feetWrap, { scale: 1, opacity: 1 }, { scale: 0.9, opacity: 0.34, duration: 0.6, ease: "power2.out" }, 2.3);
  tl.fromTo(fwb, { v: 0 }, { v: 5, duration: 0.6, ease: "power2.out", onUpdate: function () { feetWrap.style.filter = fwb.v > 0.05 ? "blur(" + fwb.v.toFixed(2) + "px)" : "none"; } }, 2.3);
  tl.fromTo(wpath, { strokeDashoffset: WAVE_L * 1.02 }, { strokeDashoffset: 0, duration: DRAW_DUR, ease: "sine.inOut" }, DRAW_AT);
  tl.fromTo(wglow, { strokeDashoffset: WAVE_L * 1.02 }, { strokeDashoffset: 0, duration: DRAW_DUR, ease: "sine.inOut" }, DRAW_AT);
  // "rhythm" @3.66: the 6/8 tag locks in under the wave
  tl.fromTo(el("tag"), { scale: 0, opacity: 0, y: 16 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.7)" }, 3.66);

  window.__timelines = window.__timelines || {};
  window.__timelines["g1-songs-steps"] = tl;
})();
</script>
</template>
