                <circle id="g4-step-one-tf1" cx="60" cy="60" r="40" fill="none" stroke="#FF3B4E" stroke-width="2" stroke-dasharray="3 7" opacity="0.5"></circle>
                <path id="g4-step-one-tl1" class="g4-step-one-tl" d="M28 38 L46 58 L60 48 L86 82" stroke="#FF3B4E"></path>
                <path id="g4-step-one-th1" class="g4-step-one-tl" d="M86 68 L86 82 L72 82" stroke="#FF3B4E"></path>
                <circle id="g4-step-one-tq1" cx="86" cy="82" r="11" fill="none" stroke="#FF3B4E" stroke-width="2.5" opacity="0"></circle>
                <circle id="g4-step-one-tp1" cx="86" cy="82" r="5" fill="#FFF4E0" opacity="0"></circle>
              </svg>
              <div class="g4-step-one-tlabel" style="color:#FF3B4E;text-shadow:0 0 22px rgba(255,59,78,0.5);">DOWNTREND</div>
              <div id="g4-step-one-ts1" class="g4-step-one-tsweep"></div>
            </div>
          </div>
        </div>
        <!-- SIDEWAYS -->
        <div id="g4-step-one-t2" class="g4-step-one-tin" style="left:670px;">
          <div id="g4-step-one-tb2" class="g4-step-one-tbump">
            <div id="g4-step-one-tr2" class="g4-step-one-tring" style="border-color:#FFC93C;box-shadow:0 0 30px rgba(255,201,60,0.5);"></div>
            <div class="g4-step-one-tile">
              <svg class="g4-step-one-ticon" viewBox="0 0 120 120" aria-hidden="true">
                <circle id="g4-step-one-to2" cx="60" cy="60" r="48" fill="rgba(255,201,60,0.1)" stroke="#FFC93C" stroke-width="5" transform="rotate(-90 60 60)"></circle>
                <circle id="g4-step-one-tf2" cx="60" cy="60" r="40" fill="none" stroke="#FFC93C" stroke-width="2" stroke-dasharray="3 7" opacity="0.5"></circle>
                <path id="g4-step-one-tl2" class="g4-step-one-tl" d="M24 60 L36 51 L50 67 L64 53 L78 60 L92 60" stroke="#FFC93C"></path>
                <path id="g4-step-one-th2" class="g4-step-one-tl" d="M82 50 L92 60 L82 70" stroke="#FFC93C"></path>
                <circle id="g4-step-one-tq2" cx="92" cy="60" r="11" fill="none" stroke="#FFC93C" stroke-width="2.5" opacity="0"></circle>
                <circle id="g4-step-one-tp2" cx="92" cy="60" r="5" fill="#FFF4E0" opacity="0"></circle>
              </svg>
              <div class="g4-step-one-tlabel" style="color:#FFC93C;text-shadow:0 0 22px rgba(255,201,60,0.5);">SIDEWAYS</div>
              <div id="g4-step-one-ts2" class="g4-step-one-tsweep"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var P = "g4-step-one-";
  var DUR = 5.32;
  function el(n) { return document.getElementById(P + n); }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var q = Math.imul(a ^ (a >>> 15), 1 | a);
      q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
      return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(44017);
  var E_P2 = gsap.parseEase("power2.out");
  var E_EXPO = gsap.parseEase("expo.out");
  var tl = gsap.timeline({ paused: true });

  // ONE onset array (the voiceover cues) drives every hit, accent and chrome pulse
  var BEAT = { step: 0.12, entry: 0.76, exit: 1.08, stop: 1.56, target: 2.12, up: 2.76, down: 3.56, side: 4.36, trend: 4.68 };
  var LAND = [0.98, 1.28, 1.82, 2.40];            // where each card's slam settles
  var TILE = [BEAT.up - 0.04, BEAT.down - 0.04, BEAT.side - 0.04];

  // ======================= GROUND (built once, deterministic) =======================
  function petal(r1, r2, w, deg) {
    var m = (r1 + r2) / 2;
    return '<path transform="rotate(' + deg + ')" d="M0 ' + (-r1).toFixed(1) + ' Q' + w.toFixed(1) + ' ' + (-m).toFixed(1) + ' 0 ' + (-r2).toFixed(1) + ' Q' + (-w).toFixed(1) + ' ' + (-m).toFixed(1) + ' 0 ' + (-r1).toFixed(1) + 'Z"></path>';
  }
  function ringOf(n, r, rad) {
    var s = "";
    for (var k = 0; k < n; k++) {
      var a = (k / n) * Math.PI * 2;
      s += '<circle cx="' + (Math.cos(a) * r).toFixed(1) + '" cy="' + (Math.sin(a) * r).toFixed(1) + '" r="' + rad.toFixed(1) + '"></circle>';
    }
    return s;
  }
  function rangoli(R, gold, red, sw) {
    var s = '<g fill="none" stroke="' + red + '" stroke-width="' + sw + '">';
    s += '<circle r="' + (R * 0.28).toFixed(1) + '"></circle><circle r="' + (R * 0.54).toFixed(1) + '"></circle><circle r="' + (R * 0.79).toFixed(1) + '"></circle>';
    for (var k = 0; k < 12; k++) s += petal(R * 0.3, R * 0.52, R * 0.07, k * 30);
    s += '</g><g fill="none" stroke="' + gold + '" stroke-width="' + (sw * 0.85) + '">';
    for (k = 0; k < 24; k++) s += petal(R * 0.56, R * 0.77, R * 0.045, k * 15 + 7.5);
    s += '<circle r="' + (R * 0.97).toFixed(1) + '"></circle></g>';
    s += '<g fill="' + gold + '">' + ringOf(48, R * 0.87, R * 0.013) + '</g>';
    s += '<g fill="none" stroke="' + red + '" stroke-width="' + (sw * 0.85) + '">' + ringOf(36, R * 0.97, R * 0.045) + '</g>';
    s += '<g fill="' + gold + '">';
    for (k = 0; k < 8; k++) s += petal(R * 0.04, R * 0.22, R * 0.05, k * 45);
    s += '</g>';
    return s;
  }
  el("rangoli").innerHTML = rangoli(560, "#FFC93C", "#C8102E", 3);
  el("rangoli2").innerHTML = rangoli(400, "#FFC93C", "#C8102E", 3);

  // the badge's spinning dashed mandala ring
  var ringS = '<g id="' + P + 'ringspin">';
  ringS += '<circle r="160" fill="none" stroke="#FF9F1C" stroke-width="4" stroke-dasharray="16 11"></circle>';
  ringS += '<g fill="#FFC93C">' + ringOf(36, 146, 3.2) + '</g>';
  ringS += '<g fill="none" stroke="#C8102E" stroke-width="3">';
  for (var pk = 0; pk < 16; pk++) ringS += petal(122, 140, 7, pk * 22.5 + 11.25);
  ringS += '</g></g>';
  el("ring").innerHTML = ringS;

  // string lights on two wires + loose bokeh
  var lightsHost = el("lights");
  var LIGHTS = [];
  function qb(p0, p1, p2, k) { var u = 1 - k; return u * u * p0 + 2 * u * k * p1 + k * k * p2; }
  function addLight(x, y, d, rgb, base, kind) {
    var n = document.createElement("i");
    n.className = P + "bk";
    var g = kind === "bulb"
      ? "radial-gradient(circle closest-side, rgba(255,246,220,0.95) 0%, rgba(" + rgb + ",0.75) 22%, rgba(" + rgb + ",0.22) 55%, rgba(" + rgb + ",0) 100%)"
      : "radial-gradient(circle closest-side, rgba(" + rgb + ",0.32) 0%, rgba(" + rgb + ",0.4) 74%, rgba(" + rgb + ",0.62) 88%, rgba(" + rgb + ",0) 100%)";
    n.style.cssText = "left:" + (x - d / 2).toFixed(1) + "px;top:" + (y - d / 2).toFixed(1) + "px;width:" + d.toFixed(1) + "px;height:" + d.toFixed(1) + "px;background:" + g + ";opacity:" + base.toFixed(3) + ";";
    lightsHost.appendChild(n);
    LIGHTS.push({ n: n, base: base, amp: kind === "bulb" ? 2 + rnd() * 2 : 8 + rnd() * 14, ph: rnd() * 6.283, sp: 0.35 + rnd() * 0.5, tw: kind === "bulb" ? 2.2 + rnd() * 3.2 : 0.8 + rnd() * 1.2 });
  }
  var BULB_RGB = ["255,201,60", "255,159,28", "255,201,60", "255,226,150"];
  var k;
  for (k = 0; k < 15; k++) { var u = (k + 0.5) / 15; addLight(qb(-40, 540, 1120, u), qb(60, 280, 80, u) + 8, 46 + rnd() * 26, BULB_RGB[k % 4], 0.5 + rnd() * 0.35, "bulb"); }
  for (k = 0; k < 13; k++) { var u2 = (k + 0.5) / 13; addLight(qb(-40, 540, 1120, u2), qb(1540, 1790, 1550, u2) + 8, 52 + rnd() * 30, BULB_RGB[(k + 1) % 4], 0.45 + rnd() * 0.35, "bulb"); }
  var BOKEH_RGB = ["255,201,60", "255,159,28", "200,16,46", "255,201,60", "229,0,125"];
  for (k = 0; k < 20; k++) { addLight(30 + rnd() * 1020, 60 + rnd() * 1820, 60 + rnd() * 110, BOKEH_RGB[k % 5], 0.07 + rnd() * 0.15, "disc"); }

  // ======================= DOM refs =======================
  var cam = el("cam"), ringSpin = el("ringspin"), core = el("core"), badgeBeat = el("badgebeat");
  var sh = [el("sh0"), el("sh1")];
  var c1 = el("c1"), streakBlur = el("streakblur");
  var gl = [el("gl0"), el("gl1"), el("gl2"), el("gl3")];
  var ic0 = el("ic0"), ic1 = el("ic1"), ic2 = el("ic2"), ic3 = el("ic3");
  var tb = [el("tb0"), el("tb1"), el("tb2")], tr = [el("tr0"), el("tr1"), el("tr2")];
  var tf = [el("tf0"), el("tf1"), el("tf2")], tq = [el("tq0"), el("tq1"), el("tq2")], tp = [el("tp0"), el("tp1"), el("tp2")];
  var TIP = [[86, 40], [86, 82], [92, 60]];
  var rang1 = el("rangoli"), rang2 = el("rangoli2"), blob = el("blob"), goldGlow = el("goldglow");

  function pulse(t, T, decay) { var dt = t - T; if (dt < 0) return 0; var att = clamp01(dt / 0.06); return att * Math.exp(-Math.max(0, dt - 0.06) * decay); }

  // ======================= THE ONE PER-FRAME APPLIER (pure function of t) =======================
  function render(t) {
    var i, q;
    // camera: slow push 1.00 -> 1.04 + a kick on every hit
    var kick = 0.016 * pulse(t, 0.3, 6);
    for (i = 0; i < 4; i++) kick += 0.009 * pulse(t, LAND[i] - 0.06, 7);
    for (i = 0; i < 3; i++) kick += 0.006 * pulse(t, TILE[i] + 0.2, 7);
    cam.style.transform = "translate(0px," + (-10 * (t / DUR)).toFixed(2) + "px) scale(" + (1 + 0.04 * (t / DUR) + kick).toFixed(5) + ")";

    // badge: ring spin (a whoosh on the slam that settles into a steady turn) + beat pulses
    var spin = 26 * t + (t > BEAT.step ? 140 * (1 - Math.exp(-(t - BEAT.step) * 4.2)) : 0);
    var rb = 0;
    for (i = 0; i < 4; i++) rb += 0.05 * pulse(t, LAND[i], 6);
    rb += 0.06 * pulse(t, BEAT.trend, 5);
    ringSpin.setAttribute("transform", "rotate(" + spin.toFixed(2) + ") scale(" + (1 + rb).toFixed(4) + ")");
    var bb = 0;
    for (i = 0; i < 4; i++) bb += 0.025 * pulse(t, LAND[i], 7);
    bb += 0.04 * pulse(t, BEAT.trend, 6);
    badgeBeat.style.transform = "scale(" + (1 + bb).toFixed(4) + ")";
    var glowA = 0.45 + 0.4 * pulse(t, 0.3, 3) + 0.35 * pulse(t, BEAT.trend, 3.5);
    for (i = 0; i < 4; i++) glowA += 0.15 * pulse(t, LAND[i], 5);
    core.style.boxShadow = "0 0 " + (50 + 30 * (glowA - 0.45)).toFixed(1) + "px rgba(255,159,28," + Math.min(0.95, glowA).toFixed(3) + "), inset 0 0 40px rgba(255,159,28,0.18)";
    // slam shockwaves
    var SHK = [0.28, 0.38];
    for (q = 0; q < 2; q++) {
      var sp = (t - SHK[q]) / 0.7;
      if (sp >= 0 && sp < 1) {
        sh[q].setAttribute("r", (125 + 115 * E_P2(sp)).toFixed(1));
        sh[q].setAttribute("stroke-width", (7 * (1 - sp) + 1).toFixed(2));
        sh[q].style.opacity = (0.85 * Math.pow(1 - sp, 1.3)).toFixed(3);
      } else sh[q].style.opacity = "0";
    }

    // EXIT card: directional streak blur on the same window + ease as its side snap
    var ep = clamp01((t - BEAT.exit) / 0.42);
    var eb = (t < BEAT.exit || ep >= 1) ? 0 : 24 * (1 - E_EXPO(ep));
    if (eb > 0.2) { streakBlur.setAttribute("stdDeviation", eb.toFixed(2) + " 0"); c1.style.filter = "url(#" + P + "streak)"; }
    else c1.style.filter = "none";

    // card border flashes on landing + the final "trend" accent
    for (i = 0; i < 4; i++) gl[i].style.opacity = (0.95 * pulse(t, LAND[i] - 0.04, 3.2) + 0.5 * pulse(t, BEAT.trend + i * 0.04, 4)).toFixed(3);

    // card icons wake up after landing (svg-icon-enrichment: nudge / pulse)
    var a0 = t > LAND[0] ? Math.sin((t - LAND[0]) * 7) * 3.5 * Math.min(1, (t - LAND[0]) * 3) : 0;
    ic0.setAttribute("transform", "translate(" + a0.toFixed(2) + " 0)");
    var a1 = t > LAND[1] ? Math.sin((t - LAND[1]) * 7) * 3.5 * Math.min(1, (t - LAND[1]) * 3) : 0;
    ic1.setAttribute("transform", "translate(" + a1.toFixed(2) + " 0)");
    var s2 = t > LAND[2] ? 1 + 0.06 * Math.sin((t - LAND[2]) * 6) * Math.min(1, (t - LAND[2]) * 3) : 1;
    ic2.setAttribute("transform", "translate(39 39) scale(" + s2.toFixed(4) + ") translate(-39 -39)");
    var s3 = t > LAND[3] ? 1 + 0.35 * Math.abs(Math.sin((t - LAND[3]) * 4.5)) : 1;
    ic3.setAttribute("transform", "translate(39 39) scale(" + s3.toFixed(4) + ") translate(-39 -39)");

    // trend tiles: pulse ring + bump on the cue; tip pulse + dash flow (svg-icon-enrichment)
    for (i = 0; i < 3; i++) {
      var T0 = TILE[i];
      var rp = (t - (T0 + 0.18)) / 0.6;
      if (rp >= 0 && rp < 1) {
        tr[i].style.opacity = (0.95 * Math.pow(1 - rp, 1.2)).toFixed(3);
        tr[i].style.transform = "scale(" + (1 + 0.05 * E_P2(rp)).toFixed(4) + ")";
      } else tr[i].style.opacity = "0";
      var bump = 0.045 * pulse(t, T0 + 0.18, 6) + 0.035 * pulse(t, BEAT.trend + i * 0.06, 6);
      tb[i].style.transform = "scale(" + (1 + bump).toFixed(4) + ")";
      var en = t - (T0 + 0.62);
      var tipOp = clamp01(en / 0.12);
      var ph = en * 7.5;
      var sD = 1 + Math.sin(ph) * 0.16, sR = 1 + Math.sin(ph + Math.PI / 2) * 0.1;
      var cx = TIP[i][0], cy = TIP[i][1];
      tp[i].style.opacity = tipOp.toFixed(3);
      tp[i].setAttribute("transform", "translate(" + cx + " " + cy + ") scale(" + sD.toFixed(4) + ") translate(" + (-cx) + " " + (-cy) + ")");
      tq[i].style.opacity = (tipOp * (0.5 + 0.35 * Math.sin(ph))).toFixed(3);
      tq[i].setAttribute("transform", "translate(" + cx + " " + cy + ") scale(" + sR.toFixed(4) + ") translate(" + (-cx) + " " + (-cy) + ")");
      tf[i].style.strokeDashoffset = (-Math.max(0, t - T0) * 30).toFixed(2);
    }

    // ground ambience: drifting, twinkling string-light bokeh; rotating rangoli
    for (i = 0; i < LIGHTS.length; i++) {
      var Lg = LIGHTS[i];
      var lx = Lg.amp * Math.sin(Lg.ph + t * Lg.sp), ly = Lg.amp * 0.7 * Math.cos(Lg.ph * 1.3 + t * Lg.sp * 0.8);
      Lg.n.style.transform = "translate(" + lx.toFixed(2) + "px," + ly.toFixed(2) + "px)";
      Lg.n.style.opacity = (Lg.base * (0.62 + 0.38 * Math.sin(Lg.ph * 2 + t * Lg.tw))).toFixed(3);
    }
    rang1.style.transform = "rotate(" + (2.6 * t).toFixed(3) + "deg)";
    rang2.style.transform = "rotate(" + (-3.4 * t).toFixed(3) + "deg)";
    blob.style.transform = "translate(" + (-30 * Math.sin(t * 0.5)).toFixed(2) + "px," + (-16 * t).toFixed(2) + "px)";
    goldGlow.style.transform = "scale(" + (0.94 + 0.08 * Math.sin(t * 0.9) + 0.1 * pulse(t, 0.3, 3)).toFixed(4) + ")";
  }
  render(0);
  var clock = { t: 0 };
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(clock.t); } }, 0);

  // svg-path-draw helper: measured length, dashoffset len -> 0
  function draw(node, at, dur) {
    var L = node.getTotalLength() * 1.02;
    node.style.strokeDasharray = L.toFixed(2);
    node.style.strokeDashoffset = L.toFixed(2);
    tl.fromTo(node, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
  }

  // ======================= SCENE 1 (0.0-2.4): STEP 1 slams, four rule cards slam in on their cues =======================
  // "step"@0.12 — scale-slam with depth blur
  tl.fromTo(el("badgeslam"), { scale: 2.4, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, BEAT.step);
  tl.fromTo(el("coresheen"), { x: -160 }, { x: 290, duration: 0.6, ease: "power2.inOut" }, 0.62);

  // kinetic-beat-slam: a DIFFERENT entrance per card, each on its own cue
  tl.fromTo(el("c0"), { scale: 1.45, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, BEAT.entry);
  tl.fromTo(el("c1"), { x: 380, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "expo.out" }, BEAT.exit);
  tl.fromTo(el("c2"), { y: 120, rotation: 7, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" }, BEAT.stop);
  tl.fromTo(el("c3"), { y: -150, scale: 1.18, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }, BEAT.target);

  // each card: the check fills + draws itself right after landing, then a gold sweep
  for (k = 0; k < 4; k++) {
    tl.fromTo(el("cf" + k), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, LAND[k] + 0.02);
    draw(el("ck" + k), LAND[k] + 0.12, 0.28);
    tl.fromTo(el("sw" + k), { x: -260 }, { x: 500, duration: 0.6, ease: "power2.inOut" }, LAND[k] + 0.22);
  }

  // ======================= SCENE 2 (2.4-5.32): cards compact, the three trend tiles spring in =======================
  tl.fromTo(el("cardscmp"), { scale: 1, y: 0 }, { scale: 0.82, y: -6, duration: 0.52, ease: "power3.inOut" }, 2.4);
  tl.fromTo(el("badgecmp"), { scale: 1, y: 0 }, { scale: 0.9, y: -6, duration: 0.52, ease: "power3.inOut" }, 2.4);
  for (k = 0; k < 3; k++) {
    var T0 = TILE[k];
    tl.fromTo(el("t" + k), { scale: 0.3, y: 50, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, T0);
    draw(el("to" + k), T0 + 0.08, 0.4);   // outline first
    draw(el("tl" + k), T0 + 0.24, 0.36);  // then the inner trend line
    draw(el("th" + k), T0 + 0.52, 0.16);  // then the arrowhead
    tl.fromTo(el("tf" + k), { opacity: 0 }, { opacity: 0.5, duration: 0.3, ease: "power1.out" }, T0 + 0.3);
  }
  // "trend"@4.68 — one gold sweep runs across the row
  for (k = 0; k < 3; k++) tl.fromTo(el("ts" + k), { x: -180 }, { x: 330, duration: 0.45, ease: "power2.inOut" }, BEAT.trend + k * 0.06);

  window.__timelines = window.__timelines || {};
  window.__timelines["g4-step-one"] = tl;
})();
</script>
</template>
